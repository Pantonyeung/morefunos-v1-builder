name: V2 CMD-053 Recovered R8 Verification

on:
  push:
    branches: [main]
    paths: ['requests/v2-cmd053-shared-direct-final-gate-request.txt']

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-cmd053-shared-direct-final-gate-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          BRANCH_NAME="$(sed -n 's/^branch_name=//p' requests/v2-cmd053-shared-direct-final-gate-request.txt | tr -d '\r\n')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRANCH_NAME" = 'landing/CMD-053-shared-direct-final-gate-r8' ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          echo "source-identity=PASS sha=$EXPECTED" | tee evidence/source-identity.log

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install TypeScript test toolchain
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22

      - name: Run canonical Pricing regression
        working-directory: source
        run: node --test --experimental-strip-types packages/pricing/*.test.ts 2>&1 | tee ../evidence/pricing-tests.log

      - name: Run canonical Catalog regression
        working-directory: source
        run: node --test --experimental-strip-types packages/catalog/*.test.ts 2>&1 | tee ../evidence/catalog-tests.log

      - name: Run BusinessDay unit regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find packages/business-day-cash -maxdepth 1 -name '*.test.ts' ! -name '*.integration.test.ts' -print | sort)
          node --test --experimental-strip-types "${tests[@]}" 2>&1 | tee ../evidence/business-day-tests.log

      - name: Run recovered r8 exact behavior harness
        shell: bash
        run: |
          set -euo pipefail
          node --test --experimental-strip-types verification/cmd053-r8-exact.test.mjs 2>&1 | tee evidence/r8-exact-harness.log

      - name: Run root TypeScript typecheck
        working-directory: source
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json 2>&1 | tee ../evidence/root-typecheck.log

      - name: Write evidence
        if: always()
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nrecovered_branch=landing/CMD-053-shared-direct-final-gate-r8\nworkflow=v2-cmd053-shared-direct-final-gate.yml\n' "$SOURCE_SHA" > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-cmd053-r8-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
