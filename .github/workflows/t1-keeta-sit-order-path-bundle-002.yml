name: T1 Keeta SIT Order Path Bundle 002

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-sit-order-path-bundle-002.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Resolve exact V2 source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-sit-order-path-bundle-002.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Install exact V2 dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exact SIT order path bundle tests
        working-directory: source
        run: |
          node --test packages/integration/keeta-sit-order-path-runtime.test.ts
          node --test packages/integration/keeta-order-get-reconciliation.test.ts
          node --test packages/integration/keeta-provider-action-delivery.test.ts
      - name: Keeta regression
        working-directory: source
        run: |
          node --test packages/integration/keeta-decision-integrity.test.ts
          node --test packages/integration/keeta-worker-durable-receipt-linkup.test.ts
      - name: Team1 Keeta scoped TypeScript guard
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          config = {
            "extends": "./tsconfig.json",
            "files": [
              "packages/integration/keeta-sit-order-path-runtime.ts",
              "packages/integration/keeta-sit-order-path-runtime.test.ts",
              "packages/integration/keeta-provider-action-delivery.test.ts",
              "packages/integration/keeta-order-get-reconciliation.ts",
              "packages/integration/keeta-order-get-reconciliation.test.ts",
              "packages/integration/d1-keeta-durable-runtime.ts",
              "packages/integration/keeta-durable-delivery.ts"
            ],
            "include": [],
            "exclude": []
          }
          open("tsconfig.team1-keeta-bundle002.json","w").write(json.dumps(config))
          PY
          tsc --noEmit -p tsconfig.team1-keeta-bundle002.json

      - name: Root TypeScript diagnostic
        working-directory: source
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/root-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep "error TS" /tmp/root-typecheck.log > /tmp/root-errors.log || true
          grep -v "^packages/smt-ui-integration/production-native-print-runtime.ts(88,12): error TS7006:" /tmp/root-errors.log > /tmp/unexpected-errors.log || true
          if [ -s /tmp/unexpected-errors.log ]; then
            cat /tmp/unexpected-errors.log
            exit 1
          fi
          grep -q "^packages/smt-ui-integration/production-native-print-runtime.ts(88,12): error TS7006:" /tmp/root-errors.log
          echo "Known unrelated Team3 root typecheck regression only; Team1 scoped guard passed."
