name: Verify Admin Transport V2

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-admin-transport-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Run Admin transport tests
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --test --experimental-strip-types packages/integration-v2/*.test.ts 2>&1 | tee "$RUNNER_TEMP/admin-transport-v2-test.log"

      - name: Run Runtime V2 regression
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --test --experimental-strip-types packages/runtime-v2/*.test.ts 2>&1 | tee "$RUNNER_TEMP/runtime-v2-test.log"

      - name: Run Staff regression
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --test --experimental-strip-types packages/staff/*.test.ts 2>&1 | tee "$RUNNER_TEMP/staff-test.log"

      - name: Typecheck exact source
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npx --yes -p typescript@5.8.3 tsc --noEmit -p tsconfig.json 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source_sha=%s\n' "$SOURCE_SHA" > evidence/admin-transport-v2-summary.txt
          cp "$RUNNER_TEMP/admin-transport-v2-test.log" evidence/admin-transport-v2-test.log 2>/dev/null || true
          cp "$RUNNER_TEMP/runtime-v2-test.log" evidence/runtime-v2-test.log 2>/dev/null || true
          cp "$RUNNER_TEMP/staff-test.log" evidence/staff-test.log 2>/dev/null || true
          cp "$RUNNER_TEMP/typecheck.log" evidence/typecheck.log 2>/dev/null || true

      - name: Upload Admin transport V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-transport-v2-evidence-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
