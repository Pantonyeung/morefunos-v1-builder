name: Deploy Admin Web Preview

on:
  push:
    paths:
      - '.github/workflows/deploy-admin-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  SOURCE_SHA: 403b297b4e3e9bcafb6f4a40a606dc5eb8086bfc
  PAGES_PROJECT: morefunos-v1-admin-preview

jobs:
  deploy-admin-web-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostics
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/admin-web-preview-stages.log"
          echo 'workflow_started=PASS' >> "$RUNNER_TEMP/admin-web-preview-stages.log"

      - name: Validate Cloudflare credentials
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CF_API" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'cloudflare_credentials=PASS' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          else
            echo 'cloudflare_credentials=FAIL' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          echo 'exact_source=PASS' >> "$RUNNER_TEMP/admin-web-preview-stages.log"

      - name: Install and build Admin Web
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          {
            node --version
            npm --version
            npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
            npm test
            npm run build
            test -f dist/_redirects
          } 2>&1 | tee "$RUNNER_TEMP/admin-web-preview-build.log"
          echo 'build=PASS' >> "$RUNNER_TEMP/admin-web-preview-stages.log"

      - name: Deploy Admin Web Preview with Wrangler CLI
        working-directory: source/apps/admin-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'wrangler_cli=STARTED' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          npx --yes wrangler@4 --version 2>&1 | tee "$RUNNER_TEMP/admin-web-preview-wrangler.log"

          echo 'pages_project_check=STARTED' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          set +e
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main \
            2>&1 | tee -a "$RUNNER_TEMP/admin-web-preview-wrangler.log"
          project_rc=${PIPESTATUS[0]}
          set -e
          echo "pages_project_check_rc=$project_rc" >> "$RUNNER_TEMP/admin-web-preview-stages.log"

          echo 'pages_deploy=STARTED' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          set +e
          npx --yes wrangler@4 pages deploy ./dist \
            --project-name="$PAGES_PROJECT" \
            --branch=preview \
            --commit-hash="$SOURCE_SHA" \
            2>&1 | tee -a "$RUNNER_TEMP/admin-web-preview-wrangler.log"
          deploy_rc=${PIPESTATUS[0]}
          set -e
          echo "pages_deploy_rc=$deploy_rc" >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          if [ "$deploy_rc" -ne 0 ]; then
            echo 'pages_deploy=FAIL' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
            exit "$deploy_rc"
          fi
          echo 'pages_deploy=PASS' >> "$RUNNER_TEMP/admin-web-preview-stages.log"

          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' "$RUNNER_TEMP/admin-web-preview-wrangler.log" | tail -n1 | sed 's/[),.;]*$//' || true)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo 'deployment_url_parse=FAIL' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
            exit 1
          fi
          printf '%s\n' "$DEPLOYMENT_URL" > "$GITHUB_WORKSPACE/admin-web-preview-url.txt"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$RUNNER_TEMP/admin-web-preview-stages.log"

      - name: Verify deployed routes
        shell: bash
        run: |
          set -euo pipefail
          echo 'route_smoke=STARTED' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          DEPLOYMENT_URL="$(cat admin-web-preview-url.txt)"
          test -n "$DEPLOYMENT_URL"
          for route in \
            /admin/overview \
            /admin/catalog/products/PRC-001 \
            /admin/catalog/options/OPT-001 \
            /admin/catalog/combos/COM-001 \
            /admin/storefront \
            /admin/operations/pickup-queue \
            /admin/settings/port-exposure \
            /admin/print-kitchen \
            /admin/publish; do
            echo "checking=$route" >> "$RUNNER_TEMP/admin-web-preview-stages.log"
            curl -fsS "$DEPLOYMENT_URL$route" >/dev/null
          done
          echo 'route_smoke=PASS' >> "$RUNNER_TEMP/admin-web-preview-stages.log"

          STABLE_ALIAS="https://preview.${PAGES_PROJECT}.pages.dev"
          printf '%s\n' "$STABLE_ALIAS" > admin-web-preview-stable-url.txt
          echo "stable_alias_url=$STABLE_ALIAS" >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          echo 'stable_alias=STARTED' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$STABLE_ALIAS/admin/publish" >/dev/null; then
              echo 'stable_alias=PASS' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
              exit 0
            fi
            sleep 5
          done
          echo 'stable_alias=FAIL' >> "$RUNNER_TEMP/admin-web-preview-stages.log"
          exit 1

      - name: Persist Preview diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='diagnostics/admin-web-preview-latest.log'
          {
            printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"
            printf 'PAGES_PROJECT=%s\n' "$PAGES_PROJECT"
            printf '\n===== STAGES =====\n'
            cat "$RUNNER_TEMP/admin-web-preview-stages.log" 2>/dev/null || true
            printf '\n===== BUILD =====\n'
            cat "$RUNNER_TEMP/admin-web-preview-build.log" 2>/dev/null || true
            printf '\n===== WRANGLER =====\n'
            cat "$RUNNER_TEMP/admin-web-preview-wrangler.log" 2>/dev/null || true
          } > /tmp/admin-web-preview-latest.log
          content="$(base64 -w0 /tmp/admin-web-preview-latest.log)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='ci: refresh Admin Web Preview diagnostic' -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Persist Preview URLs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='diagnostics/admin-web-preview-url-latest.txt'
          {
            cat admin-web-preview-url.txt
            cat admin-web-preview-stable-url.txt
          } > /tmp/admin-web-preview-url.txt
          content="$(base64 -w0 /tmp/admin-web-preview-url.txt)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='ci: refresh Admin Web Preview URL' -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Upload Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-preview-${{ env.SOURCE_SHA }}
          path: |
            admin-web-preview-url.txt
            admin-web-preview-stable-url.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=admin-web-preview-deploy \
            -f description='Admin Web Cloudflare Pages Preview deployed and canonical routes checked' >/dev/null

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=admin-web-preview-deploy \
            -f description='Admin Web Cloudflare Pages Preview deployment failed' >/dev/null
