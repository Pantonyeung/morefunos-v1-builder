name: Verify Staff Authorization Projection V2

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-staff-authorization-projection-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Run Staff projection equivalence tests
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            packages/staff/staff-authority.test.ts \
            packages/staff/staff-authorization-projection.test.ts \
            packages/runtime-v2/staff-authorization-projection-service.test.ts \
            2>&1 | tee "$RUNNER_TEMP/staff-authorization-projection-test.log"

      - name: Run V2 Core regression tests
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run test:v2-core 2>&1 | tee "$RUNNER_TEMP/v2-core-regression.log"

      - name: Typecheck exact source
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npx --yes -p typescript@5.8.3 tsc --noEmit -p tsconfig.json 2>&1 | tee "$RUNNER_TEMP/staff-authorization-projection-typecheck.log"

      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source_sha=%s\n' "$SOURCE_SHA" > evidence/staff-authorization-projection-summary.txt
          cp "$RUNNER_TEMP/staff-authorization-projection-test.log" evidence/test.log 2>/dev/null || true
          cp "$RUNNER_TEMP/v2-core-regression.log" evidence/v2-core-regression.log 2>/dev/null || true
          cp "$RUNNER_TEMP/staff-authorization-projection-typecheck.log" evidence/typecheck.log 2>/dev/null || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-authorization-projection-v2-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
