name: Deploy MFK Customer Web

on:
  push:
    branches: [main]
    paths:
      - 'requests/mfk-customer-web-deploy.txt'

permissions:
  contents: read

concurrency:
  group: deploy-mfk-customer-web
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/mfk-customer-web-deploy.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/mfk
          ref: ${{ steps.req.outputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify and build exact Customer R4
        working-directory: source/v2customer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "${{ steps.req.outputs.source_sha }}"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          test -s dist/index.html
          grep -R -F "admin.morefunos.com" dist/assets >/dev/null

      - name: Deploy Customer Worker + custom domain
        working-directory: source/v2customer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > wrangler.deploy.jsonc <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "mfk-customer",
            "compatibility_date": "2026-09-24",
            "workers_dev": true,
            "preview_urls": true,
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            },
            "routes": [
              {
                "pattern": "order.morefunos.com",
                "zone_name": "morefunos.com",
                "custom_domain": true
              }
            ]
          }
          EOF
          npm exec --yes --package=wrangler@4.125.0 -- wrangler deploy --config wrangler.deploy.jsonc

      - name: Production public smoke
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE="$(curl -sS -o "$RUNNER_TEMP/index.html" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://order.morefunos.com/' || true)"
            if [ "$CODE" = 200 ]; then break; fi
            sleep 2
          done
          test "$CODE" = 200
          JS_PATH="$(grep -Eo 'src="[^"]*assets/[^"]+\.js"' "$RUNNER_TEMP/index.html" | head -n1 | sed -E 's/^src="([^"]+)"$/\1/')"
          test -n "$JS_PATH"
          case "$JS_PATH" in
            http*) JS_URL="$JS_PATH" ;;
            /*) JS_URL="https://order.morefunos.com$JS_PATH" ;;
            *) JS_URL="https://order.morefunos.com/$JS_PATH" ;;
          esac
          curl -fsS -H 'Cache-Control: no-cache' "$JS_URL" -o "$RUNNER_TEMP/customer.js"
          grep -F "admin.morefunos.com" "$RUNNER_TEMP/customer.js"

          SNAP_HEADERS="$RUNNER_TEMP/snapshot.headers"
          SNAP_CODE="$(curl -sS -D "$SNAP_HEADERS" -o "$RUNNER_TEMP/snapshot.json" -w '%{http_code}' -H 'Origin: https://order.morefunos.com' -H 'Cache-Control: no-cache' 'https://admin.morefunos.com/api/customer/snapshot?storeId=MF01')"
          test "$SNAP_CODE" = 200
          grep -i -F 'access-control-allow-origin: https://order.morefunos.com' "$SNAP_HEADERS"
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/snapshot.json','utf8'));
          if(x?.store?.storeId!=='MF01'||!Array.isArray(x?.menu?.products))process.exit(1);
          console.log('MFK_CUSTOMER_WEB_LIVE_GREEN products='+x.menu.products.length+' channelAvailable='+x.store.channelAvailable);
          NODE
