name: V2 Q-ORDER-03 Connected One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.ci-trigger/q-order-03-connected.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_SHA: b49376fe49c35d16e4d03f6e1c68164ac34d63d2
      CUSTOMER_SHA: 30c0d178d768038f14ee62bc319039a63c30c16a
      SMT_SHA: beead70bd6e9b11bbc2770b9e7da0c5efb753438

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact Integration source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Checkout exact Customer source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CUSTOMER_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: customer
          persist-credentials: false

      - name: Checkout exact SMT source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SMT_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: smt
          persist-credentials: false

      - name: Verify identities and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C customer rev-parse HEAD)" = "$CUSTOMER_SHA"
          test "$(git -C smt rev-parse HEAD)" = "$SMT_SHA"
          grep -q 'lookupToken' core/packages/integration-v2/customer-order-submit-adapter.ts
          grep -q 'createCustomerOrderLifecycleReadAdapterV1' core/packages/integration-v2/customer-order-lifecycle-read-adapter.ts
          grep -q 'createSmtChannelDecisionReconciliationV1' core/packages/integration-v2/smt-channel-decision-reconciliation.ts
          grep -q 'acceptChannelOrder' smt/apps/smt-web/src/smt-runtime-adapter.ts
          grep -q 'rejectChannelSubmission' smt/apps/smt-web/src/smt-runtime-adapter.ts
          ! grep -R --line-number --exclude='*.test.*' 'lookupToken' core/packages/channels core/packages/contracts-v2 core/packages/runtime-v2
          ! grep -R --line-number --exclude-dir=.git --exclude='*.md' --exclude='*.test.*' -E 'FIREBASE_NAMESPACE.*(p-line-staging|b-line-staging)' core/functions core/packages/integration-v2 core/wrangler.jsonc

      - name: Install deployment dependencies
        working-directory: core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Q-ORDER-03 integration regressions
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            packages/integration-v2/customer-order-lifecycle-access.test.ts \
            packages/integration-v2/customer-order-lifecycle-read-adapter.test.ts \
            packages/integration-v2/customer-order-submit-adapter.test.ts \
            packages/integration-v2/smt-channel-decision-reconciliation.test.ts \
            packages/integration-v2/durable-channel-transport.test.ts \
            2>&1 | tee "$RUNNER_TEMP/q-order-03-integration.log"

      - name: Run exact Customer browser regressions
        working-directory: customer
        shell: bash
        run: |
          set -o pipefail
          node --test apps/customer-web/customer-runtime-bridge.test.mjs 2>&1 | tee "$RUNNER_TEMP/q-order-03-customer.log"

      - name: Build Pages Functions bundle
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/q-order-03-functions"
          npx wrangler pages functions build --outdir="$RUNNER_TEMP/q-order-03-functions" 2>&1 | tee "$RUNNER_TEMP/q-order-03-functions.log"

      - name: Verify browser/server credential boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY|GOOGLE_SERVICE_ACCOUNT_EMAIL|FIREBASE_DATABASE_URL' customer/apps/customer-web
          grep -q 'authorization: `Bearer ${token}`' customer/apps/customer-web/customer-runtime-bridge.js
          grep -q "CUSTOMER_LIFECYCLE_NOT_FOUND" core/packages/integration-v2/customer-order-lifecycle-read-adapter.ts
          grep -q "crypto.subtle.digest('SHA-256'" core/packages/integration-v2/customer-order-lifecycle-access.ts

      - name: Persist qualification result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence builder/.ci-results
          {
            printf 'core_sha=%s\ncustomer_sha=%s\nsmt_sha=%s\n' "$CORE_SHA" "$CUSTOMER_SHA" "$SMT_SHA"
            printf 'builder_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'identity=success\nintegration=success\ncustomer=success\nfunctions_build=success\nboundary=success\nconclusion=success\n'
          } > builder/.ci-results/v2-q-order-03-connected.txt
          cp builder/.ci-results/v2-q-order-03-connected.txt evidence/result.txt
          cp "$RUNNER_TEMP/q-order-03-integration.log" evidence/integration.log
          cp "$RUNNER_TEMP/q-order-03-customer.log" evidence/customer.log
          cp "$RUNNER_TEMP/q-order-03-functions.log" evidence/functions.log
          git -C builder config user.name morefunos-builder-bot
          git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git -C builder add .ci-results/v2-q-order-03-connected.txt
          git -C builder commit -m "ci(result): Q-ORDER-03 connected PASS $CORE_SHA"
          git -C builder push origin HEAD:main

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-q-order-03-connected-${{ env.CORE_SHA }}
          path: evidence
          retention-days: 30
