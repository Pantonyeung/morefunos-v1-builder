name: Verify V2 Zero-Cost Payment Proof

on:
  push:
    paths:
      - 'requests/v2-zero-cost-payment-proof-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-zero-cost-payment-proof-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exact source
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck
      - name: Payment proof and payment regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find packages/payment -maxdepth 1 -name '*.test.ts' ! -name '*.integration.test.ts' | sort)
          ((${#TESTS[@]} > 0))
          node --test "${TESTS[@]}"
      - name: Order D1 regression
        working-directory: source
        run: npm run test:core-order
      - name: Integration Firebase signal regression
        working-directory: source
        run: node --test packages/integration/firebase-rtdb-signal.test.ts packages/integration/google-service-account-token.test.ts
      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_sha=%s\nmutation=NONE\nworkflow=verify-v2-zero-cost-payment-proof.yml\nrun_id=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > evidence/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-zero-cost-payment-proof-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
