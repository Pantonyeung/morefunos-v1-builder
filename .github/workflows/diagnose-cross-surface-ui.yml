name: Owner V1 Cross-Surface UI Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose-ui:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/diagnose-ui ')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: smt
            directory: apps/smt-web
          - id: admin
            directory: apps/admin-web
          - id: customer
            directory: apps/customer-web
          - id: owner
            directory: apps/owner-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      APP_DIR: ${{ matrix.directory }}
      SURFACE_ID: ${{ matrix.id }}
    steps:
      - name: Validate exact source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SOURCE_SHA="${COMMAND#'/diagnose-ui '}"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ || "$COMMAND" != "/diagnose-ui ${SOURCE_SHA}" ]]; then
            echo 'UI diagnostic requires exactly one 40-character source SHA.' >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ steps.request.outputs.source_sha }}"

      - name: Run UI test and sanitize first failure
        id: ui
        continue-on-error: true
        shell: bash
        run: |
          set -u
          cd source
          if [[ -f "$APP_DIR/package-lock.json" ]]; then
            npm --prefix "$APP_DIR" ci --no-audit --no-fund >/dev/null 2>&1 || {
              echo 'result=INSTALL_FAIL' >> "$GITHUB_OUTPUT"
              exit 1
            }
          else
            npm --prefix "$APP_DIR" install --no-audit --no-fund --package-lock=false >/dev/null 2>&1 || {
              echo 'result=INSTALL_FAIL' >> "$GITHUB_OUTPUT"
              exit 1
            }
          fi

          if ! node -e "const p=require('./$APP_DIR/package.json'); process.exit(p.scripts?.['test:ui'] ? 0 : 1)"; then
            echo 'result=NO_UI_SCRIPT' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOG="$GITHUB_WORKSPACE/private-${SURFACE_ID}-ui.log"
          PLAIN="$GITHUB_WORKSPACE/private-${SURFACE_ID}-ui-plain.log"
          if npm --prefix "$APP_DIR" run test:ui -- --reporter=verbose >"$LOG" 2>&1; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$LOG" > "$PLAIN"
          TEST_NAME="$(grep -E '^[[:space:]]*[×]' "$PLAIN" | head -1 | sed -E 's/^[[:space:]]*×[[:space:]]*//' || true)"
          if [[ -z "$TEST_NAME" ]]; then
            TEST_NAME="$(grep -E '^[[:space:]]*FAIL[[:space:]]+' "$PLAIN" | head -1 | sed -E 's/^[[:space:]]*FAIL[[:space:]]+//' || true)"
          fi
          TEST_NAME="$(printf '%s' "$TEST_NAME" | tr '[:space:]' '_' | tr -cd 'A-Za-z0-9_./,:>+-' | cut -c1-220)"
          ERROR_KIND="$(grep -Eo '(TestingLibraryElementError|AssertionError|TypeError|ReferenceError|SyntaxError)' "$PLAIN" | head -1 || true)"
          echo "result=FAIL" >> "$GITHUB_OUTPUT"
          echo "test_name=${TEST_NAME:-UNAVAILABLE}" >> "$GITHUB_OUTPUT"
          echo "error_kind=${ERROR_KIND:-UNAVAILABLE}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report sanitized UI result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RESULT: ${{ steps.ui.outputs.result }}
          TEST_NAME: ${{ steps.ui.outputs.test_name }}
          ERROR_KIND: ${{ steps.ui.outputs.error_kind }}
        run: |
          set -euo pipefail
          BODY="ui-diagnostic-${SURFACE_ID} ${SOURCE_SHA} result=${RESULT:-FAILED} test=${TEST_NAME:-UNAVAILABLE} kind=${ERROR_KIND:-UNAVAILABLE}"
          gh issue comment 2 --body "$BODY" >/dev/null

      - name: Fail after sanitized diagnostic
        if: steps.ui.outcome == 'failure'
        run: exit 1
