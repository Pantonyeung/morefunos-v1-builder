name: Team1 Customer DIRECT Live Continuation

on:
  push:
    paths:
      - 'requests/team1-customer-direct-live-continuation.txt'

permissions:
  contents: read

jobs:
  live:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      CANONICAL_STORE_ID: d2d882b4-5c7b-40f9-ad59-91f8faabb8e8
      CANONICAL_PRODUCT_ID: 29e9e173-087f-46f4-bae3-0c29f4d51417
      CANONICAL_STAFF_ID: 7d61cc4d-e3d1-45b7-9e6c-28e2b8d7f779
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve live request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team1-customer-direct-live-continuation.txt | tr -d '[:space:]')"
          SUBMISSION_ID="$(sed -n 's/^submission_id=//p' requests/team1-customer-direct-live-continuation.txt | tr -d '[:space:]')"
          IDEMPOTENCY_KEY="$(sed -n 's/^idempotency_key=//p' requests/team1-customer-direct-live-continuation.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SUBMISSION_ID"
          test -n "$IDEMPOTENCY_KEY"
          test -n "$ADMIN_LOGIN_SECRET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$IDEMPOTENCY_KEY" >> "$GITHUB_OUTPUT"
          mkdir -p evidence

      - name: Verify formal Admin session without re-bootstrap mutation
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          LOGIN_HTTP="$(curl -sS -D /tmp/admin.headers -o /tmp/admin-login.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$ADMIN_URL/api/admin/session")"
          echo "admin_login_http=$LOGIN_HTTP" | tee evidence/admin-session.txt
          cat /tmp/admin-login.json >> evidence/admin-session.txt
          test "$LOGIN_HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/admin.headers | tr -d '\r' | head -n1)"
          test -n "$COOKIE"
          node -e "const x=require('/tmp/admin-login.json');if(x.staffId!==process.env.CANONICAL_STAFF_ID||x.scopeRef!==process.env.CANONICAL_STORE_ID||!x.bootstrapAuthorized)process.exit(1)"
          GET_HTTP="$(curl -sS -o /tmp/admin-get.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/session")"
          echo "admin_get_http=$GET_HTTP" >> evidence/admin-session.txt
          test "$GET_HTTP" = 200

      - name: Canonical production readback and zero-order preflight
        shell: bash
        run: |
          set -euo pipefail
          D1_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          SQL="SELECT (SELECT COUNT(*) FROM mfos_catalog_state WHERE store_id='${CANONICAL_STORE_ID}') AS catalog_rows,(SELECT COUNT(*) FROM mfos_pricing_profile WHERE store_id='${CANONICAL_STORE_ID}' AND currency='HKD' AND fixed_price_minor=2500) AS pricing_rows,(SELECT COUNT(*) FROM mfos_availability_state WHERE store_id='${CANONICAL_STORE_ID}' AND status='AVAILABLE') AS availability_rows,(SELECT COUNT(*) FROM mfos_store_operational_state WHERE store_id='${CANONICAL_STORE_ID}' AND operational_status='OPEN') AS operational_rows,(SELECT COUNT(*) FROM mfos_business_day WHERE store_id='${CANONICAL_STORE_ID}') AS business_day_rows,(SELECT COUNT(*) FROM mfos_order_state) AS order_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership) AS ownership_rows"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/preflight.json',JSON.stringify({sql:process.env.SQL}))"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/preflight.json > /tmp/preflight-result.json
          node - <<'NODE' | tee evidence/preflight.txt
          const x=require('/tmp/preflight-result.json'),r=x.result?.[0]?.results?.[0];
          if(!x.success||!r) throw new Error('D1_PREFLIGHT_FAILED');
          for(const k of ['catalog_rows','pricing_rows','availability_rows','operational_rows','business_day_rows']) if(Number(r[k])!==1) throw new Error('CANONICAL_READBACK_'+k+'='+r[k]);
          if(Number(r.order_rows)!==0||Number(r.ownership_rows)!==0) throw new Error('ORDER_BASELINE_NOT_ZERO:'+JSON.stringify(r));
          console.log(JSON.stringify(r));
          NODE

      - name: Prove live Customer canonical ordering projection
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o /tmp/ordering.json -w '%{http_code}' "$ADMIN_URL/api/customer/ordering")"
          echo "customer_ordering_http=$HTTP" | tee evidence/customer-ordering.txt
          cat /tmp/ordering.json >> evidence/customer-ordering.txt
          test "$HTTP" = 200
          node - <<'NODE'
          const x=require('/tmp/ordering.json');
          if(x.storeStatus!=='open') throw new Error('STORE_NOT_OPEN');
          const p=(x.products||[]).find(v=>v.productId===process.env.CANONICAL_PRODUCT_ID);
          if(!p||p.name!=='古早鹽酥雞'||p.currency!=='HKD'||Number(p.priceMinor)!==2500||p.available!==true) throw new Error('ORDERING_PRODUCT_MISMATCH:'+JSON.stringify(p));
          NODE

      - name: Submit one real DIRECT order then replay and lifecycle
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
          IDEMPOTENCY_KEY: ${{ steps.req.outputs.idempotency_key }}
        run: |
          set -euo pipefail
          node -e "require('fs').writeFileSync('/tmp/order.json',JSON.stringify({submissionId:process.env.SUBMISSION_ID,idempotencyKey:process.env.IDEMPOTENCY_KEY,payload:{lines:[{productId:process.env.CANONICAL_PRODUCT_ID,quantity:1}]}}))"
          FIRST_HTTP="$(curl -sS -D /tmp/customer.headers -c /tmp/customer.cookies -o /tmp/first.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/order.json "$ADMIN_URL/api/customer/orders")"
          echo "first_http=$FIRST_HTTP" | tee evidence/customer-order.txt
          cat /tmp/first.json | tee evidence/customer-first.json
          test "$FIRST_HTTP" = 200
          LOOKUP_TOKEN="$(node -e "const x=require('/tmp/first.json');if(!x.ok||!x.orderId||!x.lookupToken||x.status!=='ACCEPTED')process.exit(1);process.stdout.write(x.lookupToken)")"
          ORDER_ID="$(node -e "const x=require('/tmp/first.json');process.stdout.write(x.orderId)")"
          [[ "$LOOKUP_TOKEN" =~ ^[A-Za-z0-9_-]{43}$ ]]
          REPLAY_HTTP="$(curl -sS -b /tmp/customer.cookies -o /tmp/replay.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/order.json "$ADMIN_URL/api/customer/orders")"
          echo "replay_http=$REPLAY_HTTP" >> evidence/customer-order.txt
          test "$REPLAY_HTTP" = 200
          node -e "const a=require('/tmp/first.json'),b=require('/tmp/replay.json');if(a.orderId!==b.orderId||a.submissionId!==b.submissionId)process.exit(1)"
          STATUS_HTTP="$(curl -sS -b /tmp/customer.cookies -o /tmp/status.json -w '%{http_code}' -H "Authorization: Bearer $LOOKUP_TOKEN" "$ADMIN_URL/api/customer/order-status?submissionId=$SUBMISSION_ID")"
          echo "lifecycle_http=$STATUS_HTTP" >> evidence/customer-order.txt
          test "$STATUS_HTTP" = 200
          node -e "const a=require('/tmp/first.json'),s=require('/tmp/status.json');if(s.orderId!==a.orderId||s.submissionId!==a.submissionId||s.lifecycleStatus!=='ACCEPTED'||Number(s.totalMinor)!==2500||s.currency!=='HKD')process.exit(1)"
          WRONG_HTTP="$(curl -sS -b /tmp/customer.cookies -o /tmp/wrong.json -w '%{http_code}' -H 'Authorization: Bearer AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' "$ADMIN_URL/api/customer/order-status?submissionId=$SUBMISSION_ID")"
          echo "wrong_lookup_http=$WRONG_HTTP" >> evidence/customer-order.txt
          test "$WRONG_HTTP" = 401
          printf '%s' "$ORDER_ID" > evidence/order-id.txt
          cp /tmp/replay.json evidence/customer-replay.json
          cp /tmp/status.json evidence/customer-status.json

      - name: Prove exactly one canonical production D1 Order
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
        run: |
          set -euo pipefail
          ORDER_ID="$(cat evidence/order-id.txt)"
          D1_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          SQL="SELECT (SELECT COUNT(*) FROM mfos_order_state WHERE order_id='${ORDER_ID}') AS order_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}' AND order_id='${ORDER_ID}') AS ownership_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}') AS submission_rows,(SELECT order_id FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}' LIMIT 1) AS canonical_order_id"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/readback.json',JSON.stringify({sql:process.env.SQL}))"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/readback.json > /tmp/readback-result.json
          node - <<'NODE' | tee evidence/d1-exactly-one.txt
          const x=require('/tmp/readback-result.json'),r=x.result?.[0]?.results?.[0];
          if(!x.success||!r) throw new Error('D1_READBACK_FAILED');
          if(Number(r.order_rows)!==1||Number(r.ownership_rows)!==1||Number(r.submission_rows)!==1) throw new Error('NOT_EXACTLY_ONE:'+JSON.stringify(r));
          const expected=require('fs').readFileSync('evidence/order-id.txt','utf8');
          if(r.canonical_order_id!==expected) throw new Error('ORDER_ID_MISMATCH');
          console.log(JSON.stringify(r));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team1-customer-direct-live-continuation-${{ steps.req.outputs.source_sha }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
