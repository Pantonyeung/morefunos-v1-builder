name: V2 SMT Runtime Canonical Data Diagnostic

on:
  push:
    paths:
      - 'requests/v2-smt-runtime-canonical-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smt-runtime-canonical-diagnostic.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read production canonical runtime state
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          CONFIG='infra/cloudflare/admin-web-worker/wrangler.jsonc'
          DB='morefun-v2-production'
          runq() {
            local name="$1"
            local sql="$2"
            npx --yes wrangler@4 d1 execute "$DB" --remote --config "$CONFIG" --json --command "$sql" > "$GITHUB_WORKSPACE/evidence/$name.json"
          }

          runq store "SELECT b.store_code,b.store_id,b.merchant_id,s.record_json FROM mfos_store_code_binding b LEFT JOIN mfos_stores s ON s.store_id=b.store_id WHERE b.store_code='MF01';"
          STORE_ID="$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE+'/evidence/store.json','utf8'));
          const rows=(Array.isArray(x)?x.flatMap(v=>v.results||[]):[]);
          if(rows.length!==1||!rows[0].store_id) process.exit(1);
          process.stdout.write(rows[0].store_id);
          NODE
          )"

          runq business_day "SELECT business_day_id,store_id,business_date,lifecycle_status,opened_at,revision FROM mfos_business_day WHERE store_id='$STORE_ID' ORDER BY opened_at DESC LIMIT 5;"
          runq catalog "SELECT store_id,catalog_revision,revision,updated_at,length(snapshot_json) AS snapshot_bytes FROM mfos_catalog_state WHERE store_id='$STORE_ID';"
          runq orders "SELECT COUNT(*) AS accepted_projection_count FROM mfos_order_state WHERE store_id='$STORE_ID' AND accepted_projection_json IS NOT NULL;"
          runq open_orders "SELECT COUNT(*) AS open_projection_count FROM mfos_order_state WHERE store_id='$STORE_ID' AND accepted_projection_json IS NOT NULL AND json_extract(accepted_projection_json,'$.lifecycleStatus')='ACCEPTED';"
          runq catalog_identity "SELECT store_id,catalog_revision,json_extract(snapshot_json,'$.storeId') AS snapshot_store_id,json_extract(snapshot_json,'$.catalogRevision') AS snapshot_catalog_revision,json_array_length(json_extract(snapshot_json,'$.categories')) AS category_count,json_array_length(json_extract(snapshot_json,'$.products')) AS product_count FROM mfos_catalog_state WHERE store_id='$STORE_ID';"
          runq order_identity "SELECT COUNT(*) AS total, SUM(CASE WHEN json_extract(accepted_projection_json,'$.orderId')!=order_id THEN 1 ELSE 0 END) AS order_id_mismatch, SUM(CASE WHEN CAST(json_extract(accepted_projection_json,'$.orderRevision') AS INTEGER)!=revision THEN 1 ELSE 0 END) AS revision_mismatch, SUM(CASE WHEN json_extract(accepted_projection_json,'$.storeId') IS NOT NULL AND json_extract(accepted_projection_json,'$.storeId')!=store_id THEN 1 ELSE 0 END) AS store_mismatch, SUM(CASE WHEN json_extract(accepted_projection_json,'$.lifecycleStatus') NOT IN ('ACCEPTED','COMPLETED','CANCELLED') THEN 1 ELSE 0 END) AS lifecycle_invalid FROM mfos_order_state WHERE store_id='$STORE_ID' AND accepted_projection_json IS NOT NULL;"
          runq sessions "SELECT session_id,staff_id,lifecycle_status,absolute_expires_at,revision,json_extract(payload_json,'$.deviceId') AS device_id,json_extract(payload_json,'$.policyId') AS policy_id,json_extract(payload_json,'$.lastActivityAt') AS last_activity_at FROM mfos_session WHERE session_id LIKE 'smt-device-session:%' ORDER BY rowid DESC LIMIT 8;"
          runq bindings "SELECT runtime_binding_ref,device_id,bound_session_id,lifecycle_status,expires_at,revision,capability_ids_json,created_at,updated_at FROM mfos_smt_runtime_binding ORDER BY created_at DESC LIMIT 8;"
          runq devices "SELECT device_id,revision,json_extract(payload_json,'$.lifecycleStatus') AS lifecycle_status,json_extract(payload_json,'$.trustSourceRef') AS trust_source_ref,json_extract(payload_json,'$.displayName') AS display_name FROM mfos_device_trust WHERE device_id LIKE 'device:smt:%' ORDER BY rowid DESC LIMIT 8;"
          runq staff_credential "SELECT staff_id,employee_code,status,revision,updated_at FROM mfos_staff_pos_credential WHERE employee_code='12345' LIMIT 2;"
          runq staff_identity "SELECT staff_id,record_json FROM mfos_rbac_staff WHERE staff_id IN (SELECT staff_id FROM mfos_staff_pos_credential WHERE employee_code='12345');"
          runq catalog_shape "SELECT json_extract(snapshot_json,'$.categories[0].categoryId') AS category_id,json_extract(snapshot_json,'$.categories[0].name') AS category_name,json_extract(snapshot_json,'$.categories[0].lifecycleStatus') AS category_status,json_extract(snapshot_json,'$.categories[0].position') AS category_position,json_extract(snapshot_json,'$.categories[0].revision') AS category_revision,json_extract(snapshot_json,'$.categories[0].createdAt') AS category_created,json_extract(snapshot_json,'$.categories[0].updatedAt') AS category_updated,json_extract(snapshot_json,'$.products[0].productId') AS product_id,json_extract(snapshot_json,'$.products[0].name') AS product_name,json_extract(snapshot_json,'$.products[0].lifecycleStatus') AS product_status,json_extract(snapshot_json,'$.products[0].revision') AS product_revision,json_extract(snapshot_json,'$.products[0].createdAt') AS product_created,json_extract(snapshot_json,'$.products[0].updatedAt') AS product_updated,json_array_length(json_extract(snapshot_json,'$.products[0].categoryMemberships')) AS membership_count,json_extract(snapshot_json,'$.products[0].categoryMemberships[0].categoryId') AS membership_category_id,json_extract(snapshot_json,'$.products[0].categoryMemberships[0].position') AS membership_position,json_array_length(json_extract(snapshot_json,'$.products[0].optionGroups')) AS option_group_count FROM mfos_catalog_state WHERE store_id='$STORE_ID';"

          node - <<'NODE' | tee "$GITHUB_WORKSPACE/evidence/summary.txt"
          const fs=require('fs'), p=process.env.GITHUB_WORKSPACE+'/evidence/';
          function rows(n){const x=JSON.parse(fs.readFileSync(p+n+'.json','utf8'));return Array.isArray(x)?x.flatMap(v=>v.results||[]):[]}
          const store=rows('store');
          const days=rows('business_day');
          const catalog=rows('catalog');
          const orders=rows('orders');
          const open=rows('open_orders');
          const catalogIdentity=rows('catalog_identity');
          const orderIdentity=rows('order_identity');
          const sessions=rows('sessions');
          const bindings=rows('bindings');
          const devices=rows('devices');
          const staffCredential=rows('staff_credential');
          const staffIdentity=rows('staff_identity');
          const catalogShape=rows('catalog_shape');
          const openDays=days.filter(x=>x.lifecycle_status==='OPEN');
          console.log('source_sha='+process.env.SOURCE_SHA);
          console.log('canonical_store_rows='+store.length);
          console.log('canonical_store_id='+(store[0]?.store_id||'MISSING'));
          console.log('business_day_rows='+days.length);
          console.log('open_business_day_count='+openDays.length);
          console.log('open_business_day='+(openDays[0]?.business_date||'MISSING'));
          console.log('catalog_state_count='+catalog.length);
          console.log('catalog_revision='+(catalog[0]?.catalog_revision||'MISSING'));
          console.log('catalog_snapshot_bytes='+(catalog[0]?.snapshot_bytes||0));
          console.log('accepted_projection_count='+(orders[0]?.accepted_projection_count??'UNKNOWN'));
          console.log('open_projection_count='+(open[0]?.open_projection_count??'UNKNOWN'));
          console.log('catalog_snapshot_store_match='+(catalogIdentity[0]?.snapshot_store_id===catalogIdentity[0]?.store_id));
          console.log('catalog_snapshot_revision_match='+(catalogIdentity[0]?.snapshot_catalog_revision===catalogIdentity[0]?.catalog_revision));
          console.log('catalog_category_count='+(catalogIdentity[0]?.category_count??'UNKNOWN'));
          console.log('catalog_product_count='+(catalogIdentity[0]?.product_count??'UNKNOWN'));
          console.log('order_identity_total='+(orderIdentity[0]?.total??'UNKNOWN'));
          console.log('order_id_mismatch='+(orderIdentity[0]?.order_id_mismatch??'UNKNOWN'));
          console.log('order_revision_mismatch='+(orderIdentity[0]?.revision_mismatch??'UNKNOWN'));
          console.log('order_store_mismatch='+(orderIdentity[0]?.store_mismatch??'UNKNOWN'));
          console.log('order_lifecycle_invalid='+(orderIdentity[0]?.lifecycle_invalid??'UNKNOWN'));
          console.log('smt_session_count='+sessions.length);
          console.log('latest_session_status='+(sessions[0]?.lifecycle_status||'MISSING'));
          console.log('latest_session_device='+(sessions[0]?.device_id||'MISSING'));
          console.log('latest_session_expiry='+(sessions[0]?.absolute_expires_at||'MISSING'));
          console.log('runtime_binding_count='+bindings.length);
          console.log('latest_binding_status='+(bindings[0]?.lifecycle_status||'MISSING'));
          console.log('latest_binding_device='+(bindings[0]?.device_id||'MISSING'));
          console.log('latest_binding_session_match='+(bindings[0]?.bound_session_id===sessions[0]?.session_id));
          console.log('latest_binding_expiry='+(bindings[0]?.expires_at||'MISSING'));
          console.log('latest_binding_capabilities='+(bindings[0]?.capability_ids_json||'MISSING'));
          console.log('paired_device_count='+devices.length);
          console.log('latest_device_status='+(devices[0]?.lifecycle_status||'MISSING'));
          console.log('latest_device_id_match='+(devices[0]?.device_id===sessions[0]?.device_id));
          console.log('staff_12345_credential_count='+staffCredential.length);
          console.log('staff_12345_credential_status='+(staffCredential[0]?.status||'MISSING'));
          console.log('staff_12345_credential_revision='+(staffCredential[0]?.revision??'MISSING'));
          console.log('staff_12345_identity_count='+staffIdentity.length);
          let staffLifecycle='MISSING';
          try{staffLifecycle=JSON.parse(staffIdentity[0]?.record_json||'{}').lifecycleStatus||'MISSING'}catch{}
          console.log('staff_12345_lifecycle='+staffLifecycle);
          const cs=catalogShape[0]||{};
          console.log('catalog_category_id='+(cs.category_id||'MISSING'));
          console.log('catalog_category_name='+(cs.category_name||'MISSING'));
          console.log('catalog_category_status='+(cs.category_status||'MISSING'));
          console.log('catalog_category_position='+(cs.category_position??'MISSING'));
          console.log('catalog_category_revision='+(cs.category_revision??'MISSING'));
          console.log('catalog_category_created='+(cs.category_created||'MISSING'));
          console.log('catalog_category_updated='+(cs.category_updated||'MISSING'));
          console.log('catalog_product_id='+(cs.product_id||'MISSING'));
          console.log('catalog_product_name='+(cs.product_name||'MISSING'));
          console.log('catalog_product_status='+(cs.product_status||'MISSING'));
          console.log('catalog_product_revision='+(cs.product_revision??'MISSING'));
          console.log('catalog_product_created='+(cs.product_created||'MISSING'));
          console.log('catalog_product_updated='+(cs.product_updated||'MISSING'));
          console.log('catalog_membership_count='+(cs.membership_count??'MISSING'));
          console.log('catalog_membership_category_id='+(cs.membership_category_id||'MISSING'));
          console.log('catalog_membership_position='+(cs.membership_position??'MISSING'));
          console.log('catalog_option_group_count='+(cs.option_group_count??'MISSING'));
          NODE
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smt-runtime-canonical-diagnostic-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
