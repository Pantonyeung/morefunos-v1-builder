name: T1 Keeta Order SIT Canonical Mapping Repair
on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-order-sit-canonical-mapping-repair.txt'
permissions:
  contents: read
concurrency:
  group: t1-keeta-order-sit-canonical-mapping-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PROD_D1_DATABASE_ID: "1ed17fcb-7e7a-4e13-a922-ae141aff4142"
      STORE_ID: "d2d882b4-5c7b-40f9-ad59-91f8faabb8e8"
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Read exact production preconditions
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CAT_SQL="SELECT catalog_revision,revision,snapshot_json FROM mfos_catalog_state WHERE store_id=? LIMIT 1"
          jq -n --arg sql "$CAT_SQL" --arg store "$STORE_ID" '{sql:$sql,params:[$store]}' > "$RUNNER_TEMP/cat-q.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/cat-q.json" > "$RUNNER_TEMP/cat.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results|length)==1' "$RUNNER_TEMP/cat.json" >/dev/null

          MAP_SQL="SELECT provider_sku_id,mapping_id,canonical_product_id,mapping_status FROM mfos_channel_menu_item WHERE store_id=? AND channel_context='KEETA' AND provider_sku_id IN ('116746882','116519256','116747836')"
          jq -n --arg sql "$MAP_SQL" --arg store "$STORE_ID" '{sql:$sql,params:[$store]}' > "$RUNNER_TEMP/map-q.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/map-q.json" > "$RUNNER_TEMP/map.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results|length)==0' "$RUNNER_TEMP/map.json" >/dev/null

          node - "$RUNNER_TEMP/cat.json" <<'NODE'
          const fs=require('fs');const row=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).result[0].results[0];const s=JSON.parse(row.snapshot_json);
          const ids=['cde33523-b6fb-529b-a4be-6b3e6a0884d9','acc44f97-f911-5536-8a37-919b390f9b9a','d63c5569-abb1-57b5-859f-8c38054f2661'];
          if((s.products||[]).some(p=>ids.includes(p.productId))) throw new Error('ORDER_SIT_CANONICAL_PRODUCT_CONFLICT');
          console.log('precondition_catalog_revision='+row.catalog_revision);console.log('precondition_revision='+row.revision);console.log('precondition_mapping_absent=PASS');console.log('precondition_products_absent=PASS');
          NODE
      - name: Build guarded production batch
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/cat.json" "$RUNNER_TEMP/batch.json" <<'NODE'
          const fs=require('fs');const row=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).result[0].results[0];const snap=JSON.parse(row.snapshot_json);const at=new Date().toISOString();
          const rev=String(row.catalog_revision).includes('+keeta-order-sit-map-001')?String(row.catalog_revision):String(row.catalog_revision)+'+keeta-order-sit-map-001';
          const defs=[
            {pid:'cde33523-b6fb-529b-a4be-6b3e6a0884d9',mid:'cf101bf2-bdfe-59d2-8db7-1f7ac6be6241',spu:'119940091',sku:'116746882',name:'SIT 無選項餐 A',short:'SIT A',price:1000,spuOpen:'MF-ORDER-SPU-NG-01',skuOpen:'MF-ORDER-SKU-NG-01'},
            {pid:'acc44f97-f911-5536-8a37-919b390f9b9a',mid:'ba25b015-d3d0-5c1d-990a-167ef4cf4129',spu:'119935094',sku:'116519256',name:'SIT 無選項餐 B',short:'SIT B',price:1200,spuOpen:'MF-ORDER-SPU-NG-02',skuOpen:'MF-ORDER-SKU-NG-02'},
            {pid:'d63c5569-abb1-57b5-859f-8c38054f2661',mid:'e5f8d9e8-f739-5a93-9ecf-1901ce85cef9',spu:'119949529',sku:'116747836',name:'SIT 多選項餐',short:'SIT 多選',price:1500,spuOpen:'MF-ORDER-SPU-MULTI-01',skuOpen:'MF-ORDER-SKU-MULTI-01'}
          ];
          const products=defs.map(d=>({productId:d.pid,name:d.name,shortName:d.short,lifecycleStatus:'ACTIVE',revision:1,createdAt:at,updatedAt:at,categoryMemberships:[],optionGroups:[]}));
          const next={...snap,catalogRevision:rev,products:[...(snap.products||[]),...products]};
          const batch=[{sql:"UPDATE mfos_catalog_state SET catalog_revision=?,snapshot_json=?,revision=revision+1,updated_at=? WHERE store_id=? AND revision=?",params:[rev,JSON.stringify(next),at,process.env.STORE_ID,row.revision]}];
          for(const d of defs) batch.push({sql:"INSERT INTO mfos_channel_menu_item (store_id,channel_context,provider_menu_item_id,provider_sku_id,mapping_id,mapping_type,mapping_status,canonical_product_id,provider_display_name,provider_categories_json,option_group_names_json,pickup_price_minor,delivery_price_minor,dine_in_fact_minor,menu_revision,updated_at) VALUES (?,'KEETA',?,?,?,'SINGLE_PRODUCT','ACTIVE',?,?,'[]','[]',?,?,NULL,?,?)",params:[process.env.STORE_ID,d.spu,d.sku,d.mid,d.pid,d.name,d.price,d.price,rev,at]});
          const meta=JSON.stringify({reason:'ORDER_SIT_CANONICAL_ALIAS_REPAIR',providerSkus:defs.map(d=>d.sku),openItemCodes:defs.map(d=>d.skuOpen)});
          batch.push({sql:"INSERT INTO mfos_catalog_audit (audit_id,store_id,actor_id,authorization_context_ref,request_id,catalog_revision,event_type,recorded_at,metadata_json) VALUES (?,?,?,?,?,?,?,?,?)",params:['catalog-keeta-order-sit-map-001',process.env.STORE_ID,'builder:team1-order-sit-map','admin:keeta-sit-order-map','catalog-keeta-order-sit-map-001',rev,'KEETA_ORDER_SIT_CANONICAL_MAPPING_RESTORED',at,meta]});
          fs.writeFileSync(process.argv[3],JSON.stringify({batch},null,2));console.log('repair_batch_build=PASS');
          NODE
      - name: Execute guarded D1 batch
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/batch.json" > "$RUNNER_TEMP/out.json"
          jq -e '.success==true and ([.result[]|select(.success!=true)]|length)==0 and (.result[0].meta.changes|tonumber)==1 and (.result[1].meta.changes|tonumber)==1 and (.result[2].meta.changes|tonumber)==1 and (.result[3].meta.changes|tonumber)==1' "$RUNNER_TEMP/out.json" >/dev/null
          echo "production_mapping_batch=PASS"
      - name: Exact readback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="SELECT provider_menu_item_id,provider_sku_id,mapping_id,canonical_product_id,mapping_status,provider_display_name,pickup_price_minor,delivery_price_minor FROM mfos_channel_menu_item WHERE store_id=? AND channel_context='KEETA' AND provider_sku_id IN ('116746882','116519256','116747836') ORDER BY provider_sku_id"
          jq -n --arg sql "$SQL" --arg store "$STORE_ID" '{sql:$sql,params:[$store]}' > "$RUNNER_TEMP/read-q.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/read-q.json" > "$RUNNER_TEMP/read.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results|length)==3 and ([.result[0].results[]|select(.mapping_status!="ACTIVE")]|length)==0' "$RUNNER_TEMP/read.json" >/dev/null
          jq -c '.result[0].results[]' "$RUNNER_TEMP/read.json"
          echo "mapping_readback=PASS_3_OF_3"
