name: V2 Builder Admission Queue

on:
  push:
    paths:
      - 'requests/v2-admission-queue/*.txt'
      - 'requests/v2-admission-queue-request.txt'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen Morefun-v2 candidate SHA
        required: true
        type: string
      base_main_sha:
        description: Main SHA the candidate was based on
        required: true
        type: string
      work_id:
        description: Acceptance/work object ID
        required: true
        type: string
      affected_ports:
        description: Comma-separated SMT,SMM,ADMIN,OWNER,CUSTOMER,CORE
        required: false
        default: ''
        type: string
      depends_on_specs:
        description: Comma-separated candidateSha@baseSha train dependencies
        required: false
        default: ''
        type: string
      required_core_tests:
        description: Comma-separated ORDER,PAYMENT,PRINT,PRICING,AVAILABILITY,BUSINESS_DAY,CATALOG
        required: false
        default: ''
        type: string
      force_full_proof:
        description: Force affected-port integration proof even when candidate is already admitted (post-admission exact-main verification only)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: morefun-v2-builder-admission-queue
  queue: max

jobs:
  integrate:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve queue manifest
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_BASE_MAIN_SHA: ${{ inputs.base_main_sha }}
          INPUT_WORK_ID: ${{ inputs.work_id }}
          INPUT_AFFECTED_PORTS: ${{ inputs.affected_ports }}
          INPUT_DEPENDS_ON_SPECS: ${{ inputs.depends_on_specs }}
          INPUT_REQUIRED_CORE_TESTS: ${{ inputs.required_core_tests }}
          INPUT_FORCE_FULL_PROOF: ${{ inputs.force_full_proof }}
        run: |
          set -euo pipefail
          REQUEST_FILE=""
          read_request() {
            local key="$1"
            local file="$2"
            sed -n "s/^${key}=//p" "$file" | tail -n1 | tr -d '\r\n'
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            CANDIDATE_SHA="$(printf '%s' "$INPUT_CANDIDATE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            BASE_MAIN_SHA="$(printf '%s' "$INPUT_BASE_MAIN_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            WORK_ID="$(printf '%s' "$INPUT_WORK_ID" | tr -d '\r\n')"
            AFFECTED_PORTS="$(printf '%s' "$INPUT_AFFECTED_PORTS" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            DEPENDS_ON_SPECS="$(printf '%s' "$INPUT_DEPENDS_ON_SPECS" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            REQUIRED_CORE_TESTS="$(printf '%s' "$INPUT_REQUIRED_CORE_TESTS" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            FORCE_FULL_PROOF="$(printf '%s' "$INPUT_FORCE_FULL_PROOF" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            REQUEST_FILE=WORKFLOW_DISPATCH
          else
            mapfile -t REQUEST_FILES < <(
              git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- 'requests/v2-admission-queue/*.txt' |
              sort -u
            )

            if [[ "${#REQUEST_FILES[@]}" -eq 0 ]]; then
              # Legacy compatibility only. New submissions must use unique files.
              if git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- 'requests/v2-admission-queue-request.txt' | grep -q .; then
                REQUEST_FILES=('requests/v2-admission-queue-request.txt')
              fi
            fi

            if [[ "${#REQUEST_FILES[@]}" -ne 1 ]]; then
              echo "QUEUE_REQUEST_COUNT_INVALID:${#REQUEST_FILES[@]}" >&2
              printf '%s\n' "${REQUEST_FILES[@]}" >&2
              exit 24
            fi

            REQUEST_FILE="${REQUEST_FILES[0]}"
            test -f "$REQUEST_FILE"
            CANDIDATE_SHA="$(read_request candidate_sha "$REQUEST_FILE" | tr '[:upper:]' '[:lower:]')"
            BASE_MAIN_SHA="$(read_request base_main_sha "$REQUEST_FILE" | tr '[:upper:]' '[:lower:]')"
            WORK_ID="$(read_request work_id "$REQUEST_FILE")"
            AFFECTED_PORTS="$(read_request affected_ports "$REQUEST_FILE" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            DEPENDS_ON_SPECS="$(read_request depends_on_specs "$REQUEST_FILE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            REQUIRED_CORE_TESTS="$(read_request required_core_tests "$REQUEST_FILE" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            FORCE_FULL_PROOF="$(read_request force_full_proof "$REQUEST_FILE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          DEPENDS_ON_SPECS="${DEPENDS_ON_SPECS:-}"
          REQUIRED_CORE_TESTS="${REQUIRED_CORE_TESTS:-}"
          FORCE_FULL_PROOF="${FORCE_FULL_PROOF:-false}"
          [[ "$FORCE_FULL_PROOF" == "true" || "$FORCE_FULL_PROOF" == "false" ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$WORK_ID"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_main_sha=$BASE_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "work_id=$WORK_ID" >> "$GITHUB_OUTPUT"
          echo "affected_ports=$AFFECTED_PORTS" >> "$GITHUB_OUTPUT"
          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          echo "depends_on_specs=$DEPENDS_ON_SPECS" >> "$GITHUB_OUTPUT"
          echo "required_core_tests=$REQUIRED_CORE_TESTS" >> "$GITHUB_OUTPUT"
          echo "force_full_proof=$FORCE_FULL_PROOF" >> "$GITHUB_OUTPUT"
          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout current Morefun-v2 main
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: main
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: latest
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frozen candidate
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.candidate_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze impact and build integration working tree
        id: impact
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_main_sha }}
          DEPENDS_ON_SPECS: ${{ steps.request.outputs.depends_on_specs }}
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(git -C latest rev-parse HEAD)"
          ACTUAL_CANDIDATE="$(git -C candidate rev-parse HEAD)"
          test "$ACTUAL_CANDIDATE" = "$CANDIDATE_SHA"
          git -C latest cat-file -e "${BASE_SHA}^{commit}"
          git -C candidate cat-file -e "${BASE_SHA}^{commit}"
          if ! git -C latest merge-base --is-ancestor "$BASE_SHA" "$LATEST_SHA"; then
            echo "BASE_NOT_ANCESTOR_OF_LATEST" >&2
            exit 21
          fi

          mkdir -p evidence
          git -C candidate diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort -u > evidence/candidate-files.txt
          git -C latest diff --name-only "$BASE_SHA" "$LATEST_SHA" | sort -u > evidence/main-delta-files.txt

          if git -C latest merge-base --is-ancestor "$CANDIDATE_SHA" "$LATEST_SHA" 2>/dev/null; then
            ALREADY_ADMITTED=true
          else
            ALREADY_ADMITTED=false
          fi

          docs_only() {
            local file="$1"
            [[ ! -s "$file" ]] && return 0
            while IFS= read -r p; do
              case "$p" in docs/*|README.md|*.md) ;; *) return 1 ;; esac
            done < "$file"
            return 0
          }

          authority_of() {
            local p="$1"
            case "$p" in
              packages/order/*) echo ORDER ;;
              packages/pricing/*) echo PRICING ;;
              packages/availability/*) echo AVAILABILITY ;;
              packages/business-day-cash/*) echo BUSINESS_DAY ;;
              packages/payment/*) echo PAYMENT ;;
              packages/print/*) echo PRINT ;;
              packages/catalog/*) echo CATALOG ;;
              packages/*auth*/*|packages/management-ui-integration/*|packages/admin-ui-integration/*) echo MANAGEMENT_AUTH_OR_UI ;;
              infra/cloudflare/d1/migrations/*) echo D1_SCHEMA ;;
              infra/cloudflare/*) echo CLOUDFLARE_RUNTIME ;;
              package.json|tsconfig.json) echo GLOBAL_BUILD ;;
              *) ;;
            esac
          }

          while IFS= read -r p; do authority_of "$p"; done < evidence/candidate-files.txt | sort -u > evidence/candidate-authorities.txt
          while IFS= read -r p; do authority_of "$p"; done < evidence/main-delta-files.txt | sort -u > evidence/main-authorities.txt
          comm -12 evidence/candidate-files.txt evidence/main-delta-files.txt > evidence/exact-file-overlap.txt
          comm -12 evidence/candidate-authorities.txt evidence/main-authorities.txt > evidence/authority-overlap.txt
          awk -F/ 'NF>=2 {print $1"/"$2} NF==1 {print $1}' evidence/candidate-files.txt | sort -u > evidence/candidate-roots.txt
          awk -F/ 'NF>=2 {print $1"/"$2} NF==1 {print $1}' evidence/main-delta-files.txt | sort -u > evidence/main-roots.txt
          comm -12 evidence/candidate-roots.txt evidence/main-roots.txt > evidence/root-overlap.txt

          COLLISION=C0
          IMPACT=V1
          REASON=DISJOINT
          if [[ "$ALREADY_ADMITTED" == true ]]; then
            COLLISION=C0; IMPACT=V0; REASON=ALREADY_ADMITTED_OR_NOOP
          elif docs_only evidence/candidate-files.txt; then
            COLLISION=C0; IMPACT=V0; REASON=CANDIDATE_DOCS_ONLY
          elif grep -qE '(^|/)migrations/|(^|/)(package|tsconfig)' evidence/exact-file-overlap.txt 2>/dev/null; then
            COLLISION=C4; IMPACT=V4; REASON=DESTRUCTIVE_OR_GLOBAL_FILE_COLLISION
          elif [[ -s evidence/authority-overlap.txt ]]; then
            COLLISION=C3; IMPACT=V3; REASON=SAME_CANONICAL_AUTHORITY
          elif [[ -s evidence/root-overlap.txt ]]; then
            COLLISION=C1; IMPACT=V2; REASON=DEPENDENCY_OR_PACKAGE_TOUCH
          elif docs_only evidence/main-delta-files.txt; then
            COLLISION=C0; IMPACT=V1; REASON=MAIN_MOVED_DOCS_ONLY
          fi

          rm -rf integration
          cp -a latest integration
          APPLY_STATUS=SKIPPED
          TRAIN_COUNT=0

          ensure_ref() {
            local sha="$1"
            if git -C latest cat-file -e "${sha}^{commit}" 2>/dev/null; then
              return 0
            fi
            local auth
            auth="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
            git -C latest -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$sha"
            git -C latest cat-file -e "${sha}^{commit}"
          }

          apply_delta() {
            local base="$1"
            local cand="$2"
            local label="$3"
            local list="evidence/${label}-files.txt"
            git -C latest diff --name-only "$base" "$cand" | sort -u > "$list"

            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              local base_exists=false
              local cand_exists=false
              local ours_exists=false
              git -C latest cat-file -e "$base:$path" 2>/dev/null && base_exists=true
              git -C latest cat-file -e "$cand:$path" 2>/dev/null && cand_exists=true
              [[ -e "integration/$path" ]] && ours_exists=true

              if [[ "$base_exists" == false && "$cand_exists" == true ]]; then
                local cand_blob
                cand_blob="$(git -C latest rev-parse "$cand:$path")"
                if [[ "$ours_exists" == false ]]; then
                  mkdir -p "integration/$(dirname "$path")"
                  git -C latest show "$cand:$path" > "integration/$path"
                else
                  local ours_blob
                  ours_blob="$(git hash-object "integration/$path")"
                  if [[ "$ours_blob" != "$cand_blob" ]]; then
                    echo "TRAIN_ADD_COLLISION:$label:$path" >&2
                    return 31
                  fi
                fi
                continue
              fi

              if [[ "$base_exists" == true && "$cand_exists" == false ]]; then
                if [[ "$ours_exists" == false ]]; then
                  continue
                fi
                local base_blob ours_blob
                base_blob="$(git -C latest rev-parse "$base:$path")"
                ours_blob="$(git hash-object "integration/$path")"
                if [[ "$ours_blob" == "$base_blob" ]]; then
                  rm -f "integration/$path"
                else
                  echo "TRAIN_DELETE_COLLISION:$label:$path" >&2
                  return 32
                fi
                continue
              fi

              if [[ "$base_exists" == true && "$cand_exists" == true ]]; then
                if [[ "$ours_exists" == false ]]; then
                  echo "TRAIN_MISSING_OURS:$label:$path" >&2
                  return 33
                fi
                local base_blob cand_blob ours_blob
                base_blob="$(git -C latest rev-parse "$base:$path")"
                cand_blob="$(git -C latest rev-parse "$cand:$path")"
                ours_blob="$(git hash-object "integration/$path")"

                if [[ "$ours_blob" == "$cand_blob" || "$cand_blob" == "$base_blob" ]]; then
                  continue
                fi
                if [[ "$ours_blob" == "$base_blob" ]]; then
                  git -C latest show "$cand:$path" > "integration/$path"
                  continue
                fi

                mkdir -p evidence/merge-work
                local safe
                safe="$(printf '%s' "$label-$path" | tr '/ ' '__')"
                cp "integration/$path" "evidence/merge-work/${safe}.ours"
                git -C latest show "$base:$path" > "evidence/merge-work/${safe}.base"
                git -C latest show "$cand:$path" > "evidence/merge-work/${safe}.theirs"
                if git merge-file -p                   "evidence/merge-work/${safe}.ours"                   "evidence/merge-work/${safe}.base"                   "evidence/merge-work/${safe}.theirs"                   > "evidence/merge-work/${safe}.merged"; then
                  cp "evidence/merge-work/${safe}.merged" "integration/$path"
                  echo "$label:$path" >> evidence/train-three-way-clean.txt
                else
                  echo "TRAIN_CONTENT_CONFLICT:$label:$path" >&2
                  return 34
                fi
              fi
            done < "$list"
          }

          if [[ -n "$DEPENDS_ON_SPECS" ]]; then
            IFS=',' read -r -a TRAIN_SPECS <<< "$DEPENDS_ON_SPECS"
            if [[ "${#TRAIN_SPECS[@]}" -gt 8 ]]; then
              echo "TRAIN_DEPENDENCY_LIMIT_EXCEEDED" >&2
              exit 35
            fi
            for spec in "${TRAIN_SPECS[@]}"; do
              [[ -z "$spec" ]] && continue
              dep_sha="${spec%@*}"
              dep_base="${spec#*@}"
              [[ "$dep_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$dep_base" =~ ^[0-9a-f]{40}$ ]]
              ensure_ref "$dep_sha"
              ensure_ref "$dep_base"

              if git -C latest merge-base --is-ancestor "$dep_sha" "$LATEST_SHA" 2>/dev/null; then
                echo "$dep_sha@$dep_base" >> evidence/train-dependency-already-admitted.txt
                continue
              fi

              TRAIN_COUNT=$((TRAIN_COUNT+1))
              if ! apply_delta "$dep_base" "$dep_sha" "train-${TRAIN_COUNT}"; then
                APPLY_STATUS=CONFLICT
                COLLISION=C4
                IMPACT=V4
                REASON=TRAIN_DEPENDENCY_CONTENT_CONFLICT
                break
              fi
            done
          fi

          if [[ "$APPLY_STATUS" != CONFLICT && "$ALREADY_ADMITTED" != true && -s evidence/candidate-files.txt ]]; then
            ensure_ref "$BASE_SHA"
            ensure_ref "$CANDIDATE_SHA"
            if apply_delta "$BASE_SHA" "$CANDIDATE_SHA" "candidate"; then
              if [[ "$TRAIN_COUNT" -gt 0 ]]; then
                APPLY_STATUS=TRAIN_THREE_WAY_OR_OVERLAY
                COLLISION=C1
                if [[ "$IMPACT" == V0 || "$IMPACT" == V1 ]]; then IMPACT=V2; fi
                REASON=C1_ADMISSION_TRAIN_COMPOSED
              else
                APPLY_STATUS=DISJOINT_OVERLAY
              fi
            else
              APPLY_STATUS=CONFLICT
              COLLISION=C4
              IMPACT=V4
              REASON=CANDIDATE_CONTENT_CONFLICT
            fi
          fi
          {
            echo "work_id=${{ steps.request.outputs.work_id }}"
            echo "base_main_sha=$BASE_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "latest_main_sha=$LATEST_SHA"
            echo "already_admitted=$ALREADY_ADMITTED"
            echo "collision=$COLLISION"
            echo "impact=$IMPACT"
            echo "reason=$REASON"
            echo "apply_status=$APPLY_STATUS"
            echo "train_count=$TRAIN_COUNT"
          } | tee evidence/impact-summary.txt

          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "collision=$COLLISION" >> "$GITHUB_OUTPUT"
          echo "impact=$IMPACT" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "apply_status=$APPLY_STATUS" >> "$GITHUB_OUTPUT"
          echo "already_admitted=$ALREADY_ADMITTED" >> "$GITHUB_OUTPUT"
          if [[ "$APPLY_STATUS" == CONFLICT ]]; then exit 22; fi

      - name: Setup Node 24
        if: steps.impact.outputs.impact != 'V0' || steps.request.outputs.force_full_proof == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install root dependencies
        if: steps.impact.outputs.impact != 'V0' || steps.request.outputs.force_full_proof == 'true'
        working-directory: integration
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Root integration typecheck
        if: steps.impact.outputs.impact != 'V0' || steps.request.outputs.force_full_proof == 'true'
        working-directory: integration
        run: npm run typecheck

      - name: Required core/train proof
        if: steps.impact.outputs.impact == 'V3' || steps.impact.outputs.impact == 'V4' || steps.request.outputs.required_core_tests != ''
        working-directory: integration
        env:
          REQUIRED_CORE_TESTS: ${{ steps.request.outputs.required_core_tests }}
          FORCE_FULL_PROOF: ${{ steps.request.outputs.force_full_proof }}
        shell: bash
        run: |
          set -euo pipefail
          auths="$(cat ../evidence/candidate-authorities.txt ../evidence/main-authorities.txt | sort -u)"
          tests="$REQUIRED_CORE_TESTS"
          if [[ ",$tests," == *,ORDER_ADMISSION,* ]]; then
            node --test --test-concurrency=1 \
              packages/order/canonical-order-identity.test.ts \
              packages/order/d1-order-display-code.test.ts \
              packages/order/d1-store-order-acceptance.test.ts \
              packages/order/direct-order-variation.test.ts \
              packages/order/order-acceptance-idempotency.test.ts \
              packages/order/order-port-contract.test.ts \
              packages/order/staff-direct-order-identity-parity.test.ts
          elif grep -qx ORDER <<<"$auths" || [[ ",$tests," == *,ORDER,* ]]; then
            npm run test:core-order
          fi
          if grep -qx PRICING <<<"$auths" || [[ ",$tests," == *,PRICING,* ]]; then npm run test:core-pricing; fi
          if grep -qx AVAILABILITY <<<"$auths" || [[ ",$tests," == *,AVAILABILITY,* ]]; then npm run test:core-availability; fi
          if grep -qx BUSINESS_DAY <<<"$auths" || [[ ",$tests," == *,BUSINESS_DAY,* ]]; then npm run test:core-business-day-cash; fi
          if [[ ",$tests," == *,PAYMENT_ADMISSION,* ]]; then
            node --test \
              packages/payment/b0267-payment-refund-consumer-port.test.ts \
              packages/payment/durable-acceptance.test.ts \
              packages/payment/frontline-payment-refund-management-handshake.test.ts \
              packages/payment/payment-proof-http.test.ts \
              packages/payment/payment-proof-runtime.test.ts \
              packages/payment/payment-proof.test.ts \
              packages/payment/payment.test.ts \
              packages/payment/refund-lifecycle.test.ts \
              packages/payment/refund-postgres-transition.test.ts \
              packages/payment/t2-d1-payment-refund-authority.test.ts
          elif grep -qx PAYMENT <<<"$auths" || [[ ",$tests," == *,PAYMENT,* ]]; then
            npm run test:core-payment
          fi
          if grep -qx PRINT <<<"$auths" || [[ ",$tests," == *,PRINT,* ]]; then npm run test:print; fi
          if grep -qx CATALOG <<<"$auths" || [[ ",$tests," == *,CATALOG,* ]]; then npm run test:core-catalog; fi

      - name: SMT integration proof
        if: (steps.impact.outputs.impact != 'V0' || steps.request.outputs.force_full_proof == 'true') && contains(steps.request.outputs.affected_ports, 'SMT')
        working-directory: integration/apps/smt-clean
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build

      - name: SMM integration proof
        if: (steps.impact.outputs.impact != 'V0' || steps.request.outputs.force_full_proof == 'true') && contains(steps.request.outputs.affected_ports, 'SMM')
        working-directory: integration/apps/smm-web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build

      - name: Admin integration proof
        if: (steps.impact.outputs.impact != 'V0' || steps.request.outputs.force_full_proof == 'true') && contains(steps.request.outputs.affected_ports, 'ADMIN')
        working-directory: integration/apps/admin-web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build

      - name: Owner integration proof
        if: (steps.impact.outputs.impact != 'V0' || steps.request.outputs.force_full_proof == 'true') && contains(steps.request.outputs.affected_ports, 'OWNER')
        working-directory: integration/apps/owner-web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build

      - name: Queue summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MoreFunOS Admission Queue"
            echo
            test -f evidence/impact-summary.txt && cat evidence/impact-summary.txt || true
            echo
            echo "Temporary integration working tree only; Morefun-v2 is never mutated by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-admission-queue-${{ steps.request.outputs.work_id }}-${{ steps.request.outputs.candidate_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Seal durable queue result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ID: ${{ steps.request.outputs.work_id }}
          CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_main_sha }}
          LATEST_SHA: ${{ steps.impact.outputs.latest_sha }}
          COLLISION: ${{ steps.impact.outputs.collision }}
          IMPACT: ${{ steps.impact.outputs.impact }}
          REASON: ${{ steps.impact.outputs.reason }}
          APPLY_STATUS: ${{ steps.impact.outputs.apply_status }}
          CONCLUSION: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          DEPENDS_ON_SPECS: ${{ steps.request.outputs.depends_on_specs }}
          REQUIRED_CORE_TESTS: ${{ steps.request.outputs.required_core_tests }}
          FORCE_FULL_PROOF: ${{ steps.request.outputs.force_full_proof }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          safe_work_id="$(printf '%s' "$WORK_ID" | tr -c 'A-Za-z0-9._-' '_')"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .ci-results/admission-queue
            {
              echo "work_id=$WORK_ID"
              echo "candidate_sha=$CANDIDATE_SHA"
              echo "base_main_sha=$BASE_SHA"
              echo "latest_main_sha=${LATEST_SHA:-UNKNOWN}"
              echo "collision=${COLLISION:-UNKNOWN}"
              echo "impact=${IMPACT:-UNKNOWN}"
              echo "reason=${REASON:-UNKNOWN}"
              echo "apply_status=${APPLY_STATUS:-UNKNOWN}"
              echo "depends_on_specs=$DEPENDS_ON_SPECS"
              echo "required_core_tests=$REQUIRED_CORE_TESTS"
              echo "force_full_proof=$FORCE_FULL_PROOF"
              echo "run_id=$RUN_ID"
              echo "conclusion=$CONCLUSION"
            } > ".ci-results/admission-queue/${safe_work_id}.txt"
            git add ".ci-results/admission-queue/${safe_work_id}.txt"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ci(queue): ${WORK_ID} ${CONCLUSION} ${CANDIDATE_SHA}"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "QUEUE_RESULT_SEAL_PUSH_FAILED" >&2
          exit 1
