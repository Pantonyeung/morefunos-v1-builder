name: V2 Bounded Print Admission Proof

on:
  push:
    paths:
      - 'requests/v2-bounded-print-admission/*.txt'

permissions:
  contents: read

jobs:
  prove:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve bounded proof request
        id: request
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t REQUEST_FILES < <(
            git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- 'requests/v2-bounded-print-admission/*.txt' | sort -u
          )
          [[ "${#REQUEST_FILES[@]}" -eq 1 ]] || { echo "BOUNDED_PRINT_REQUEST_COUNT_INVALID:${#REQUEST_FILES[@]}" >&2; exit 24; }
          REQUEST_FILE="${REQUEST_FILES[0]}"
          read_request() { sed -n "s/^$1=//p" "$REQUEST_FILE" | tail -n1 | tr -d '\r\n'; }
          CANDIDATE_SHA="$(read_request candidate_sha | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          WORK_ID="$(read_request work_id)"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORK_ID" == F1-WI-PRINT-RECEIPT-DURABLE-ADMISSION-20260910 ]]
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "work_id=$WORK_ID" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout frozen Morefun-v2 candidate
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.candidate_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install root dependencies
        working-directory: candidate
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Root typecheck
        id: edge_typecheck
        working-directory: candidate
        run: npm run typecheck

      - name: E1 to E2 same-transaction ORDER proof
        id: edge_order
        working-directory: candidate
        run: node --test --test-concurrency=1 packages/order/d1-store-order-acceptance-atomic.test.ts

      - name: Durable PrintJob admission and recovery proof
        id: edge_print
        working-directory: candidate
        run: |
          node --test --test-concurrency=1 \
            packages/print/d1-print-persistence.test.ts \
            packages/print/auto-order-print-admission.test.ts \
            packages/print/auto-order-print-admission-retry-idempotency.test.ts \
            packages/print/d1-order-accepted-auto-print-consumer.test.ts

      - name: SMT downstream smoke
        id: smt_smoke
        continue-on-error: true
        working-directory: candidate/apps/smt-clean
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build

      - name: SMM downstream smoke
        id: smm_smoke
        if: always()
        continue-on-error: true
        working-directory: candidate/apps/smm-web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build

      - name: Bounded proof summary
        if: always()
        shell: bash
        env:
          TYPECHECK_OUTCOME: ${{ steps.edge_typecheck.outcome }}
          ORDER_OUTCOME: ${{ steps.edge_order.outcome }}
          PRINT_OUTCOME: ${{ steps.edge_print.outcome }}
          SMT_OUTCOME: ${{ steps.smt_smoke.outcome }}
          SMM_OUTCOME: ${{ steps.smm_smoke.outcome }}
        run: |
          set -euo pipefail
          EDGE_VERDICT=RED
          if [[ "$TYPECHECK_OUTCOME" == 'success' && "$ORDER_OUTCOME" == 'success' && "$PRINT_OUTCOME" == 'success' ]]; then
            EDGE_VERDICT=GREEN
          fi
          {
            echo '## ROUND011 B0320 bounded PRINT admission proof'
            echo
            echo "work_id=${{ steps.request.outputs.work_id }}"
            echo "candidate_sha=${{ steps.request.outputs.candidate_sha }}"
            echo "edge_verdict=$EDGE_VERDICT"
            echo "root_typecheck=$TYPECHECK_OUTCOME"
            echo "order_same_transaction=$ORDER_OUTCOME"
            echo "durable_print_admission_recovery=$PRINT_OUTCOME"
            echo "smt_downstream_smoke=${SMT_OUTCOME:-not_run}"
            echo "smm_downstream_smoke=${SMM_OUTCOME:-not_run}"
            echo
            echo 'Scope: E1 CLEAN_PRINT_EXECUTION_CREATED -> E2 DURABLE_PRINT_JOB_CREATED only.'
            echo 'Downstream smoke is evidence only and cannot invalidate this bounded edge. Global PRINT baseline and port build debt remain independently tracked; nothing is waived or mutated here.'
          } | tee round011-b0320-bounded-proof.txt >> "$GITHUB_STEP_SUMMARY"
          [[ "$EDGE_VERDICT" == 'GREEN' ]]

      - name: Upload bounded proof evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: round011-b0320-bounded-proof-${{ steps.request.outputs.candidate_sha }}
          path: round011-b0320-bounded-proof.txt
          if-no-files-found: error
          retention-days: 30
