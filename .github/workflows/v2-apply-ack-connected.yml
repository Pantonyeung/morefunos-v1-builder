name: V2 Apply Ack Connected

on:
  push:
    branches: [main]
    paths: ['.ci-trigger/apply-ack-connected.txt']

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: b33ad92de7a3029b13d25297d7d761760aa278d1
      BASE_PAYMENT: d5988f750037148e6a10bed161a1741585d23229
    steps:
      - uses: actions/checkout@v4
        with: { path: builder, persist-credentials: true }
      - uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Qualify Apply Ack exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          PHASE=exact-source; mkdir -p evidence
          persist(){
            rc=$?; conclusion=success; [ "$rc" -eq 0 ] || conclusion=failure
            {
              printf 'source_sha=%s\nbase_payment=%s\nbuilder_sha=%s\nrun_id=%s\nphase=%s\nconclusion=%s\n' "$SOURCE_SHA" "$BASE_PAYMENT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PHASE" "$conclusion"
              if [ "$conclusion" = success ]; then
                printf 'payment_ancestry=success\nfulfillment_domain=success\ndurable_apply_ack=success\nrestart_recovery=success\nidempotent_replay=success\nwrong_writer_denied=success\nstale_version_denied=success\nidempotency_conflict_denied=success\nfirebase_normalization=success\ntypescript=success\n'
              fi
            } | tee evidence/result.txt
            git -C builder config user.name morefunos-builder-bot
            git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
            git -C builder fetch origin main || true
            git -C builder rebase origin/main || true
            mkdir -p builder/.ci-results
            cp evidence/result.txt builder/.ci-results/v2-apply-ack-connected.txt
            git -C builder add .ci-results/v2-apply-ack-connected.txt
            git -C builder commit -m "ci(result): Apply Ack $conclusion $SOURCE_SHA" || true
            git -C builder push origin HEAD:main || true
            exit "$rc"
          }
          trap persist EXIT

          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source merge-base --is-ancestor "$BASE_PAYMENT" "$SOURCE_SHA"
          grep -q "morefunos.fulfillment.state.v1" source/packages/fulfillment/durable-fulfillment-authority.ts
          grep -q "checkpointRevision" source/packages/fulfillment/durable-fulfillment-authority.ts

          PHASE=install
          (cd source && npm install --ignore-scripts --no-audit --no-fund)

          PHASE=domain-tests
          (cd source && node --test --experimental-strip-types packages/fulfillment/fulfillment-authority.test.ts) | tee evidence/domain-tests.log

          PHASE=durable-tests
          (cd source && node --test --experimental-strip-types packages/fulfillment/durable-fulfillment-authority.test.ts) | tee evidence/durable-tests.log

          PHASE=typescript
          (cd source && npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22 && ./node_modules/.bin/tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck packages/fulfillment/durable-fulfillment-authority.ts packages/fulfillment/durable-fulfillment-authority.test.ts packages/fulfillment/fulfillment-authority.ts packages/fulfillment/required-flow.ts packages/durability/durability.ts packages/payment/payment-authority.ts) | tee evidence/typescript.log

          PHASE=complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-apply-ack-connected-${{ env.SOURCE_SHA }}
          path: evidence
          retention-days: 30
