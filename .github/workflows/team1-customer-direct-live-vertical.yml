name: Team1 Customer DIRECT Live Vertical

on:
  push:
    paths:
      - 'requests/team1-customer-direct-live-vertical.txt'

permissions:
  contents: read

jobs:
  live:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      CANONICAL_STORE_ID: d2d882b4-5c7b-40f9-ad59-91f8faabb8e8
      CANONICAL_PRODUCT_ID: 29e9e173-087f-46f4-bae3-0c29f4d51417
      CANONICAL_STAFF_ID: 7d61cc4d-e3d1-45b7-9e6c-28e2b8d7f779
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source and live request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team1-customer-direct-live-vertical.txt | tr -d '[:space:]')"
          SUBMISSION_ID="$(sed -n 's/^submission_id=//p' requests/team1-customer-direct-live-vertical.txt | tr -d '[:space:]')"
          IDEMPOTENCY_KEY="$(sed -n 's/^idempotency_key=//p' requests/team1-customer-direct-live-vertical.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SUBMISSION_ID"
          test -n "$IDEMPOTENCY_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_LOGIN_SECRET"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$IDEMPOTENCY_KEY" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact source and build
        working-directory: source
        shell: bash
        env:
          EXPECTED: ${{ steps.req.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          npm install --no-save --ignore-scripts --no-audit --no-fund
          node --test packages/customer-ui-integration/*.test.ts
          node --test packages/customer-loyalty/customer-authentication-d1.test.ts
          node --test packages/order/d1-store-order-acceptance.test.ts
          node --test packages/admin-ui-integration/admin-worker-session-runtime.test.ts
          npm run typecheck
          cd apps/admin-web
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html

      - name: Apply only Customer auth migration 0011
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --file=infra/cloudflare/d1/migrations/0011-customer-authentication-binding.sql 2>&1 | tee "$GITHUB_WORKSPACE/evidence/migration-0011.log"

      - name: Freeze explicit canonical Admin principal and login secret
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          PRINCIPAL="$(node -e "process.stdout.write(JSON.stringify({actorId:'admin:owner',staffId:process.env.CANONICAL_STAFF_ID,scopeRef:process.env.CANONICAL_STORE_ID,permissions:['admin.direct_authority.bootstrap.v1','admin.merchant_store.initialize.v1']}))")"
          printf '%s' "$PRINCIPAL" | npx --yes wrangler@4 secret put ADMIN_AUTH_PRINCIPAL_JSON --config infra/cloudflare/admin-web-worker/wrangler.jsonc >/dev/null
          printf '%s' "$ADMIN_LOGIN_SECRET" | npx --yes wrangler@4 secret put ADMIN_LOGIN_SECRET --config infra/cloudflare/admin-web-worker/wrangler.jsonc >/dev/null
          echo 'explicit_admin_principal=CONFIGURED' > "$GITHUB_WORKSPACE/evidence/admin-authority.txt"
          echo 'default_principal_fallback=FORBIDDEN' >> "$GITHUB_WORKSPACE/evidence/admin-authority.txt"

      - name: Deploy exact Worker and assets
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config infra/cloudflare/admin-web-worker/wrangler.jsonc 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          grep -E 'Current Version ID:' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | tee "$GITHUB_WORKSPACE/evidence/version.txt"

      - name: Verify formal Admin session and protected bootstrap replay
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          LOGIN_HTTP="$(curl -sS -D /tmp/admin-login.headers -o /tmp/admin-login.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$ADMIN_URL/api/admin/session")"
          test "$LOGIN_HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/admin-login.headers | tr -d '\r' | head -n1)"
          test -n "$COOKIE"
          node -e "const x=require('/tmp/admin-login.json');if(x.staffId!==process.env.CANONICAL_STAFF_ID||x.scopeRef!==process.env.CANONICAL_STORE_ID||!x.bootstrapAuthorized)process.exit(1)"
          GET_HTTP="$(curl -sS -o /tmp/admin-get.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/session")"
          test "$GET_HTTP" = 200

          node - <<'NODE'
          const fs=require('fs');
          const m=require('./docs/recovery/team1/MF01-TEMPORARY-BOOTSTRAP-MANIFEST-2026-09-03.json');
          const now=new Date().toISOString();
          const category={categoryId:m.catalog.category.categoryId,name:m.catalog.category.name,lifecycleStatus:'ACTIVE',position:0,revision:1,createdAt:now,updatedAt:now};
          const product={productId:m.catalog.product.productId,name:m.catalog.product.name,lifecycleStatus:'ACTIVE',revision:1,createdAt:now,updatedAt:now,categoryMemberships:[{categoryId:category.categoryId,position:0}],optionGroups:[]};
          const body={idempotencyKey:'mf01-direct-bootstrap-xlsx-32f79e4463d1-v1',catalogIdempotencyKey:'mf01-catalog-bootstrap-xlsx-32f79e4463d1-v1',catalogSnapshot:{storeId:m.store.storeId,catalogRevision:m.catalog.catalogRevision,categories:[category],products:[product]},selectedProductId:m.catalog.product.productId,storeOperational:m.storeOperational,availability:[m.availability],pricing:[m.pricing],businessDay:{businessDayId:m.businessDayPolicy.businessDayId,businessDate:'2026-09-03',timezone:m.businessDayPolicy.timezone,boundaryLocalTime:m.businessDayPolicy.boundaryLocalTime,policyRevision:m.businessDayPolicy.policyRevision}};
          fs.writeFileSync('/tmp/bootstrap.json',JSON.stringify(body));
          NODE
          BOOT_HTTP="$(curl -sS -o /tmp/bootstrap-response.json -w '%{http_code}' -H 'content-type: application/json' -H "Cookie: $COOKIE" --data-binary @/tmp/bootstrap.json "$ADMIN_URL/api/admin/direct-authority/bootstrap")"
          test "$BOOT_HTTP" = 200
          node -e "const x=require('/tmp/bootstrap-response.json');if(!x.ok||x.storeId!==process.env.CANONICAL_STORE_ID||x.selectedProductId!==process.env.CANONICAL_PRODUCT_ID)process.exit(1)"
          printf 'admin_login_http=%s\nadmin_session_get_http=%s\nprotected_bootstrap_replay_http=%s\n' "$LOGIN_HTTP" "$GET_HTTP" "$BOOT_HTTP" > "$GITHUB_WORKSPACE/evidence/admin-live.txt"

      - name: Canonical production readback and zero-order preflight
        shell: bash
        run: |
          set -euo pipefail
          D1_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          cat >/tmp/preflight.json <<'JSON'
          {"sql":"SELECT (SELECT COUNT(*) FROM mfos_catalog_state WHERE store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8') AS catalog_rows,(SELECT COUNT(*) FROM mfos_pricing_profile WHERE store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8' AND currency='HKD' AND fixed_price_minor=2500) AS pricing_rows,(SELECT COUNT(*) FROM mfos_availability_state WHERE store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8' AND status='AVAILABLE') AS availability_rows,(SELECT COUNT(*) FROM mfos_store_operational_state WHERE store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8' AND operational_status='OPEN') AS operational_rows,(SELECT COUNT(*) FROM mfos_business_day WHERE store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8') AS business_day_rows,(SELECT COUNT(*) FROM mfos_order_state) AS order_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership) AS ownership_rows"}
          JSON
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/preflight.json >/tmp/preflight-result.json
          node - <<'NODE' | tee "$GITHUB_WORKSPACE/evidence/preflight.txt"
          const x=require('/tmp/preflight-result.json'),r=x.result?.[0]?.results?.[0]; if(!x.success||!r) throw new Error('D1_PREFLIGHT_FAILED');
          for(const k of ['catalog_rows','pricing_rows','availability_rows','operational_rows','business_day_rows']) if(Number(r[k])!==1) throw new Error('CANONICAL_READBACK_'+k+'='+r[k]);
          if(Number(r.order_rows)!==0||Number(r.ownership_rows)!==0) throw new Error('ORDER_BASELINE_NOT_ZERO:'+JSON.stringify(r));
          console.log('canonical_readback='+JSON.stringify(r)); console.log('zero_order_baseline=PASS');
          NODE

      - name: Live Customer canonical ordering projection
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o /tmp/ordering.json -w '%{http_code}' "$ADMIN_URL/api/customer/ordering")"
          test "$HTTP" = 200
          node - <<'NODE'
          const x=require('/tmp/ordering.json');
          if(x.storeStatus!=='open') throw new Error('STORE_NOT_OPEN');
          const p=(x.products||[]).find(v=>v.productId===process.env.CANONICAL_PRODUCT_ID);
          if(!p||p.name!=='古早鹽酥雞'||p.currency!=='HKD'||Number(p.priceMinor)!==2500||p.available!==true) throw new Error('ORDERING_PRODUCT_MISMATCH:'+JSON.stringify(p));
          NODE
          echo "customer_ordering_http=$HTTP" > evidence/customer-ordering.txt
          cat /tmp/ordering.json >> evidence/customer-ordering.txt

      - name: Submit exactly one live Customer DIRECT Order and prove replay/lifecycle
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
          IDEMPOTENCY_KEY: ${{ steps.req.outputs.idempotency_key }}
        run: |
          set -euo pipefail
          node -e "require('fs').writeFileSync('/tmp/order.json',JSON.stringify({submissionId:process.env.SUBMISSION_ID,idempotencyKey:process.env.IDEMPOTENCY_KEY,payload:{lines:[{productId:process.env.CANONICAL_PRODUCT_ID,quantity:1}]}}))"
          FIRST_HTTP="$(curl -sS -D /tmp/customer.headers -c /tmp/customer.cookies -o /tmp/customer-first.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/order.json "$ADMIN_URL/api/customer/orders")"
          test "$FIRST_HTTP" = 200
          LOOKUP_TOKEN="$(node -e "const x=require('/tmp/customer-first.json'); if(!x.ok||!x.lookupToken||!x.orderId)process.exit(1);process.stdout.write(x.lookupToken)")"
          ORDER_ID="$(node -e "const x=require('/tmp/customer-first.json');process.stdout.write(x.orderId)")"
          [[ "$LOOKUP_TOKEN" =~ ^[A-Za-z0-9_-]{43}$ ]]

          REPLAY_HTTP="$(curl -sS -b /tmp/customer.cookies -o /tmp/customer-replay.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/order.json "$ADMIN_URL/api/customer/orders")"
          test "$REPLAY_HTTP" = 200
          node -e "const a=require('/tmp/customer-first.json'),b=require('/tmp/customer-replay.json');if(a.orderId!==b.orderId||a.submissionId!==b.submissionId)process.exit(1)"

          STATUS_HTTP="$(curl -sS -b /tmp/customer.cookies -o /tmp/customer-status.json -w '%{http_code}' -H "Authorization: Bearer $LOOKUP_TOKEN" "$ADMIN_URL/api/customer/order-status?submissionId=$SUBMISSION_ID")"
          test "$STATUS_HTTP" = 200
          node -e "const a=require('/tmp/customer-first.json'),s=require('/tmp/customer-status.json');if(s.orderId!==a.orderId||s.submissionId!==a.submissionId||s.lifecycleStatus!=='ACCEPTED')process.exit(1)"

          WRONG_HTTP="$(curl -sS -b /tmp/customer.cookies -o /tmp/customer-wrong.json -w '%{http_code}' -H 'Authorization: Bearer AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' "$ADMIN_URL/api/customer/order-status?submissionId=$SUBMISSION_ID")"
          test "$WRONG_HTTP" = 401

          printf 'submission_id=%s\nidempotency_key=%s\norder_id=%s\nfirst_http=%s\nreplay_http=%s\nlifecycle_http=%s\nwrong_lookup_http=%s\n' "$SUBMISSION_ID" "$IDEMPOTENCY_KEY" "$ORDER_ID" "$FIRST_HTTP" "$REPLAY_HTTP" "$STATUS_HTTP" "$WRONG_HTTP" | tee evidence/customer-order-live.txt
          cp /tmp/customer-first.json evidence/customer-first.json
          cp /tmp/customer-replay.json evidence/customer-replay.json
          cp /tmp/customer-status.json evidence/customer-status.json

      - name: Prove exactly one canonical production D1 Order
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
        run: |
          set -euo pipefail
          D1_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          SQL="SELECT (SELECT COUNT(*) FROM mfos_order_state) AS order_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership) AS ownership_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}') AS submission_rows,(SELECT order_id FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}' LIMIT 1) AS order_id"
          node -e "require('fs').writeFileSync('/tmp/readback.json',JSON.stringify({sql:process.env.SQL}))" \
            SQL="$SQL"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/readback.json >/tmp/readback-result.json
          node - <<'NODE' | tee evidence/order-d1-readback.txt
          const fs=require('fs'),x=require('/tmp/readback-result.json'),r=x.result?.[0]?.results?.[0];if(!x.success||!r)throw new Error('ORDER_READBACK_FAILED');
          if(Number(r.order_rows)!==1||Number(r.ownership_rows)!==1||Number(r.submission_rows)!==1||!r.order_id) throw new Error('EXACTLY_ONE_ORDER_FAILED:'+JSON.stringify(r));
          const live=Object.fromEntries(fs.readFileSync('evidence/customer-order-live.txt','utf8').trim().split(/\n/).map(v=>v.split(/=(.*)/s).slice(0,2)));
          if(live.order_id!==r.order_id) throw new Error('ORDER_ID_READBACK_MISMATCH');
          console.log('exactly_one_canonical_order=PASS'); console.log('order_id='+r.order_id); console.log('d1_counts='+JSON.stringify(r));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team1-customer-direct-live-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
