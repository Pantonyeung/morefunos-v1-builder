name: Team1 Customer DIRECT Live Isolated Proof

on:
  push:
    paths:
      - 'requests/team1-customer-direct-live-isolated.txt'

permissions:
  contents: read

jobs:
  live:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
      BASE_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      STORE_ID: d2d882b4-5c7b-40f9-ad59-91f8faabb8e8
      PRODUCT_ID: 29e9e173-087f-46f4-bae3-0c29f4d51417
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve isolated request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SUB="$(sed -n 's/^submission_id=//p' requests/team1-customer-direct-live-isolated.txt | tr -d '[:space:]')"
          IDEM="$(sed -n 's/^idempotency_key=//p' requests/team1-customer-direct-live-isolated.txt | tr -d '[:space:]')"
          test -n "$SUB"; test -n "$IDEM"; test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "submission_id=$SUB" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$IDEM" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
      - name: Verify canonical state and isolated submission is absent
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
        run: |
          set -euo pipefail
          D1_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          SQL="SELECT (SELECT COUNT(*) FROM mfos_catalog_state WHERE store_id='${STORE_ID}') AS catalog_rows,(SELECT COUNT(*) FROM mfos_pricing_profile WHERE store_id='${STORE_ID}' AND currency='HKD' AND fixed_price_minor=2500) AS pricing_rows,(SELECT COUNT(*) FROM mfos_availability_state WHERE store_id='${STORE_ID}' AND status='AVAILABLE') AS availability_rows,(SELECT COUNT(*) FROM mfos_store_operational_state WHERE store_id='${STORE_ID}' AND operational_status='OPEN') AS operational_rows,(SELECT COUNT(*) FROM mfos_business_day WHERE store_id='${STORE_ID}') AS business_day_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}') AS submission_rows"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL}))"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json >/tmp/r.json
          node - <<'NODE' | tee evidence/preflight.txt
          const x=require('/tmp/r.json'),r=x.result?.[0]?.results?.[0]; if(!x.success||!r) throw new Error('PREFLIGHT_FAILED');
          for(const k of ['catalog_rows','pricing_rows','availability_rows','operational_rows','business_day_rows']) if(Number(r[k])!==1) throw new Error(k+'='+r[k]);
          if(Number(r.submission_rows)!==0) throw new Error('SUBMISSION_ALREADY_EXISTS');
          console.log(JSON.stringify(r));
          NODE
      - name: Verify live canonical ordering
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o /tmp/ordering.json -w '%{http_code}' "$BASE_URL/api/customer/ordering")"
          echo "ordering_http=$HTTP" | tee evidence/ordering.txt
          cat /tmp/ordering.json >> evidence/ordering.txt
          test "$HTTP" = 200
          node - <<'NODE'
          const x=require('/tmp/ordering.json'); const p=(x.products||[]).find(v=>v.productId===process.env.PRODUCT_ID);
          if(x.storeStatus!=='open'||!p||p.name!=='古早鹽酥雞'||p.currency!=='HKD'||Number(p.priceMinor)!==2500||p.available!==true) throw new Error('ORDERING_MISMATCH');
          NODE
      - name: Submit replay and lifecycle
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
          IDEMPOTENCY_KEY: ${{ steps.req.outputs.idempotency_key }}
        run: |
          set -euo pipefail
          node -e "require('fs').writeFileSync('/tmp/order.json',JSON.stringify({submissionId:process.env.SUBMISSION_ID,idempotencyKey:process.env.IDEMPOTENCY_KEY,payload:{lines:[{productId:process.env.PRODUCT_ID,quantity:1}]}}))"
          FIRST="$(curl -sS -D /tmp/h -c /tmp/c -o /tmp/first.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/order.json "$BASE_URL/api/customer/orders")"
          echo "first_http=$FIRST" | tee evidence/live.txt; cat /tmp/first.json | tee evidence/first.json
          test "$FIRST" = 200
          TOKEN="$(node -e "const x=require('/tmp/first.json');if(!x.ok||x.status!=='ACCEPTED'||!x.orderId||!x.lookupToken)process.exit(1);process.stdout.write(x.lookupToken)")"
          ORDER_ID="$(node -e "process.stdout.write(require('/tmp/first.json').orderId)")"
          [[ "$TOKEN" =~ ^[A-Za-z0-9_-]{43}$ ]]
          REPLAY="$(curl -sS -b /tmp/c -o /tmp/replay.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/order.json "$BASE_URL/api/customer/orders")"
          echo "replay_http=$REPLAY" >> evidence/live.txt; test "$REPLAY" = 200
          node -e "const a=require('/tmp/first.json'),b=require('/tmp/replay.json');if(a.orderId!==b.orderId)process.exit(1)"
          STATUS="$(curl -sS -b /tmp/c -o /tmp/status.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE_URL/api/customer/order-status?submissionId=$SUBMISSION_ID")"
          echo "lifecycle_http=$STATUS" >> evidence/live.txt; test "$STATUS" = 200
          node -e "const a=require('/tmp/first.json'),s=require('/tmp/status.json');if(s.orderId!==a.orderId||s.submissionId!==a.submissionId||s.lifecycleStatus!=='ACCEPTED'||Number(s.totalMinor)!==2500||s.currency!=='HKD')process.exit(1)"
          printf '%s' "$ORDER_ID" > evidence/order-id.txt
          cp /tmp/replay.json evidence/replay.json; cp /tmp/status.json evidence/status.json
      - name: Prove exactly one canonical Order for this submission
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
        run: |
          set -euo pipefail
          ORDER_ID="$(cat evidence/order-id.txt)"
          D1_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          SQL="SELECT (SELECT COUNT(*) FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}') AS submission_rows,(SELECT COUNT(*) FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}' AND order_id='${ORDER_ID}') AS ownership_rows,(SELECT COUNT(*) FROM mfos_order_state WHERE order_id='${ORDER_ID}') AS order_rows,(SELECT order_id FROM mfos_customer_order_ownership WHERE submission_id='${SUBMISSION_ID}' LIMIT 1) AS canonical_order_id"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL}))"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json >/tmp/r.json
          node - <<'NODE' | tee evidence/exactly-one.txt
          const fs=require('fs'),x=require('/tmp/r.json'),r=x.result?.[0]?.results?.[0],expected=fs.readFileSync('evidence/order-id.txt','utf8');
          if(!x.success||!r||Number(r.submission_rows)!==1||Number(r.ownership_rows)!==1||Number(r.order_rows)!==1||r.canonical_order_id!==expected) throw new Error('EXACTLY_ONE_FAILED:'+JSON.stringify(r));
          console.log(JSON.stringify(r));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team1-customer-direct-live-isolated-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
