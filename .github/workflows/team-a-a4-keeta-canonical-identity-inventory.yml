name: Team A A4 Keeta Canonical Identity Inventory

on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-a4-keeta-canonical-identity-inventory.txt'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
      STORE_ID: d2d882b4-5c7b-40f9-ad59-91f8faabb8e8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read canonical Keeta projections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          SQL="SELECT order_id,lifecycle_status,revision,accepted_projection_json FROM mfos_order_state WHERE store_id=? AND accepted_projection_json IS NOT NULL ORDER BY rowid DESC LIMIT 100"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL,params:[process.env.STORE_ID]}))"
          curl -fsS -X POST "$URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json >/tmp/r.json
          node - <<'NODE' | tee evidence/inventory.txt
          const x=require('/tmp/r.json'),rows=x.result?.[0]?.results||[];
          if(!x.success) throw new Error('D1_READ_FAILED');
          const found=[];
          for(const r of rows){
            let p;try{p=JSON.parse(r.accepted_projection_json||'null')}catch{continue}
            const id=p?.canonicalIdentity;
            if(id?.sourceType==='PLATFORM'&&id?.sourceProvider==='KEETA'){
              found.push({orderId:r.order_id,lifecycleStatus:r.lifecycle_status,revision:r.revision,displayOrderCode:id.displayOrderCode,externalOrderId:id.externalOrderId,sourceOrderKey:id.sourceOrderKey,acceptedAt:p.acceptedAt});
            }
          }
          console.log(JSON.stringify({count:found.length,orders:found},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-a-a4-keeta-canonical-identity-inventory
          path: evidence
          if-no-files-found: error
          retention-days: 14
