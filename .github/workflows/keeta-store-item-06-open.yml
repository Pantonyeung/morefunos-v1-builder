name: Keeta Store Item 06 Open Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ci-requests/morefun-v2-keeta-store-item-06.sha'

permissions:
  contents: read

jobs:
  store-item-06:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: '4.125.0'
      EXPECTED_APP_ID: '3419700273'
      SHOP_ID: '721578302'
      WORKER_URL: 'https://morefun-v2-keeta-sit.pantonyeung.workers.dev'
    steps:
      - name: Checkout Builder request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/morefun-v2-keeta-store-item-06.sha)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Guard handbook Store Item 06 and exact contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
          grep -Fq 'CURRENT_STORE_API_ITEM: `STORE_ITEM_06_STATUS_OPEN`' source/docs/rooms/integration/INTG-CUR.md
          grep -Fq '"KEETA_APP_ID": "3419700273"' source/workers/keeta/wrangler.jsonc
          grep -Fq '/sit/store-details' source/workers/keeta/src/index.ts
          grep -Fq '/sit/store-open' source/workers/keeta/src/index.ts
          grep -Fq 'https://open.mykeeta.com/api/open/scm/shop/status/open' source/packages/integration/keeta-store-provider-requests.ts
          grep -Fq 'buildKeetaStoreReactivateRequest' source/packages/integration/keeta-store-provider-requests.ts
          test -f source/packages/integration/keeta-store-item-06-open-contract.test.ts

      - name: Require existing Keeta runtime secret names
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" secret list --config wrangler.jsonc --format json > "$RUNNER_TEMP/keeta-secrets.json"
          node - "$RUNNER_TEMP/keeta-secrets.json" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const names=new Set(rows.map((row)=>row.name));
          for (const required of ['KEETA_APP_SECRET','KEETA_TOKEN_ENCRYPTION_KEY']) {
            if (!names.has(required)) throw new Error(`${required}_MISSING`);
          }
          NODE

      - name: Prepare ephemeral SIT probe secret
        shell: bash
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf 'KEETA_SIT_PROBE_KEY=%s\n' "$PROBE_KEY" > "$RUNNER_TEMP/keeta-item06-secrets.env"
          chmod 600 "$RUNNER_TEMP/keeta-item06-secrets.env"
          echo "PROBE_KEY=$PROBE_KEY" >> "$GITHUB_ENV"

      - name: Deploy exact Worker with ephemeral probe secret
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc --secrets-file "$RUNNER_TEMP/keeta-item06-secrets.env"

      - name: Prove fresh Worker readiness and read suspended test-store baseline
        shell: bash
        run: |
          set -euo pipefail
          HTTP=000
          for attempt in $(seq 1 20); do
            HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/pre-open.json" -w '%{http_code}' \
              -H "Authorization: Bearer $PROBE_KEY" \
              "$WORKER_URL/sit/store-details?shopId=$SHOP_ID" || true)"
            if [[ "$HTTP" == '200' ]]; then break; fi
            sleep 2
          done
          test "$HTTP" = '200'
          node - "$RUNNER_TEMP/pre-open.json" <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const status=b?.data?.status;
          console.log(`baseline_store_details_code=${b.code}`);
          console.log(`baseline_status=${status}`);
          console.log(`baseline_delivery_rest_status=${b?.data?.deliveryRestStatus ?? 'not-present'}`);
          console.log(`baseline_pickup_rest_status=${b?.data?.pickupRestStatus ?? 'not-present'}`);
          console.log(`baseline_available_for_order=${b?.data?.availableForOrder ?? 'not-present'}`);
          if (b.code !== 0 || status !== 4) {
            console.error(`KEETA_STORE_ITEM_06_BASELINE_NOT_SUSPENDED code=${b.code} status=${status}`);
            process.exit(1);
          }
          NODE

      - name: Execute official status-open exactly once
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/open-result.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/store-open?shopId=$SHOP_ID" || true)"
          echo "status_open_transport_http=$HTTP"
          if [[ "$HTTP" != '200' ]]; then
            echo 'KEETA_STORE_ITEM_06_MUTATION_TRANSPORT_UNCERTAIN_NO_RETRY=true' >&2
            exit 1
          fi
          node - "$RUNNER_TEMP/open-result.json" <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`keeta_status_open_code=${b.code}`);
          console.log(`keeta_status_open_message=${String(b.message ?? '').replace(/[\r\n]/g,' ')}`);
          if (b.code !== 0) process.exit(1);
          NODE

      - name: Read back official open status without hidden rest rollback
        shell: bash
        run: |
          set -euo pipefail
          MATCH=0
          LAST_HTTP=000
          for attempt in $(seq 1 20); do
            HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/post-open.json" -w '%{http_code}' \
              -H "Authorization: Bearer $PROBE_KEY" \
              "$WORKER_URL/sit/store-details?shopId=$SHOP_ID" || true)"
            LAST_HTTP="$HTTP"
            if [[ "$HTTP" == '200' ]] && node - "$RUNNER_TEMP/post-open.json" <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const status=b?.data?.status;
          if (b.code !== 0 || status !== 3) process.exit(1);
          console.log(`post_open_store_details_code=${b.code}`);
          console.log(`post_open_status=${status}`);
          console.log(`post_open_delivery_rest_status=${b?.data?.deliveryRestStatus ?? 'not-present'}`);
          console.log(`post_open_pickup_rest_status=${b?.data?.pickupRestStatus ?? 'not-present'}`);
          console.log(`post_open_available_for_order=${b?.data?.availableForOrder ?? 'not-present'}`);
          NODE
            then
              MATCH=1
              echo "post_open_read_attempt=$attempt"
              break
            fi
            sleep 2
          done
          if [[ "$MATCH" != '1' ]]; then
            echo "KEETA_STORE_ITEM_06_POST_READ_NOT_OPEN http=$LAST_HTTP" >&2
            exit 1
          fi

      - name: Evidence summary
        shell: bash
        run: |
          printf 'builder_run_id=%s\nsource_sha=%s\napp_id=%s\nshop_id=%s\nhandbook_store_item=06\ntest_store_identity=FRESH_RESET_STORE\nstatus_open_provider_call=PASS\npre_status=4\npost_status=3\nmutation_request_count=1\nhidden_status_rest_rollback=false\nservice_line_availability_inferred=false\n' \
            "$GITHUB_RUN_ID" '${{ steps.source.outputs.sha }}' "$EXPECTED_APP_ID" "$SHOP_ID"
