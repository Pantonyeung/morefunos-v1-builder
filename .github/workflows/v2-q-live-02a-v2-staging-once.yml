name: V2 Q-LIVE-02A V2 Staging One-Shot
# trigger: deployment-contract gate 2026-08-24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-q-live-02a-v2-staging-once.yml'

permissions:
  contents: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CORE_SHA: 86b4c03ccb61191b7eb1e2a49df2de1b9b37e956
      CUSTOMER_SHA: 5a2a3da1a46b9d12b2c1cdcb0c6022ea1606c02b
      PREVIEW_BRANCH: q-live-02-v2-staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Builder result plane
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact V2 Pages source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Checkout exact Customer source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CUSTOMER_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: customer
          persist-credentials: false

      - name: Verify D-111 isolated source
        id: isolation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C customer rev-parse HEAD)" = "$CUSTOMER_SHA"
          grep -q '"FIREBASE_NAMESPACE": "morefunos-v2-staging"' core/wrangler.jsonc
          grep -q '"V2_STAGING_BOOTSTRAP": "enabled"' core/wrangler.jsonc
          ! grep -R --line-number --exclude-dir=.git --exclude='*.md' --exclude='*.test.*' -E 'FIREBASE_NAMESPACE.*(p-line-staging|b-line-staging)' core/functions core/packages/integration-v2 core/wrangler.jsonc

      - name: Install Pages dependencies
        id: install
        continue-on-error: true
        working-directory: core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run deployment boundary tests
        id: focused
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            functions/api/customer/ordering.test.ts \
            packages/integration-v2/customer-production-edge.test.ts \
            packages/integration-v2/customer-public-read-adapter.test.ts \
            packages/runtime-v2/q-read-01-connected.test.ts \
            packages/runtime-v2/operational-state-reader.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused.log"

      - name: Run Customer browser regression
        id: customer
        continue-on-error: true
        working-directory: customer
        shell: bash
        run: |
          set -o pipefail
          node --test \
            apps/customer-web/customer-runtime-bridge.test.mjs \
            apps/customer-web/customer-closure-static.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/customer.log"
          grep -q '/api/customer/ordering' apps/customer-web/customer-runtime-bridge.js

      - name: Compose exact Customer static assets
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/customer
          for file in index.html customer-shell.css customer-shell.js customer-closure.css customer-closure.js customer-closure-v2.js customer-closure-v3.css customer-closure-v3.js customer-runtime-bridge.js; do
            test -f "customer/apps/customer-web/$file"
            cp "customer/apps/customer-web/$file" "deploy/customer/$file"
          done
          printf '%s\n' '<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>MoreFunOS V2 staging</title><body><a href="/customer/">Customer</a></body></html>' > deploy/index.html

      - name: Build Pages Functions bundle
        id: functions_build
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages functions build --outdir=../deploy 2>&1 | tee "$RUNNER_TEMP/functions-build.log"

      - name: Deploy exact V2 staging preview
        id: deploy
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy ../deploy \
            --project-name=morefunos-v1 \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$CORE_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -n 1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Live Customer static smoke
        id: live_customer
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/customer/" -o "$RUNNER_TEMP/customer.html"

      - name: Live isolated canonical API smoke
        id: live_api
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -o pipefail
          CODE="$(curl --silent --show-error --location --retry 4 --retry-delay 2 --output "$RUNNER_TEMP/customer-api.json" --write-out '%{http_code}' "$URL/api/customer/ordering")"
          cat "$RUNNER_TEMP/customer-api.json"
          test "$CODE" = 200
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/customer-api.json', 'utf8'));
          if (p.port !== 'customer') process.exit(11);
          if (p.catalogVersion !== 'catalog-qread01-v1') process.exit(12);
          if (p.presentationRevision !== 'customer-qread01-r1') process.exit(13);
          if (typeof p.operationalRevision !== 'number') process.exit(14);
          if (p.storeStatus !== 'closed') process.exit(15);
          if (!Array.isArray(p.products) || p.products.length < 1) process.exit(16);
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-q-live-02a-v2-staging-${{ env.CORE_SHA }}
          path: |
            ${{ runner.temp }}/focused.log
            ${{ runner.temp }}/customer.log
            ${{ runner.temp }}/functions-build.log
            ${{ runner.temp }}/deploy.log
            ${{ runner.temp }}/customer.html
            ${{ runner.temp }}/customer-api.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist bounded result marker
        if: always()
        shell: bash
        env:
          ISOLATION: ${{ steps.isolation.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          CUSTOMER: ${{ steps.customer.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          FUNCTIONS_BUILD: ${{ steps.functions_build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE_CUSTOMER: ${{ steps.live_customer.outcome }}
          LIVE_API: ${{ steps.live_api.outcome }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          if [[ "$ISOLATION" == success && "$INSTALL" == success && "$FOCUSED" == success && "$CUSTOMER" == success && "$COMPOSE" == success && "$FUNCTIONS_BUILD" == success && "$DEPLOY" == success && "$LIVE_CUSTOMER" == success && "$LIVE_API" == success ]]; then CONCLUSION=success; else CONCLUSION=failure; fi
          mkdir -p builder/.ci-results
          {
            printf 'core_sha=%s\ncustomer_sha=%s\n' "$CORE_SHA" "$CUSTOMER_SHA"
            printf 'builder_sha=%s\nrun_id=%s\npreview_url=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PREVIEW_URL"
            printf 'isolation=%s\ninstall=%s\nfocused=%s\ncustomer=%s\ncompose=%s\nfunctions_build=%s\ndeploy=%s\nlive_customer=%s\nlive_api=%s\n' "$ISOLATION" "$INSTALL" "$FOCUSED" "$CUSTOMER" "$COMPOSE" "$FUNCTIONS_BUILD" "$DEPLOY" "$LIVE_CUSTOMER" "$LIVE_API"
            printf 'conclusion=%s\n' "$CONCLUSION"
          } > builder/.ci-results/v2-q-live-02a-v2-staging.txt
          git -C builder config user.name 'morefunos-builder-bot'
          git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git -C builder add .ci-results/v2-q-live-02a-v2-staging.txt
          if ! git -C builder diff --cached --quiet; then
            git -C builder commit -m "ci(result): V2 Q-LIVE-02A V2 staging $CORE_SHA"
            git -C builder push origin HEAD:main
          fi

      - name: Enforce result
        if: always()
        shell: bash
        env:
          ISOLATION: ${{ steps.isolation.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          CUSTOMER: ${{ steps.customer.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          FUNCTIONS_BUILD: ${{ steps.functions_build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE_CUSTOMER: ${{ steps.live_customer.outcome }}
          LIVE_API: ${{ steps.live_api.outcome }}
        run: |
          [[ "$ISOLATION" == success ]]
          [[ "$INSTALL" == success ]]
          [[ "$FOCUSED" == success ]]
          [[ "$CUSTOMER" == success ]]
          [[ "$COMPOSE" == success ]]
          [[ "$FUNCTIONS_BUILD" == success ]]
          [[ "$DEPLOY" == success ]]
          [[ "$LIVE_CUSTOMER" == success ]]
          [[ "$LIVE_API" == success ]]
