name: V2 SMT Runtime Binding D1 Apply

on:
  push:
    branches: [main]
    paths:
      - 'requests/v2-smt-runtime-binding-d1-apply.txt'

permissions:
  contents: read

jobs:
  apply:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smt-runtime-binding-d1-apply.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" && test -n "$SOURCE_TOKEN"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply only admitted SMT runtime-binding migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ steps.request.outputs.source_sha }}"
          MIGRATION='source/infra/cloudflare/d1/migrations/0017-smt-runtime-binding-authority.sql'
          test -s "$MIGRATION"
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config source/infra/cloudflare/admin-web-worker/wrangler.jsonc --file "$MIGRATION"

      - name: Verify production table
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config source/infra/cloudflare/admin-web-worker/wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='mfos_smt_runtime_binding'; PRAGMA table_info(mfos_smt_runtime_binding);" 2>&1 | tee evidence/runtime-binding-d1.txt
          grep -F 'mfos_smt_runtime_binding' evidence/runtime-binding-d1.txt >/dev/null

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf 'source_sha=%s\nrun_id=%s\nworkflow=v2-smt-runtime-binding-d1-apply\nmorefun_v2_actions=0\n' "${{ steps.request.outputs.source_sha }}" "$GITHUB_RUN_ID" > evidence/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smt-runtime-binding-d1-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
