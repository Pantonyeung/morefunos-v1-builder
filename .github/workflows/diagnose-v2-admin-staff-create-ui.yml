name: Diagnose V2 Admin Staff Create UI

on:
  push:
    paths:
      - 'requests/v2-admin-staff-create-ui-diagnostic-request.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ADMIN_ORIGIN: https://admin-ui-morefun-v2-admin.pantonyeung.workers.dev
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Probe staff create UI without mutation
        env:
          ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          test -n "$ADMIN_LOGIN_SECRET"
          cat > probe.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          const {ADMIN_ORIGIN,ADMIN_LOGIN_SECRET}=process.env;
          const browser=await chromium.launch({headless:true,executablePath:process.argv[2]});
          const context=await browser.newContext({viewport:{width:1180,height:820}});
          const page=await context.newPage();
          const pageErrors=[]; const consoleErrors=[]; const failed=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||'failed'}));

          await page.goto(ADMIN_ORIGIN+'/admin/staff',{waitUntil:'networkidle'});
          const login=page.getByLabel('登入憑證');
          if(await login.count()){
            await login.fill(ADMIN_LOGIN_SECRET);
            await page.getByRole('button',{name:'登入',exact:true}).click();
            await page.waitForLoadState('networkidle');
          }
          await page.goto(ADMIN_ORIGIN+'/admin/staff',{waitUntil:'networkidle'});

          const sessionRes=await context.request.get(ADMIN_ORIGIN+'/api/admin/session');
          const sessionText=await sessionRes.text();
          const result={sessionStatus:sessionRes.status(),sessionBody:sessionText.slice(0,1200),button:{},post:null,invalidApi:null,pageErrors,consoleErrors,failed};

          const name=page.getByPlaceholder('例如：阿明');
          const code=page.getByPlaceholder('例如：1028');
          const pin=page.getByPlaceholder('4–12 位數字');
          await name.fill('UI探針員工');
          await code.fill('94321');
          await pin.fill('2468');

          const button=page.getByRole('button',{name:'建立員工帳戶',exact:true});
          result.button.count=await button.count();
          result.button.disabled=await button.isDisabled();
          result.button.visible=await button.isVisible();

          let postSeen=null;
          await page.route('**/api/admin/staff',async route=>{
            const req=route.request();
            if(req.method()==='POST'){
              postSeen={method:req.method(),url:req.url(),body:req.postData()};
              await route.abort('blockedbyclient');
            }else await route.continue();
          });

          await button.click();
          await page.waitForTimeout(1200);
          result.post=postSeen;
          result.afterClickText=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,2200);

          const invalid=await context.request.post(ADMIN_ORIGIN+'/api/admin/staff',{
            data:{action:'CREATE_STAFF_WITH_LOGIN',idempotencyKey:'diag-invalid-'+Date.now(),displayName:'',employeeCode:'',pin:'',roleIds:[]},
            headers:{'content-type':'application/json',accept:'application/json'}
          });
          result.invalidApi={status:invalid.status(),body:(await invalid.text()).slice(0,1200)};

          await page.screenshot({path:'evidence/staff.png',fullPage:true});
          fs.writeFileSync('evidence/summary.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          await browser.close();

          if(result.sessionStatus!==200) throw new Error('SESSION_NOT_200:'+result.sessionStatus);
          if(result.button.count!==1||result.button.disabled||!result.button.visible) throw new Error('CREATE_BUTTON_NOT_ACTIONABLE');
          if(!result.post) throw new Error('CREATE_BUTTON_DID_NOT_EMIT_POST');
          if(result.invalidApi.status<400||result.invalidApi.status>=500) throw new Error('STAFF_ROUTE_INVALID_RESPONSE:'+result.invalidApi.status);
          if(pageErrors.length||consoleErrors.length) throw new Error('BROWSER_ERRORS');
          EOF
          node probe.mjs "$CHROME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-staff-create-ui-diagnostic
          path: evidence
          retention-days: 7
