name: T1 Keeta Decision Integrity Bundle 001

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-decision-integrity-bundle-001.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact V2 source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-decision-integrity-bundle-001.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install exact V2 dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Exact Keeta decision integrity tests
        working-directory: source
        run: |
          node --test packages/integration/keeta-decision-integrity.test.ts
          node --test packages/integration/keeta-merchant-decision-internal-runtime.test.ts
          node --test packages/integration/keeta-canonical-order-projection.test.ts
          node --test packages/order/d1-accepted-order-projection-identity.test.ts
          node --test packages/smm-ui-integration/keeta-merchant-inbox-runtime.test.ts

      - name: Keeta Worker Wrangler dry-run
        working-directory: source
        run: npx --yes wrangler@4 deploy --dry-run --config workers/keeta/wrangler.jsonc

      - name: Root TypeScript guard
        working-directory: source
        run: npm run typecheck
