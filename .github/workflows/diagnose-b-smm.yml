name: Owner B SMM UI Diagnostics

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  diagnose-b-smm:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/diagnose-b-smm ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUEST: ${{ github.event.comment.body }}

    steps:
      - name: Parse exact SMM diagnostic request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(printf '%s' "$REQUEST" | awk '{print $2}' | tr -d '[:space:]')"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'SMM diagnostic source SHA must be exact 40-character Git SHA' >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo 'Validated immutable SMM diagnostic request.'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo 'Exact private SMM source identity: PASS'

      - name: Install SMM dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source/apps/smm-web ci --no-audit --no-fund >/dev/null 2>&1
          echo 'SMM locked install: PASS'

      - name: Diagnose SMM UI test without source logs
        shell: bash
        run: |
          set -u
          cd source/apps/smm-web
          LOG="$RUNNER_TEMP/smm-ui-test.log"
          : > "$LOG"
          if npx vitest run src/app.vitest.test.tsx >> "$LOG" 2>&1; then
            echo 'smm-ui-test: PASS'
            exit 0
          fi

          code='OTHER'
          location='UNAVAILABLE'
          test_name='UNAVAILABLE'

          if grep -qi 'Found multiple elements' "$LOG"; then code='MULTIPLE_ELEMENTS'
          elif grep -qi 'Unable to find an element' "$LOG"; then code='ELEMENT_NOT_FOUND'
          elif grep -qi 'TestingLibraryElementError' "$LOG"; then code='TESTING_LIBRARY_ELEMENT'
          elif grep -qi 'AssertionError' "$LOG"; then code='ASSERTION_MISMATCH'
          elif grep -qi 'ReferenceError' "$LOG"; then code='REFERENCE_ERROR'
          elif grep -qi 'TypeError' "$LOG"; then code='TYPE_ERROR'
          elif grep -qi 'Unhandled Rejection' "$LOG"; then code='UNHANDLED_REJECTION'
          elif grep -qi 'Test timed out' "$LOG"; then code='TIMEOUT'
          fi

          location="$(grep -oE 'src/app\.vitest\.test\.tsx:[0-9]+:[0-9]+' "$LOG" | head -n 1 || true)"
          if [[ ! "$location" =~ ^src/app\.vitest\.test\.tsx:[0-9]+:[0-9]+$ ]]; then location='UNAVAILABLE'; fi

          test_name="$(grep -oE 'SMM mobile shell > [^[:cntrl:]]+' "$LOG" | head -n 1 | cut -c1-160 || true)"
          if [[ -z "$test_name" ]]; then test_name='UNAVAILABLE'; fi

          echo "smm-ui-test: FAIL code=$code location=$location test=$test_name (raw private output withheld)"
          echo "::error file=src/app.vitest.test.tsx,title=smm-ui-test::$code location=$location test=$test_name; raw private output withheld"
          exit 1
