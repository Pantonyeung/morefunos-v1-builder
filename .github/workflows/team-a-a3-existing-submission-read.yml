name: Team A A3 Existing Submission Read

on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-a3-existing-submission-read.txt'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Read exact submission
        shell: bash
        run: |
          set -euo pipefail
          SUBMISSION_ID="$(sed -n 's/^submission_id=//p' requests/team-a-a3-existing-submission-read.txt | tr -d '[:space:]')"
          test -n "$SUBMISSION_ID"
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          SQL="SELECT o.submission_id,o.order_id,o.store_id,s.revision,s.lifecycle_status,s.accepted_projection_json,d.display_code,d.source_order_key,d.business_date FROM mfos_customer_order_ownership o LEFT JOIN mfos_order_state s ON s.order_id=o.order_id LEFT JOIN mfos_order_display_code d ON d.order_id=o.order_id WHERE o.submission_id=?"
          SUBMISSION_ID="$SUBMISSION_ID" SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL,params:[process.env.SUBMISSION_ID]}))"
          curl -fsS -X POST "$URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json > /tmp/r.json
          node - <<'NODE'
          const x=require('/tmp/r.json'),rows=x.result?.[0]?.results||[];
          if(!x.success||!x.result?.[0]?.success) throw new Error('QUERY_FAILED');
          console.log(JSON.stringify(rows,null,2));
          NODE
