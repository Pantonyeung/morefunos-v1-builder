name: Owner V1 Verification Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    if: github.actor == 'Pantonyeung' && github.event.issue.number == 2
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.command.outputs.line }}
      source_sha: ${{ steps.command.outputs.source_sha }}
    steps:
      - name: Parse exact owner verification command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "$COMMAND" in
            '/verify-a '*) LINE='a'; EXPECTED_PREFIX='/verify-a' ;;
            '/verify-b '*) LINE='b'; EXPECTED_PREFIX='/verify-b' ;;
            '/verify-c '*) LINE='c'; EXPECTED_PREFIX='/verify-c' ;;
            '/verify-abc '*) LINE='abc'; EXPECTED_PREFIX='/verify-abc' ;;
            '/verify-ui-mother '*) LINE='ui-mother'; EXPECTED_PREFIX='/verify-ui-mother' ;;
            '/repair-smt-p01-lockfile '*) LINE='repair-smt-p01-lockfile'; EXPECTED_PREFIX='/repair-smt-p01-lockfile' ;;
            *) echo 'Unsupported verification command.' >&2; exit 1 ;;
          esac
          SOURCE_SHA="${COMMAND#* }"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Verification command requires one exact 40-character source SHA.' >&2
            exit 1
          fi
          EXPECTED="${EXPECTED_PREFIX} ${SOURCE_SHA}"
          if [[ "$COMMAND" != "$EXPECTED" ]]; then
            echo 'Verification command must contain exactly one command and one SHA.' >&2
            exit 1
          fi
          echo "line=$LINE" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "Accepted Owner verification command for line: $LINE"

  repair-smt-p01-lockfile:
    needs: prepare
    if: needs.prepare.outputs.line == 'repair-smt-p01-lockfile'
    uses: ./.github/workflows/repair-smt-p01-lockfile.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-a:
    needs: prepare
    if: needs.prepare.outputs.line == 'a'
    uses: ./.github/workflows/verify-a.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-b:
    needs: prepare
    if: needs.prepare.outputs.line == 'b'
    uses: ./.github/workflows/verify-b.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-c:
    needs: prepare
    if: needs.prepare.outputs.line == 'c'
    uses: ./.github/workflows/verify-c.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-abc:
    needs: prepare
    if: needs.prepare.outputs.line == 'abc'
    uses: ./.github/workflows/verify-abc-integration.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-ui-mother:
    needs: prepare
    if: needs.prepare.outputs.line == 'ui-mother'
    uses: ./.github/workflows/verify-ui-mother.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  report:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, repair-smt-p01-lockfile, verify-a, verify-b, verify-c, verify-abc, verify-ui-mother]
    runs-on: ubuntu-latest
    steps:
      - name: Publish sanitized owner verification result
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ needs.prepare.outputs.line }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          REPAIR_RESULT: ${{ needs.repair-smt-p01-lockfile.result }}
          A_RESULT: ${{ needs.verify-a.result }}
          B_RESULT: ${{ needs.verify-b.result }}
          C_RESULT: ${{ needs.verify-c.result }}
          ABC_RESULT: ${{ needs.verify-abc.result }}
          UI_MOTHER_RESULT: ${{ needs.verify-ui-mother.result }}
        run: |
          set -euo pipefail
          case "$LINE" in
            repair-smt-p01-lockfile) RESULT="$REPAIR_RESULT" ;;
            a) RESULT="$A_RESULT" ;;
            b) RESULT="$B_RESULT" ;;
            c) RESULT="$C_RESULT" ;;
            abc) RESULT="$ABC_RESULT" ;;
            ui-mother) RESULT="$UI_MOTHER_RESULT" ;;
            *) RESULT='unknown' ;;
          esac
          BODY="owner-verification line=${LINE:-UNKNOWN} source_sha=${SOURCE_SHA:-UNKNOWN} result=${RESULT:-UNKNOWN}"
          echo "$BODY"
          gh issue comment 2 --body "$BODY" >/dev/null
