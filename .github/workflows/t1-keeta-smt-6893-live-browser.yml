name: T1 Keeta SMT 6893 Live Browser

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-smt-6893-live-browser.txt'
      - '.github/workflows/t1-keeta-smt-6893-live-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      SMT_ORIGIN: https://morefun-v2-smt-preview.pantonyeung.workers.dev
      ORDER_ID: 9011ca2e-dd04-5198-b8d5-d96249564a15
      ORDER_CODE: "6893"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve expected source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-smt-6893-live-browser.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Browser proof
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          mkdir -p evidence
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const api=[];const responses=[];
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/api/'))api.push({origin:u.origin,path:u.pathname,method:r.method()});});
            page.on('response',async r=>{const u=new URL(r.url());if(u.pathname.startsWith('/api/')){const item={origin:u.origin,path:u.pathname,status:r.status()};if(u.pathname==='/api/smt/runtime'){try{item.body=await r.json()}catch{}}responses.push(item);}});
            await page.goto(process.env.SMT_ORIGIN+'/#/orders',{waitUntil:'networkidle'});
            const pair=await page.evaluate(async(secret)=>{
              const r=await fetch('/api/smt/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({loginSecret:secret}),cache:'no-store'});
              return {status:r.status,body:await r.json()};
            },process.env.ADMIN_LOGIN_SECRET);
            if(pair.status!==200||!pair.body?.sessionToken)throw new Error('SMT_6893_PAIR_FAILED');
            await page.evaluate(session=>localStorage.setItem('morefunos.smt.device-session.v1',JSON.stringify(session)),pair.body);
            await page.reload({waitUntil:'networkidle'});
            await page.getByText('Runtime 已連接',{exact:false}).first().waitFor({state:'visible',timeout:15000});
            const orderButton=page.locator('.orders-source-pools button',{hasText:process.env.ORDER_CODE}).first();
            try{await orderButton.waitFor({state:'visible',timeout:15000});}catch(error){const body=(await page.textContent('body'))||'';console.log('SMT_6893_DIAGNOSTIC url='+page.url()+' body='+JSON.stringify(body.slice(0,5000))+' responses='+JSON.stringify(responses));throw error;}
            const card=(await orderButton.textContent())||'';
            if(!card.includes('6893'))throw new Error('SMT_6893_SHORT_CODE_NOT_VISIBLE');
            if(!card.includes('Keeta'))throw new Error('SMT_6893_KEETA_NOT_VISIBLE');
            if(!card.includes('$21'))throw new Error('SMT_6893_TOTAL_NOT_VISIBLE');
            await orderButton.click();
            await page.getByText('1 × SIT 測試餐 A 更新',{exact:true}).waitFor({state:'visible',timeout:15000});
            const detail=(await page.locator('.orders-selected-detail').textContent())||'';
            if(!detail.includes('6893')||!detail.includes('$21')||!detail.includes('Keeta'))throw new Error('SMT_6893_DETAIL_MISMATCH');
            const publicOrigin=new URL(process.env.SMT_ORIGIN).origin;
            if(api.some(x=>x.origin!==publicOrigin))throw new Error('SMT_6893_CROSS_ORIGIN_API');
            const result={
              sourceSha:'${{ steps.req.outputs.source_sha }}',
              orderId:process.env.ORDER_ID,
              orderCode:process.env.ORDER_CODE,
              sourceLabel:'Keeta',
              totalLabel:'$21',
              canonicalProductName:'SIT 測試餐 A 更新',
              viewport:{width:1920,height:1080},
              runtimeConnected:true,
              browserDirectD1:false,
              api,
            };
            fs.writeFileSync('evidence/smt-6893-browser.json',JSON.stringify(result,null,2));
            console.log('SMT_KEETA_6893_UI_PASS '+JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-keeta-smt-6893-live-browser
          path: evidence
          if-no-files-found: error
