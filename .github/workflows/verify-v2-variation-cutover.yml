name: V2 Variation Cutover Verification

on:
  push:
    branches: [main]
    paths:
      - 'requests/v2-variation-cutover-request.txt'
      - '.github/workflows/verify-v2-variation-cutover.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source SHA
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/v2-variation-cutover-request.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install root dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Canonical Order variation tests
        working-directory: source
        run: node --experimental-strip-types --test packages/order/direct-order-variation.test.ts
      - name: SMM variation selection tests
        working-directory: source
        run: node --experimental-strip-types --test packages/smm-ui-integration/product-selection.test.ts packages/smm-ui-integration/ordering-body-migration.test.ts packages/smm-ui-integration/b0314-owner-feedback-closure.test.ts
      - name: Print variation tests
        working-directory: source
        run: node --experimental-strip-types --test packages/print/print-plan-generator.test.ts packages/print/print-template-renderer.test.ts
      - name: SMT canonical Direct Order mount tests
        working-directory: source
        run: node --experimental-strip-types --test packages/smt-ui-integration/smt-direct-order-mount.test.ts packages/smt-ui-integration/production-runtime-composition.test.ts
      - name: Root typecheck
        working-directory: source
        run: npm run typecheck
      - name: Install SMT app dependencies
        working-directory: source/apps/smt-clean
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: SMT variation presentation test only
        working-directory: source/apps/smt-clean
        run: npx vitest run src/runtime/network-production-runtime.test.ts
      - name: SMT app typecheck
        working-directory: source/apps/smt-clean
        run: npm run typecheck
      - name: SMT app build
        working-directory: source/apps/smt-clean
        run: npm run build
      - name: Install SMM app dependencies
        working-directory: source/apps/smm-web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: SMM app typecheck
        working-directory: source/apps/smm-web
        run: npm run typecheck
      - name: SMM app build
        working-directory: source/apps/smm-web
        run: npm run build
