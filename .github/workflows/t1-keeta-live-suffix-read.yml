name: T1 Keeta Live Suffix Read

on:
  push:
    branches:
      - main
    paths:
      - requests/t1-keeta-live-suffix-read.txt

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Read latest Keeta durable receipt by short order suffix
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEETA_D1_DATABASE_ID: e7e33e6f-9bc5-4f2b-89ce-acb3bb19e492
        run: |
          set -euo pipefail
          SUFFIX="$(sed -n 's/^suffix=//p' requests/t1-keeta-live-suffix-read.txt | tr -d '[:space:]')"
          [[ "$SUFFIX" =~ ^[0-9]{4}$ ]]
          SQL="SELECT dedup_key, json_extract(record_json,'$.evidence.messageId') AS message_id, json_extract(record_json,'$.evidence.providerShopId') AS provider_shop_id, json_extract(record_json,'$.merchantDecision') AS merchant_decision, record_json FROM mfos_keeta_durable_delivery WHERE record_json LIKE ? ORDER BY json_extract(record_json,'$.firstSeenAt') DESC LIMIT 3;"
          jq -n --arg sql "$SQL" --arg like "%$SUFFIX%" '{sql:$sql,params:[$like]}' > "$RUNNER_TEMP/q.json"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$KEETA_D1_DATABASE_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/q.json" > "$RUNNER_TEMP/out.json"
          jq -e '.success == true and (.result[0].success == true)' "$RUNNER_TEMP/out.json" >/dev/null
          ROWS="$(jq '[.result[0].results[]?] | length' "$RUNNER_TEMP/out.json")"
          echo "matching_rows=$ROWS"
          test "$ROWS" -ge 1

          mkdir -p .ci-results
          python3 - "$RUNNER_TEMP/out.json" ".ci-results/t1-keeta-live-suffix-read-$SUFFIX.json" <<'PY'
          import json, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          raw = json.load(open(src, encoding="utf-8"))
          rows = raw.get("result", [{}])[0].get("results", [])
          sensitive = re.compile(r"(phone|mobile|address|latitude|longitude|recipient|customer|contact|email|location|user(name|id)?$)", re.I)
          def redact(v, key=""):
              if sensitive.search(key):
                  return "[REDACTED]"
              if isinstance(v, dict):
                  return {k: redact(x, k) for k, x in v.items()}
              if isinstance(v, list):
                  return [redact(x, key) for x in v]
              return v
          out=[]
          for row in rows:
              rec = json.loads(row.get("record_json") or "{}")
              ev = rec.get("evidence") or {}
              msg_raw = ev.get("message")
              try:
                  msg = json.loads(msg_raw) if isinstance(msg_raw, str) else msg_raw
              except Exception:
                  msg = {"parseError": True}
              out.append({
                  "dedup_key": row.get("dedup_key"),
                  "message_id": row.get("message_id"),
                  "provider_shop_id": row.get("provider_shop_id"),
                  "merchant_decision": row.get("merchant_decision"),
                  "first_seen_at": rec.get("firstSeenAt"),
                  "canonical_store_id": rec.get("canonicalStoreId"),
                  "canonical_order_id": rec.get("canonicalOrderId"),
                  "canonical_revision": rec.get("canonicalRevision"),
                  "provider_action": rec.get("providerAction"),
                  "provider_action_status": rec.get("providerActionStatus"),
                  "message": redact(msg),
              })
          json.dump({"matching_rows":len(out),"rows":out}, open(dst,"w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

      - name: Read production canonical mapping and order by provider order
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
        run: |
          set -euo pipefail
          SUFFIX="$(sed -n 's/^suffix=//p' requests/t1-keeta-live-suffix-read.txt | tr -d '[:space:]')"
          PROVIDER_ORDER_ID="$(jq -r '.rows[0].message.baseOrder.orderViewIdStr // empty' ".ci-results/t1-keeta-live-suffix-read-$SUFFIX.json")"
          PROVIDER_SKU_ID="$(jq -r '.rows[0].message.products[0].skuId // empty' ".ci-results/t1-keeta-live-suffix-read-$SUFFIX.json")"
          STORE_ID="$(jq -r '.rows[0].canonical_store_id // empty' ".ci-results/t1-keeta-live-suffix-read-$SUFFIX.json")"
          test -n "$PROVIDER_ORDER_ID"; test -n "$PROVIDER_SKU_ID"; test -n "$STORE_ID"
          MAP_SQL="SELECT provider_menu_item_id, provider_sku_id, mapping_type, mapping_status, canonical_product_id FROM mfos_channel_menu_item WHERE store_id=? AND channel_context='KEETA' AND provider_sku_id=? LIMIT 5"
          jq -n --arg sql "$MAP_SQL" --arg store "$STORE_ID" --arg sku "$PROVIDER_SKU_ID" '{sql:$sql,params:[$store,$sku]}' > "$RUNNER_TEMP/map-q.json"
          curl --fail-with-body --silent --show-error --max-time 20             -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/map-q.json" > "$RUNNER_TEMP/map-out.json"
          jq -e '.success == true and (.result[0].success == true)' "$RUNNER_TEMP/map-out.json" >/dev/null

          CAT_SQL="SELECT store_id, snapshot_json FROM mfos_catalog_state WHERE store_id=? AND snapshot_json LIKE ? LIMIT 1"
          jq -n --arg sql "$CAT_SQL" --arg store "$STORE_ID" --arg like "%SIT 測試餐 A 更新%" '{sql:$sql,params:[$store,$like]}' > "$RUNNER_TEMP/cat-q.json"
          curl --fail-with-body --silent --show-error --max-time 20             -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/cat-q.json" > "$RUNNER_TEMP/cat-out.json"
          jq -e '.success == true and (.result[0].success == true)' "$RUNNER_TEMP/cat-out.json" >/dev/null

          ORDER_SQL="SELECT order_id, store_id, revision, source, channel, provider_ref, accepted_projection_json FROM mfos_order_state WHERE accepted_projection_json LIKE ? ORDER BY updated_at DESC LIMIT 5"
          jq -n --arg sql "$ORDER_SQL" --arg like "%$PROVIDER_ORDER_ID%" '{sql:$sql,params:[$like]}' > "$RUNNER_TEMP/order-q.json"
          curl --fail-with-body --silent --show-error --max-time 20             -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/order-q.json" > "$RUNNER_TEMP/order-out.json"
          jq -e '.success == true and (.result[0].success == true)' "$RUNNER_TEMP/order-out.json" >/dev/null
          jq -n --slurpfile map "$RUNNER_TEMP/map-out.json" --slurpfile catalog "$RUNNER_TEMP/cat-out.json" --slurpfile order "$RUNNER_TEMP/order-out.json" '{mapping:$map[0],catalog:$catalog[0],order:$order[0]}' > ".ci-results/t1-keeta-live-suffix-read-$SUFFIX-prod.json"

      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="$(sed -n 's/^suffix=//p' requests/t1-keeta-live-suffix-read.txt | tr -d '[:space:]')"
          git config user.name "morefunos-v1-builder"
          git config user.email "actions@users.noreply.github.com"
          git add ".ci-results/t1-keeta-live-suffix-read-$SUFFIX.json"
          test ! -f ".ci-results/t1-keeta-live-suffix-read-$SUFFIX-prod.json" || git add ".ci-results/t1-keeta-live-suffix-read-$SUFFIX-prod.json"
          git commit -m "evidence(keeta): sanitized live suffix $SUFFIX" || exit 0
          git push

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t1-keeta-live-suffix-read-${{ github.run_id }}
          path: ${{ runner.temp }}/out.json
          if-no-files-found: warn
          retention-days: 7
