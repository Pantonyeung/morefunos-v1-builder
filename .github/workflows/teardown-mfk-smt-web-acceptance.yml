name: Teardown MFK SMT Web Acceptance

on:
  push:
    branches: [main]
    paths:
      - requests/mfk-smt-web-acceptance-teardown.txt

permissions:
  contents: read

jobs:
  teardown:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require explicit teardown request
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'worker_name=mfk-smt-web-acceptance' requests/mfk-smt-web-acceptance-teardown.txt
          grep -Fx 'confirm=DELETE_TEMP_PUBLIC_SMT' requests/mfk-smt-web-acceptance-teardown.txt

      - name: Delete temporary Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > wrangler.delete.jsonc <<'EOF'
          {
            "name": "mfk-smt-web-acceptance",
            "compatibility_date": "2026-09-25"
          }
          EOF
          npm exec --yes --package=wrangler@4.125.0 -- wrangler delete --config wrangler.delete.jsonc --force
          echo "MFK_SMT_WEB_ACCEPTANCE_DELETED"
