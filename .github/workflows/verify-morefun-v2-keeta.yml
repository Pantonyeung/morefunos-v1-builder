name: Verify Morefun V2 Keeta

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/morefun-v2-keeta.sha'
      - '.github/workflows/verify-morefun-v2-keeta.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-morefun-v2-keeta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout builder request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_SHA:-}" ]; then
            SHA="$DISPATCH_SHA"
          else
            SHA="$(cat .ci-requests/morefun-v2-keeta.sha)"
          fi
          SHA="$(printf '%s' "$SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf 'verified_exact_sha=%s\n' "$ACTUAL_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pinned source dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck

      - name: Keeta canonical order binding gate
        working-directory: source
        run: node --test packages/integration/keeta-order-binding.test.ts

      - name: Keeta ingress and durable delivery regression
        working-directory: source
        run: node --test packages/integration/keeta-webhook-ingress.test.ts packages/integration/keeta-durable-delivery.test.ts packages/integration/keeta-worker-durable-receipt-linkup.test.ts workers/keeta/src/d1-durable-delivery.test.ts workers/keeta/src/index.test.ts
