name: ROUND022 Label Focused Proof

on:
  push:
    paths:
      - 'requests/round022-label-focused/*.txt'

permissions:
  contents: write

concurrency:
  group: round022-label-focused
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'requests/round022-label-focused/*.txt' | sort -u)
          [[ "${#files[@]}" -eq 1 ]]
          file="${files[0]}"
          read_field() { sed -n "s/^$1=//p" "$file" | tail -n1 | tr -d '\r\n'; }
          candidate_sha="$(read_field candidate_sha)"
          work_id="$(read_field work_id)"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          test -n "$work_id"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "work_id=$work_id" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout frozen Morefun-v2 candidate
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.candidate_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install candidate dependencies
        id: install
        continue-on-error: true
        working-directory: candidate
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Root typecheck
        id: typecheck
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: npm run typecheck

      - name: Focused Label encoder proof
        id: label
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: node --test packages/smt-ui-integration/generic-tspl-rendered-document-encoder.test.ts

      - name: SMT app typecheck and build
        id: smt
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: candidate/apps/smt-clean
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build

      - name: Seal durable result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ID: ${{ steps.request.outputs.work_id }}
          CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LABEL: ${{ steps.label.outcome }}
          SMT: ${{ steps.smt.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion=success
          for value in "$INSTALL" "$TYPECHECK" "$LABEL" "$SMT"; do
            [[ "$value" == success ]] || conclusion=failure
          done
          safe_work_id="$(printf '%s' "$WORK_ID" | tr -c 'A-Za-z0-9._-' '_')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .ci-results/round022-label-focused
            {
              echo "work_id=$WORK_ID"
              echo "candidate_sha=$CANDIDATE_SHA"
              echo "install=$INSTALL"
              echo "typecheck=$TYPECHECK"
              echo "label=$LABEL"
              echo "smt=$SMT"
              echo "run_id=$RUN_ID"
              echo "conclusion=$conclusion"
            } > ".ci-results/round022-label-focused/${safe_work_id}.txt"
            git add ".ci-results/round022-label-focused/${safe_work_id}.txt"
            if git diff --cached --quiet; then break; fi
            git commit -m "ci(round022): ${WORK_ID} ${conclusion} ${CANDIDATE_SHA}"
            if git push origin HEAD:main; then break; fi
            sleep "$attempt"
          done
          [[ "$conclusion" == success ]]
