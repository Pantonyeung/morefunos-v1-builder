name: V2 Source Write Permission Probe

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/b0321-v2-write-permission.probe'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Probe V2 token repository permission
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          JSON="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Pantonyeung/Morefun-v2)"
          PUSH="$(printf '%s' "$JSON" | jq -r '.permissions.push // false')"
          PULL="$(printf '%s' "$JSON" | jq -r '.permissions.pull // false')"
          printf 'pull=%s\npush=%s\n' "$PULL" "$PUSH" | tee permission.txt
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
      - name: Persist probe result in builder only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-results
          cp permission.txt .ci-results/b0321-v2-write-permission.txt
          git config user.name 'morefunos-builder-bot'
          git config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git add .ci-results/b0321-v2-write-permission.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci(result): probe B0321 V2 source write permission'
          git push origin HEAD:main
