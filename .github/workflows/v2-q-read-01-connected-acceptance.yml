name: V2 Q-READ-01 Connected Acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate exact source SHA input
        id: input
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact MoreFunOS source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.input.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.input.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git -C source rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          printf 'source_sha=%s\n' "$ACTUAL" >> "$GITHUB_STEP_SUMMARY"

      - name: Install root dependencies
        working-directory: source
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Q-READ-01 focused tests
        id: focused
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            packages/runtime-v2/customer-ordering-projection.test.ts \
            packages/runtime-v2/q-read-01-connected.test.ts \
            packages/runtime-v2/multi-port-published-projection.test.ts \
            packages/runtime-v2/operational-availability-projection.test.ts \
            packages/runtime-v2/admin-operational-command-seam.test.ts \
            packages/integration-v2/admin-operational-transport-adapter.test.ts \
            packages/integration-v2/admin-transport-adapter.test.ts \
            packages/integration-v2/admin-production-edge.test.ts \
            2>&1 | tee "$RUNNER_TEMP/q-read-01-focused.log"

      - name: Run V2 Core regression
        id: core
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run test:v2-core 2>&1 | tee "$RUNNER_TEMP/q-read-01-v2-core.log"

      - name: Run V2 strict typecheck
        id: typecheck
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:v2-core 2>&1 | tee "$RUNNER_TEMP/q-read-01-typecheck.log"

      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.input.outputs.source_sha }}
          FOCUSED: ${{ steps.focused.outcome }}
          CORE: ${{ steps.core.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'builder_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'builder_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'focused_tests=%s\n' "$FOCUSED"
            printf 'v2_core_regression=%s\n' "$CORE"
            printf 'typecheck=%s\n' "$TYPECHECK"
          } > evidence/q-read-01-summary.txt
          test -f "$RUNNER_TEMP/q-read-01-focused.log" && cp "$RUNNER_TEMP/q-read-01-focused.log" evidence/focused-tests.log || true
          test -f "$RUNNER_TEMP/q-read-01-v2-core.log" && cp "$RUNNER_TEMP/q-read-01-v2-core.log" evidence/v2-core-regression.log || true
          test -f "$RUNNER_TEMP/q-read-01-typecheck.log" && cp "$RUNNER_TEMP/q-read-01-typecheck.log" evidence/typecheck.log || true
          cat evidence/q-read-01-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-q-read-01-${{ steps.input.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          CORE: ${{ steps.core.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          [[ "$FOCUSED" == success ]]
          [[ "$CORE" == success ]]
          [[ "$TYPECHECK" == success ]]
