name: T1 Keeta D1 Fast Read

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-d1-fast-read.txt'

permissions:
  contents: read
  issues: write

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WRANGLER_VERSION: '4.125.0'
    steps:
      - uses: actions/checkout@v7
      - name: Read exact durable Keeta receipt via Cloudflare D1 REST API
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEETA_D1_DATABASE_ID: e7e33e6f-9bc5-4f2b-89ce-acb3bb19e492
        run: |
          set -euo pipefail
          ORDER_VIEW_ID="$(sed -n 's/^order_view_id=//p' requests/t1-keeta-d1-fast-read.txt | tail -n 1 | tr -d '[:space:]')"
          test -n "$ORDER_VIEW_ID" || { echo "ORDER_VIEW_ID_MISSING"; exit 2; }
          SQL="SELECT json_extract(record_json,'$.firstSeenAt') AS first_seen_at, json_extract(record_json,'$.merchantDecision') AS merchant_decision, json_extract(record_json,'$.providerActionStatus') AS provider_action_status, json_extract(record_json,'$.evidence.eventId') AS event_id, json_extract(record_json,'$.evidence.messageId') AS message_id, json_extract(record_json,'$.evidence.providerShopId') AS provider_shop_id, COALESCE(json_extract(json_extract(record_json,'$.evidence.message'),'$.baseOrder.orderViewId'), json_extract(json_extract(record_json,'$.evidence.message'),'$.orderInfo.baseOrder.orderViewId')) AS order_view_id FROM mfos_keeta_durable_delivery WHERE COALESCE(json_extract(json_extract(record_json,'$.evidence.message'),'$.baseOrder.orderViewId'), json_extract(json_extract(record_json,'$.evidence.message'),'$.orderInfo.baseOrder.orderViewId')) = ? ORDER BY json_extract(record_json,'$.firstSeenAt') DESC LIMIT 5;"
          jq -n --arg sql "$SQL" --arg order "$ORDER_VIEW_ID" '{sql:$sql,params:[$order]}' > "$RUNNER_TEMP/d1-query.json"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$KEETA_D1_DATABASE_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/d1-query.json" \
            > "$RUNNER_TEMP/d1-fast-read.txt"
          cat "$RUNNER_TEMP/d1-fast-read.txt"
          jq -e '.success == true and (.result | length) > 0 and (.result[0].success == true)' "$RUNNER_TEMP/d1-fast-read.txt" >/dev/null
          MATCHES="$(jq '[.result[0].results[]?] | length' "$RUNNER_TEMP/d1-fast-read.txt")"
          echo "matching_rows=$MATCHES"
          test "$MATCHES" -ge 1 || { echo "KEETA_DURABLE_RECEIPT_NOT_FOUND order_view_id=$ORDER_VIEW_ID"; exit 3; }
          BODY="T1_KEETA_D1_FAST_READ run_id=$GITHUB_RUN_ID order_view_id=$ORDER_VIEW_ID matching_rows=$MATCHES"      - name: Upload fast-read evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t1-keeta-d1-fast-read-${{ github.run_id }}
          path: ${{ runner.temp }}/d1-fast-read.txt
          if-no-files-found: warn
          retention-days: 7
        env:
          GH_TOKEN: ${{ github.token }}
\n\n'"$(tail -n 80 "$RUNNER_TEMP/d1-fast-read.txt")"
          gh api "repos/Pantonyeung/morefunos-v1-builder/issues/97/comments" -f body="$BODY"
      - name: Upload fast-read evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t1-keeta-d1-fast-read-${{ github.run_id }}
          path: ${{ runner.temp }}/d1-fast-read.txt
          if-no-files-found: warn
          retention-days: 7
        env:
          GH_TOKEN: ${{ github.token }}
