name: T1 Keeta D1 Fast Read

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-d1-fast-read.txt'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Read exact Keeta dedup and durable receipt via D1 REST API
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEETA_D1_DATABASE_ID: e7e33e6f-9bc5-4f2b-89ce-acb3bb19e492
        run: |
          set -euo pipefail

          MODE="$(sed -n 's/^mode=//p' requests/t1-keeta-d1-fast-read.txt | tail -n 1 | tr -d '[:space:]')"
          ORDER_VIEW_ID="$(sed -n 's/^order_view_id=//p' requests/t1-keeta-d1-fast-read.txt | tail -n 1 | tr -d '[:space:]')"
          MESSAGE_ID="$(sed -n 's/^message_id=//p' requests/t1-keeta-d1-fast-read.txt | tail -n 1 | tr -d '[:space:]')"

          if [ "$MODE" = "catalog_multi_2965" ]; then
            PROD_D1_DATABASE_ID="1ed17fcb-7e7a-4e13-a922-ae141aff4142"
            SQL="SELECT json_extract(j.value,'$.productId') AS product_id,json_extract(j.value,'$.name') AS name,json_extract(j.value,'$.revision') AS revision,json_extract(j.value,'$.optionGroups') AS option_groups_json FROM mfos_catalog_state c,json_each(c.snapshot_json,'$.products') j WHERE c.store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8' AND json_extract(j.value,'$.productId')='d63c5569-abb1-57b5-859f-8c38054f2661' LIMIT 1;"
            jq -n --arg sql "$SQL" '{sql:$sql,params:[]}' > "$RUNNER_TEMP/d1-query.json"
            KEETA_D1_DATABASE_ID="$PROD_D1_DATABASE_ID"
          elif [ "$MODE" = "journal_latest" ]; then
            SQL="SELECT event_id,message_id,provider_shop_id,order_view_id,status,logistics_status,op_time_ms,after_sale_order_id,provider_pushed_at FROM mfos_keeta_webhook_event_journal ORDER BY provider_pushed_at DESC, message_id DESC LIMIT 20;"
            jq -n --arg sql "$SQL" '{sql:$sql,params:[]}' > "$RUNNER_TEMP/d1-query.json"
          else
            test -n "$ORDER_VIEW_ID" || { echo "ORDER_VIEW_ID_MISSING"; exit 2; }
            test -n "$MESSAGE_ID" || { echo "MESSAGE_ID_MISSING"; exit 2; }
            DEDUP_KEY="KEETA:$MESSAGE_ID"
            SQL="SELECT d.dedup_key AS dedup_key, CASE WHEN d.fingerprint IS NOT NULL THEN 1 ELSE 0 END AS dedup_present, CASE WHEN r.dedup_key IS NOT NULL THEN 1 ELSE 0 END AS delivery_present, CASE WHEN r.record_json IS NOT NULL THEN instr(r.record_json, ?) ELSE 0 END AS delivery_contains_order, json_extract(r.record_json,'$.evidence.messageId') AS delivery_message_id, json_extract(r.record_json,'$.merchantDecision') AS merchant_decision FROM keeta_webhook_dedup d LEFT JOIN mfos_keeta_durable_delivery r ON r.dedup_key = d.dedup_key WHERE d.dedup_key = ? LIMIT 1;"
            jq -n --arg sql "$SQL" --arg order "$ORDER_VIEW_ID" --arg key "$DEDUP_KEY" '{sql:$sql,params:[$order,$key]}' > "$RUNNER_TEMP/d1-query.json"
          fi

          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$KEETA_D1_DATABASE_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/d1-query.json" \
            > "$RUNNER_TEMP/d1-fast-read.txt"

          cat "$RUNNER_TEMP/d1-fast-read.txt"
          jq -e '.success == true and (.result | length) > 0 and (.result[0].success == true)' "$RUNNER_TEMP/d1-fast-read.txt" >/dev/null

          ROWS="$(jq '[.result[0].results[]?] | length' "$RUNNER_TEMP/d1-fast-read.txt")"
          if [ "$MODE" = "catalog_multi_2965" ]; then
            echo "catalog_rows_returned=$ROWS"
            jq -c '.result[0].results[]?' "$RUNNER_TEMP/d1-fast-read.txt"
          elif [ "$MODE" = "journal_latest" ]; then
            echo "journal_rows_returned=$ROWS"
            jq -c '.result[0].results[]?' "$RUNNER_TEMP/d1-fast-read.txt"
          else
            echo "matching_identity_rows=$ROWS"
            echo "order_view_id=$ORDER_VIEW_ID"
            echo "message_id=$MESSAGE_ID"
            if [ "$ROWS" -lt 1 ]; then
              echo "KEETA_WEBHOOK_DEDUP_NOT_FOUND message_id=$MESSAGE_ID"
              exit 3
            fi
            jq -r '.result[0].results[0] | "dedup_present=\(.dedup_present) delivery_present=\(.delivery_present) delivery_contains_order=\(.delivery_contains_order) delivery_message_id=\(.delivery_message_id // "null") merchant_decision=\(.merchant_decision // "null")"' "$RUNNER_TEMP/d1-fast-read.txt"
          fi

      - name: Upload fast-read evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t1-keeta-d1-fast-read-${{ github.run_id }}
          path: ${{ runner.temp }}/d1-fast-read.txt
          if-no-files-found: warn
          retention-days: 7
