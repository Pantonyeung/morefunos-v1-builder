name: Verify V2 Keeta Durable Delivery

on:
  push:
    paths:
      - 'requests/v2-keeta-durable-delivery-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-keeta-durable-delivery-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exact source
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Keeta ingress + durable delivery + reconciliation + READY TDD gate
        working-directory: source
        run: node --test packages/integration/keeta-webhook-ingress.test.ts packages/integration/keeta-durable-delivery.test.ts packages/integration/keeta-order-get-reconciliation.test.ts packages/integration/fulfillment-ready-keeta-prepare.test.ts workers/keeta/src/d1-durable-delivery.test.ts workers/keeta/src/index.test.ts
      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck
      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_sha=%s\nmutation=NONE\nworkflow=verify-v2-keeta-durable-delivery.yml\nrun_id=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > evidence/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-keeta-durable-delivery-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
