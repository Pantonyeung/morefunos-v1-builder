name: T1 Keeta Operational Row Diagnostic

on:
  push:
    paths:
      - 'requests/t1-keeta-operational-row-diagnostic.txt'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KEETA_D1_DATABASE_ID: e7e33e6f-9bc5-4f2b-89ce-acb3bb19e492
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}

      - name: Read exact durable operational columns
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/^short_code=//p' requests/t1-keeta-operational-row-diagnostic.txt | tr -d '[:space:]')"
          [[ "$CODE" =~ ^[0-9]{4}$ ]]
          SQL="SELECT dedup_key, canonical_order_id, updated_at, json_extract(record_json,'$.canonicalStoreId') AS canonical_store_id, json_extract(record_json,'$.canonicalOrderId') AS json_canonical_order_id, json_extract(record_json,'$.merchantDecision') AS merchant_decision, json_extract(record_json,'$.providerAction') AS provider_action, json_extract(record_json,'$.providerActionStatus') AS provider_action_status, json_extract(record_json,'$.evidence.message') AS message_json FROM mfos_keeta_durable_delivery WHERE record_json LIKE ? ORDER BY updated_at DESC LIMIT 3"
          jq -n --arg sql "$SQL" --arg like "%$CODE%" '{sql:$sql,params:[$like]}' > /tmp/q.json
          curl --fail-with-body --silent --show-error --max-time 20 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$KEETA_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/q.json > /tmp/out.json
          jq -e '.success == true and (.result[0].success == true)' /tmp/out.json >/dev/null
          mkdir -p evidence
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/out.json','utf8'));
          const rows=raw.result?.[0]?.results||[];
          const out=rows.map(r=>{
            let msg={};try{msg=JSON.parse(r.message_json||'{}')}catch{}
            return {
              dedup_key:r.dedup_key,
              canonical_order_id_column:r.canonical_order_id,
              canonical_order_id_json:r.json_canonical_order_id,
              canonical_store_id:r.canonical_store_id,
              merchant_decision:r.merchant_decision,
              provider_action:r.provider_action,
              provider_action_status:r.provider_action_status,
              provider_order_id:msg?.baseOrder?.orderViewIdStr??msg?.merchantOrder?.orderViewIdStr??null,
              short_code:msg?.merchantOrder?.seqNoStr??null,
              currency:msg?.baseOrder?.currency??null,
              product_price_minor:Array.isArray(msg?.feeDtls)?msg.feeDtls.find(x=>x?.code==='productPrice')?.price??null:null,
              item_count:Array.isArray(msg?.products)?msg.products.reduce((n,x)=>n+(Number.isSafeInteger(Number(x?.count))&&Number(x.count)>0?Number(x.count):1),0):0,
              updated_at:r.updated_at,
            };
          });
          console.log('KEETA_OPERATIONAL_ROW_DIAG '+JSON.stringify(out));
          fs.writeFileSync('evidence/keeta-operational-row.json',JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: t1-keeta-operational-row-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
