name: T1 Keeta Durable Event Journal Live Apply 011

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-provider-event-inbox-live-011.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morefun-v2-keeta-durable-event-journal-live
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_VERSION: "4.125.0"
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact admitted V2 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-provider-event-inbox-live-011.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Morefun-v2
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove admitted source and canonical 010 assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          test -f source/infra/cloudflare/d1/migrations/0019-keeta-webhook-event-journal.sql
          test ! -f source/infra/cloudflare/d1/migrations/0019-provider-event-inbox.sql
          grep -Fq 'mfos_keeta_webhook_event_journal' source/infra/cloudflare/d1/migrations/0019-keeta-webhook-event-journal.sql
          grep -Fq 'createD1KeetaWebhookEventJournalRepository' source/workers/keeta/src/index.ts
          grep -Fq 'createKeetaWebhookEventJournalRecord' source/workers/keeta/src/index.ts

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install --global "wrangler@$WRANGLER_VERSION" --no-audit --no-fund

      - name: Install exact source dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Canonical 010 exact-source regression
        working-directory: source
        run: |
          node --test packages/integration/keeta-webhook-event-journal.test.ts packages/integration/d1-keeta-durable-runtime.test.ts packages/integration/keeta-webhook-ingress.test.ts packages/integration/keeta-durable-delivery.test.ts
          npm run typecheck

      - name: Verify live D1 identity
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          node - "$RUNNER_TEMP/d1-list.json" wrangler.jsonc <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const cfg=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const expected=cfg.d1_databases.find(x=>x.binding==='KEETA_INGRESS_DB');
          if(!expected) throw new Error('KEETA_D1_BINDING_MISSING');
          const live=rows.find(x=>x.name===expected.database_name);
          if(!live || live.uuid!==expected.database_id) throw new Error('KEETA_D1_IDENTITY_MISMATCH');
          console.log('d1_identity=PASS');
          console.log('d1_name='+live.name);
          console.log('d1_id='+live.uuid);
          NODE

      - name: Inspect canonical journal before apply
        id: journal_preflight
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='mfos_keeta_webhook_event_journal';" > "$RUNNER_TEMP/journal-preflight.json"
          if grep -Fq 'mfos_keeta_webhook_event_journal' "$RUNNER_TEMP/journal-preflight.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply only canonical 010 journal migration when absent
        if: steps.journal_preflight.outputs.present != 'true'
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --file ../../infra/cloudflare/d1/migrations/0019-keeta-webhook-event-journal.sql

      - name: Prove canonical journal schema
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT type,name FROM sqlite_master WHERE name IN ('mfos_keeta_webhook_event_journal','mfos_keeta_webhook_event_journal_order_idx','mfos_keeta_webhook_event_journal_event_idx') ORDER BY name;" | tee "$RUNNER_TEMP/journal-schema.json"
          grep -Fq 'mfos_keeta_webhook_event_journal' "$RUNNER_TEMP/journal-schema.json"
          grep -Fq 'mfos_keeta_webhook_event_journal_order_idx' "$RUNNER_TEMP/journal-schema.json"
          grep -Fq 'mfos_keeta_webhook_event_journal_event_idx' "$RUNNER_TEMP/journal-schema.json"

      - name: Inspect obsolete generic inbox
        id: obsolete
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='mfos_provider_event_inbox';" > "$RUNNER_TEMP/obsolete.json"
          if grep -Fq 'mfos_provider_event_inbox' "$RUNNER_TEMP/obsolete.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require obsolete inbox empty
        if: steps.obsolete.outputs.present == 'true'
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT COUNT(*) AS obsolete_rows FROM mfos_provider_event_inbox;" > "$RUNNER_TEMP/obsolete-count.json"
          node - "$RUNNER_TEMP/obsolete-count.json" <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(payload)?payload.flatMap(x=>x?.results??[]):[];
          const count=Number(rows[0]?.obsolete_rows);
          console.log('obsolete_rows='+count);
          if(count!==0) throw new Error('OBSOLETE_PROVIDER_EVENT_INBOX_NOT_EMPTY');
          NODE

      - name: Drop obsolete empty generic inbox
        if: steps.obsolete.outputs.present == 'true'
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --command "DROP TABLE IF EXISTS mfos_provider_event_inbox;"
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE name LIKE 'mfos_provider_event_inbox%';" > "$RUNNER_TEMP/obsolete-after.json"
          if grep -Fq 'mfos_provider_event_inbox' "$RUNNER_TEMP/obsolete-after.json"; then
            cat "$RUNNER_TEMP/obsolete-after.json"
            exit 1
          fi
          echo "obsolete_generic_inbox_removed=true"

      - name: Deploy exact admitted Keeta Worker
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.jsonc | tee "$RUNNER_TEMP/deploy.txt"

      - name: Smoke live Worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error https://morefun-v2-keeta-sit.pantonyeung.workers.dev/health | tee "$RUNNER_TEMP/health.json"
          grep -Fq '"status":"ok"' "$RUNNER_TEMP/health.json"

      - name: Read canonical journal count
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT COUNT(*) AS journal_rows FROM mfos_keeta_webhook_event_journal;" | tee "$RUNNER_TEMP/journal-count.json"
