name: Owner Writeback Operational Lockfiles

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  writeback:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/writeback-operational-lockfiles ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Validate immutable writeback request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SOURCE_SHA="${COMMAND#'/writeback-operational-lockfiles '}"
          SOURCE_SHA="$(printf '%s' "$SOURCE_SHA" | tr -d '[:space:]')"
          test "$COMMAND" = "/writeback-operational-lockfiles ${SOURCE_SHA}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Canonicalize and verify four operational lockfiles
        id: lockfiles
        shell: bash
        run: |
          set -u
          cd source
          APPS=(apps/smm-web apps/admin-web apps/customer-web apps/owner-web)
          for APP in "${APPS[@]}"; do
            ID="$(basename "$APP" | tr '-' '_')"
            LOG="$RUNNER_TEMP/${ID}.log"
            test -f "$APP/package.json" || { echo "result=${ID}:manifest:ENOENT" >> "$GITHUB_OUTPUT"; exit 1; }
            rm -rf "$APP/node_modules"
            rm -f "$APP/package-lock.json"
            if ! npm --prefix "$APP" install --package-lock-only --ignore-scripts --no-audit --no-fund >"$LOG" 2>&1; then
              CODE="$(grep -Eo '(npm (ERR!|error) code )?[A-Z][A-Z0-9_]+' "$LOG" | tail -1 | grep -Eo '[A-Z][A-Z0-9_]+' || true)"
              echo "result=${ID}:lockgen:${CODE:-UNKNOWN}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            node - "$APP/package.json" "$APP/package-lock.json" <<'NODE'
          const fs = require('node:fs');
          const [pkgPath, lockPath] = process.argv.slice(2);
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const root = lock.packages?.[''];
          if (!root || root.name !== pkg.name || root.version !== pkg.version) {
            throw new Error(`LOCK_IDENTITY_MISMATCH:${lockPath}`);
          }
          NODE
            if ! npm --prefix "$APP" ci --ignore-scripts --no-audit --no-fund >"$LOG" 2>&1; then
              CODE="$(grep -Eo '(npm (ERR!|error) code )?[A-Z][A-Z0-9_]+' "$LOG" | tail -1 | grep -Eo '[A-Z][A-Z0-9_]+' || true)"
              echo "result=${ID}:ci:${CODE:-UNKNOWN}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' apps/admin-web/package-lock.json apps/customer-web/package-lock.json apps/owner-web/package-lock.json apps/smm-web/package-lock.json | sort)"
          test "$CHANGED" = "$EXPECTED"
          echo "result=PASS" >> "$GITHUB_OUTPUT"

      - name: Commit verified lockfiles and fast-forward integration branch
        id: writeback
        if: steps.lockfiles.outputs.result == 'PASS'
        shell: bash
        env:
          V1_WRITE_TOKEN: ${{ secrets.V1_B2_LOCKFILE_WRITE_TOKEN }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$V1_WRITE_TOKEN"
          cd source
          TARGET_BRANCH='agent/operational-chain-integration-159-162'
          REMOTE_HEAD="$(git ls-remote https://x-access-token:${V1_WRITE_TOKEN}@github.com/Pantonyeung/morefunos-v1.git refs/heads/${TARGET_BRANCH} | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$SOURCE_SHA"
          git config user.name 'MoreFunOS V1 Builder'
          git config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git add -- apps/smm-web/package-lock.json apps/admin-web/package-lock.json apps/customer-web/package-lock.json apps/owner-web/package-lock.json
          git commit -m 'build(operational): canonicalize verified surface lockfiles'
          NEW_SHA="$(git rev-parse HEAD)"
          ASKPASS="$RUNNER_TEMP/v1-writeback-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) echo "x-access-token" ;;
            *Password*) printf '%s\n' "$V1_WRITE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          git push https://github.com/Pantonyeung/morefunos-v1.git "HEAD:refs/heads/${TARGET_BRANCH}"
          rm -f "$ASKPASS"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Report sanitized writeback result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RESULT: ${{ steps.lockfiles.outputs.result }}
          NEW_SHA: ${{ steps.writeback.outputs.new_sha }}
        run: |
          set -euo pipefail
          if [[ "${RESULT:-UNKNOWN}" = 'PASS' && -n "${NEW_SHA:-}" ]]; then
            BODY="operational-lockfile-writeback ${SOURCE_SHA} PASS new_sha=${NEW_SHA}"
          else
            BODY="operational-lockfile-writeback ${SOURCE_SHA} FAIL diagnostic=${RESULT:-UNKNOWN}"
          fi
          echo "$BODY"
          gh issue comment 2 --body "$BODY" >/dev/null
