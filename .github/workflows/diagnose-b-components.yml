name: Owner B Component Diagnostics

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/diagnose-b-components ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: Pantonyeung/morefunos-v1
      REQUEST: ${{ github.event.comment.body }}
    steps:
      - name: Parse exact diagnostic request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(printf '%s' "$REQUEST" | awk '{print $2}' | tr -d '[:space:]')"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'diagnostic source SHA must be exact 40-character Git SHA' >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo 'Validated immutable B component diagnostic request.'

      - name: Checkout exact private source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo 'Exact private source identity: PASS'

      - name: Install SMT Web dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source/apps/smt-web ci --no-audit --no-fund >/dev/null 2>&1
          echo 'SMT Web locked install: PASS'

      - name: Diagnose component files without source logs
        shell: bash
        run: |
          set -u
          cd source/apps/smt-web
          failed=0
          run_file() {
            local stage="$1"
            local file="$2"
            local file_log="$RUNNER_TEMP/${stage}.log"
            : > "$file_log"
            if npx vitest run "$file" >> "$file_log" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            local code='OTHER'
            local location='UNAVAILABLE'
            if grep -qi 'Found multiple elements' "$file_log"; then code='MULTIPLE_ELEMENTS'
            elif grep -qi 'Unable to find an element' "$file_log"; then code='ELEMENT_NOT_FOUND'
            elif grep -qi 'TestingLibraryElementError' "$file_log"; then code='TESTING_LIBRARY_ELEMENT'
            elif grep -qi 'AssertionError' "$file_log"; then code='ASSERTION_MISMATCH'
            elif grep -qi 'ReferenceError' "$file_log"; then code='REFERENCE_ERROR'
            elif grep -qi 'TypeError' "$file_log"; then code='TYPE_ERROR'
            elif grep -qi 'Unhandled Rejection' "$file_log"; then code='UNHANDLED_REJECTION'
            elif grep -qi 'Test timed out' "$file_log"; then code='TIMEOUT'
            fi
            location="$(grep -oE 'src/[A-Za-z0-9_.-]+\.vitest\.test\.tsx:[0-9]+:[0-9]+' "$file_log" | head -n 1 || true)"
            if [[ ! "$location" =~ ^src/[A-Za-z0-9_.-]+\.vitest\.test\.tsx:[0-9]+:[0-9]+$ ]]; then location='UNAVAILABLE'; fi
            echo "$stage: FAIL code=$code location=$location (raw private output withheld)"
            failed=1
          }
          run_file 'component-app' 'src/app.vitest.test.tsx'
          run_file 'component-shared-ui' 'src/shared-ui.vitest.test.tsx'
          run_file 'component-orders' 'src/orders-page.vitest.test.tsx'
          run_file 'component-dine-in' 'src/dine-in-page.vitest.test.tsx'
          run_file 'component-soldout' 'src/soldout-page.vitest.test.tsx'
          run_file 'component-business-day' 'src/business-day-page.vitest.test.tsx'
          run_file 'component-reporting' 'src/reporting-page.vitest.test.tsx'
          exit "$failed"