name: V2 SMM UI Integration Verification

on:
  push:
    paths:
      - 'requests/v2-smm-ui-integration-request.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish Builder pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context='builder/v2-smm-ui-integration' \
            -f description='Builder verification started'

      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          else
            test -f requests/v2-smm-ui-integration-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smm-ui-integration-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Mark tests pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context='builder/v2-smm-ui-integration/tests' -f description='SMM integration tests running'

      - name: Mark B0314 contract pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context='builder/v2-smm-ui-integration/test-b0314' -f description='B0314 contract test running'

      - name: B0314 owner-feedback contract test
        id: test_b0314
        working-directory: source
        run: node --test packages/smm-ui-integration/b0314-owner-feedback-closure.test.ts

      - name: Mark B0314 contract success
        if: ${{ steps.test_b0314.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context='builder/v2-smm-ui-integration/test-b0314' -f description='B0314 contract test passed'

      - name: Mark B0314 contract failure
        if: ${{ failure() && steps.test_b0314.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=failure -f context='builder/v2-smm-ui-integration/test-b0314' -f description='B0314 contract test failed'

      - name: Mark trusted runtime pending
        if: ${{ steps.test_b0314.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context='builder/v2-smm-ui-integration/test-runtime' -f description='Trusted runtime test running'

      - name: Trusted worker runtime test
        id: test_runtime
        if: ${{ steps.test_b0314.outcome == 'success' }}
        working-directory: source
        run: node --test packages/smm-ui-integration/trusted-worker-runtime.test.ts

      - name: Mark trusted runtime success
        if: ${{ steps.test_runtime.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context='builder/v2-smm-ui-integration/test-runtime' -f description='Trusted runtime test passed'

      - name: Mark trusted runtime failure
        if: ${{ failure() && steps.test_runtime.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=failure -f context='builder/v2-smm-ui-integration/test-runtime' -f description='Trusted runtime test failed'

      - name: Mark remaining tests pending
        if: ${{ steps.test_runtime.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context='builder/v2-smm-ui-integration/test-rest' -f description='Remaining SMM tests running'

      - name: Remaining SMM UI integration tests
        id: test_rest
        if: ${{ steps.test_runtime.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages/smm-ui-integration -maxdepth 1 -name '*.test.ts' ! -name 'b0314-owner-feedback-closure.test.ts' ! -name 'trusted-worker-runtime.test.ts' | sort)
          node --test "${files[@]}"

      - name: Mark remaining tests success
        if: ${{ steps.test_rest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context='builder/v2-smm-ui-integration/test-rest' -f description='Remaining SMM tests passed'
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context='builder/v2-smm-ui-integration/tests' -f description='SMM integration tests passed'

      - name: Mark remaining tests failure
        if: ${{ failure() && steps.test_rest.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=failure -f context='builder/v2-smm-ui-integration/test-rest' -f description='Remaining SMM tests failed'

      - name: Mark typecheck pending
        if: ${{ hashFiles('source/apps/smm-web/package.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context='builder/v2-smm-ui-integration/typecheck' -f description='SMM app typecheck running'

      - name: SMM app typecheck
        if: ${{ hashFiles('source/apps/smm-web/package.json') != '' }}
        working-directory: source/apps/smm-web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck

      - name: Mark typecheck success
        if: ${{ hashFiles('source/apps/smm-web/package.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context='builder/v2-smm-ui-integration/typecheck' -f description='SMM app typecheck passed'

      - name: Mark build pending
        if: ${{ hashFiles('source/apps/smm-web/package.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context='builder/v2-smm-ui-integration/build' -f description='SMM app build running'

      - name: SMM app build
        if: ${{ hashFiles('source/apps/smm-web/package.json') != '' }}
        working-directory: source/apps/smm-web
        run: npm run build

      - name: Mark build success
        if: ${{ hashFiles('source/apps/smm-web/package.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context='builder/v2-smm-ui-integration/build' -f description='SMM app build passed'

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nworkflow=verify-v2-smm-ui-integration.yml\n' "$SOURCE_SHA" > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-smm-ui-integration-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish Builder success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context='builder/v2-smm-ui-integration' \
            -f description='Builder verification passed'

      - name: Publish Builder failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context='builder/v2-smm-ui-integration' \
            -f description='Builder verification failed'
