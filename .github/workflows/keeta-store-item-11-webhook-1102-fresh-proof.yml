name: Keeta Store Item 11 Webhook 1102 Fresh Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ci-requests/morefun-v2-keeta-store-item-11.sha'

permissions:
  contents: read

concurrency:
  group: keeta-store-item-11-webhook-1102-fresh-proof
  cancel-in-progress: false

jobs:
  store-item-11:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_VERSION: '4.125.0'
      EXPECTED_APP_ID: '3419700273'
      SHOP_ID: '721578302'
      D1_DATABASE: 'morefun-v2-keeta-sit-ingress'
      WORKER_URL: 'https://morefun-v2-keeta-sit.pantonyeung.workers.dev'

    steps:
      - name: Checkout Builder request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/morefun-v2-keeta-store-item-11.sha)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Guard fresh reset identity and strict webhook runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
          grep -Fq '/sit/configure-webhook-1102' source/workers/keeta/src/index.ts
          grep -Fq '/webhooks/keeta' source/workers/keeta/src/index.ts
          grep -Fq 'INSERT INTO keeta_webhook_evidence' source/workers/keeta/src/store-status-runtime.ts
          test -f source/workers/keeta/migrations/0005_keeta_webhook_evidence.sql
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('source/workers/keeta/wrangler.jsonc','utf8');
          if (!text.includes(`\"KEETA_APP_ID\": \"${process.env.EXPECTED_APP_ID}\"`)) throw new Error('EXPECTED_APP_ID_NOT_FOUND');
          NODE

      - name: Require existing runtime secret names
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" secret list --config wrangler.jsonc --format json > "$RUNNER_TEMP/secrets-before.json"
          node - "$RUNNER_TEMP/secrets-before.json" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const names=new Set(rows.map(row=>row.name));
          for (const name of ['KEETA_APP_SECRET','KEETA_TOKEN_ENCRYPTION_KEY']) if (!names.has(name)) throw new Error(`${name}_MISSING`);
          NODE

      - name: Ensure durable evidence migration
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply "$D1_DATABASE" --remote --config wrangler.jsonc

      - name: Prepare ephemeral SIT probe secret
        shell: bash
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf 'KEETA_SIT_PROBE_KEY=%s\n' "$PROBE_KEY" > "$RUNNER_TEMP/item11-secrets.env"
          chmod 600 "$RUNNER_TEMP/item11-secrets.env"
          echo "PROBE_KEY=$PROBE_KEY" >> "$GITHUB_ENV"

      - name: Deploy exact Worker preserving existing secrets
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc --secrets-file "$RUNNER_TEMP/item11-secrets.env"

      - name: Configure genuine Keeta webhook event 1102
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/config-1102.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/configure-webhook-1102" || true)"
          test "$HTTP" = '200'
          node - "$RUNNER_TEMP/config-1102.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (body.code !== 0 || body.data?.eventId !== 1102 || body.data?.isTest !== 1) throw new Error('KEETA_1102_CONFIG_REJECTED');
          console.log('configure_webhook_1102=PASS');
          NODE

      - name: Require provider pre-state status 4
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/status-before.json" -w '%{http_code}' -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-status-state?shopId=$SHOP_ID" || true)"
          test "$HTTP" = '200'
          node - "$RUNNER_TEMP/status-before.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId)!==721578302 || Number(body.data?.status)!==4) throw new Error(`KEETA_ITEM11_PRESTATE_NOT_4:${body.data?.status}`);
          console.log('provider_pre_status=4');
          NODE

      - name: Read durable 1102 evidence baseline
        id: evidence_before
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$D1_DATABASE" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS count FROM keeta_webhook_evidence WHERE event_id=1102 AND app_id=$EXPECTED_APP_ID AND shop_id=$SHOP_ID" --json > "$RUNNER_TEMP/evidence-before.json"
          COUNT="$(node - "$RUNNER_TEMP/evidence-before.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const row=Array.isArray(body)?body[0]?.results?.[0]:body?.results?.[0];
          if (!row || !Number.isFinite(Number(row.count))) process.exit(1);
          process.stdout.write(String(Number(row.count)));
          NODE
          )"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "baseline_1102_evidence_count=$COUNT"

      - name: Start sanitized Cloudflare real-time tail
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (timeout 210s npx --yes "wrangler@$WRANGLER_VERSION" tail --config wrangler.jsonc --format json > "$RUNNER_TEMP/item11-tail.jsonl" 2> "$RUNNER_TEMP/item11-tail.err" || true) &
          echo "TAIL_PID=$!" >> "$GITHUB_ENV"
          sleep 5

      - name: Trigger provider status 4 to 3 exactly once
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/open-result.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-open?shopId=$SHOP_ID" || true)"
          echo "item11_open_transport_http=$HTTP"
          if [[ "$HTTP" != '200' ]]; then
            echo 'KEETA_ITEM11_OPEN_TRANSPORT_UNCERTAIN_NO_RETRY=true' >&2
            exit 1
          fi
          node - "$RUNNER_TEMP/open-result.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`item11_open_provider_code=${body.code}`);
          if (body.code !== 0) process.exit(1);
          NODE
          echo 'STORE_OPENED=1' >> "$GITHUB_ENV"

      - name: Wait for genuine Keeta 1102 durable evidence without mutation retry
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_COUNT: ${{ steps.evidence_before.outputs.count }}
        run: |
          set -euo pipefail
          FOUND=0
          FOUND_ATTEMPT=0
          for attempt in $(seq 1 30); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$D1_DATABASE" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS count FROM keeta_webhook_evidence WHERE event_id=1102 AND app_id=$EXPECTED_APP_ID AND shop_id=$SHOP_ID" --json > "$RUNNER_TEMP/evidence-poll.json"
            COUNT="$(node - "$RUNNER_TEMP/evidence-poll.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const row=Array.isArray(body)?body[0]?.results?.[0]:body?.results?.[0];
          process.stdout.write(String(Number(row?.count ?? -1)));
          NODE
          )"
            if [[ "$COUNT" =~ ^[0-9]+$ ]] && (( COUNT > BASELINE_COUNT )); then
              FOUND=1
              FOUND_ATTEMPT=$attempt
              break
            fi
            sleep 2
          done
          echo "ITEM11_WEBHOOK_FOUND=$FOUND" >> "$GITHUB_ENV"
          echo "ITEM11_WEBHOOK_ATTEMPT=$FOUND_ATTEMPT" >> "$GITHUB_ENV"
          echo "genuine_1102_found=$FOUND attempt=$FOUND_ATTEMPT"

      - name: Restore provider status to 4 exactly once and prove readback
        if: always() && env.STORE_OPENED == '1'
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/rest-result.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-rest?shopId=$SHOP_ID" || true)"
          echo "item11_restore_transport_http=$HTTP"
          if [[ "$HTTP" != '200' ]]; then
            echo 'KEETA_ITEM11_RESTORE_TRANSPORT_UNCERTAIN_NO_RETRY=true' >&2
            exit 1
          fi
          node - "$RUNNER_TEMP/rest-result.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`item11_restore_provider_code=${body.code}`);
          if (body.code !== 0) process.exit(1);
          NODE
          MATCH=0
          for attempt in $(seq 1 20); do
            HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/status-after.json" -w '%{http_code}' -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-status-state?shopId=$SHOP_ID" || true)"
            if [[ "$HTTP" == '200' ]] && node - "$RUNNER_TEMP/status-after.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (body.code!==0 || Number(body.data?.shopId)!==721578302 || Number(body.data?.status)!==4) process.exit(1);
          NODE
            then
              MATCH=1
              echo "restore_status4_readback_attempt=$attempt"
              break
            fi
            sleep 2
          done
          test "$MATCH" = '1'
          echo 'provider_status_restored=PASS'

      - name: Stop tail and report sanitized webhook observations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TAIL_PID:-}" ]]; then kill "$TAIL_PID" 2>/dev/null || true; fi
          sleep 2
          node - "$RUNNER_TEMP/item11-tail.jsonl" <<'NODE'
          const fs=require('fs');
          const path=process.argv[2];
          if (!fs.existsSync(path)) { console.log('tail_webhook_events=0'); process.exit(0); }
          let count=0;
          const statuses=new Set();
          const outcomes=new Set();
          for (const line of fs.readFileSync(path,'utf8').split(/\r?\n/)) {
            if (!line.trim()) continue;
            let row; try { row=JSON.parse(line); } catch { continue; }
            const requestUrl=row?.event?.request?.url;
            if (typeof requestUrl!=='string') continue;
            let pathname=''; try { pathname=new URL(requestUrl).pathname; } catch { continue; }
            if (pathname!=='/webhooks/keeta') continue;
            count+=1;
            const status=row?.event?.response?.status ?? row?.response?.status;
            if (status!==undefined) statuses.add(String(status));
            if (row?.outcome) outcomes.add(String(row.outcome));
          }
          console.log(`tail_webhook_events=${count}`);
          console.log(`tail_webhook_response_statuses=${[...statuses].join(',') || 'unknown'}`);
          console.log(`tail_webhook_outcomes=${[...outcomes].join(',') || 'unknown'}`);
          NODE

      - name: Prove genuine 1102 envelope and durable dedup identity
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "${ITEM11_WEBHOOK_FOUND:-0}" != '1' ]]; then
            echo 'KEETA_STORE_ITEM_11_NO_POST_VERIFY_1102_EVIDENCE=true' >&2
            exit 1
          fi
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$D1_DATABASE" --remote --config wrangler.jsonc --command "SELECT message_id,event_id,app_id,shop_id,provider_timestamp,LENGTH(message) AS message_length FROM keeta_webhook_evidence WHERE event_id=1102 AND app_id=$EXPECTED_APP_ID AND shop_id=$SHOP_ID ORDER BY provider_timestamp DESC, received_at DESC LIMIT 1" --json > "$RUNNER_TEMP/evidence-latest.json"
          MESSAGE_ID="$(node - "$RUNNER_TEMP/evidence-latest.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const row=Array.isArray(body)?body[0]?.results?.[0]:body?.results?.[0];
          if (!row || Number(row.event_id)!==1102 || Number(row.app_id)!==3419700273 || Number(row.shop_id)!==721578302 || !row.message_id || Number(row.provider_timestamp)<=0 || Number(row.message_length)<=0) process.exit(1);
          process.stdout.write(String(row.message_id));
          NODE
          )"
          SAFE_ID="${MESSAGE_ID//\'/\'\'}"
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$D1_DATABASE" --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS count FROM keeta_webhook_dedup WHERE dedup_key='KEETA:$SAFE_ID'" --json > "$RUNNER_TEMP/dedup-latest.json"
          node - "$RUNNER_TEMP/dedup-latest.json" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const row=Array.isArray(body)?body[0]?.results?.[0]:body?.results?.[0];
          if (Number(row?.count)!==1) throw new Error('KEETA_ITEM11_DEDUP_IDENTITY_MISSING');
          console.log('genuine_1102_envelope=PASS');
          console.log('genuine_1102_dedup=PASS');
          NODE

      - name: Evidence summary
        shell: bash
        run: |
          printf 'builder_run_id=%s\nsource_sha=%s\napp_id=%s\nshop_id=%s\nhandbook_store_item=11\nwebhook_event_id=1102\nprovider_configuration=PASS\nprovider_state_transition=4_TO_3\nprovider_status_restored=PASS\nsignature_gate=PASS_BY_DURABLE_POST_VERIFY_EVIDENCE\ndurable_evidence=PASS\ndurable_dedup=PASS\nopen_mutation_request_count=1\nrestore_mutation_request_count=1\nautomatic_mutation_retry=false\nself_generated_webhook=false\n' \
            "$GITHUB_RUN_ID" '${{ steps.source.outputs.sha }}' "$EXPECTED_APP_ID" "$SHOP_ID"
