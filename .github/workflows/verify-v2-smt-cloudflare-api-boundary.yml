name: Verify V2 SMT Cloudflare API Boundary

on:
  push:
    paths:
      - 'requests/v2-smt-cloudflare-api-boundary-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smt-cloudflare-api-boundary-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exact source
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck
      - name: SMT API contract tests
        working-directory: source
        run: npm run test:smt-ui-integration
      - name: Generate non-production dry-run config
        shell: bash
        run: |
          cat > source/infra/cloudflare/smt-api-worker/wrangler.dry-run.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "morefunos-v2-smt-api-dry-run",
            "main": "src/index.ts",
            "compatibility_date": "2026-08-31",
            "compatibility_flags": ["nodejs_compat"],
            "hyperdrive": [{ "binding": "HYPERDRIVE", "id": "00000000-0000-0000-0000-000000000000" }]
          }
          EOF
      - name: Wrangler bundle dry-run only
        working-directory: source/infra/cloudflare/smt-api-worker
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir=dist --config=wrangler.dry-run.jsonc
      - name: Verify bundle contains canonical SMT routes
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F '/api/smt/session/login' source/infra/cloudflare/smt-api-worker/dist >/dev/null
          grep -R -F '/api/smt/orders' source/infra/cloudflare/smt-api-worker/dist >/dev/null
      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_sha=%s\nmutation=NONE\nworkflow=verify-v2-smt-cloudflare-api-boundary.yml\nrun_id=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > evidence/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smt-cloudflare-api-boundary-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
