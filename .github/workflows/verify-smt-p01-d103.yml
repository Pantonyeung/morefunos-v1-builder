name: SMT P01 D-103 Verification

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
    outputs:
      failure_stage:
        value: ${{ jobs.verify.outputs.failure_stage }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      failure_stage: ${{ steps.stage.outputs.failure_stage }}
    env:
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact V1 source
        id: source_checkout
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        id: identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Run V1-owned D-103 profile
        id: v1_profile
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run verify:smt-p01-d103 2>&1 | tee "$RUNNER_TEMP/v1-d103-summary.log"

      - name: Upload V1-produced D-103 evidence
        id: evidence_artifact
        if: steps.v1_profile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: smt-p01-d103-evidence-${{ steps.request.outputs.source_sha }}
          path: source/artifacts/smt-p01-d103
          if-no-files-found: error
          retention-days: 30

      - name: Derive failure stage
        id: stage
        if: always()
        shell: bash
        env:
          REQUEST: ${{ steps.request.outcome }}
          SOURCE: ${{ steps.source_checkout.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          PROFILE: ${{ steps.v1_profile.outcome }}
          ARTIFACT: ${{ steps.evidence_artifact.outcome }}
        run: |
          set -euo pipefail
          STAGE=none
          if [[ "$REQUEST" == failure ]]; then
            STAGE=request
          elif [[ "$SOURCE" == failure ]]; then
            STAGE=source-checkout
          elif [[ "$IDENTITY" == failure ]]; then
            STAGE=identity
          elif [[ "$PROFILE" == failure ]]; then
            STAGE="$(grep -oE 'stage=[^ ]+' "$RUNNER_TEMP/v1-d103-summary.log" 2>/dev/null | tail -n1 | cut -d= -f2 || true)"
            [[ -n "$STAGE" ]] || STAGE=v1-profile
          elif [[ "$ARTIFACT" == failure ]]; then
            STAGE=evidence-artifact
          fi
          echo "failure_stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "smt-p01-d103-stage=$STAGE"

      - name: Enforce D-103 verification result
        if: always()
        shell: bash
        env:
          STAGE: ${{ steps.stage.outputs.failure_stage }}
        run: |
          set -euo pipefail
          test "$STAGE" = none
