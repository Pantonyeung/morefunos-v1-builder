name: Owner V1 Current Verification

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
    outputs:
      failure_stage:
        value: ${{ jobs.verify.outputs.failure_stage }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: morefunos-v1-current-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      failure_stage: ${{ steps.stage.outputs.failure_stage }}
    env:
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      SOVEREIGNTY_PATH: docs/authority/IMMUTABLE_MOREFUNOS_OWNER_SOVEREIGNTY_SNAPSHOT_V1_2026-08-21.md
      SOVEREIGNTY_BLOB_SHA: d4767c95d566633fc241fe5fbbaaed6eeba2d351
    steps:
      - name: Validate immutable verification request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Builder definition
        id: builder_checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        id: node_setup
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify current Builder policy
        id: policy
        shell: bash
        run: node scripts/verify-builder-policy.mjs

      - name: Checkout exact MoreFunOS V1 source
        id: source_checkout
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        id: identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Verify immutable Owner Sovereignty Snapshot
        id: sovereignty
        shell: bash
        run: |
          set -euo pipefail
          test -f "source/$SOVEREIGNTY_PATH"
          ACTUAL="$(git -C source hash-object "$SOVEREIGNTY_PATH")"
          test "$ACTUAL" = "$SOVEREIGNTY_BLOB_SHA"
          echo "owner-sovereignty-snapshot=PASS blob=$ACTUAL"

      - name: Setup pinned TypeScript
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"

      - name: Verify current V1 without public source logs
        id: verify
        shell: bash
        run: |
          set -u
          LOG="$RUNNER_TEMP/v1-current-private.log"
          : > "$LOG"
          cd source

          run_stage() {
            local stage="$1"
            shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            echo "$stage: FAIL (details withheld from public log)"
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            return 1
          }

          if [[ ! -f apps/smt-web/package-lock.json ]]; then
            echo "failed_stage=v1-smt-lockfile" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          run_stage "v1-smt-locked-install" npm --prefix apps/smt-web ci --no-audit --no-fund || exit 1
          run_stage "v1-contracts" npm run test:v1 || exit 1
          run_stage "v1-typecheck" npm run typecheck:v1 || exit 1
          run_stage "v1-smt-functional" npm --prefix apps/smt-web test || exit 1
          run_stage "v1-smt-build" npm --prefix apps/smt-web run build || exit 1
          echo "Current V1 verification: PASS"

      - name: Derive sanitized V1 failure stage
        id: stage
        if: always()
        shell: bash
        env:
          REQUEST: ${{ steps.request.outcome }}
          BUILDER_CHECKOUT: ${{ steps.builder_checkout.outcome }}
          NODE_SETUP: ${{ steps.node_setup.outcome }}
          POLICY: ${{ steps.policy.outcome }}
          SOURCE_CHECKOUT: ${{ steps.source_checkout.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          SOVEREIGNTY: ${{ steps.sovereignty.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          VERIFY_STAGE: ${{ steps.verify.outputs.failed_stage }}
        run: |
          set -euo pipefail
          STAGE=none
          if [[ "$REQUEST" == failure ]]; then STAGE=request;
          elif [[ "$BUILDER_CHECKOUT" == failure ]]; then STAGE=builder-checkout;
          elif [[ "$NODE_SETUP" == failure ]]; then STAGE=node-setup;
          elif [[ "$POLICY" == failure ]]; then STAGE=builder-policy;
          elif [[ "$SOURCE_CHECKOUT" == failure ]]; then STAGE=source-checkout;
          elif [[ "$IDENTITY" == failure ]]; then STAGE=source-identity;
          elif [[ "$SOVEREIGNTY" == failure ]]; then STAGE=sovereignty-lock;
          elif [[ "$TOOLCHAIN" == failure ]]; then STAGE=toolchain;
          elif [[ "$VERIFY" == failure ]]; then STAGE="${VERIFY_STAGE:-v1-verification}";
          fi
          echo "failure_stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "verify-v1-stage=$STAGE"
