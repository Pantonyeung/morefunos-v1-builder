name: Owner V1 Current Verification

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
    outputs:
      failure_stage:
        value: ${{ jobs.verify.outputs.failure_stage }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: morefunos-v1-current-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      failure_stage: ${{ steps.verify.outputs.failed_stage }}
    env:
      SOURCE_REPO: Pantonyeung/morefunos-v1
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate immutable verification request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup pinned TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"

      - name: Verify current V1 without public source logs
        id: verify
        shell: bash
        run: |
          set -u
          LOG="$RUNNER_TEMP/v1-current-private.log"
          : > "$LOG"
          cd source

          run_stage() {
            local stage="$1"
            shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            echo "$stage: FAIL (details withheld from public log)"
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            return 1
          }

          if [[ ! -f apps/smt-web/package-lock.json ]]; then
            echo "failed_stage=v1-smt-lockfile" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          run_stage "v1-smt-locked-install" npm --prefix apps/smt-web ci --no-audit --no-fund || exit 1

          run_stage "v1-runtime-contracts" node --experimental-strip-types --test \
            packages/contracts/*.test.ts \
            packages/customer/*.test.ts \
            packages/loyalty/*.test.ts \
            packages/order/*.test.ts \
            packages/pricing/*.test.ts \
            packages/payment/*.test.ts \
            packages/fulfillment/*.test.ts \
            packages/printing/*.test.ts \
            packages/durability/*.test.ts \
            packages/admin/*.test.ts \
            packages/staff/*.test.ts \
            packages/store-settings/*.test.ts \
            packages/catalog/*.test.ts \
            packages/availability/*.test.ts \
            packages/inventory/*.test.ts \
            packages/procurement/*.test.ts \
            packages/table/*.test.ts \
            packages/channels/*.test.ts \
            packages/facts/*.test.ts \
            packages/runtime/*.test.ts \
            packages/business-day/*.test.ts \
            packages/reporting/*.test.ts \
            packages/ui/module-contract.test.ts || exit 1

          run_stage "v1-ui-authority" node --test \
            packages/ui/ui-authority-boundary.test.mjs \
            packages/ui/sdk-passthrough.test.mjs || exit 1

          run_stage "v1-typecheck" tsc --noEmit -p tsconfig.json || exit 1
          run_stage "v1-smt-functional" npm --prefix apps/smt-web test || exit 1
          run_stage "v1-smt-build" npm --prefix apps/smt-web run build || exit 1

          echo "Current V1 verification: PASS"
