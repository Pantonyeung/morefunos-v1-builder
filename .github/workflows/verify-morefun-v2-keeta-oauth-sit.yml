name: Verify Morefun V2 Keeta OAuth SIT

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/morefun-v2-keeta-oauth-proof.txt'
      - '.github/workflows/verify-morefun-v2-keeta-oauth-sit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-oauth-sit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: '4.125.0'
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: 42c95004500f412054dce9b4f64a0f550024a353
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Diagnose OAuth state lifecycle without exposing state value
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc \
            --command "SELECT connection_id, created_at, CASE WHEN consumed_at IS NULL THEN 0 ELSE 1 END AS consumed FROM keeta_oauth_state ORDER BY created_at DESC LIMIT 5" \
            --json > "$RUNNER_TEMP/oauth-state-proof.json"
          node - "$RUNNER_TEMP/oauth-state-proof.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = payload.flatMap((entry) => entry.results ?? []);
          console.log(`oauth_state_rows=${rows.length}`);
          rows.forEach((row, index) => {
            console.log(`oauth_state_${index}_connection_id=${row.connection_id}`);
            console.log(`oauth_state_${index}_created_at=${row.created_at}`);
            console.log(`oauth_state_${index}_consumed=${Boolean(Number(row.consumed))}`);
          });
          NODE

      - name: Prove encrypted OAuth token exists without exposing credential material
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc \
            --command "SELECT connection_id, expires_at, updated_at, length(ciphertext) AS ciphertext_length, length(iv) AS iv_length FROM keeta_oauth_token ORDER BY updated_at DESC LIMIT 5" \
            --json > "$RUNNER_TEMP/oauth-proof.json"
          node - "$RUNNER_TEMP/oauth-proof.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = payload.flatMap((entry) => entry.results ?? []);
          if (rows.length === 0) throw new Error('KEETA_OAUTH_TOKEN_NOT_STORED');
          for (const row of rows) {
            if (!row.connection_id || !Number.isFinite(Number(row.expires_at)) || Number(row.ciphertext_length) <= 0 || Number(row.iv_length) <= 0) {
              throw new Error('KEETA_OAUTH_ENCRYPTED_ROW_INVALID');
            }
          }
          const latest = rows[0];
          console.log(`oauth_connection_id=${latest.connection_id}`);
          console.log(`oauth_expires_at=${latest.expires_at}`);
          console.log(`oauth_ciphertext_present=${Number(latest.ciphertext_length) > 0}`);
          console.log(`oauth_iv_present=${Number(latest.iv_length) > 0}`);
          NODE
