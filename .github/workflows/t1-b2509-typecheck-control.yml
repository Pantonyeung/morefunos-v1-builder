name: Team1 B2509 TypeScript Baseline Control

on:
  push:
    paths:
      - requests/t1-b2509-typecheck-control.txt

permissions:
  contents: read

jobs:
  typecheck:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/t1-b2509-typecheck-control.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install exact dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Root TypeScript control
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-b2509-typecheck-control-${{ steps.req.outputs.source_sha }}
          path: ${{ runner.temp }}/typecheck.log
          if-no-files-found: warn
          retention-days: 30
