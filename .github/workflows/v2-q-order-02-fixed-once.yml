name: V2 Q-ORDER-02 Fixed One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.ci-trigger/q-order-02-fixed.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CORE_SHA: 18511b8de267d47a8bb91a58c5a9ae210097b7e4
      CUSTOMER_SHA: d44b03de913c667b6c43837e8f98a9d07542d1de
      SMT_SHA: beead70bd6e9b11bbc2770b9e7da0c5efb753438
      PREVIEW_BRANCH: q-order-02-v2-staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact Core
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Checkout exact Customer
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CUSTOMER_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: customer
          persist-credentials: false

      - name: Checkout exact SMT
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SMT_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: smt
          persist-credentials: false

      - name: Verify identities and isolation
        id: identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C customer rev-parse HEAD)" = "$CUSTOMER_SHA"
          test "$(git -C smt rev-parse HEAD)" = "$SMT_SHA"
          grep -q '"FIREBASE_NAMESPACE": "morefunos-v2-staging"' core/wrangler.jsonc
          ! grep -R --line-number --exclude-dir=.git --exclude='*.md' --exclude='*.test.*' -E 'FIREBASE_NAMESPACE.*(p-line-staging|b-line-staging)' core/functions core/packages/integration-v2 core/wrangler.jsonc
          grep -q 'pendingChannelSubmissions' smt/apps/smt-web/src/smt-runtime-adapter.ts

      - name: Install dependencies
        id: install
        continue-on-error: true
        working-directory: core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run focused regression including reordered readback
        id: focused
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            packages/runtime-v2/operational-state-durable-authority.test.ts \
            packages/integration-v2/durable-channel-transport.test.ts \
            packages/integration-v2/customer-order-submit-adapter.test.ts \
            packages/integration-v2/smt-durable-channel-hydrator.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused.log"

      - name: Compose Customer assets
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/customer
          for file in index.html customer-shell.css customer-shell.js customer-closure.css customer-closure.js customer-closure-v2.js customer-closure-v3.css customer-closure-v3.js customer-runtime-bridge.js; do
            cp "customer/apps/customer-web/$file" "deploy/customer/$file"
          done
          cat > deploy/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q-ORDER-02</title></head><body><a href="/customer/">Customer</a></body></html>
          HTML

      - name: Add ephemeral operator harness
        id: harness
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/operator-token"
          mkdir -p core/functions/api/operator
          cat > core/functions/api/operator/q-order-02.ts <<EOF
          import { FirebaseRtdbDurabilityPort } from '../../../packages/durability/firebase-rtdb-durability.ts';
          import { createOperationalStateCheckpointReaderV1 } from '../../../packages/runtime-v2/operational-state-reader.ts';
          import { createOperationalStateDurableAuthorityV1 } from '../../../packages/runtime-v2/operational-state-durable-authority.ts';
          import { createGoogleFirebaseBearerTokenProviderV1 } from '../../../packages/integration-v2/admin-production-edge.ts';
          import { createWebCryptoGoogleJwtClientFactoryV1 } from '../../../packages/integration-v2/google-service-account-webcrypto.ts';
          import { createDurableChannelTransportV1 } from '../../../packages/integration-v2/durable-channel-transport.ts';
          const TOKEN='$TOKEN'; const BRANCH='$PREVIEW_BRANCH'; const NS='morefunos-v2-staging';
          const googleJwt=createWebCryptoGoogleJwtClientFactoryV1();
          interface Env { FIREBASE_DATABASE_URL:string; FIREBASE_NAMESPACE:string; GOOGLE_SERVICE_ACCOUNT_EMAIL:string; GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:string; CF_PAGES_BRANCH?:string; }
          interface Ctx { request:Request; env:Env & Record<string,unknown>; }
          const json=(body:unknown,status=200)=>Response.json(body,{status,headers:{'cache-control':'no-store'}});
          const codeOf=(e:unknown)=>e instanceof Error && e.message ? e.message : 'UNKNOWN';
          export async function onRequest(context:Ctx):Promise<Response>{
            if(context.request.method!=='POST') return json({ok:false,error:'METHOD_NOT_ALLOWED'},405);
            if(context.env.CF_PAGES_BRANCH!==BRANCH) return json({ok:false,error:'NOT_FOUND'},404);
            if(context.env.FIREBASE_NAMESPACE!==NS) return json({ok:false,error:'NAMESPACE_MISMATCH'},409);
            if(context.request.headers.get('authorization')!=='Bearer '+TOKEN) return json({ok:false,error:'UNAUTHORIZED'},401);
            try {
              const tokens=createGoogleFirebaseBearerTokenProviderV1({email:context.env.GOOGLE_SERVICE_ACCOUNT_EMAIL,privateKey:context.env.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY},googleJwt);
              const port=new FirebaseRtdbDurabilityPort({databaseUrl:context.env.FIREBASE_DATABASE_URL,namespace:context.env.FIREBASE_NAMESPACE,tokens});
              const body=await context.request.json() as Record<string,unknown>;
              if(body.action==='set-status'){
                const status=body.status==='open'?'open':body.status==='closed'?'closed':null;
                if(!status) return json({ok:false,error:'STATUS_INVALID'},400);
                const reader=createOperationalStateCheckpointReaderV1(port);
                const current=await reader.readCurrent();
                if(current.storeStatus===status) return json({ok:true,state:current,unchanged:true});
                const authority=createOperationalStateDurableAuthorityV1({port,initialState:current});
                const next=await authority.execute({expectedRevision:current.revision,command:{kind:'set-store-status',status},committedAt:new Date().toISOString()});
                return json({ok:true,state:next});
              }
              if(body.action==='inspect-channel'){
                const date=String(body.businessDate??''); const id=String(body.submissionId??'');
                const transport=createDurableChannelTransportV1(port);
                const matches=(await transport.list(date)).filter((x)=>x.submissionId===id);
                return json({ok:true,count:matches.length,envelope:matches[0]??null});
              }
              return json({ok:false,error:'ACTION_INVALID'},400);
            } catch(error){ return json({ok:false,error:codeOf(error)},500); }
          }
          EOF

      - name: Build harness bundle
        id: build
        continue-on-error: true
        working-directory: core
        shell: bash
        run: npx wrangler pages functions build --outdir=../deploy 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Deploy harness preview
        id: deploy
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy ../deploy --project-name=morefunos-v1 --branch="$PREVIEW_BRANCH" --commit-hash="$CORE_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -n1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Open staging and prove canonical read
        id: open_store
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/operator-token")"
          CODE="$(curl --silent --show-error --location -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data '{"action":"set-status","status":"open"}' -o "$RUNNER_TEMP/open.json" -w '%{http_code}' "$URL/api/operator/q-order-02")"
          cat "$RUNNER_TEMP/open.json"
          test "$CODE" = 200
          node -e "const x=require(process.env.RUNNER_TEMP+'/open.json');if(!x.ok||x.state.storeStatus!=='open')process.exit(1)"
          curl --fail --silent --show-error --location "$URL/api/customer/ordering" > "$RUNNER_TEMP/ordering.json"
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ordering.json','utf8'));if(x.storeStatus!=='open')process.exit(1);fs.writeFileSync(process.env.RUNNER_TEMP+'/business-date',x.businessDate);
          NODE

      - name: Submit and replay live Customer order
        id: live_submit
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          export BUSINESS_DATE="$(cat "$RUNNER_TEMP/business-date")"
          export SUBMISSION_ID="q-order-02-fixed-${GITHUB_RUN_ID}"
          export IDEMPOTENCY_KEY="q-order-02-fixed-idem-${GITHUB_RUN_ID}"
          export CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          node - <<'NODE'
          const fs=require('fs');fs.writeFileSync(process.env.RUNNER_TEMP+'/submit.json',JSON.stringify({submissionId:process.env.SUBMISSION_ID,idempotencyKey:process.env.IDEMPOTENCY_KEY,createdAt:process.env.CREATED_AT,businessDate:process.env.BUSINESS_DATE,payload:{lines:[{lineId:'line-1',productId:'F4',quantity:1,selections:[{optionGroupId:'drink',optionIds:['milk-tea']}]}],pickup:{mode:'takeaway',requestedTime:'asap'},customerDisplayedTotalMinor:4500,currency:'HKD',externalReference:process.env.SUBMISSION_ID}}));
          NODE
          C1="$(curl --silent --show-error --location -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/submit.json" -o "$RUNNER_TEMP/first.json" -w '%{http_code}' "$URL/api/customer/orders")"
          C2="$(curl --silent --show-error --location -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/submit.json" -o "$RUNNER_TEMP/replay.json" -w '%{http_code}' "$URL/api/customer/orders")"
          test "$C1" = 202; test "$C2" = 202
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/first.json','utf8'));const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/replay.json','utf8'));if(!a.ok||!b.ok||a.submissionId!==process.env.SUBMISSION_ID||b.submissionId!==process.env.SUBMISSION_ID||a.status!=='submitted'||b.status!=='submitted')process.exit(1);
          NODE
          printf '%s' "$SUBMISSION_ID" > "$RUNNER_TEMP/submission-id"

      - name: Prove live durable envelope and SMT pending hydration
        id: live_chain
        continue-on-error: true
        working-directory: core
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/operator-token")"; DATE="$(cat "$RUNNER_TEMP/business-date")"; ID="$(cat "$RUNNER_TEMP/submission-id")"
          printf '{"action":"inspect-channel","businessDate":"%s","submissionId":"%s"}' "$DATE" "$ID" > "$RUNNER_TEMP/inspect.json"
          curl --fail --silent --show-error --location -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/inspect.json" "$URL/api/operator/q-order-02" > "$RUNNER_TEMP/live-envelope.json"
          export LIVE_ENVELOPE_FILE="$RUNNER_TEMP/live-envelope.json" BUSINESS_DATE="$DATE" EXPECTED_ID="$ID"
          node --experimental-strip-types --input-type=module - <<'NODE' | tee "$RUNNER_TEMP/smt.log"
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createChannelIntake}from'./packages/channels/channel-intake.ts';import{createSmtDurableChannelHydratorV1}from'./packages/integration-v2/smt-durable-channel-hydrator.ts';
          const payload=JSON.parse(fs.readFileSync(process.env.LIVE_ENVELOPE_FILE,'utf8'));assert.equal(payload.count,1);const live=payload.envelope;assert.equal(live.submissionId,process.env.EXPECTED_ID);assert.equal(live.channel,'customer-web');assert.equal(live.status,'submitted');const intake=createChannelIntake();const runtime={submitChannel:intake.submit,pendingChannelSubmissions:()=>intake.list().filter(x=>x.status==='submitted')};const result=await createSmtDurableChannelHydratorV1({queue:{async list(){return[live]}},runtime}).hydrate(process.env.BUSINESS_DATE);assert.equal(result.pending.length,1);assert.equal(result.pending[0].submissionId,process.env.EXPECTED_ID);console.log(JSON.stringify({ok:true,pending:1,id:process.env.EXPECTED_ID}));
          NODE
          grep -q 'pendingChannelSubmissions' ../../smt/apps/smt-web/src/smt-runtime-adapter.ts

      - name: Close staging through canonical authority
        id: close_store
        if: always()
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$URL"
          TOKEN="$(cat "$RUNNER_TEMP/operator-token")"
          CODE="$(curl --silent --show-error --location -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data '{"action":"set-status","status":"closed"}' -o "$RUNNER_TEMP/close.json" -w '%{http_code}' "$URL/api/operator/q-order-02")"
          cat "$RUNNER_TEMP/close.json"
          test "$CODE" = 200
          node -e "const x=require(process.env.RUNNER_TEMP+'/close.json');if(!x.ok||x.state.storeStatus!=='closed')process.exit(1)"

      - name: Build clean exact-source deployment
        id: clean_build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f core/functions/api/operator/q-order-02.ts
          rm -rf deploy-clean
          cp -R deploy deploy-clean
          rm -f deploy-clean/_worker.js
          (cd core && npx wrangler pages functions build --outdir=../deploy-clean)

      - name: Redeploy clean exact-source preview
        id: clean_deploy
        if: always()
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy ../deploy-clean --project-name=morefunos-v1 --branch="$PREVIEW_BRANCH" --commit-hash="$CORE_SHA" 2>&1 | tee "$RUNNER_TEMP/clean-deploy.log"
          URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/clean-deploy.log" | tail -n1 || true)";test -n "$URL";echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify clean state
        id: cleanup
        if: always()
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.clean_deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$URL"
          curl --silent --show-error --location -X POST -H 'content-type: application/json' --data '{}' "$URL/api/operator/q-order-02" > "$RUNNER_TEMP/operator-after.txt" || true
          ! grep -q '"error":"UNAUTHORIZED"' "$RUNNER_TEMP/operator-after.txt"
          ! grep -q 'NAMESPACE_MISMATCH' "$RUNNER_TEMP/operator-after.txt"
          curl --fail --silent --show-error --location "$URL/api/customer/ordering" > "$RUNNER_TEMP/final-ordering.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/final-ordering.json');if(x.storeStatus!=='closed')process.exit(1)"

      - name: Persist result
        if: always()
        shell: bash
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          HARNESS: ${{ steps.harness.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          OPEN_STORE: ${{ steps.open_store.outcome }}
          LIVE_SUBMIT: ${{ steps.live_submit.outcome }}
          LIVE_CHAIN: ${{ steps.live_chain.outcome }}
          CLOSE_STORE: ${{ steps.close_store.outcome }}
          CLEAN_BUILD: ${{ steps.clean_build.outcome }}
          CLEAN_DEPLOY: ${{ steps.clean_deploy.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          LIVE_URL: ${{ steps.deploy.outputs.url }}
          CLEAN_URL: ${{ steps.clean_deploy.outputs.url }}
        run: |
          set -euo pipefail
          if [[ "$IDENTITY" == success && "$INSTALL" == success && "$FOCUSED" == success && "$COMPOSE" == success && "$HARNESS" == success && "$BUILD" == success && "$DEPLOY" == success && "$OPEN_STORE" == success && "$LIVE_SUBMIT" == success && "$LIVE_CHAIN" == success && "$CLOSE_STORE" == success && "$CLEAN_BUILD" == success && "$CLEAN_DEPLOY" == success && "$CLEANUP" == success ]];then CONCLUSION=success;else CONCLUSION=failure;fi
          mkdir -p evidence builder/.ci-results
          {
            printf 'core_sha=%s\ncustomer_sha=%s\nsmt_sha=%s\nbuilder_sha=%s\nrun_id=%s\n' "$CORE_SHA" "$CUSTOMER_SHA" "$SMT_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'preview_branch=%s\nlive_url=%s\nclean_url=%s\n' "$PREVIEW_BRANCH" "$LIVE_URL" "$CLEAN_URL"
            printf 'identity=%s\ninstall=%s\nfocused=%s\ncompose=%s\nharness=%s\nbuild=%s\ndeploy=%s\nopen_store=%s\nlive_submit=%s\nlive_chain=%s\nclose_store=%s\nclean_build=%s\nclean_deploy=%s\ncleanup=%s\nconclusion=%s\n' "$IDENTITY" "$INSTALL" "$FOCUSED" "$COMPOSE" "$HARNESS" "$BUILD" "$DEPLOY" "$OPEN_STORE" "$LIVE_SUBMIT" "$LIVE_CHAIN" "$CLOSE_STORE" "$CLEAN_BUILD" "$CLEAN_DEPLOY" "$CLEANUP" "$CONCLUSION"
          } > builder/.ci-results/v2-q-order-02-fixed.txt
          cp builder/.ci-results/v2-q-order-02-fixed.txt evidence/result.txt
          for f in focused.log build.log deploy.log open.json ordering.json first.json replay.json live-envelope.json smt.log close.json clean-deploy.log final-ordering.json operator-after.txt;do test -f "$RUNNER_TEMP/$f"&&cp "$RUNNER_TEMP/$f" evidence/||true;done
          git -C builder config user.name morefunos-builder-bot;git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com';git -C builder add .ci-results/v2-q-order-02-fixed.txt;if ! git -C builder diff --cached --quiet;then git -C builder commit -m "ci(result): Q-ORDER-02 fixed $CORE_SHA";git -C builder push origin HEAD:main;fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-q-order-02-fixed-${{ env.CORE_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce result
        if: always()
        shell: bash
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          HARNESS: ${{ steps.harness.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          OPEN_STORE: ${{ steps.open_store.outcome }}
          LIVE_SUBMIT: ${{ steps.live_submit.outcome }}
          LIVE_CHAIN: ${{ steps.live_chain.outcome }}
          CLOSE_STORE: ${{ steps.close_store.outcome }}
          CLEAN_BUILD: ${{ steps.clean_build.outcome }}
          CLEAN_DEPLOY: ${{ steps.clean_deploy.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          [[ "$IDENTITY" == success && "$INSTALL" == success && "$FOCUSED" == success && "$COMPOSE" == success && "$HARNESS" == success && "$BUILD" == success && "$DEPLOY" == success && "$OPEN_STORE" == success && "$LIVE_SUBMIT" == success && "$LIVE_CHAIN" == success && "$CLOSE_STORE" == success && "$CLEAN_BUILD" == success && "$CLEAN_DEPLOY" == success && "$CLEANUP" == success ]]
