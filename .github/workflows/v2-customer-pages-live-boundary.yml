name: V2 Customer Pages Live Boundary

on:
  push:
    branches: [main]
    paths:
      - '.ci-trigger/customer-pages-live-boundary.txt'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_SHA: 31111fe6be91ce9eead5956da1b19092677afc17
      CUSTOMER_SHA: 31100dae325f43d5ceaeddd53a270b85aef75be2
      PREVIEW_BRANCH: q-customer-boundary-v2-staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CUSTOMER_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: customer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C customer rev-parse HEAD)" = "$CUSTOMER_SHA"
          grep -q '"FIREBASE_NAMESPACE": "morefunos-v2-staging"' core/wrangler.jsonc
          for file in customer-runtime-adapter.js customer-runtime-store.js customer-runtime-ui-binding.js customer-runtime-bridge.js; do test -f "customer/apps/customer-web/$file"; done

      - name: Install Core dependencies
        working-directory: core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Compose exact Customer assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/customer
          for file in index.html customer-shell.css customer-shell.js customer-closure.css customer-closure.js customer-closure-v2.js customer-closure-v3.css customer-closure-v3.js customer-runtime-adapter.js customer-runtime-store.js customer-runtime-ui-binding.js customer-runtime-bridge.js; do
            cp "customer/apps/customer-web/$file" "deploy/customer/$file"
          done
          cat > deploy/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Boundary</title></head><body><a href="/customer/">Customer</a></body></html>
          HTML

      - name: Build Pages Functions
        working-directory: core
        run: npm exec --yes --package=wrangler@4.125.0 -- wrangler pages functions build --outdir=../deploy

      - name: Deploy isolated Preview
        id: deploy
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=wrangler@4.125.0 -- wrangler pages deploy ../deploy --project-name=morefunos-v1 --branch="$PREVIEW_BRANCH" --commit-hash="$CORE_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -n1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Prove live Customer page modules and canonical public read
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$URL/customer/" > "$RUNNER_TEMP/customer.html"
          grep -q 'customer-runtime-bridge.js' "$RUNNER_TEMP/customer.html"
          for module in customer-runtime-adapter.js customer-runtime-store.js customer-runtime-ui-binding.js customer-runtime-bridge.js; do
            CODE="$(curl --silent --show-error -o "$RUNNER_TEMP/$module" -w '%{http_code}' "$URL/customer/$module")"
            test "$CODE" = 200
            test -s "$RUNNER_TEMP/$module"
          done
          curl --fail --silent --show-error "$URL/api/customer/ordering" > "$RUNNER_TEMP/ordering.json"
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ordering.json','utf8'));
          if(!Number.isSafeInteger(x.publishSequence)||!x.catalogVersion||!x.presentationRevision||!Number.isSafeInteger(x.operationalRevision)) process.exit(1);
          NODE

      - name: Persist live evidence
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builder/.ci-results evidence
          printf 'core_sha=%s\ncustomer_sha=%s\nbuilder_sha=%s\nrun_id=%s\npreview_branch=%s\nlive_url=%s\ncustomer_html=success\nruntime_adapter=200\nruntime_store=200\nruntime_ui_binding=200\nruntime_bridge=200\ncanonical_ordering_read=success\nconclusion=success\n' "$CORE_SHA" "$CUSTOMER_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PREVIEW_BRANCH" "$URL" | tee evidence/result.txt > builder/.ci-results/v2-customer-pages-live-boundary.txt
          cp "$RUNNER_TEMP/ordering.json" evidence/ordering.json
          git -C builder config user.name morefunos-builder-bot
          git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git -C builder add .ci-results/v2-customer-pages-live-boundary.txt
          git -C builder commit -m "ci(result): Customer Pages live boundary PASS $CUSTOMER_SHA"
          git -C builder push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: v2-customer-pages-live-boundary-${{ env.CUSTOMER_SHA }}
          path: evidence
          retention-days: 30
