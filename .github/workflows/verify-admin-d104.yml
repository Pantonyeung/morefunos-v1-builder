name: Admin D-104 Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-admin-d104.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        default: ce67adb26860d6ad26d0c869a87cecf5d9391c92
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUESTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || 'ce67adb26860d6ad26d0c869a87cecf5d9391c92' }}
    steps:
      - name: Validate exact source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Install pinned Admin dependencies and generate lockfile
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/admin-install.log"

      - name: Run Admin D-104 tests
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/admin-test.log"

      - name: Build Admin Web
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/admin-build.log"

      - name: Record verification identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source_sha=%s\n' "$SOURCE_SHA" > evidence/admin-d104-summary.txt
          printf 'install=PASS\ntest=PASS\nbuild=PASS\n' >> evidence/admin-d104-summary.txt
          cp source/apps/admin-web/package-lock.json evidence/package-lock.json
          cp "$RUNNER_TEMP/admin-install.log" evidence/install.log
          cp "$RUNNER_TEMP/admin-test.log" evidence/test.log
          cp "$RUNNER_TEMP/admin-build.log" evidence/build.log

      - name: Upload Admin D-104 verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: admin-d104-evidence-${{ steps.request.outputs.source_sha }}
          path: |
            evidence
            source/apps/admin-web/dist
          if-no-files-found: error
          retention-days: 30
