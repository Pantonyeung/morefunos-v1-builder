name: V2 Team1 MF01 Bootstrap Manifest Preflight

on:
  push:
    paths:
      - 'requests/v2-team1-mf01-bootstrap-manifest-preflight.txt'

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact V2 source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/v2-team1-mf01-bootstrap-manifest-preflight.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate manifest against V2 contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateCategory, validateProduct } from './packages/catalog/catalog-validation.ts';
          import { openBusinessDay } from './packages/business-day-cash/business-day.ts';
          const m=JSON.parse(fs.readFileSync('./docs/recovery/team1/MF01-TEMPORARY-BOOTSTRAP-MANIFEST-2026-09-03.json','utf8'));
          const now='2026-09-03T14:00:00.000Z';
          const category={categoryId:m.catalog.category.categoryId,name:m.catalog.category.name,lifecycleStatus:'ACTIVE',position:0,revision:1,createdAt:now,updatedAt:now};
          const product={productId:m.catalog.product.productId,name:m.catalog.product.name,lifecycleStatus:'ACTIVE',revision:1,createdAt:now,updatedAt:now,categoryMemberships:[{categoryId:category.categoryId,position:0}],optionGroups:[]};
          const c=validateCategory(category); const p=validateProduct(product);
          if(!c.ok) throw new Error('CATEGORY:'+c.issues.join(','));
          if(!p.ok) throw new Error('PRODUCT:'+p.issues.join(','));
          if(m.pricing.fixedPriceMinor!==2500||m.pricing.currency!=='HKD') throw new Error('PRICING_MANIFEST_MISMATCH');
          if(m.availability.status!=='AVAILABLE') throw new Error('AVAILABILITY_MANIFEST_MISMATCH');
          const day=openBusinessDay({businessDayId:m.businessDayPolicy.businessDayId,storeId:m.store.storeId,businessDate:'2026-09-03',timezone:m.businessDayPolicy.timezone,boundaryLocalTime:m.businessDayPolicy.boundaryLocalTime,policyRevision:m.businessDayPolicy.policyRevision,openedAt:now,openedByActorId:m.adminOperator.staffId});
          if(!day.ok) throw new Error('BUSINESS_DAY:'+day.issues.join(','));
          console.log('mf01_manifest_contract_validation=PASS');
          console.log('source_code='+m.catalog.product.sourceCode);
          console.log('product_id='+m.catalog.product.productId);
          console.log('price_minor='+m.pricing.fixedPriceMinor);
          console.log('staff_id='+m.adminOperator.staffId);
          NODE
          npm run typecheck
      - name: Configure canonical Admin principal
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_LOGIN_SECRET"
          STAFF_ID="$(node -e "const m=require('./docs/recovery/team1/MF01-TEMPORARY-BOOTSTRAP-MANIFEST-2026-09-03.json');process.stdout.write(m.adminOperator.staffId)")"
          STORE_ID="$(node -e "const m=require('./docs/recovery/team1/MF01-TEMPORARY-BOOTSTRAP-MANIFEST-2026-09-03.json');process.stdout.write(m.store.storeId)")"
          PRINCIPAL="$(node -e "process.stdout.write(JSON.stringify({actorId:'admin:owner',staffId:process.argv[1],scopeRef:process.argv[2],permissions:['admin.direct_authority.bootstrap.v1','admin.merchant_store.initialize.v1']}))" "$STAFF_ID" "$STORE_ID")"
          printf '%s' "$PRINCIPAL" | npx --yes wrangler@4 secret put ADMIN_AUTH_PRINCIPAL_JSON --config infra/cloudflare/admin-web-worker/wrangler.jsonc >/dev/null
          echo "admin_principal_uuid=PASS"
          echo "staff_id=$STAFF_ID"
          echo "scope_ref=$STORE_ID"
      - name: Verify new formal session principal
        shell: bash
        run: |
          set -euo pipefail
          URL='https://morefun-v2-admin.pantonyeung.workers.dev'
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          HTTP="$(curl -sS -D /tmp/h -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$URL/api/admin/session")"
          test "$HTTP" = 200
          node - <<'NODE'
          const x=require('/tmp/login.json');
          if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(x.staffId||'')) throw new Error('STAFF_NOT_UUID');
          if(x.scopeRef!=='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8') throw new Error('SCOPE_NOT_CANONICAL_STORE');
          console.log('live_admin_staff_uuid=PASS');
          console.log('live_admin_scope_canonical_mf01=PASS');
          NODE
