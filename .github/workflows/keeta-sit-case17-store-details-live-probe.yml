name: Keeta SIT Case17 Store Details Live Probe
on:
  push:
    branches: [main]
    paths: ['requests/keeta-sit-case17-store-details-live-probe.txt']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Deploy ephemeral protected probe, read Store Details, cleanup
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/keeta-case17-store-probe"
          mkdir -p "$WORK/src"
          KEY="$(openssl rand -hex 32)"
          cat > "$WORK/package.json" <<'EOF'
          {"private":true,"type":"module","devDependencies":{"wrangler":"4.37.1"}}
          EOF
          cat > "$WORK/wrangler.jsonc" <<EOF
          {
            "name": "morefun-keeta-case17-store-probe",
            "main": "src/index.ts",
            "compatibility_date": "2026-09-05",
            "vars": {"PROBE_KEY": "$KEY"},
            "services": [
              {
                "binding": "KEETA",
                "service": "morefun-v2-keeta-sit",
                "entrypoint": "KeetaMerchantDecisionService"
              }
            ]
          }
          EOF
          cat > "$WORK/src/index.ts" <<'EOF'
          interface Env {
            PROBE_KEY: string;
            KEETA: { readStoreDetails():Promise<unknown> };
          }
          export default {
            async fetch(request:Request,env:Env):Promise<Response>{
              if(request.headers.get("x-probe-key")!==env.PROBE_KEY)return new Response("forbidden",{status:403});
              const result=await env.KEETA.readStoreDetails();
              return Response.json(result);
            }
          };
          EOF
          cd "$WORK"
          npm install --ignore-scripts --no-audit --no-fund
          cleanup(){ npx wrangler delete --name morefun-keeta-case17-store-probe --force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          DEPLOY="$(npx wrangler deploy)"
          echo "$DEPLOY"
          URL="$(printf '%s\n' "$DEPLOY" | grep -Eo 'https://[^ ]+workers.dev' | tail -1)"
          test -n "$URL"
          BODY="$(curl --fail-with-body --silent --show-error -H "x-probe-key: $KEY" "$URL")"
          echo "$BODY" | jq -e '.providerCode==0' >/dev/null
          echo "$BODY" | jq -e '.shopId|type=="number"' >/dev/null
          echo "$BODY" | jq -e '.name|type=="string"' >/dev/null
          echo "$BODY" | jq -e '.address|type=="string"' >/dev/null
          echo "$BODY" | jq -e '.longitude|type=="number"' >/dev/null
          echo "$BODY" | jq -e '.latitude|type=="number"' >/dev/null
          echo "CASE17_STORE_DETAILS=$(echo "$BODY" | jq -c '{providerCode,shopId,name,address,longitude,latitude,status,availableForOrder}')"
