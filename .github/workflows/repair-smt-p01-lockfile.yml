name: Repair SMT P01 Lockfile

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      new_sha:
        description: 'Source SHA after canonical SMT lockfile writeback'
        value: ${{ jobs.repair.outputs.new_sha }}
      lock_sha256:
        description: 'Canonical SMT package-lock SHA-256'
        value: ${{ jobs.repair.outputs.lock_sha256 }}
      failure_stage:
        description: 'Sanitized failure stage for caller diagnostics'
        value: ${{ jobs.repair.outputs.failure_stage }}
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
      V1_B2_LOCKFILE_WRITE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  repair:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      new_sha: ${{ steps.writeback.outputs.new_sha }}
      lock_sha256: ${{ steps.lock.outputs.lock_sha256 }}
      failure_stage: ${{ steps.stage.outputs.failure_stage }}
    env:
      INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate immutable repair request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22.12
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'

      - name: Checkout exact private source SHA
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ steps.request.outputs.source_sha }}"
          test -z "$(git -C source status --porcelain)"

      - name: Canonicalize SMT lockfile and prove npm ci
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test -f apps/smt-web/package.json
          rm -rf apps/smt-web/node_modules
          rm -f apps/smt-web/package-lock.json
          npm --prefix apps/smt-web install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          test -f apps/smt-web/package-lock.json
          node -e "JSON.parse(require('node:fs').readFileSync('apps/smt-web/package-lock.json','utf8'))"
          npm --prefix apps/smt-web ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          rm -rf apps/smt-web/node_modules
          test "$(git diff --name-only)" = "apps/smt-web/package-lock.json"
          test -z "$(git ls-files --others --exclude-standard)"
          LOCK_SHA256="$(sha256sum apps/smt-web/package-lock.json | awk '{print $1}')"
          echo "lock_sha256=$LOCK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Commit only lockfile and push immutable repair branch
        id: writeback
        shell: bash
        env:
          V1_WRITE_TOKEN: ${{ secrets.V1_B2_LOCKFILE_WRITE_TOKEN }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$V1_WRITE_TOKEN"
          cd source
          SHORT_SHA="${SOURCE_SHA:0:12}"
          REPAIR_BRANCH="builder/p01-lockfile-${SHORT_SHA}"
          git config user.name 'MoreFunOS V1 Builder'
          git config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git add -- apps/smt-web/package-lock.json
          test "$(git diff --cached --name-only)" = "apps/smt-web/package-lock.json"
          git commit -m 'build(smt): canonicalize P01 web lockfile'
          NEW_SHA="$(git rev-parse HEAD)"
          ASKPASS="$RUNNER_TEMP/v1-smt-lock-write-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) echo "x-access-token" ;;
            *Password*) printf '%s\n' "$V1_WRITE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          git push https://github.com/Pantonyeung/morefunos-v1.git "HEAD:refs/heads/${REPAIR_BRANCH}"
          rm -f "$ASKPASS"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "repair_branch=$REPAIR_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Derive sanitized failure stage
        id: stage
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          LOCK_OUTCOME: ${{ steps.lock.outcome }}
          WRITEBACK_OUTCOME: ${{ steps.writeback.outcome }}
          NEW_SHA: ${{ steps.writeback.outputs.new_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${NEW_SHA:-}" ]]; then
            STAGE='none'
          elif [[ "${REQUEST_OUTCOME:-}" != 'success' ]]; then
            STAGE='request'
          elif [[ "${NODE_OUTCOME:-}" != 'success' ]]; then
            STAGE='setup_node'
          elif [[ "${CHECKOUT_OUTCOME:-}" != 'success' ]]; then
            STAGE='checkout'
          elif [[ "${IDENTITY_OUTCOME:-}" != 'success' ]]; then
            STAGE='identity'
          elif [[ "${LOCK_OUTCOME:-}" != 'success' ]]; then
            STAGE='lock_or_npm_ci'
          elif [[ "${WRITEBACK_OUTCOME:-}" != 'success' ]]; then
            STAGE='writeback'
          else
            STAGE='unknown'
          fi
          echo "failure_stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "repair-stage=$STAGE"
