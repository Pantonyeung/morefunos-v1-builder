name: Team A A3 Existing Submission Readback
on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-a3-existing-submission-readback.txt'
permissions:
  contents: read
jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Read exact submission
        shell: bash
        run: |
          set -euo pipefail
          SUB="$(sed -n 's/^submission_id=//p' requests/team-a-a3-existing-submission-readback.txt | tr -d '[:space:]')"
          test -n "$SUB"
          mkdir -p evidence
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          SQL="SELECT o.submission_id,o.order_id,s.store_id,s.revision,s.lifecycle_status,s.accepted_projection_json,d.display_code,d.source_order_key,d.business_date,d.allocated_at FROM mfos_customer_order_ownership o JOIN mfos_order_state s ON s.order_id=o.order_id LEFT JOIN mfos_order_display_code d ON d.order_id=o.order_id WHERE o.submission_id=?"
          SQL="$SQL" SUB="$SUB" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL,params:[process.env.SUB]}))"
          curl -fsS -X POST "$URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json > /tmp/r.json
          node - <<'NODE' | tee evidence/readback.txt
          const x=require('/tmp/r.json'),rows=x.result?.[0]?.results||[];
          if(!x.success) throw new Error('D1_READ_FAILED');
          console.log(JSON.stringify(rows,null,2));
          if(rows.length!==1) throw new Error('EXPECTED_EXACTLY_ONE_ROW:'+rows.length);
          const r=rows[0],p=JSON.parse(r.accepted_projection_json||'null');
          console.log(JSON.stringify({orderId:r.order_id,submissionId:r.submission_id,storeId:r.store_id,revision:r.revision,lifecycleStatus:r.lifecycle_status,displayCode:r.display_code,sourceOrderKey:r.source_order_key,businessDate:r.business_date,allocatedAt:r.allocated_at,canonicalIdentity:p?.canonicalIdentity??null},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-a-a3-existing-submission-readback
          path: evidence
          if-no-files-found: error
          retention-days: 7
