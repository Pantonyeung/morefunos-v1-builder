name: V2 Print Source Test

on:
  push:
    branches: [main]
    paths: ['requests/v2-print-source-test.txt']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-print-source-test.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          BRANCH_NAME="$(sed -n 's/^branch_name=//p' requests/v2-print-source-test.txt | tr -d '\r\n')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$BRANCH_NAME" ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source identity
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          echo "source-identity=PASS sha=$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript test toolchain
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22
      - name: Run PRINT tests
        working-directory: source
        run: node --test --experimental-strip-types packages/print/*.test.ts
      - name: Run accepted-order projection tests
        working-directory: source
        run: node --test --experimental-strip-types packages/order/d1-accepted-order-projection.test.ts packages/order/d1-store-order-acceptance.test.ts
      - name: Run full TypeScript typecheck
        working-directory: source
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
