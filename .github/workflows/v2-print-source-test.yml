name: V2 Print Source Test

on:
  push:
    branches: [main]
    paths: ['requests/v2-print-source-test.txt']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-print-source-test.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          BRANCH_NAME="$(sed -n 's/^branch_name=//p' requests/v2-print-source-test.txt | tr -d '\r\n')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$BRANCH_NAME" ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source identity
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          echo "source-identity=PASS sha=$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript test toolchain
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22
      - name: Run PRINT tests
        working-directory: source
        run: node --test --experimental-strip-types packages/print/*.test.ts
      - name: Run accepted-order projection tests
        working-directory: source
        run: node --test --experimental-strip-types packages/order/d1-accepted-order-projection.test.ts packages/order/d1-store-order-acceptance.test.ts packages/order/direct-order-variation.test.ts packages/order/d1-customer-order-variation.test.ts
      - name: Run full TypeScript typecheck
        working-directory: source
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Seal Builder result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BRANCH_NAME: ${{ steps.request.outputs.branch_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONCLUSION: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-results
          REQUEST_ID="$(sed -n 's/^request_id=//p' requests/v2-print-source-test.txt | tr -d '\r\n')"
          {
            echo "source_sha=${SOURCE_SHA:-UNKNOWN}"
            echo "branch_name=${BRANCH_NAME:-UNKNOWN}"
            echo "request_id=${REQUEST_ID:-UNKNOWN}"
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "conclusion=$CONCLUSION"
          } > .ci-results/v2-print-source-test.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-results/v2-print-source-test.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(result): V2 Print source ${CONCLUSION} ${SOURCE_SHA:-UNKNOWN}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "RESULT_SEAL_PUSH_FAILED" >&2
          exit 1
