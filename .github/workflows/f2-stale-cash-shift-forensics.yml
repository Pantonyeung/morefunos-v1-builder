name: F2 Stale Cash Shift Forensics

on:
  push:
    branches: [main]
    paths:
      - 'requests/f2-stale-cash-shift-forensics-request.txt'

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/f2-stale-cash-shift-forensics-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Read stale shift canonical facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          query(){ NAME="$1"; SQL="$2"; SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL}))"; curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json > "evidence/$NAME.json"; }
          query shift "SELECT cash_shift_id,business_day_id,store_id,lifecycle_status,revision,record_json,created_at,updated_at FROM mfos_cash_shift WHERE lifecycle_status='OPEN' ORDER BY updated_at DESC LIMIT 2"
          SHIFT_ID="$(node -e "const x=require('./evidence/shift.json');const r=x.result?.[0]?.results?.[0];if(!r)process.exit(2);process.stdout.write(r.cash_shift_id)")"
          STORE_ID="$(node -e "const x=require('./evidence/shift.json');const r=x.result?.[0]?.results?.[0];if(!r)process.exit(2);process.stdout.write(r.store_id)")"
          query movements "SELECT cash_movement_id,occurred_at,record_json FROM mfos_cash_movement WHERE cash_shift_id='$SHIFT_ID' ORDER BY occurred_at"
          query payments "SELECT payment_id,lifecycle_status,payment_json,updated_at FROM mfos_payment_state WHERE store_id='$STORE_ID' ORDER BY updated_at"
          query refunds "SELECT refund_id,status,refund_json,created_at FROM mfos_refund_state WHERE store_id='$STORE_ID' ORDER BY created_at"
          query close_policy "SELECT * FROM mfos_business_day_close_variance_policy WHERE store_id='$STORE_ID' LIMIT 5"
          query shift_open_event "SELECT event_id,metadata_json,payload_json,status,recorded_at FROM mfos_outbox WHERE aggregate_id='$SHIFT_ID' AND event_type='CASH_SHIFT_OPENED' ORDER BY recorded_at LIMIT 5"
          query actor_staff "SELECT staff_id,record_json FROM mfos_rbac_staff WHERE staff_id=(SELECT json_extract(record_json,'$.openedByActorId') FROM mfos_cash_shift WHERE cash_shift_id='$SHIFT_ID') LIMIT 1"
          SHIFT_ID="$SHIFT_ID" node - <<'NODE' | tee evidence/summary.txt
          const fs=require('fs');
          const rows=n=>JSON.parse(fs.readFileSync('evidence/'+n+'.json','utf8')).result?.[0]?.results||[];
          const shifts=rows('shift');
          if(shifts.length!==1) throw new Error('OPEN_CASH_SHIFT_COUNT_INVALID:'+shifts.length);
          const row=shifts[0];
          const shift=JSON.parse(row.record_json);
          const movements=rows('movements').map(r=>{let x={};try{x=JSON.parse(r.record_json)}catch{};return x});
          const payments=rows('payments').map(r=>{let x={};try{x=JSON.parse(r.payment_json)}catch{};return x});
          const refunds=rows('refunds').map(r=>{let x={};try{x=JSON.parse(r.refund_json)}catch{};return x});
          const inWindow=t=>Date.parse(t)>=Date.parse(shift.openedAt||row.created_at);
          const cashPayments=payments.filter(p=>p.lifecycleStatus==='COMPLETED'&&p.tenderMethod==='CASH'&&inWindow(p.completedAt||p.updatedAt||p.createdAt||''));
          const cashRefunds=refunds.filter(r=>r.status==='COMPLETED'&&inWindow(r.completedAt||r.createdAt||''));
          const operating=movements.filter(m=>m.movementPhase==='OPERATING');
          console.log('cash_shift_id='+row.cash_shift_id);
          console.log('business_day_id='+row.business_day_id);
          console.log('created_at='+row.created_at);
          console.log('revision='+row.revision);
          console.log('shift='+JSON.stringify(shift));
          console.log('opening_cash_minor='+String(shift.openingCashMinor??''));
          console.log('opened_by_actor_id='+String(shift.openedByActorId??''));
          console.log('operating_movement_count='+operating.length);
          console.log('operating_movements='+JSON.stringify(operating));
          console.log('completed_cash_payment_count='+cashPayments.length);
          console.log('cash_payments='+JSON.stringify(cashPayments));
          console.log('completed_refund_count='+cashRefunds.length);
          console.log('close_policy_rows='+JSON.stringify(rows('close_policy')));
          console.log('shift_open_events='+JSON.stringify(rows('shift_open_event')));
          console.log('actor_staff_rows='+JSON.stringify(rows('actor_staff')));
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-stale-cash-shift-forensics-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
