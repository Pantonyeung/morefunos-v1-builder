name: T1 Keeta Limited Auto Accept Arm

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-limited-auto-arm.txt'

permissions:
  contents: read
  statuses: write

concurrency:
  group: t1-keeta-limited-auto-arm
  cancel-in-progress: false

jobs:
  arm:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish arm pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context='builder/t1-keeta-limited-auto-arm' \
            -f description='Keeta limited AUTO arm running' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-limited-auto-arm.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.125.0 --no-audit --no-fund

      - name: Verify runtime secrets and OAuth token
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler secret list --config wrangler.jsonc --format json > "$RUNNER_TEMP/secrets.json"
          node - "$RUNNER_TEMP/secrets.json" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const names=new Set(rows.map(r=>r.name));
          for(const name of ['KEETA_APP_SECRET','KEETA_TOKEN_ENCRYPTION_KEY']) if(!names.has(name)) throw new Error(name+'_MISSING');
          NODE
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
            --command "SELECT connection_id,expires_at FROM keeta_oauth_token WHERE connection_id='default' LIMIT 1;" \
            > "$RUNNER_TEMP/token.json"
          node - "$RUNNER_TEMP/token.json" <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(payload)?payload.flatMap(x=>x?.results??[]):[];
          const row=rows[0];
          if(!row||row.connection_id!=='default') throw new Error('KEETA_OAUTH_DEFAULT_TOKEN_MISSING');
          if(Number(row.expires_at)<=Date.now()) throw new Error('KEETA_OAUTH_DEFAULT_TOKEN_EXPIRED');
          NODE

      - name: Build limited AUTO config
        working-directory: source/workers/keeta
        shell: bash
        run: |
          set -euo pipefail
          AFTER="$(date +%s%3N)"
          UNTIL="$((AFTER + 900000))"
          export AFTER UNTIL
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.vars={
            ...(config.vars||{}),
            KEETA_ACCEPTANCE_MODE:'AUTO',
            KEETA_AUTO_ACCEPT_AFTER_MS:process.env.AFTER,
            KEETA_AUTO_ACCEPT_UNTIL_MS:process.env.UNTIL
          };
          fs.writeFileSync('limited-auto-wrangler.jsonc',JSON.stringify(config,null,2));
          NODE
          echo "auto_after_ms=$AFTER"
          echo "auto_until_ms=$UNTIL"

      - name: Deploy limited AUTO worker
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config limited-auto-wrangler.jsonc

      - name: Smoke health
        run: |
          curl --fail-with-body --silent --show-error \
            https://morefun-v2-keeta-sit.pantonyeung.workers.dev/health

      - name: Publish arm success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context='builder/t1-keeta-limited-auto-arm' \
            -f description='Keeta limited AUTO armed for 15 minutes' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Publish arm failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context='builder/t1-keeta-limited-auto-arm' \
            -f description='Keeta limited AUTO arm failed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
