name: Deploy MFK SMM Web

on:
  push:
    branches: [main]
    paths:
      - 'requests/mfk-smm-web-deploy.txt'

permissions:
  contents: read

concurrency:
  group: deploy-mfk-smm-web
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/mfk-smm-web-deploy.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/mfk
          ref: ${{ steps.req.outputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify and build exact SMM
        working-directory: source/v2smm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "${{ steps.req.outputs.source_sha }}"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          test -s dist/index.html

      - name: Deploy SMM Worker
        working-directory: source/v2smm
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > wrangler.deploy.jsonc <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "mfk-smm-web",
            "main": "./worker.ts",
            "compatibility_date": "2026-09-25",
            "workers_dev": true,
            "preview_urls": true,
            "assets": {
              "directory": "./dist",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application"
            }
          }
          EOF
          npm exec --yes --package=wrangler@4.125.0 -- wrangler deploy --config wrangler.deploy.jsonc 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          grep -Eo 'https://[^ ]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | tail -n1 > "$RUNNER_TEMP/smm-url.txt"
          test -s "$RUNNER_TEMP/smm-url.txt"

      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat "$RUNNER_TEMP/smm-url.txt")"
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o "$RUNNER_TEMP/index.html" -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL/" || true)"
            if [ "$CODE" = 200 ]; then break; fi
            sleep 2
          done
          test "$CODE" = 200
          grep -F '<div id="root"></div>' "$RUNNER_TEMP/index.html"

          HEALTH_CODE="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL/api/health")"
          test "$HEALTH_CODE" = 200
          node -e "const x=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/health.json','utf8')); if(x.service!=='mfk-smm-web') process.exit(1)"

          SNAPSHOT_CODE="$(curl -sS -o "$RUNNER_TEMP/snapshot.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL/api/smm/snapshot?storeId=MF01")"
          test "$SNAPSHOT_CODE" = 200
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/snapshot.json','utf8'));
          if(x.connectionPath!=='INTERNET') throw new Error('SMM_INTERNET_PATH_MISSING');
          if(!x.menu||!Array.isArray(x.menu.categories)||!Array.isArray(x.menu.products)) throw new Error('SMM_MENU_INVALID');
          for(const key of ['orders','work','channels','dineSessions','printHealth','refundRequests']){
            if(!Array.isArray(x[key])) throw new Error('SMM_ARRAY_INVALID_'+key);
          }
          NODE
          echo "MFK_SMM_WEB_DEPLOY_GREEN $URL"
          echo "MFK_SMM_INTERNET_PROJECTION_GREEN $URL/api/smm/snapshot?storeId=MF01"
