name: Team A A1+A2 Canonical Identity + Pickup

on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-a1-canonical-order-identity.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact V2 source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team-a-a1-canonical-order-identity.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          BASELINE_SHA="$(sed -n 's/^baseline_sha=//p' requests/team-a-a1-canonical-order-identity.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "baseline_sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact latest-main baseline
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.baseline_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: baseline
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund && npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22

      - name: Install baseline TypeScript toolchain
        working-directory: baseline
        run: npm install --ignore-scripts --no-audit --no-fund && npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22

      - name: A1+A2 canonical identity and pickup tests
        working-directory: source
        run: |
          node --test packages/order/canonical-order-identity.test.ts
          node --test packages/order/order-display-code.test.ts
          node --test packages/order/d1-order-display-code.test.ts
          node --test packages/order/order-validation.test.ts
          node --test packages/order/d1-acceptance-replay.test.ts
          node --test packages/order/d1-customer-order-variation.test.ts
          node --test packages/integration/keeta-canonical-order-projection.test.ts
          node --test packages/integration/keeta-standard-canonical-acceptance-bridge.test.ts

      - name: A1+A2 changed-file typecheck
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2022 --allowImportingTsExtensions \
            packages/order/canonical-order-identity.ts \
            packages/order/order-display-code.ts \
            packages/order/d1-order-display-code.ts \
            packages/order/order-validation.ts \
            packages/order/d1-acceptance.ts \
            packages/order/d1-store-order-acceptance.ts \
            packages/order/d1-customer-order-service.ts \
            packages/integration/keeta-canonical-order-projection.ts 2>&1 | tee /tmp/team-a-targeted.log
          set -e
          if grep -E '^(packages/order/(canonical-order-identity|order-display-code|d1-order-display-code|order-validation|d1-acceptance|d1-store-order-acceptance|d1-customer-order-service)\.ts|packages/integration/keeta-canonical-order-projection\.ts)\(' /tmp/team-a-targeted.log; then
            echo 'Team A changed-file TypeScript diagnostic detected' >&2
            exit 1
          fi

      - name: Full repo typecheck regression control
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd source && ./node_modules/.bin/tsc --noEmit -p tsconfig.json) 2>&1 | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort -u > /tmp/candidate-ts.txt
          CANDIDATE_RC=${PIPESTATUS[0]}
          (cd baseline && ./node_modules/.bin/tsc --noEmit -p tsconfig.json) 2>&1 | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort -u > /tmp/baseline-ts.txt
          BASELINE_RC=${PIPESTATUS[0]}
          set -e
          comm -23 /tmp/candidate-ts.txt /tmp/baseline-ts.txt > /tmp/new-ts.txt
          if [ -s /tmp/new-ts.txt ]; then
            echo 'New TypeScript diagnostics introduced by Team A candidate:' >&2
            cat /tmp/new-ts.txt >&2
            exit 1
          fi
          echo "candidate_typecheck_rc=$CANDIDATE_RC"
          echo "baseline_typecheck_rc=$BASELINE_RC"
          echo 'No new full-repo TypeScript diagnostics versus exact latest-main baseline.'

      - name: Write evidence
        if: always()
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nworkflow=team-a-a1-canonical-order-identity.yml\n' "$SOURCE_SHA" > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-a-a1-canonical-order-identity-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
