name: Deploy Admin Policy Preview

on:
  push:
    paths:
      - '.github/workflows/deploy-admin-policy-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  SOURCE_SHA: b8745b2346dc233f22bc1e7dd374c6dd6932e879
  WORKER_NAME: morefunos-v1-admin-policy-preview

jobs:
  deploy-admin-policy-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Builder-only deployment credentials
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_TOKEN: ${{ secrets.V1_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API" || { echo 'MISSING:CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'MISSING:CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo 'MISSING:V1_SOURCE_READ_TOKEN'; exit 1; }
          echo 'BUILDER_DEPLOY_CREDENTIALS=PASS'
          echo 'RUNTIME_SECRETS=Cloudflare Worker only'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          grep -q "'business-policy'" source/infra/cloudflare/admin-policy-worker/worker.ts
          grep -q "'store-settings'" source/infra/cloudflare/admin-policy-worker/worker.ts
          grep -q "'availability'" source/infra/cloudflare/admin-policy-worker/worker.ts
          echo 'EXPECTED_CAPABILITY_SOURCE=PASS'

      - name: Verify Google service-account key normalization
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test packages/durability/google-service-account-token-provider.test.ts
          node --experimental-strip-types --test infra/cloudflare/admin-policy-worker/worker.test.ts
          node --experimental-strip-types --test infra/cloudflare/admin-policy-worker/entry.test.ts
          echo 'ADMIN_WORKER_EXACT_SOURCE_TESTS=PASS'

      - name: Deploy preview Worker code only
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: source/infra/cloudflare/admin-policy-worker
          command: deploy --config wrangler.jsonc

      - name: Verify remote Runtime Secret bindings
        id: runtime
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME/secrets"
          curl -fsS -H "Authorization: Bearer $CF_API" -H 'Content-Type: application/json' "$api" > /tmp/worker-secrets.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          const names = (Array.isArray(payload.result) ? payload.result : []).map(x => x?.name).filter(Boolean).sort();
          const required = ['GOOGLE_CLIENT_EMAIL','GOOGLE_PRIVATE_KEY','ADMIN_OWNER_TOKEN'];
          const missing = required.filter(x => !names.includes(x));
          fs.writeFileSync('/tmp/admin-preview-config.txt', missing.length ? `CLOUDFLARE_RUNTIME_MISSING:${missing.join(',')}\n` : 'CLOUDFLARE_RUNTIME_SECRETS=PASS\n');
          console.log(JSON.stringify({worker: process.env.WORKER_NAME, requiredSecretNamesPresent: missing.length === 0, missingRequiredSecrets: missing}, null, 2));
          if (missing.length) process.exit(2);
          NODE

      - name: Verify preview health, capabilities and credential material
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL"
          success=0
          for attempt in $(seq 1 18); do
            echo "health_attempt=$attempt"
            if curl -fsS -H 'cache-control: no-cache' "$DEPLOYMENT_URL/health?source=$SOURCE_SHA&attempt=$attempt" -o admin-preview-health.json; then
              cat admin-preview-health.json
              if node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('admin-preview-health.json', 'utf8'));
          const required = ['policy','catalog','business-policy','store-settings','availability'];
          const capabilities = Array.isArray(health.capabilities) ? health.capabilities : [];
          const missing = required.filter(x => !capabilities.includes(x));
          console.log(JSON.stringify({healthOk: health.ok === true, capabilities, missing}, null, 2));
          process.exit(health.ok === true && missing.length === 0 ? 0 : 2);
          NODE
              then
                success=1
                break
              fi
            fi
            sleep 5
          done
          test "$success" -eq 1
          set +e
          curl -sS -H 'cache-control: no-cache' "$DEPLOYMENT_URL/health/credentials?source=$SOURCE_SHA" -o admin-preview-credential-health.json
          credential_rc=$?
          set -e
          cat admin-preview-credential-health.json
          test "$credential_rc" -eq 0
          grep -q '"ok":true' admin-preview-credential-health.json
          grep -q '"code":"PASS"' admin-preview-credential-health.json
          echo 'ADMIN_POLICY_PREVIEW_HEALTH=PASS'
          echo 'ADMIN_POLICY_PREVIEW_CAPABILITIES=PASS'
          echo 'ADMIN_POLICY_CREDENTIAL_MATERIAL=PASS'

      - name: Persist Preview config diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/admin-preview-config.txt || printf 'DEPLOY_OR_REMOTE_SECRET_CHECK_FAILED\n' > /tmp/admin-preview-config.txt
          if [ -f admin-preview-health.json ]; then
            printf '\nHEALTH=' >> /tmp/admin-preview-config.txt
            tr -d '\n' < admin-preview-health.json >> /tmp/admin-preview-config.txt
            printf '\n' >> /tmp/admin-preview-config.txt
          fi
          if [ -f admin-preview-credential-health.json ]; then
            printf '\nCREDENTIAL_HEALTH=' >> /tmp/admin-preview-config.txt
            tr -d '\n' < admin-preview-credential-health.json >> /tmp/admin-preview-config.txt
            printf '\n' >> /tmp/admin-preview-config.txt
          fi
          path='diagnostics/admin-policy-preview-config-latest.txt'
          content="$(base64 -w0 /tmp/admin-preview-config.txt)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='ci: refresh Admin Preview runtime binding diagnostic' -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Record preview URL
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOYMENT_URL" > admin-policy-preview-url.txt
          path='diagnostics/admin-policy-preview-url-latest.txt'
          content="$(base64 -w0 admin-policy-preview-url.txt)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='ci: refresh Admin Policy Preview URL' -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-policy-preview-${{ env.SOURCE_SHA }}
          path: |
            admin-policy-preview-url.txt
            admin-preview-health.json
            admin-preview-credential-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=admin-policy-preview-deploy \
            -f description='Worker live with Policy/Catalog/BusinessPolicy/StoreSettings/Availability; secrets + health PASS' >/dev/null

      - name: Report deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=admin-policy-preview-deploy \
            -f description='Worker test/deploy, runtime secrets, capabilities, credential material, or health failed' >/dev/null

# manual reverify after GOOGLE_PRIVATE_KEY refresh: 2026-08-22
