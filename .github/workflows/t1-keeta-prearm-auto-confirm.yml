name: T1 Keeta Pre-Armed Auto Confirm

on:
  push:
    branches:
      - main
    paths:
      - requests/t1-keeta-prearm-auto-confirm.txt

permissions:
  contents: read

concurrency:
  group: t1-keeta-prearm-auto-confirm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_VERSION: "4.125.0"
      WORKER_URL: "https://morefun-v2-keeta-sit.pantonyeung.workers.dev"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact admitted source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-prearm-auto-confirm.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-wrangler-${{ env.WRANGLER_VERSION }}

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION" --no-audit --no-fund
          wrangler --version

      - name: Checkout admitted source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Assemble limited auto-accept deployment
        shell: bash
        run: |
          set -euo pipefail
          ARM_AFTER_MS="$(date +%s%3N)"
          ARM_UNTIL_MS="$((ARM_AFTER_MS + 900000))"
          export ARM_AFTER_MS ARM_UNTIL_MS
          echo "ARM_AFTER_MS=$ARM_AFTER_MS" >> "$GITHUB_ENV"
          echo "ARM_UNTIL_MS=$ARM_UNTIL_MS" >> "$GITHUB_ENV"

          node - <<'NODE'
          const fs=require('fs');
          if(!process.env.ARM_AFTER_MS || !process.env.ARM_UNTIL_MS) throw new Error('ARM_ENV_MISSING');
          const src=JSON.parse(fs.readFileSync('source/workers/keeta/wrangler.jsonc','utf8'));
          src.vars={
            ...(src.vars||{}),
            KEETA_APP_ID:'3419700273',
            KEETA_ACCEPTANCE_MODE:'AUTO',
            KEETA_STORM_MODE_ACTIVE:'false',
            KEETA_AUTO_ACCEPT_AFTER_MS:process.env.ARM_AFTER_MS,
            KEETA_AUTO_ACCEPT_UNTIL_MS:process.env.ARM_UNTIL_MS
          };
          fs.writeFileSync('source/workers/keeta/prearm-wrangler.jsonc',JSON.stringify(src,null,2));
          const verify=JSON.parse(fs.readFileSync('source/workers/keeta/prearm-wrangler.jsonc','utf8'));
          if(verify.vars.KEETA_ACCEPTANCE_MODE!=='AUTO') throw new Error('AUTO_MODE_WRITE_MISMATCH');
          if(verify.vars.KEETA_AUTO_ACCEPT_AFTER_MS!==process.env.ARM_AFTER_MS) throw new Error('ARM_AFTER_WRITE_MISMATCH');
          if(verify.vars.KEETA_AUTO_ACCEPT_UNTIL_MS!==process.env.ARM_UNTIL_MS) throw new Error('ARM_UNTIL_WRITE_MISMATCH');
          console.log('arm_config_write=PASS');
          NODE

      - name: Deploy pre-armed worker
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config prearm-wrangler.jsonc

      - name: Verify health and arm state
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$WORKER_URL/health")"
          echo "health_http=$HTTP"
          cat "$RUNNER_TEMP/health.json"
          test "$HTTP" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('source/workers/keeta/prearm-wrangler.jsonc','utf8'));
          if(cfg.vars?.KEETA_ACCEPTANCE_MODE!=='AUTO') process.exit(1);
          if(!cfg.vars?.KEETA_AUTO_ACCEPT_AFTER_MS || !cfg.vars?.KEETA_AUTO_ACCEPT_UNTIL_MS) process.exit(1);
          console.log('AUTO_CONFIRM_ARMED=true');
          console.log('auto_confirm_after_ms='+cfg.vars.KEETA_AUTO_ACCEPT_AFTER_MS);
          console.log('auto_confirm_until_ms='+cfg.vars.KEETA_AUTO_ACCEPT_UNTIL_MS);
          NODE
          echo "target_shop=721578302"
          echo "target_next_orders=ONE_FRESH_ORDER_ONLY"
