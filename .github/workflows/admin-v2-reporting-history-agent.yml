name: Admin V2 Historical Reporting Verification

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/admin-v2-reporting-history.sha'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: builder
          persist-credentials: true
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < builder/.ci-requests/admin-v2-reporting-history.sha | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.19.0"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Run Historical Reporting transport test
        id: reporting_test
        continue-on-error: true
        working-directory: source
        run: node --experimental-strip-types --test packages/integration-v2/admin-reporting-history-transport.test.ts
      - name: Run Historical Report Export transport test
        id: reporting_export_test
        continue-on-error: true
        working-directory: source
        run: node --experimental-strip-types --test packages/integration-v2/admin-reporting-export-transport.test.ts
      - name: Install Admin Web
        id: install_admin
        continue-on-error: true
        working-directory: source/apps/admin-web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Historical Reporting Web Port test
        id: reporting_web_test
        if: ${{ always() && steps.install_admin.outcome == 'success' }}
        continue-on-error: true
        working-directory: source/apps/admin-web
        run: npm test -- reporting-history-port.vitest.test.ts
      - name: Run Historical Reporting UI-A test
        id: reporting_ui_test
        if: ${{ always() && steps.install_admin.outcome == 'success' }}
        continue-on-error: true
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -o pipefail
          npm test -- reporting-history.vitest.test.tsx 2>&1 | tee "$GITHUB_WORKSPACE/reporting-ui.log"
      - name: Run Historical Reporting routing test
        id: reporting_routing_test
        if: ${{ always() && steps.install_admin.outcome == 'success' }}
        continue-on-error: true
        working-directory: source/apps/admin-web
        run: npm test -- reporting-history-routing.vitest.test.tsx
      - name: Typecheck
        id: typecheck
        if: ${{ always() }}
        continue-on-error: true
        working-directory: source
        run: npm run typecheck:v2-core
      - name: Persist result
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REPORTING_TEST: ${{ steps.reporting_test.outcome }}
          REPORTING_EXPORT_TEST: ${{ steps.reporting_export_test.outcome }}
          INSTALL_ADMIN: ${{ steps.install_admin.outcome }}
          REPORTING_WEB_TEST: ${{ steps.reporting_web_test.outcome }}
          REPORTING_UI_TEST: ${{ steps.reporting_ui_test.outcome }}
          REPORTING_ROUTING_TEST: ${{ steps.reporting_routing_test.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          set -euo pipefail
          if [[ "$REPORTING_TEST" == success && "$REPORTING_EXPORT_TEST" == success && "$INSTALL_ADMIN" == success && "$REPORTING_WEB_TEST" == success && "$REPORTING_UI_TEST" == success && "$REPORTING_ROUTING_TEST" == success && "$TYPECHECK" == success ]]; then CONCLUSION=success; else CONCLUSION=failure; fi
          mkdir -p builder/.ci-results
          printf 'source_sha=%s\nbuilder_sha=%s\nrun_id=%s\nreporting_test=%s\nreporting_export_test=%s\ninstall_admin=%s\nreporting_web_test=%s\nreporting_ui_test=%s\nreporting_routing_test=%s\ntypecheck=%s\nconclusion=%s\n' "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$REPORTING_TEST" "$REPORTING_EXPORT_TEST" "$INSTALL_ADMIN" "$REPORTING_WEB_TEST" "$REPORTING_UI_TEST" "$REPORTING_ROUTING_TEST" "$TYPECHECK" "$CONCLUSION" > builder/.ci-results/admin-v2-reporting-history.txt
          if [[ -f "$GITHUB_WORKSPACE/reporting-ui.log" ]]; then tail -n 120 "$GITHUB_WORKSPACE/reporting-ui.log" > builder/.ci-results/admin-v2-reporting-history-ui.log; fi
          git -C builder config user.name 'morefunos-builder-bot'
          git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git -C builder add .ci-results/admin-v2-reporting-history.txt .ci-results/admin-v2-reporting-history-ui.log 2>/dev/null || git -C builder add .ci-results/admin-v2-reporting-history.txt
          if git -C builder diff --cached --quiet; then exit 0; fi
          git -C builder commit -m "ci(result): Admin V2 historical reporting $SOURCE_SHA"
          git -C builder push origin HEAD:main
      - name: Enforce
        if: always()
        shell: bash
        env:
          REPORTING_TEST: ${{ steps.reporting_test.outcome }}
          REPORTING_EXPORT_TEST: ${{ steps.reporting_export_test.outcome }}
          INSTALL_ADMIN: ${{ steps.install_admin.outcome }}
          REPORTING_WEB_TEST: ${{ steps.reporting_web_test.outcome }}
          REPORTING_UI_TEST: ${{ steps.reporting_ui_test.outcome }}
          REPORTING_ROUTING_TEST: ${{ steps.reporting_routing_test.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          [[ "$REPORTING_TEST" == success ]]
          [[ "$REPORTING_EXPORT_TEST" == success ]]
          [[ "$INSTALL_ADMIN" == success ]]
          [[ "$REPORTING_WEB_TEST" == success ]]
          [[ "$REPORTING_UI_TEST" == success ]]
          [[ "$REPORTING_ROUTING_TEST" == success ]]
          [[ "$TYPECHECK" == success ]]
