name: Team1 Customer Browser Submit Lifecycle B2506

on:
  push:
    paths:
      - 'requests/team1-customer-browser-submit-lifecycle-b2506.txt'

permissions:
  contents: read
  issues: write

jobs:
  browser-e2e:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team1-customer-browser-submit-lifecycle-b2506.txt | tr -d '[:space:]')"
          ORIGIN="$(sed -n 's/^origin=//p' requests/team1-customer-browser-submit-lifecycle-b2506.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORIGIN" =~ ^https:// ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with: {node-version: '24'}

      - name: Install browser harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Browser Menu to Order to Refresh Same ID
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          ORIGIN: ${{ steps.req.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          cat > customer-browser-b2506.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const [chrome, origin, sourceSha] = process.argv.slice(2);
          const browser = await chromium.launch({ headless: true, executablePath: chrome });
          const ctx = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const page = await ctx.newPage();
          const pageErrors = [];
          let orderPosts = 0;
          let submittedOrderId = '';
          let submittedSubmissionId = '';

          page.on('pageerror', (error) => pageErrors.push(String(error)));
          page.on('request', (request) => {
            const url = new URL(request.url());
            if (url.pathname === '/api/customer/orders' && request.method() === 'POST') orderPosts += 1;
          });
          page.on('response', async (response) => {
            const url = new URL(response.url());
            if (url.pathname !== '/api/customer/orders' || response.request().method() !== 'POST') return;
            try {
              const body = await response.json();
              submittedOrderId = String(body.orderId || '');
              submittedSubmissionId = String(body.submissionId || '');
            } catch {}
          });

          await page.goto(origin + '/menu', { waitUntil: 'networkidle' });
          await page.locator('html[data-cu-runtime="connected"]').waitFor({ timeout: 15000 });
          const product = page.locator('.mf-menu-card').filter({ has: page.locator('button:not([disabled])') }).first();
          await product.waitFor({ timeout: 15000 });
          await product.click();
          await page.locator('[data-add-product]:not([disabled])').click();
          await page.locator('[data-route="/memory-jar"]').last().click();
          const submit = page.locator('[data-cu-submit]:not([disabled])');
          await submit.waitFor({ timeout: 10000 });
          await submit.click();

          await page.waitForURL(/\/orders$/, { timeout: 20000 });
          await page.locator('.mf-order-card').waitFor({ timeout: 20000 });
          if (orderPosts !== 1) throw new Error('B2506_ORDER_POST_COUNT_' + orderPosts);
          if (!submittedOrderId) throw new Error('B2506_SUBMITTED_ORDER_ID_REQUIRED');

          const beforeRefresh = (await page.locator('.mf-order-card').first().innerText()).replace(/\s+/g, ' ');
          if (!beforeRefresh.includes(submittedOrderId)) throw new Error('B2506_ORDER_ID_NOT_RENDERED_BEFORE_REFRESH');

          await page.reload({ waitUntil: 'networkidle' });
          await page.locator('html[data-cu-runtime="connected"]').waitFor({ timeout: 15000 });
          await page.locator('.mf-order-card').waitFor({ timeout: 20000 });
          const afterRefresh = (await page.locator('.mf-order-card').first().innerText()).replace(/\s+/g, ' ');
          if (!afterRefresh.includes(submittedOrderId)) throw new Error('B2506_ORDER_ID_NOT_RENDERED_AFTER_REFRESH');
          if (orderPosts !== 1) throw new Error('B2506_DUPLICATE_POST_AFTER_REFRESH_' + orderPosts);
          if (pageErrors.length) throw new Error('B2506_PAGE_ERROR:' + pageErrors.join('|'));

          const result = {
            source_sha: sourceSha,
            origin,
            order_id: submittedOrderId,
            submission_id: submittedSubmissionId,
            order_post_count: orderPosts,
            same_order_before_refresh: true,
            same_order_after_refresh: true,
            duplicate_observed: false,
            page_errors: pageErrors,
          };
          fs.writeFileSync('evidence/customer-browser-b2506.json', JSON.stringify(result, null, 2) + '\n');
          await page.screenshot({ path: 'evidence/customer-orders-after-refresh.png', fullPage: true });
          console.log(JSON.stringify(result));
          await ctx.close();
          await browser.close();
          NODE
          node customer-browser-b2506.mjs "$CHROME" "$ORIGIN" "$SOURCE_SHA"

      - name: Publish audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ -f evidence/customer-browser-b2506.json ]]; then
            ORDER_ID="$(node -e "const x=require('./evidence/customer-browser-b2506.json');process.stdout.write(x.order_id)")"
            gh issue comment 98 --repo Pantonyeung/morefunos-v1-builder --body "T1_CUSTOMER_BROWSER_B2506 status=$JOB_STATUS run_id=$RUN_ID source_sha=$SOURCE_SHA order_id=$ORDER_ID post_count=1 refresh_same_id=true duplicate_observed=false"
          else
            gh issue comment 98 --repo Pantonyeung/morefunos-v1-builder --body "T1_CUSTOMER_BROWSER_B2506 status=$JOB_STATUS run_id=$RUN_ID source_sha=$SOURCE_SHA no_browser_evidence=true"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team1-customer-browser-b2506-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
