name: Verify V2 SMT Cloudflare Publish Credentials

on:
  push:
    paths:
      - 'requests/v2-smt-cloudflare-publish-credential-check.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUCKET_NAME: morefunos-v2-smt-ota
      WORKER_NAME: morefunos-v2-smt-ota
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require Builder Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify token is active
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify' \
            > "$RUNNER_TEMP/token-verify.json"
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/token-verify.json', 'utf8'));
          if (!x.success || x.result?.status !== 'active') throw new Error('CLOUDFLARE_API_TOKEN_NOT_ACTIVE');
          console.log('CLOUDFLARE_API_TOKEN_ACTIVE=PASS');
          NODE

      - name: Verify account R2 REST boundary and exact bucket
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error \
            -o "$RUNNER_TEMP/r2-buckets.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
          if [[ "$HTTP_CODE" != '200' ]]; then
            node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/r2-buckets.json', 'utf8'));
          const codes = (x.errors ?? []).map(e => e.code).join(',');
          if (codes.includes('10000')) {
            console.error('CLOUDFLARE_R2_REST_AUTH_10000: token class/account mismatch; bucket-scoped R2 Object tokens are not valid for Cloudflare REST API publication');
          } else {
            console.error(`CLOUDFLARE_R2_REST_FAILED: http=${process.env.HTTP_CODE ?? 'non-200'} codes=${codes || 'unknown'}`);
          }
          process.exit(1);
          NODE
          fi
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/r2-buckets.json', 'utf8'));
          if (!x.success) throw new Error('CLOUDFLARE_R2_REST_NOT_SUCCESS');
          const buckets = Array.isArray(x.result?.buckets) ? x.result.buckets : Array.isArray(x.result) ? x.result : [];
          if (!buckets.some(b => b?.name === process.env.BUCKET_NAME)) throw new Error('MOREFUN_R2_BUCKET_NOT_IN_ACCOUNT');
          console.log('CLOUDFLARE_R2_ACCOUNT_BUCKET=PASS');
          NODE

      - name: Verify Worker account subdomain read
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            > "$RUNNER_TEMP/workers-subdomain.json"
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/workers-subdomain.json', 'utf8'));
          if (!x.success || !x.result?.subdomain) throw new Error('CLOUDFLARE_WORKERS_SUBDOMAIN_READ_FAILED');
          console.log('CLOUDFLARE_WORKER_ACCOUNT_BOUNDARY=PASS');
          NODE

      - name: Record credential boundary evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf 'scope=v2-smt-cloudflare-publish-credentials\nmutation=NONE\nrun_id=%s\nbucket=%s\nworker=%s\n' \
            "$GITHUB_RUN_ID" "$BUCKET_NAME" "$WORKER_NAME" > evidence/summary.txt

      - name: Upload credential boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-smt-cloudflare-publish-credentials-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
