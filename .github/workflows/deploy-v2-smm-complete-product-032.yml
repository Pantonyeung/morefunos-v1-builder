name: Deploy V2 SMM Complete Product 032

on:
  push:
    paths:
      - 'requests/v2-smm-complete-product-032-deploy.txt'

permissions:
  contents: read
  statuses: write

jobs:
  deploy-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context='builder/v2-smm-complete-product-032-deploy' \
            -f description='SMM 032 deploy/browser running' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smm-complete-product-032-deploy.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require trusted credentials
        env:
          V2_SOURCE_READ_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_LOGIN_SECRET"
          test -n "$V2_SOURCE_READ_TOKEN"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact source and build SMM
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.req.outputs.source_sha }}"
          npm install --no-save --ignore-scripts --no-audit --no-fund
          node --test packages/smm-ui-integration/*.test.ts
          # Port-scoped deploy gate: SMM Preview must not be blocked by unrelated
          # Admin/Customer/Owner/SMT root type errors. SMM app typecheck follows
          # its imported shared dependencies and is paired with SMM integration tests.
          npm --prefix apps/smm-web install --ignore-scripts --no-audit --no-fund
          npm --prefix apps/smm-web run typecheck
          npm --prefix apps/smm-web run build
          test -s apps/smm-web/dist/index.html
          test -s apps/smm-web/dist/manifest.webmanifest
          ! grep -R -E 'mfos_order_state|D1Database|\.prepare\(' apps/smm-web/src infra/cloudflare/smm-web-worker

      - name: Deploy exact SMM public Worker
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          npm exec --yes --package=wrangler@4.125.0 -- wrangler deploy --config infra/cloudflare/smm-web-worker/wrangler.jsonc 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | sed 's/[),.;]*$//' || true)"
          test -n "$URL"
          printf '%s\n' "$URL" > "$GITHUB_WORKSPACE/evidence/url.txt"

      - name: Public PWA and fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat evidence/url.txt)"
          fetch200() { local u="$1" o="$2" c=""; for i in {1..30}; do c="$(curl -sS -o "$o" -w '%{http_code}' "$u" || true)"; [ "$c" = 200 ] && break; sleep 2; done; printf '%s' "$c"; }
          INDEX_HTTP="$(fetch200 "$URL/" /tmp/index.html)"
          SPA_HTTP="$(fetch200 "$URL/orders" /tmp/spa.html)"
          MANIFEST_HTTP="$(fetch200 "$URL/manifest.webmanifest" /tmp/manifest.json)"
          test "$INDEX_HTTP" = 200
          test "$SPA_HTTP" = 200
          test "$MANIFEST_HTTP" = 200
          node -e "const x=require('/tmp/manifest.json');if(x.name!=='MoreFun SMM'||x.start_url!=='/'||x.display!=='standalone'||!Array.isArray(x.icons)||!x.icons.length)process.exit(1)"
          JS_PATH="$(grep -Eo 'src="[^"]*assets/[^"]+\.js"' /tmp/index.html | head -n1 | sed -E 's/^src="([^"]+)"$/\1/')"
          test -n "$JS_PATH"
          case "$JS_PATH" in http*) JS_URL="$JS_PATH";; /*) JS_URL="$URL$JS_PATH";; *) JS_URL="$URL/$JS_PATH";; esac
          ASSET_HTTP="$(fetch200 "$JS_URL" /tmp/smm.js)"
          test "$ASSET_HTTP" = 200
          SESSION_HTTP="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$URL/api/smm/session")"
          test "$SESSION_HTTP" = 401
          node -e "const x=require('/tmp/session.json');if(x.code!=='SMM_RUNTIME_SESSION_REQUIRED')process.exit(1)"
          BAD='__smm_032_invalid__'
          BAD="$BAD" node -e "require('fs').writeFileSync('/tmp/pair.json',JSON.stringify({loginSecret:process.env.BAD}))"
          PAIR_HTTP="$(curl -sS -H 'content-type: application/json' --data-binary @/tmp/pair.json -o /tmp/pair-response.json -w '%{http_code}' "$URL/api/smm/session")"
          test "$PAIR_HTTP" = 401
          node -e "const x=require('/tmp/pair-response.json');if(x.code!=='SMM_PAIRING_CREDENTIAL_INVALID')process.exit(1)"
          FIXTURE_MARKERS=0
          for marker in 'TST-SMM-' 'SMM-DEMO-ORDER' 'SMM-FIXTURE-ORDER' '__MOREFUNOS_SMM_RUNTIME__'; do
            grep -Fq "$marker" /tmp/smm.js && FIXTURE_MARKERS=$((FIXTURE_MARKERS+1)) || true
          done
          test "$FIXTURE_MARKERS" = 0
          printf 'index_http=%s\nspa_http=%s\nmanifest_http=%s\nasset_http=%s\nanonymous_session_http=%s\ninvalid_pair_http=%s\nfixture_markers=%s\n' "$INDEX_HTTP" "$SPA_HTTP" "$MANIFEST_HTTP" "$ASSET_HTTP" "$SESSION_HTTP" "$PAIR_HTTP" "$FIXTURE_MARKERS" > evidence/public-smoke.txt

      - name: Real Chromium SMM functional E2E
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          URL="$(cat evidence/url.txt)"
          export URL ADMIN_LOGIN_SECRET
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const expected=[
            'catalog.menu.active.read.v1',
            'pricing.quote.v1',
            'availability.read.current.internal.v2',
            'availability.set.v2',
            'order.open-list.read.v1',
            'order.history-list.read.v1',
            'order.detail.read.v1',
            'order.cancel.v1',
            'order.complete.v1',
            'order.direct.staff.submit.v1',
            'payment.accept.v1',
            'payment.reconcile.v1',
            'refund.request.v1',
            'refund.reconcile.v1',
            'print.job.request.v1',
            'print.job.observe.v1',
            'business-day.read.current.v1',
            'reporting.snapshot.read.v1',
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932}});
            const pageErrors=[];
            const requestFailures=[];
            const apiNetwork=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()?.errorText||''}));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/api/'))apiNetwork.push({origin:u.origin,path:u.pathname,method:r.method()})});
            page.on('response',async r=>{
              const u=new URL(r.url());
              if(!u.pathname.startsWith('/api/smm/'))return;
              let body={};
              try{body=await r.json()}catch{}
              let requestOperation='none';
              try{requestOperation=r.request().postDataJSON()?.operationId||'none'}catch{}
              console.log('SMM_API_HTTP method='+r.request().method()+' path='+u.pathname+' status='+r.status()+' code='+(body.code||'none')+' operation='+requestOperation);
            });
            await page.goto(process.env.URL+'/',{waitUntil:'networkidle'});
            await page.locator('input[type="password"]').fill(process.env.ADMIN_LOGIN_SECRET);
            const pairResponsePromise=page.waitForResponse(r=>new URL(r.url()).pathname==='/api/smm/session'&&r.request().method()==='POST',{timeout:15000});
            const ownerResponsePromise=page.waitForResponse(r=>new URL(r.url()).pathname==='/api/smm/owner-test-session'&&r.request().method()==='POST',{timeout:15000});
            await page.getByRole('button',{name:'我係 Owner，直接進入測試模式',exact:true}).click();
            const [pairResponse,ownerResponse]=await Promise.all([pairResponsePromise,ownerResponsePromise]);
            let pairBody={};let ownerBody={};
            try{pairBody=await pairResponse.json()}catch{}
            try{ownerBody=await ownerResponse.json()}catch{}
            const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
            console.log('SMM_PAIR_HTTP status='+pairResponse.status()+' code='+(pairBody.code||'none')+' device='+pairBody.deviceId);
            console.log('SMM_OWNER_TEST_HTTP status='+ownerResponse.status()+' code='+(ownerBody.code||'none')+' mounted='+((ownerBody.mountedOperationIds||[]).length)+' staff_uuid='+uuid.test(ownerBody.staffId||'')+' operator_same='+(ownerBody.operatorId===ownerBody.staffId));
            if(pairResponse.status()!==200)throw new Error('SMM_PAIR_HTTP_'+pairResponse.status()+':'+(pairBody.code||'UNKNOWN'));
            if(ownerResponse.status()!==200)throw new Error('SMM_OWNER_TEST_HTTP_'+ownerResponse.status()+':'+(ownerBody.code||'UNKNOWN'));
            if(!pairBody.sessionToken||!ownerBody.sessionToken)throw new Error('SMM_AUTH_TOKEN_MISSING');
            const diagnostic=await page.evaluate(async({deviceToken,operatorToken})=>{
              const deviceRuntime=await fetch('/api/smm/runtime',{method:'POST',headers:{authorization:'Bearer '+deviceToken,'content-type':'application/json',accept:'application/json'},body:JSON.stringify({operationId:'order.open-list.read.v1',request:{limit:1}}),cache:'no-store'});
              let deviceRuntimeBody={};try{deviceRuntimeBody=await deviceRuntime.json()}catch{}
              const sessionResponse=await fetch('/api/smm/owner-test-session',{headers:{authorization:'Bearer '+operatorToken,accept:'application/json'},cache:'no-store'});
              let sessionBody={};try{sessionBody=await sessionResponse.json()}catch{}
              const orderResponse=await fetch('/api/smm/runtime',{method:'POST',headers:{authorization:'Bearer '+operatorToken,'content-type':'application/json',accept:'application/json'},body:JSON.stringify({operationId:'order.open-list.read.v1',request:{limit:50}}),cache:'no-store'});
              let orderBody={};try{orderBody=await orderResponse.json()}catch{}
              return {
                deviceRuntimeStatus:deviceRuntime.status,
                deviceRuntimeCode:deviceRuntimeBody.code||'none',
                sessionStatus:sessionResponse.status,
                sessionCode:sessionBody.code||'none',
                orderStatus:orderResponse.status,
                orderCode:orderBody.code||'none',
                orderCount:Array.isArray(orderBody.orders)?orderBody.orders.length:null,
              };
            },{deviceToken:pairBody.sessionToken,operatorToken:ownerBody.sessionToken});
            console.log('SMM_AUTH_DIAGNOSTIC '+JSON.stringify(diagnostic));
            if(diagnostic.deviceRuntimeStatus!==401||diagnostic.deviceRuntimeCode!=='SMM_STAFF_SESSION_REQUIRED')throw new Error('SMM_DEVICE_TOKEN_NOT_FAIL_CLOSED:'+JSON.stringify(diagnostic));
            if(diagnostic.sessionStatus!==200)throw new Error('SMM_OWNER_SESSION_DIAG_'+diagnostic.sessionStatus+':'+diagnostic.sessionCode);
            if(diagnostic.orderStatus!==200)throw new Error('SMM_OWNER_ORDER_DIAG_'+diagnostic.orderStatus+':'+diagnostic.orderCode);
            await page.getByText('已連接',{exact:true}).waitFor({state:'visible',timeout:15000});
            const result=await page.evaluate(async(expected)=>{
              const raw=localStorage.getItem('morefunos.smm.staff-session.v1');
              if(!raw)throw new Error('SMM_SESSION_STORAGE_MISSING');
              const saved=JSON.parse(raw);
              if(!saved.sessionToken)throw new Error('SMM_SESSION_TOKEN_MISSING');
              const headers={authorization:'Bearer '+saved.sessionToken,'content-type':'application/json',accept:'application/json'};
              const s=await fetch('/api/smm/owner-test-session',{headers:{authorization:'Bearer '+saved.sessionToken,accept:'application/json'},cache:'no-store'});
              const session=await s.json();
              if(s.status!==200)throw new Error('SMM_SESSION_REFRESH_FAILED');
              const ids=new Set(session.mountedOperationIds||[]);
              for(const id of expected)if(!ids.has(id))throw new Error('SMM_MANIFEST_MISSING:'+id);
              for(const id of ['availability.read.current.v1','availability.set.v1','print.job.reprint.v1','print.job.execute.v1'])if(ids.has(id))throw new Error('SMM_MANIFEST_FORBIDDEN:'+id);

              const invoke=async(operationId,request)=>{
                const r=await fetch('/api/smm/runtime',{method:'POST',headers,body:JSON.stringify({operationId,request}),cache:'no-store'});
                const body=await r.json();
                if(r.status!==200)throw new Error(operationId+':HTTP_'+r.status+':'+(body.code||'UNKNOWN'));
                return body;
              };

              const menu=await invoke('catalog.menu.active.read.v1',{});
              if(!Array.isArray(menu.products)||menu.products.length<1)throw new Error('SMM_MENU_EMPTY');
              const product=menu.products[0];
              const optionIds=[];
              for(const group of product.optionGroups||[]){
                const need=Math.max(0,group.required?group.minSelections||1:0);
                for(let i=0;i<need;i++){
                  const option=group.options?.[i];
                  if(!option)throw new Error('SMM_REQUIRED_OPTION_UNAVAILABLE');
                  optionIds.push(option.optionId);
                }
              }
              const line={lineId:'smm-live-quote-1',productId:product.productId,quantity:1,...(optionIds.length?{optionIds}:{})};
              const pricing=await invoke('pricing.quote.v1',{lines:[line]});
              if(!Array.isArray(pricing.lines)||pricing.lines.length!==1||!Number.isSafeInteger(pricing.totalMinor))throw new Error('SMM_PRICING_INVALID');
              const availability=await invoke('availability.read.current.internal.v2',{storeId:session.storeId,targetType:'PRODUCT',targetId:product.productId});
              if(availability.ok!==true)throw new Error('SMM_AVAILABILITY_READ_FAILED');
              const open=await invoke('order.open-list.read.v1',{limit:50});
              if(!Array.isArray(open.orders))throw new Error('SMM_ORDERS_INVALID');
              return {
                storeId:session.storeId,
                mountedOperationIds:[...ids],
                menu:{catalogRevision:menu.catalogRevision,productCount:menu.products.length,firstProductId:product.productId},
                pricing:{currency:pricing.currency,totalMinor:pricing.totalMinor},
                availability:{ok:availability.ok,hasValue:availability.value!==null},
                orders:{count:open.orders.length,actionableCount:open.orders.filter(o=>o.lifecycleStatus==='ACCEPTED').length,acceptedOrderId:open.orders.find(o=>o.lifecycleStatus==='ACCEPTED')?.orderId||null,firstOrderId:open.orders[0]?.orderId||null},
              };
            },expected);

            const mainNav=page.getByRole('navigation',{name:'主要功能'});
            await mainNav.getByRole('button',{name:'訂單',exact:true}).click();
            await page.waitForTimeout(500);
            const refreshOrders=page.getByRole('button',{name:'更新訂單',exact:true});
            if(await refreshOrders.count()){
              await refreshOrders.click();
              await page.waitForTimeout(900);
            }
            const completeCount=await page.getByRole('button',{name:'完成訂單',exact:true}).count();
            const cancelCount=await page.getByRole('button',{name:'取消訂單',exact:true}).count();
            if(completeCount!==cancelCount)throw new Error('SMM_ORDER_ACTION_PAIR_MISMATCH');
            if(await page.getByRole('button',{name:'重印小票'}).count())throw new Error('SMM_UNSUPPORTED_REPRINT_BUTTON_PRESENT');

            await mainNav.getByRole('button',{name:'更多',exact:true}).click();
            await page.getByText('營運控制',{exact:true}).waitFor({state:'visible',timeout:5000});
            await page.getByText('列印管理',{exact:true}).waitFor({state:'visible',timeout:5000});
            await page.getByText('營業日',{exact:true}).waitFor({state:'visible',timeout:5000});
            await page.getByText('營運報表',{exact:true}).waitFor({state:'visible',timeout:5000});

            const assertDialogInViewport=async(name)=>{
              const dialog=page.getByRole('dialog',{name,exact:true});
              await dialog.waitFor({state:'visible',timeout:5000});
              const box=await dialog.boundingBox();
              const viewport=page.viewportSize();
              if(!box||!viewport||box.y>=viewport.height||box.y+box.height<=0)throw new Error('SMM_TOOL_DIALOG_OUTSIDE_VIEWPORT:'+name);
              return dialog;
            };

            await page.getByRole('button',{name:'營業日：查看目前營業日期',exact:true}).click();
            const businessDialog=await assertDialogInViewport('營業日');
            await businessDialog.getByRole('heading',{name:'目前營業狀態',exact:true}).waitFor({state:'visible',timeout:5000});
            await businessDialog.getByRole('button',{name:'收起',exact:true}).click();

            await page.getByRole('button',{name:'營運報表：今日營業額／訂單／退款',exact:true}).click();
            const reportingDialog=await assertDialogInViewport('營運報表');
            await reportingDialog.getByRole('heading',{name:'今日營運',exact:true}).waitFor({state:'visible',timeout:5000});
            await reportingDialog.getByRole('button',{name:'收起',exact:true}).click();

            await page.getByRole('button',{name:'營運控制：售罄／暫停／恢復供應',exact:true}).click();
            const operationsDialog=await assertDialogInViewport('營運控制');
            await operationsDialog.getByRole('heading',{name:'售罄／暫停／恢復',exact:true}).waitFor({state:'visible',timeout:5000});
            await operationsDialog.getByPlaceholder('輸入商品名稱').waitFor({state:'visible',timeout:5000});
            await operationsDialog.getByRole('button',{name:'收起',exact:true}).click();

            await mainNav.getByRole('button',{name:'待處理',exact:true}).click();
            await page.getByText('平台訂單',{exact:true}).waitFor({state:'visible',timeout:5000});

            const orderingMenuResponsePromise=page.waitForResponse(r=>{
              if(new URL(r.url()).pathname!=='/api/smm/runtime'||r.request().method()!=='POST')return false;
              try{return r.request().postDataJSON()?.operationId==='catalog.menu.active.read.v1'}catch{return false}
            },{timeout:15000});
            await mainNav.getByRole('button',{name:'點單',exact:true}).click();
            const orderingMenuResponse=await orderingMenuResponsePromise;
            if(orderingMenuResponse.status()!==200)throw new Error('SMM_ORDERING_MENU_HTTP_'+orderingMenuResponse.status());
            await page.locator('.smm-product-card__primary').first().waitFor({state:'visible',timeout:15000});
            const bodyText=await page.locator('body').innerText();
            if(bodyText.includes('店務資料尚未連接'))throw new Error('SMM_UI_PROVIDER_NOT_READY');
            if(bodyText.includes('暫未開放直接落單'))throw new Error('SMM_DIRECT_ORDER_STALE_DISABLED_COPY');

            let directAdd=null;
            const categoryButtons=page.locator('.smm-category-rail__item');
            const categoryCount=await categoryButtons.count();
            for(let i=0;i<categoryCount;i++){
              await categoryButtons.nth(i).click();
              await page.waitForTimeout(120);
              const candidate=page.getByRole('button',{name:/^加入 /}).first();
              if(await candidate.count()){
                directAdd=candidate;
                break;
              }
            }
            if(!directAdd){
              const productLabels=await page.locator('.smm-product-card__primary').evaluateAll(nodes=>nodes.map(node=>node.getAttribute('aria-label')||node.textContent||''));
              throw new Error('SMM_DIRECT_ADD_PRODUCT_NOT_FOUND:'+JSON.stringify(productLabels.slice(0,20)));
            }
            await directAdd.waitFor({state:'visible',timeout:8000});
            await directAdd.click();
            const cartButton=page.getByRole('button',{name:'查看購物車',exact:true});
            await cartButton.waitFor({state:'visible',timeout:8000});
            await cartButton.click();
            await page.getByRole('heading',{name:'購物車',exact:true}).waitFor({state:'visible',timeout:5000});
            const confirmOrder=page.getByRole('button',{name:/^確認落單 /});
            await confirmOrder.waitFor({state:'visible',timeout:5000});
            const submitResponsePromise=page.waitForResponse(r=>{
              if(new URL(r.url()).pathname!=='/api/smm/runtime'||r.request().method()!=='POST')return false;
              try{return r.request().postDataJSON()?.operationId==='order.direct.staff.submit.v1'}catch{return false}
            },{timeout:20000});
            await confirmOrder.click();
            const submitResponse=await submitResponsePromise;
            let submitBody={};try{submitBody=await submitResponse.json()}catch{}
            console.log('SMM_DIRECT_ORDER_HTTP status='+submitResponse.status()+' disposition='+(submitBody.disposition||'none')+' orderId='+(submitBody.orderId||'none'));
            if(submitResponse.status()!==200)throw new Error('SMM_DIRECT_ORDER_HTTP_'+submitResponse.status()+':'+(submitBody.code||'UNKNOWN'));
            if(submitBody.disposition!=='ACCEPT'||!submitBody.orderId||!Number.isSafeInteger(submitBody.canonicalRevision))throw new Error('SMM_DIRECT_ORDER_NOT_ACCEPTED:'+JSON.stringify(submitBody));
            const submittedOrderId=submitBody.orderId;
            const submittedReadback=await page.evaluate(async(orderId)=>{
              const raw=localStorage.getItem('morefunos.smm.staff-session.v1');
              if(!raw)throw new Error('SMM_SUBMIT_READBACK_SESSION_MISSING');
              const saved=JSON.parse(raw);
              const r=await fetch('/api/smm/runtime',{method:'POST',headers:{authorization:'Bearer '+saved.sessionToken,'content-type':'application/json',accept:'application/json'},body:JSON.stringify({operationId:'order.detail.read.v1',request:{orderId}}),cache:'no-store'});
              let body={};try{body=await r.json()}catch{}
              return {status:r.status,body};
            },submittedOrderId);
            console.log('SMM_DIRECT_ORDER_READBACK status='+submittedReadback.status+' orderId='+(submittedReadback.body?.orderId||'none'));
            if(submittedReadback.status!==200||submittedReadback.body?.orderId!==submittedOrderId)throw new Error('SMM_DIRECT_ORDER_READBACK_FAILED:'+JSON.stringify(submittedReadback));
            const frontendText=await page.locator('body').innerText();
            if(frontendText.includes(submittedOrderId))throw new Error('SMM_FRONTLINE_UUID_LEAK:'+submittedOrderId);

            const cleanup=await page.evaluate(async({orderId,revision})=>{
              const raw=localStorage.getItem('morefunos.smm.staff-session.v1');
              if(!raw)throw new Error('SMM_CLEANUP_SESSION_MISSING');
              const saved=JSON.parse(raw);
              const r=await fetch('/api/smm/runtime',{method:'POST',headers:{authorization:'Bearer '+saved.sessionToken,'content-type':'application/json',accept:'application/json'},body:JSON.stringify({operationId:'order.cancel.v1',request:{orderId,expectedRevision:revision,idempotencyKey:'smm-e2e-cleanup:'+orderId+':'+revision,reason:'SMM Preview E2E cleanup'}}),cache:'no-store'});
              let body={};try{body=await r.json()}catch{}
              return {status:r.status,body};
            },{orderId:submittedOrderId,revision:submitBody.canonicalRevision});
            if(cleanup.status!==200)throw new Error('SMM_DIRECT_ORDER_CLEANUP_'+cleanup.status+':'+JSON.stringify(cleanup.body));

            const postCleanupOpen=await page.evaluate(async(cancelledOrderId)=>{
              const raw=localStorage.getItem('morefunos.smm.staff-session.v1');
              if(!raw)throw new Error('SMM_POST_CLEANUP_SESSION_MISSING');
              const saved=JSON.parse(raw);
              const r=await fetch('/api/smm/runtime',{method:'POST',headers:{authorization:'Bearer '+saved.sessionToken,'content-type':'application/json',accept:'application/json'},body:JSON.stringify({operationId:'order.open-list.read.v1',request:{limit:50}}),cache:'no-store'});
              let body={};try{body=await r.json()}catch{}
              return {status:r.status,body,cancelledStillOpen:Array.isArray(body.orders)&&body.orders.some(order=>order?.orderId===cancelledOrderId)};
            },submittedOrderId);
            console.log('SMM_POST_CLEANUP_OPEN_LIST status='+postCleanupOpen.status+' cancelledStillOpen='+postCleanupOpen.cancelledStillOpen);
            if(postCleanupOpen.status!==200)throw new Error('SMM_POST_CLEANUP_OPEN_LIST_'+postCleanupOpen.status+':'+JSON.stringify(postCleanupOpen.body));
            if(postCleanupOpen.cancelledStillOpen)throw new Error('SMM_CANCELLED_ORDER_STILL_IN_OPEN_LIST:'+submittedOrderId);
            const publicOrigin=new URL(process.env.URL).origin;
            if(apiNetwork.some(x=>x.origin!==publicOrigin))throw new Error('SMM_BROWSER_CROSS_ORIGIN_API_FORBIDDEN');
            if(pageErrors.length)throw new Error('SMM_PAGE_ERRORS:'+pageErrors.join('|'));
            if(requestFailures.length)throw new Error('SMM_REQUEST_FAILURES:'+JSON.stringify(requestFailures));
            fs.writeFileSync('evidence/browser-e2e.json',JSON.stringify({
              publicOrigin,
              runtimeReady:true,
              apiNetwork,
              pageErrors,
              requestFailures,
              directBrowserD1:false,
              ...result,
            },null,2));
            console.log('SMM_032_BROWSER_READY products='+result.menu.productCount+' orders='+result.orders.count+' totalMinor='+result.pricing.totalMinor);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Write summary
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          CLASSIFICATION=FAILED
          test -s evidence/browser-e2e.json && CLASSIFICATION=READY
          printf 'source_sha=%s\nrun_id=%s\nclassification=%s\npublic_origin=%s\nmorefun_v2_native_ci=0\n' "${{ steps.req.outputs.source_sha }}" "$GITHUB_RUN_ID" "$CLASSIFICATION" "$(cat evidence/url.txt 2>/dev/null || true)" > evidence/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smm-complete-product-032-deploy-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context='builder/v2-smm-complete-product-032-deploy' \
            -f description='SMM 032 deploy/browser passed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context='builder/v2-smm-complete-product-032-deploy' \
            -f description='SMM 032 deploy/browser failed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
