name: V2 Customer Production Integration Verification

on:
  push:
    paths:
      - 'requests/v2-customer-production-integration-request.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          else
            test -f requests/v2-customer-production-integration-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-customer-production-integration-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Customer canonical integration tests
        working-directory: source
        run: node --test packages/customer-ui-integration/*.test.ts

      - name: Customer D1 persistence tests
        working-directory: source
        run: |
          node --test packages/customer-loyalty/customer-authentication-d1.test.ts
          node --test packages/order/d1-store-order-acceptance.test.ts

      - name: Admin explicit-principal regression
        working-directory: source
        run: node --test packages/admin-ui-integration/admin-worker-session-runtime.test.ts

      - name: Customer browser adapter tests
        working-directory: source
        run: node --test apps/customer-web/*.test.mjs

      - name: Customer public Worker TDD
        working-directory: source
        run: node --experimental-strip-types --test infra/cloudflare/customer-web-worker/*.test.ts

      - name: Customer web production build
        working-directory: source/apps/customer-web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/index.html
          find dist/assets -maxdepth 1 -type f | grep -E '/[^/]+-[A-Za-z0-9_-]+\.(js|css)$'

      - name: Customer Worker Wrangler dry-run
        working-directory: source
        run: npx --yes wrangler@4 deploy --dry-run --config infra/cloudflare/customer-web-worker/wrangler.jsonc

      - name: Customer integration TypeScript strict check
        working-directory: source
        run: npm exec --yes --package=typescript@5.9.3 -- tsc -p packages/customer-ui-integration/tsconfig.json

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nworkflow=verify-v2-customer-production-integration.yml\n' "$SOURCE_SHA" > evidence/summary.txt

      - name: Publish Team2 audit comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: gh issue comment 98 --repo Pantonyeung/morefunos-v1-builder --body "T2_CUSTOMER_PRODUCTION_INTEGRATION status=$JOB_STATUS run_id=$RUN_ID source_sha=$SOURCE_SHA"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-customer-production-integration-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Seal durable Builder result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONCLUSION: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="$(sed -n 's/^request_id=//p' requests/v2-customer-production-integration-request.txt | tr -d '\r\n')"
          if [[ -z "$REQUEST_ID" ]]; then
            REQUEST_ID="$(sed -n 's/^attempt=//p' requests/v2-customer-production-integration-request.txt | tr -d '\r\n')"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .ci-results
            {
              echo "source_sha=${SOURCE_SHA:-UNKNOWN}"
              echo "request_id=${REQUEST_ID:-UNKNOWN}"
              echo "run_id=$RUN_ID"
              echo "run_attempt=$RUN_ATTEMPT"
              echo "conclusion=$CONCLUSION"
            } > .ci-results/v2-customer-production-integration.txt
            git add .ci-results/v2-customer-production-integration.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ci(result): V2 Customer Production Integration ${CONCLUSION} ${SOURCE_SHA:-UNKNOWN}"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "RESULT_SEAL_PUSH_FAILED" >&2
          exit 1

