name: Verify Morefun V2 Keeta 1102 SIT

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/morefun-v2-keeta-1102.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morefun-v2-keeta-1102-sit
  cancel-in-progress: false

jobs:
  verify-1102-sit:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_VERSION: '4.125.0'
      SHOP_ID: '721517434'
      WORKER_ORIGIN: 'https://morefun-v2-keeta-sit.pantonyeung.workers.dev'
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(head -n 1 .ci-requests/morefun-v2-keeta-1102.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Require Builder credentials
        env:
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -q 'configure-webhook-1102' source/workers/keeta/src/index.ts
          grep -q 'store-open' source/workers/keeta/src/index.ts
          grep -q 'store-rest' source/workers/keeta/src/index.ts

      - name: Rotate protected SIT probe secret
        id: probe
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf '%s' "$PROBE_KEY" | npx --yes "wrangler@$WRANGLER_VERSION" secret put KEETA_SIT_PROBE_KEY --config wrangler.jsonc >/dev/null
          echo "probe_key=$PROBE_KEY" >> "$GITHUB_OUTPUT"

      - name: Configure test 1102 webhook through Keeta Standard API
        env:
          PROBE_KEY: ${{ steps.probe.outputs.probe_key }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_ORIGIN/sit/configure-webhook-1102" > "$RUNNER_TEMP/configure-1102.json"
          node - "$RUNNER_TEMP/configure-1102.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0) throw new Error(`KEETA_1102_CONFIGURATION_FAILED ${JSON.stringify(body)}`);
          if (body.data?.eventId !== 1102 || body.data?.isTest !== 1) throw new Error('KEETA_1102_CONFIGURATION_EVIDENCE_INVALID');
          console.log(`keeta_1102_configured_url=${body.data.url}`);
          NODE

      - name: Capture webhook baseline
        id: baseline
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc \
            --command "SELECT COUNT(*) AS dedup_count FROM keeta_webhook_dedup" --json > "$RUNNER_TEMP/baseline.json"
          COUNT="$(node - "$RUNNER_TEMP/baseline.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = payload.flatMap((entry) => entry.results ?? []);
          process.stdout.write(String(Number(rows[0]?.dedup_count ?? 0)));
          NODE
          )"
          echo "dedup_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "dedup_baseline=$COUNT"

      - name: Open API test store to trigger 1102
        env:
          PROBE_KEY: ${{ steps.probe.outputs.probe_key }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_ORIGIN/sit/store-open?shopId=$SHOP_ID" > "$RUNNER_TEMP/store-open.json"
          node - "$RUNNER_TEMP/store-open.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0) throw new Error(`KEETA_STORE_OPEN_FAILED ${JSON.stringify(body)}`);
          NODE

      - name: Wait for live 1102 open webhook evidence
        id: open-webhook
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc \
              --command "SELECT status, delivery_rest_status, pickup_rest_status, source, provider_timestamp, updated_at FROM keeta_store_status WHERE shop_id = $SHOP_ID LIMIT 1" \
              --json > "$RUNNER_TEMP/open-webhook.json"
            RESULT="$(node - "$RUNNER_TEMP/open-webhook.json" <<'NODE'
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const row = payload.flatMap((entry) => entry.results ?? [])[0];
            if (row?.source === 'WEBHOOK_1102' && Number(row.status) === 3 && Number(row.provider_timestamp) > 0) {
              process.stdout.write(`PASS:${row.provider_timestamp}:${row.delivery_rest_status}:${row.pickup_rest_status}`);
            } else process.stdout.write('WAIT');
            NODE
            )"
            if [[ "$RESULT" == PASS:* ]]; then
              IFS=':' read -r _ TS DELIVERY PICKUP <<< "$RESULT"
              echo "provider_timestamp=$TS" >> "$GITHUB_OUTPUT"
              echo "live_1102_open_status=3 delivery=$DELIVERY pickup=$PICKUP provider_timestamp=$TS"
              exit 0
            fi
            sleep 5
          done
          echo 'KEETA_LIVE_1102_OPEN_NOT_OBSERVED' >&2
          exit 1

      - name: Return API test store to rest state
        env:
          PROBE_KEY: ${{ steps.probe.outputs.probe_key }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_ORIGIN/sit/store-rest?shopId=$SHOP_ID" > "$RUNNER_TEMP/store-rest.json"
          node - "$RUNNER_TEMP/store-rest.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0) throw new Error(`KEETA_STORE_REST_FAILED ${JSON.stringify(body)}`);
          NODE

      - name: Wait for live 1102 rest webhook evidence
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_PROVIDER_TS: ${{ steps.open-webhook.outputs.provider_timestamp }}
          DEDUP_BASELINE: ${{ steps.baseline.outputs.dedup_count }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc \
              --command "SELECT status, delivery_rest_status, pickup_rest_status, source, provider_timestamp, updated_at FROM keeta_store_status WHERE shop_id = $SHOP_ID LIMIT 1; SELECT COUNT(*) AS dedup_count FROM keeta_webhook_dedup" \
              --json > "$RUNNER_TEMP/rest-webhook.json"
            if node - "$RUNNER_TEMP/rest-webhook.json" "$OPEN_PROVIDER_TS" "$DEDUP_BASELINE" <<'NODE'
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const openTs = Number(process.argv[3]);
            const baseline = Number(process.argv[4]);
            const resultSets = payload.map((entry) => entry.results ?? []);
            const row = resultSets.find((rows) => rows.some((item) => Object.prototype.hasOwnProperty.call(item, 'source')))?.[0];
            const countRow = resultSets.find((rows) => rows.some((item) => Object.prototype.hasOwnProperty.call(item, 'dedup_count')))?.[0];
            const count = Number(countRow?.dedup_count ?? 0);
            if (row?.source !== 'WEBHOOK_1102' || Number(row.status) !== 4 || Number(row.provider_timestamp) <= openTs || count < baseline + 2) process.exit(1);
            console.log(`live_1102_rest_status=4 delivery=${row.delivery_rest_status} pickup=${row.pickup_rest_status} provider_timestamp=${row.provider_timestamp}`);
            console.log(`dedup_baseline=${baseline} dedup_final=${count}`);
            NODE
            then exit 0; fi
            sleep 5
          done
          echo 'KEETA_LIVE_1102_REST_NOT_OBSERVED' >&2
          exit 1

      - name: Record 1102 SIT evidence
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          printf 'builder_run_id=%s\nsource_sha=%s\nevent_id=1102\ntest_shop_id=%s\nresult=LIVE_SIT_PASS\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$SHOP_ID"
