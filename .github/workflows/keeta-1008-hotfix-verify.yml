name: Keeta 1008 Hotfix Verify

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/keeta-1008-hotfix.sha'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Resolve V2 SHA
        id: src
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/keeta-1008-hotfix.sha)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.src.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Install
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Targeted 1008 regression
        working-directory: source
        run: node --test packages/integration/keeta-webhook-ingress.test.ts
      - name: Targeted Keeta ingress and journal regression
        working-directory: source
        run: |
          node --test packages/integration/keeta-webhook-ingress.test.ts
          node --test packages/integration/keeta-webhook-event-journal.test.ts
      - name: Guard Worker journals 1008
        working-directory: source
        run: |
          grep -Fq "[1002, 1003, 1004, 1005, 1006, 1007, 1008].includes(result.evidence.eventId)" workers/keeta/src/index.ts
          grep -Fq "1008: 'OBSERVED_SYSTEM_ORDER_CANCELLATION'" packages/integration/keeta-webhook-event-registry.ts
      - name: Root typecheck
        working-directory: source
        run: npm run typecheck
