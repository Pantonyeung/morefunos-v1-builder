name: R4B Fulfillment Projection Shape Readback

on:
  push:
    branches: [main]
    paths:
      - 'requests/r4b-fulfillment-projection-shape-readback-request.txt'

permissions:
  contents: write

jobs:
  readback:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/r4b-fulfillment-projection-shape-readback-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Read projection revision shapes only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CONFIG='source/infra/cloudflare/admin-web-worker/wrangler.jsonc'
          SQL="SELECT s.order_id,s.revision AS row_revision,json_extract(COALESCE(s.order_snapshot_json,s.accepted_projection_json),'$.orderRevision') AS legacy_order_revision,json_extract(COALESCE(s.order_snapshot_json,s.accepted_projection_json),'$.revision') AS canonical_revision,json_type(COALESCE(s.order_snapshot_json,s.accepted_projection_json),'$.orderRevision') AS legacy_revision_type,json_type(COALESCE(s.order_snapshot_json,s.accepted_projection_json),'$.revision') AS canonical_revision_type,s.lifecycle_status,s.created_at,s.updated_at,s.provider_ref,COALESCE(s.order_snapshot_json,s.accepted_projection_json) AS projection_json FROM mfos_order_state s LEFT JOIN mfos_fulfillment_state f ON f.order_id=s.order_id WHERE s.lifecycle_status='ACCEPTED' AND s.created_at>='2026-09-10T23:18:26Z' AND f.order_id IS NULL ORDER BY s.created_at ASC,s.order_id ASC LIMIT 100;"
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --json --config "$CONFIG" --command "$SQL" > evidence/projection-shape.json
          cat evidence/projection-shape.json
      - name: Seal result
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .ci-results
          cp "$GITHUB_WORKSPACE/evidence/projection-shape.json" .ci-results/mf-rca-fulfillment-projection-shape-01.json
          git add .ci-results/mf-rca-fulfillment-projection-shape-01.json
          git commit -m "rca(result): fulfillment projection revision shape"
          git push origin HEAD:main
