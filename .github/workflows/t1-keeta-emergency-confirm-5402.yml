name: T1 Keeta Prepare 5402

on:
  push:
    branches:
      - main
    paths:
      - requests/t1-keeta-prepare-5402.txt

permissions:
  contents: read

concurrency:
  group: t1-keeta-prepare-5402
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WRANGLER_VERSION: "4.125.0"
      DONOR_SHA: "967a8e09dfbc53655380665824d5687c0ccd177b"
      SOURCE_SHA: "fe436016ce86672a9d08a634635380f845a2e985"
      WORKER_URL: "https://morefun-v2-keeta-sit.pantonyeung.workers.dev"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-wrangler-${{ env.WRANGLER_VERSION }}

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION" --no-audit --no-fund

      - name: Checkout exact V2
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout OAuth donor
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ env.DONOR_SHA }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: donor
          persist-credentials: false
          fetch-depth: 1

      - name: Assemble protected manual prepare worker
        shell: bash
        run: |
          set -euo pipefail
          cp donor/workers/keeta/src/oauth-runtime.ts source/workers/keeta/src/oauth-runtime.ts
          cp donor/packages/integration/keeta-standard-oauth.ts source/packages/integration/keeta-standard-oauth.ts
          cat > source/workers/keeta/src/manual-prepare-5402.ts <<'TS'
          import base from "./index.ts";
          import { buildKeetaOrderReadyRequest } from "../../../packages/integration/keeta-order-provider-requests.ts";
          import { sendKeetaJsonRequest, type RuntimeSecretProvider } from "../../../packages/integration/keeta-standard-api.ts";
          import { getUsableKeetaConnectionToken, type KeetaOAuthRuntimeEnv } from "./oauth-runtime.ts";

          interface Env extends KeetaOAuthRuntimeEnv {
            readonly KEETA_MANUAL_PREPARE_KEY?: string;
          }

          const APP_ID = 3419700273;
          const SHOP_ID = 721578302;
          const ORDER_ID = 5123441027165402;
          const json = (body: unknown, status=200) => new Response(JSON.stringify(body), {
            status,
            headers: {"content-type":"application/json; charset=utf-8","cache-control":"no-store"},
          });

          function secretProvider(env: Env): RuntimeSecretProvider {
            return { async getSecret(name: string) {
              if (name !== "KEETA_APP_SECRET") return null;
              return env.KEETA_APP_SECRET?.length ? env.KEETA_APP_SECRET : null;
            }};
          }

          export default {
            async fetch(request: Request, env: Env): Promise<Response> {
              const url = new URL(request.url);
              if (request.method === "POST" && url.pathname === "/sit/manual-prepare-5402") {
                const expected = env.KEETA_MANUAL_PREPARE_KEY;
                if (!expected || request.headers.get("authorization") !== `Bearer ${expected}`) {
                  return json({code:"UNAUTHORIZED"},401);
                }
                try {
                  const token = await getUsableKeetaConnectionToken("default", env);
                  const providerRequest = buildKeetaOrderReadyRequest({orderViewId: ORDER_ID, providerShopId: SHOP_ID});
                  const response = await sendKeetaJsonRequest({
                    url: providerRequest.endpoint,
                    params: {
                      ...providerRequest.params,
                      appId: APP_ID,
                      accessToken: token.accessToken,
                      timestamp: Math.floor(Date.now()/1000),
                    },
                    secretProvider: secretProvider(env),
                  });
                  return json({
                    code:0,
                    orderViewId:ORDER_ID,
                    providerOk:response.ok,
                    providerCode:response.code,
                    providerMessage:response.message ?? null
                  });
                } catch (error) {
                  return json({code:error instanceof Error ? error.message : "MANUAL_PREPARE_FAILED"},500);
                }
              }
              return base.fetch(request, env as never);
            }
          };
          TS

          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('source/workers/keeta/wrangler.jsonc','utf8'));
          src.main='src/manual-prepare-5402.ts';
          src.vars={...(src.vars||{}),KEETA_APP_ID:'3419700273'};
          fs.writeFileSync('source/workers/keeta/manual-prepare-wrangler.jsonc',JSON.stringify(src,null,2));
          NODE

      - name: Deploy and prepare immediately
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          printf 'KEETA_MANUAL_PREPARE_KEY=%s\n' "$KEY" > "$RUNNER_TEMP/manual.env"
          wrangler deploy --config manual-prepare-wrangler.jsonc --secrets-file "$RUNNER_TEMP/manual.env"
          sleep 2
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/prepare.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $KEY" "$WORKER_URL/sit/manual-prepare-5402")"
          echo "prepare_http=$HTTP"
          cat "$RUNNER_TEMP/prepare.json"
          test "$HTTP" = "200"
          jq -e '.code==0 and .orderViewId==5123441027165402' "$RUNNER_TEMP/prepare.json" >/dev/null

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t1-keeta-prepare-5402-${{ github.run_id }}
          path: ${{ runner.temp }}/prepare.json
          if-no-files-found: warn
          retention-days: 7
