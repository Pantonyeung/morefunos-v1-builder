name: V2 Admin Responsive Browser Acceptance

on:
  push:
    paths:
      - 'requests/v2-admin-responsive-browser-request.txt'

permissions:
  contents: read

jobs:
  browser:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ADMIN_ORIGIN: https://morefun-v2-admin.pantonyeung.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-admin-responsive-browser-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build exact Admin candidate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.req.outputs.source_sha }}"
          npm install --no-save --ignore-scripts --no-audit --no-fund
          cd apps/admin-web
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html

      - name: Install browser harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Run desktop tablet mobile acceptance
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_LOGIN_SECRET"
          mkdir -p evidence
          cat > static-server.mjs <<'EOF'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=path.resolve('source/apps/admin-web/dist');
          const types={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json','.svg':'image/svg+xml','.png':'image/png','.webmanifest':'application/manifest+json'};
          http.createServer((req,res)=>{
            const u=new URL(req.url,'http://127.0.0.1');
            let p=decodeURIComponent(u.pathname);
            let file=path.join(root,p.replace(/^\/+/,'')); 
            if(p==='/'||!fs.existsSync(file)||fs.statSync(file).isDirectory()) file=path.join(root,'index.html');
            const ext=path.extname(file);
            res.writeHead(200,{'content-type':types[ext]||'application/octet-stream','cache-control':'no-store'});
            fs.createReadStream(file).pipe(res);
          }).listen(4173,'127.0.0.1',()=>console.log('STATIC_READY'));
          EOF
          node static-server.mjs > evidence/static-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/admin/overview >/dev/null && break; sleep 1; done

          cat > responsive-browser.mjs <<'EOF'
          import {chromium,request} from 'playwright-core';
          import fs from 'node:fs';
          const {ADMIN_ORIGIN,ADMIN_LOGIN_SECRET,SOURCE_SHA}=process.env;
          const chrome=process.argv[2];
          const api=await request.newContext({baseURL:ADMIN_ORIGIN});
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const summary={sourceSha:SOURCE_SHA,views:{}};

          async function proxyAdmin(page){
            await page.route('**/api/admin/**',async route=>{
              const r=route.request();
              const u=new URL(r.url());
              const headers={...r.headers()};
              for(const k of ['host','origin','referer','cookie','content-length']) delete headers[k];
              const opts={method:r.method(),headers,failOnStatusCode:false};
              const data=r.postDataBuffer();
              if(data) opts.data=data;
              const response=await api.fetch(u.pathname+u.search,opts);
              const responseHeaders={...response.headers()};
              delete responseHeaders['set-cookie'];
              delete responseHeaders['content-encoding'];
              delete responseHeaders['content-length'];
              await route.fulfill({status:response.status(),headers:responseHeaders,body:await response.body()});
            });
          }

          async function login(page){
            await page.goto('http://127.0.0.1:4173/admin/overview',{waitUntil:'networkidle'});
            const gate=page.getByLabel('管理員密碼');
            if(await gate.count()){
              await gate.fill(ADMIN_LOGIN_SECRET);
              await page.getByRole('button',{name:'登入 Admin',exact:true}).click();
            }
            await page.getByRole('heading',{name:'營運總覽',exact:true}).waitFor({timeout:15000});
          }

          async function display(page,selector){return page.locator(selector).evaluate(el=>getComputedStyle(el).display);}
          async function rect(page,selector){return page.locator(selector).boundingBox();}
          async function noHorizontalOverflow(page){
            return page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth:window.innerWidth,bodyScrollWidth:document.body.scrollWidth}));
          }

          // Authenticate once through the real production API authority, proxied into the exact candidate UI.
          const authContext=await browser.newContext({viewport:{width:1440,height:1000}});
          const authPage=await authContext.newPage();
          await proxyAdmin(authPage);
          await login(authPage);
          await authContext.close();

          for(const spec of [
            {name:'desktop',width:1440,height:1000},
            {name:'tablet',width:1024,height:900},
            {name:'mobile',width:390,height:844},
          ]){
            const context=await browser.newContext({viewport:{width:spec.width,height:spec.height}});
            const page=await context.newPage();
            await proxyAdmin(page);
            await page.goto('http://127.0.0.1:4173/admin/overview',{waitUntil:'networkidle'});
            await page.getByRole('heading',{name:'營運總覽',exact:true}).waitFor({timeout:15000});

            const railDisplay=await display(page,'.admin-pos-rail');
            const sectionDisplay=await display(page,'.admin-pos-section-nav');
            const mobileNavDisplay=await display(page,'.admin-mobile-nav');
            const overflow=await noHorizontalOverflow(page);
            if(overflow.scrollWidth>overflow.innerWidth+2||overflow.bodyScrollWidth>overflow.innerWidth+2) throw new Error(spec.name+'_HORIZONTAL_OVERFLOW:'+JSON.stringify(overflow));

            if(spec.name==='desktop'){
              if(railDisplay==='none') throw new Error('DESKTOP_RAIL_HIDDEN');
              if(sectionDisplay==='none') throw new Error('DESKTOP_SECTION_HIDDEN');
              if(mobileNavDisplay!=='none') throw new Error('DESKTOP_MOBILE_NAV_VISIBLE');
              const rail=await rect(page,'.admin-pos-rail'); const section=await rect(page,'.admin-pos-section-nav');
              if(!rail||Math.abs(rail.width-72)>3) throw new Error('DESKTOP_RAIL_WIDTH:'+JSON.stringify(rail));
              if(!section||Math.abs(section.width-228)>4) throw new Error('DESKTOP_SECTION_WIDTH:'+JSON.stringify(section));
            }

            if(spec.name==='tablet'){
              if(railDisplay==='none') throw new Error('TABLET_RAIL_HIDDEN');
              if(mobileNavDisplay!=='none') throw new Error('TABLET_MOBILE_NAV_VISIBLE');
              const rail=await rect(page,'.admin-pos-rail');
              if(!rail||Math.abs(rail.width-64)>4) throw new Error('TABLET_RAIL_WIDTH:'+JSON.stringify(rail));
              const trigger=page.locator('.admin-pos-section-trigger');
              if(!(await trigger.isVisible())) throw new Error('TABLET_SECTION_TRIGGER_HIDDEN');
              await trigger.click();
              await page.locator('.admin-pos-section-nav.is-open').waitFor({state:'visible'});
            }

            if(spec.name==='mobile'){
              if(railDisplay!=='none') throw new Error('MOBILE_RAIL_VISIBLE');
              if(mobileNavDisplay==='none') throw new Error('MOBILE_NAV_HIDDEN');
              const nav=page.locator('.admin-mobile-nav');
              const items=nav.locator(':scope > a, :scope > button');
              if(await items.count()!==5) throw new Error('MOBILE_NAV_COUNT:'+(await items.count()));
              for(let i=0;i<5;i++){const b=await items.nth(i).boundingBox();if(!b||b.height<44) throw new Error('MOBILE_TOUCH_TARGET_'+i+':'+JSON.stringify(b));}
              if(!(await page.locator('.admin-mobile-page-title').isVisible())) throw new Error('MOBILE_PAGE_TITLE_HIDDEN');
              await page.getByRole('button',{name:'更多',exact:true}).click();
              await page.locator('.admin-mobile-more-sheet').waitFor({state:'visible'});
              for(const label of ['平台','報表','門店','系統']) if(!(await page.getByRole('link',{name:label,exact:true}).isVisible())) throw new Error('MOBILE_MORE_MISSING:'+label);

              await page.goto('http://127.0.0.1:4173/admin/availability',{waitUntil:'networkidle'});
              await page.locator('.availability-mobile-summary').waitFor({state:'visible'});
              await page.goto('http://127.0.0.1:4173/admin/orders/open',{waitUntil:'networkidle'});
              await page.locator('.order-mobile-switcher').waitFor({state:'visible'});
              await page.goto('http://127.0.0.1:4173/admin/business-day',{waitUntil:'networkidle'});
              await page.locator('.business-day-mobile-summary').waitFor({state:'visible'});
            }

            await page.screenshot({path:'evidence/'+spec.name+'.png',fullPage:true});
            summary.views[spec.name]={viewport:[spec.width,spec.height],railDisplay,sectionDisplay,mobileNavDisplay,overflow,status:'PASS'};
            await context.close();
          }

          await api.dispose();
          await browser.close();
          fs.writeFileSync('evidence/summary.json',JSON.stringify(summary,null,2));
          EOF
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          node responsive-browser.mjs "$CHROME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-responsive-browser-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
