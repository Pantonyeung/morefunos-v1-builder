name: Runtime Release V3

on:
  push:
    branches: [runtime-release-queue]
    paths: [runtime-release-request.json]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        type: string
      release_channel:
        description: Runtime channel
        required: true
        default: candidate
        type: choice
        options: [candidate, stable, dev]

permissions:
  contents: read
  issues: write

env:
  SOURCE_REPO: Pantonyeung/morefunos-v1
  EXPECTED_APP_SIGNING_CERT_SHA256: 8f66270541c419a90ae0e8b94a2c7796e13d5c06805b0919ce3f7f5b3602857a
  MIN_CARRIER_VERSION_CODE: '21'
  BRIDGE_VERSION: '1'
  WRANGLER_VERSION: '4.118.0'

concurrency:
  group: runtime-release-v3-${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder release executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact release request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          echo 'request' > "$RUNNER_TEMP/runtime-v3-stage"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            SOURCE_SHA="$DISPATCH_SOURCE_SHA"
            RELEASE_CHANNEL="$DISPATCH_CHANNEL"
            REQUEST_ID="dispatch-${GITHUB_RUN_ID}"
          else
            test -s runtime-release-request.json
            mapfile -t VALUES < <(node <<'NODE'
          const fs=require('node:fs');
          const request=JSON.parse(fs.readFileSync('runtime-release-request.json','utf8'));
          const channels=new Set(['candidate','stable','dev']);
          if (!/^[0-9a-fA-F]{40}$/.test(request.sourceSha ?? '')) process.exit(2);
          if (!channels.has(request.channel)) process.exit(3);
          if (typeof request.requestId !== 'string' || !/^[A-Za-z0-9._:-]{1,96}$/.test(request.requestId)) process.exit(4);
          console.log(request.sourceSha.toLowerCase());
          console.log(request.channel);
          console.log(request.requestId);
          NODE
            )
            SOURCE_SHA="${VALUES[0]}"
            RELEASE_CHANNEL="${VALUES[1]}"
            REQUEST_ID="${VALUES[2]}"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$RELEASE_CHANNEL" in candidate|stable|dev) ;; *) exit 1 ;; esac
          {
            echo "source_sha=$SOURCE_SHA"
            echo "release_channel=$RELEASE_CHANNEL"
            echo "request_id=$REQUEST_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Runtime Release V3 accepted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ steps.request.outputs.release_channel }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          echo 'accepted' > "$RUNNER_TEMP/runtime-v3-stage"
          gh issue comment 2 --repo Pantonyeung/morefunos-v1-builder --body "runtime-release-v3 request_id=$REQUEST_ID source_sha=$SOURCE_SHA status=accepted channel=$RELEASE_CHANNEL run_id=$GITHUB_RUN_ID" >/dev/null

      - name: Setup Node 22.22.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'

      - name: Mark source checkout stage
        shell: bash
        run: echo 'source-checkout' > "$RUNNER_TEMP/runtime-v3-stage"

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          echo 'source-identity' > "$RUNNER_TEMP/runtime-v3-stage"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install SMT Runtime dependencies
        shell: bash
        run: |
          echo 'install' > "$RUNNER_TEMP/runtime-v3-stage"
          npm --prefix source/apps/smt-web ci --no-audit --no-fund

      - name: Verify SMT Runtime
        shell: bash
        run: |
          echo 'test' > "$RUNNER_TEMP/runtime-v3-stage"
          npm --prefix source/apps/smt-web test

      - name: Build SMT Runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'build' > "$RUNNER_TEMP/runtime-v3-stage"
          npm --prefix source/apps/smt-web run build
          test -s source/apps/smt-web/dist/index.html
          find source/apps/smt-web/dist -maxdepth 2 -type f -size +0c | grep -q .

      - name: Setup JDK 17 for Runtime signing
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Sign Runtime package
        id: signing
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ steps.request.outputs.release_channel }}
          V1_ANDROID_KEYSTORE_B64: ${{ secrets.V1_ANDROID_KEYSTORE_B64 }}
          V1_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V1_ANDROID_KEYSTORE_PASSWORD }}
          V1_ANDROID_KEY_ALIAS: ${{ secrets.V1_ANDROID_KEY_ALIAS }}
          V1_ANDROID_KEY_PASSWORD: ${{ secrets.V1_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo 'sign' > "$RUNNER_TEMP/runtime-v3-stage"
          KEYSTORE="$RUNNER_TEMP/morefunos-v1-app-signing.p12"
          CERT_DER="$RUNNER_TEMP/morefunos-v1-app-signing.der"
          MANIFEST="$RUNNER_TEMP/MANIFEST.MF"
          cleanup() { rm -f "$KEYSTORE" "$CERT_DER" "$MANIFEST"; }
          trap cleanup EXIT

          printf '%s' "$V1_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" -alias "$V1_ANDROID_KEY_ALIAS" -file "$CERT_DER" >/dev/null 2>&1
          CERT_SHA256="$(sha256sum "$CERT_DER" | awk '{print $1}')"
          test "$CERT_SHA256" = "$EXPECTED_APP_SIGNING_CERT_SHA256"

          SHORT_SHA="${SOURCE_SHA:0:12}"
          RELEASE_ID="runtime-${RELEASE_CHANNEL}-${SHORT_SHA}"
          RUNTIME_FILENAME="MoreFunOS-SMT-${RELEASE_ID}.mfos"
          RUNTIME_BUNDLE="$GITHUB_WORKSPACE/$RUNTIME_FILENAME"

          cat > "$MANIFEST" <<EOF
          Manifest-Version: 1.0
          MoreFun-Release-Id: ${RELEASE_ID}
          MoreFun-Runtime-Version: ${RELEASE_ID}
          MoreFun-Channel: ${RELEASE_CHANNEL}
          MoreFun-Min-Carrier-Version-Code: ${MIN_CARRIER_VERSION_CODE}
          MoreFun-Bridge-Version: ${BRIDGE_VERSION}
          EOF
          sed -i 's/^          //' "$MANIFEST"

          jar cfm "$RUNTIME_BUNDLE" "$MANIFEST" -C source/apps/smt-web/dist .
          jarsigner -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" -keypass "$V1_ANDROID_KEY_PASSWORD" "$RUNTIME_BUNDLE" "$V1_ANDROID_KEY_ALIAS" >/dev/null
          jarsigner -verify -strict -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" "$RUNTIME_BUNDLE" "$V1_ANDROID_KEY_ALIAS" >/dev/null

          RUNTIME_SHA256="$(sha256sum "$RUNTIME_BUNDLE" | awk '{print $1}')"
          RUNTIME_BYTES="$(stat -c%s "$RUNTIME_BUNDLE")"
          {
            echo "release_id=$RELEASE_ID"
            echo "runtime_filename=$RUNTIME_FILENAME"
            echo "runtime_bundle=$RUNTIME_BUNDLE"
            echo "runtime_sha256=$RUNTIME_SHA256"
            echo "runtime_bytes=$RUNTIME_BYTES"
            echo "certificate_sha256=$CERT_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Runtime metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ steps.request.outputs.release_channel }}
          RELEASE_ID: ${{ steps.signing.outputs.release_id }}
          RUNTIME_FILENAME: ${{ steps.signing.outputs.runtime_filename }}
          RUNTIME_SHA256: ${{ steps.signing.outputs.runtime_sha256 }}
          RUNTIME_BYTES: ${{ steps.signing.outputs.runtime_bytes }}
          CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          echo 'metadata' > "$RUNNER_TEMP/runtime-v3-stage"
          export SOURCE_REPO SOURCE_SHA RELEASE_CHANNEL RELEASE_ID RUNTIME_FILENAME RUNTIME_SHA256 RUNTIME_BYTES CERT_SHA256 MIN_CARRIER_VERSION_CODE BRIDGE_VERSION
          node <<'NODE'
          const fs=require('node:fs');
          const update={
            releaseId:process.env.RELEASE_ID,
            runtimeVersion:process.env.RELEASE_ID,
            channel:process.env.RELEASE_CHANNEL,
            minCarrierVersionCode:Number(process.env.MIN_CARRIER_VERSION_CODE),
            bridgeVersion:Number(process.env.BRIDGE_VERSION),
            bundleUrl:process.env.RUNTIME_FILENAME,
            archiveSha256:process.env.RUNTIME_SHA256,
          };
          const metadata={
            sourceRepository:process.env.SOURCE_REPO,
            sourceSha:process.env.SOURCE_SHA,
            ...update,
            runtimeFilename:process.env.RUNTIME_FILENAME,
            runtimeBytes:Number(process.env.RUNTIME_BYTES),
            signingCertificateSha256:process.env.CERT_SHA256,
            runtimePackageContract:'PASS',
            builderRepository:process.env.GITHUB_REPOSITORY,
            builderSha:process.env.GITHUB_SHA,
            builderRunId:process.env.GITHUB_RUN_ID,
            builtAtUtc:new Date().toISOString(),
          };
          fs.writeFileSync('runtime-update.json',JSON.stringify(update,null,2)+'\n');
          fs.writeFileSync('runtime-build-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          fs.writeFileSync('RUNTIME_SHA256SUMS',`${process.env.RUNTIME_SHA256}  ${process.env.RUNTIME_FILENAME}\n`);
          NODE

      - name: Verify generated Runtime contract
        shell: bash
        env:
          RUNTIME_BUNDLE: ${{ steps.signing.outputs.runtime_bundle }}
          RUNTIME_SHA256: ${{ steps.signing.outputs.runtime_sha256 }}
          RELEASE_ID: ${{ steps.signing.outputs.release_id }}
        run: |
          set -euo pipefail
          echo 'package-contract' > "$RUNNER_TEMP/runtime-v3-stage"
          test -f "$RUNTIME_BUNDLE"
          test "$(sha256sum "$RUNTIME_BUNDLE" | awk '{print $1}')" = "$RUNTIME_SHA256"
          EXTRACT_DIR="$RUNNER_TEMP/runtime-v3-contract"
          mkdir -p "$EXTRACT_DIR"
          (cd "$EXTRACT_DIR" && jar xf "$RUNTIME_BUNDLE")
          test -s "$EXTRACT_DIR/index.html"
          test -s "$EXTRACT_DIR/META-INF/MANIFEST.MF"
          grep -F "MoreFun-Release-Id: $RELEASE_ID" "$EXTRACT_DIR/META-INF/MANIFEST.MF" >/dev/null

      - name: Deliver immutable Runtime evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RELEASE_ID: ${{ steps.signing.outputs.release_id }}
          RUNTIME_BUNDLE: ${{ steps.signing.outputs.runtime_bundle }}
          CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
          RUNTIME_SHA256: ${{ steps.signing.outputs.runtime_sha256 }}
        run: |
          set -euo pipefail
          echo 'evidence' > "$RUNNER_TEMP/runtime-v3-stage"
          TAG="builder-v3-${RELEASE_ID}-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$RUNTIME_BUNDLE" runtime-update.json runtime-build-metadata.json RUNTIME_SHA256SUMS --repo "$SOURCE_REPO" --target "$SOURCE_SHA" --title "MoreFunOS SMT ${RELEASE_ID}" --notes "Runtime Release V3. Source ${SOURCE_SHA}. Signer ${CERT_SHA256}. Bundle ${RUNTIME_SHA256}." --prerelease

      - name: Install pinned official Wrangler CLI
        shell: bash
        run: |
          set -euo pipefail
          echo 'wrangler' > "$RUNNER_TEMP/runtime-v3-stage"
          npm install --global --silent "wrangler@${WRANGLER_VERSION}"
          wrangler --version | grep -F "$WRANGLER_VERSION" >/dev/null

      - name: Publish Runtime package-first and manifest-last
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUNTIME_BUNDLE: ${{ steps.signing.outputs.runtime_bundle }}
          RUNTIME_MANIFEST: ${{ github.workspace }}/runtime-update.json
          RUNTIME_METADATA: ${{ github.workspace }}/runtime-build-metadata.json
          OTA_WORKER_DIR: ${{ github.workspace }}/source/infra/cloudflare/ota-worker
        run: |
          echo 'publish' > "$RUNNER_TEMP/runtime-v3-stage"
          node scripts/publish-runtime-online.mjs

      - name: Runtime Release V3 final result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ steps.request.outputs.release_channel }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          RESULT: ${{ job.status }}
          RELEASE_ID: ${{ steps.signing.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_SHA:-}" || -z "${REQUEST_ID:-}" ]]; then exit 0; fi
          STAGE='unknown'
          if [[ -s "$RUNNER_TEMP/runtime-v3-stage" ]]; then STAGE="$(cat "$RUNNER_TEMP/runtime-v3-stage")"; fi
          BODY="runtime-release-v3 request_id=$REQUEST_ID source_sha=$SOURCE_SHA status=$RESULT channel=$RELEASE_CHANNEL run_id=$GITHUB_RUN_ID stage=$STAGE"
          if [[ -n "${RELEASE_ID:-}" ]]; then BODY="$BODY release_id=$RELEASE_ID"; fi
          gh issue comment 2 --repo Pantonyeung/morefunos-v1-builder --body "$BODY" >/dev/null
