name: T1 Keeta B2517 Exact Rollback

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-b2517-exact-rollback.txt'

permissions:
  contents: read

concurrency:
  group: t1-keeta-b2517-exact-rollback
  cancel-in-progress: false

jobs:
  rollback:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PROD_D1_DATABASE_ID: "1ed17fcb-7e7a-4e13-a922-ae141aff4142"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Execute exact B2517 rollback transaction
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"
          STORE="d2d882b4-5c7b-40f9-ad59-91f8faabb8e8"
          PRODUCT="4a7fe38e-5cf7-5994-9fa1-00ec0efec7ae"
          SKU="115907604"
          MAPPING="335d9c23-7c40-52ba-a24e-cd78619110f4"
          EVENT="catalog-keeta-sit-identity:d2d882b4-5c7b-40f9-ad59-91f8faabb8e8:001"

          SQL1="UPDATE mfos_catalog_state SET snapshot_json=json_set(json_remove(snapshot_json,'$.products[' || (SELECT key FROM json_each(snapshot_json,'$.products') WHERE json_extract(value,'$.productId')='$PRODUCT' AND json_extract(value,'$.name')='SIT 測試餐 A 更新' AND json_extract(value,'$.lifecycleStatus')='ACTIVE' AND json_array_length(json_extract(value,'$.categoryMemberships'))=0 LIMIT 1) || ']'),'$.catalogRevision',replace(json_extract(snapshot_json,'$.catalogRevision'),'+keeta-sit-001','')),catalog_revision=replace(catalog_revision,'+keeta-sit-001',''),revision=revision+1,updated_at=datetime('now') WHERE store_id='$STORE' AND instr(catalog_revision,'+keeta-sit-001')>0 AND (SELECT COUNT(*) FROM json_each(snapshot_json,'$.products') WHERE json_extract(value,'$.productId')='$PRODUCT' AND json_extract(value,'$.name')='SIT 測試餐 A 更新' AND json_extract(value,'$.lifecycleStatus')='ACTIVE' AND json_array_length(json_extract(value,'$.categoryMemberships'))=0)=1;"
          SQL2="DELETE FROM mfos_channel_menu_item WHERE store_id='$STORE' AND channel_context='KEETA' AND provider_sku_id='$SKU' AND mapping_id='$MAPPING' AND canonical_product_id='$PRODUCT' AND mapping_status='ACTIVE';"
          SQL3="DELETE FROM mfos_catalog_audit WHERE audit_id='$EVENT' AND event_type='KEETA_SIT_CANONICAL_IDENTITY_REGISTERED';"
          SQL4="DELETE FROM mfos_outbox WHERE event_id='$EVENT' AND event_type='KEETA_SIT_CANONICAL_IDENTITY_REGISTERED' AND status='PENDING';"

          jq -n --arg a "$SQL1" --arg b "$SQL2" --arg c "$SQL3" --arg d "$SQL4" '{batch:[{sql:$a,params:[]},{sql:$b,params:[]},{sql:$c,params:[]},{sql:$d,params:[]}]}' > "$RUNNER_TEMP/batch.json"
          curl --fail-with-body --silent --show-error -X POST "$URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/batch.json" > "$RUNNER_TEMP/rollback.json"

          jq -e '.success == true and (.result|length)==4 and ([.result[] | select(.success != true)] | length)==0' "$RUNNER_TEMP/rollback.json" >/dev/null
          jq -e '([.result[].meta.changes|tonumber] | all(. == 1))' "$RUNNER_TEMP/rollback.json" >/dev/null
          echo "b2517_exact_rollback=PASS"

      - name: Prove zero residue
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"
          SQL="SELECT (SELECT COUNT(*) FROM mfos_channel_menu_item WHERE store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8' AND channel_context='KEETA' AND provider_sku_id='115907604') mapping_count,(SELECT COUNT(*) FROM mfos_catalog_audit WHERE audit_id='catalog-keeta-sit-identity:d2d882b4-5c7b-40f9-ad59-91f8faabb8e8:001') audit_count,(SELECT COUNT(*) FROM mfos_outbox WHERE event_id='catalog-keeta-sit-identity:d2d882b4-5c7b-40f9-ad59-91f8faabb8e8:001') outbox_count,(SELECT COUNT(*) FROM mfos_catalog_state c,json_each(c.snapshot_json,'$.products') j WHERE c.store_id='d2d882b4-5c7b-40f9-ad59-91f8faabb8e8' AND json_extract(j.value,'$.productId')='4a7fe38e-5cf7-5994-9fa1-00ec0efec7ae') product_count;"
          jq -n --arg sql "$SQL" '{sql:$sql,params:[]}' > "$RUNNER_TEMP/readback-q.json"
          curl --fail-with-body --silent --show-error -X POST "$URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/readback-q.json" > "$RUNNER_TEMP/readback.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results[0].mapping_count|tonumber)==0 and (.result[0].results[0].audit_count|tonumber)==0 and (.result[0].results[0].outbox_count|tonumber)==0 and (.result[0].results[0].product_count|tonumber)==0' "$RUNNER_TEMP/readback.json" >/dev/null
          jq -c '.result[0].results[0]' "$RUNNER_TEMP/readback.json"
          echo "b2517_residue=ZERO"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-keeta-b2517-exact-rollback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rollback.json
            ${{ runner.temp }}/readback.json
          retention-days: 30
