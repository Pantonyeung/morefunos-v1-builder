name: Keeta Store Item 07 Rest Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ci-requests/morefun-v2-keeta-store-item-07.sha'

permissions:
  contents: read

concurrency:
  group: keeta-store-item-07-rest
  cancel-in-progress: false

jobs:
  store-item-07:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: '4.125.0'
      EXPECTED_APP_ID: '3419700273'
      SHOP_ID: '721578302'
      WORKER_URL: 'https://morefun-v2-keeta-sit.pantonyeung.workers.dev'

    steps:
      - name: Checkout Builder request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/morefun-v2-keeta-store-item-07.sha)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Guard Item 07 exact contract and fresh reset identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
          grep -Fq 'CURRENT_STORE_API_ITEM: `STORE_ITEM_07_STATUS_REST`' source/docs/rooms/integration/INTG-CUR.md
          grep -Fq 'LAST_PASSED_STORE_API_ITEM: `STORE_ITEM_06_STATUS_OPEN`' source/docs/rooms/integration/INTG-CUR.md
          grep -Fq '/sit/store-details' source/workers/keeta/src/index.ts
          grep -Fq '/sit/store-rest' source/workers/keeta/src/index.ts
          grep -Fq 'https://open.mykeeta.com/api/open/scm/shop/status/rest' source/packages/integration/keeta-store-provider-requests.ts
          grep -Fq 'buildKeetaStoreSuspendRequest' source/packages/integration/keeta-store-provider-requests.ts
          test -f source/packages/integration/keeta-store-item-07-rest-contract.test.ts
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('source/workers/keeta/wrangler.jsonc', 'utf8');
          const expected = process.env.EXPECTED_APP_ID;
          if (!text.includes(`\"KEETA_APP_ID\": \"${expected}\"`)) throw new Error(`EXPECTED_APP_ID_NOT_FOUND:${expected}`);
          NODE

      - name: Require existing Keeta runtime secret names
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" secret list --config wrangler.jsonc --format json > "$RUNNER_TEMP/keeta-secrets-before.json"
          node - "$RUNNER_TEMP/keeta-secrets-before.json" <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const names = new Set(rows.map((row) => row.name));
          for (const required of ['KEETA_APP_SECRET', 'KEETA_TOKEN_ENCRYPTION_KEY']) {
            if (!names.has(required)) throw new Error(`${required}_MISSING_BEFORE_DEPLOY`);
          }
          NODE

      - name: Prepare ephemeral SIT probe secret
        shell: bash
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf 'KEETA_SIT_PROBE_KEY=%s\n' "$PROBE_KEY" > "$RUNNER_TEMP/keeta-item07-secrets.env"
          chmod 600 "$RUNNER_TEMP/keeta-item07-secrets.env"
          echo "PROBE_KEY=$PROBE_KEY" >> "$GITHUB_ENV"

      - name: Deploy exact Worker preserving existing runtime secrets
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc --secrets-file "$RUNNER_TEMP/keeta-item07-secrets.env"

      - name: Prove runtime secret names survived deployment
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" secret list --config wrangler.jsonc --format json > "$RUNNER_TEMP/keeta-secrets-after.json"
          node - "$RUNNER_TEMP/keeta-secrets-after.json" <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const names = new Set(rows.map((row) => row.name));
          for (const required of ['KEETA_APP_SECRET', 'KEETA_TOKEN_ENCRYPTION_KEY', 'KEETA_SIT_PROBE_KEY']) {
            if (!names.has(required)) throw new Error(`${required}_MISSING_AFTER_DEPLOY`);
          }
          NODE

      - name: Read operating baseline before mutation
        shell: bash
        run: |
          set -euo pipefail
          HTTP=000
          for attempt in $(seq 1 20); do
            HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/pre-rest.json" -w '%{http_code}' -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-details?shopId=$SHOP_ID" || true)"
            if [[ "$HTTP" == '200' ]]; then break; fi
            sleep 2
          done
          test "$HTTP" = '200'
          node - "$RUNNER_TEMP/pre-rest.json" <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const status=b?.data?.status;
          console.log(`baseline_store_details_code=${b.code}`);
          console.log(`baseline_status=${status}`);
          console.log(`baseline_delivery_rest_status=${b?.data?.deliveryRestStatus ?? 'not-present'}`);
          console.log(`baseline_pickup_rest_status=${b?.data?.pickupRestStatus ?? 'not-present'}`);
          console.log(`baseline_available_for_order=${b?.data?.availableForOrder ?? 'not-present'}`);
          if (b.code !== 0 || status !== 3) {
            console.error(`KEETA_STORE_ITEM_07_BASELINE_NOT_OPERATING code=${b.code} status=${status}`);
            process.exit(1);
          }
          NODE

      - name: Execute official status-rest exactly once
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/rest-result.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-rest?shopId=$SHOP_ID" || true)"
          echo "status_rest_transport_http=$HTTP"
          if [[ "$HTTP" != '200' ]]; then
            echo 'KEETA_STORE_ITEM_07_MUTATION_TRANSPORT_UNCERTAIN_NO_RETRY=true' >&2
            exit 1
          fi
          node - "$RUNNER_TEMP/rest-result.json" <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`keeta_status_rest_code=${b.code}`);
          console.log(`keeta_status_rest_message=${String(b.message ?? '').replace(/[\r\n]/g,' ')}`);
          if (b.code !== 0) process.exit(1);
          NODE

      - name: Read back official suspended status without hidden open rollback
        shell: bash
        run: |
          set -euo pipefail
          MATCH=0
          LAST_HTTP=000
          for attempt in $(seq 1 20); do
            HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/post-rest.json" -w '%{http_code}' -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-details?shopId=$SHOP_ID" || true)"
            LAST_HTTP="$HTTP"
            if [[ "$HTTP" == '200' ]] && node - "$RUNNER_TEMP/post-rest.json" <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const status=b?.data?.status;
          const available=b?.data?.availableForOrder;
          if (b.code !== 0 || status !== 4 || available !== false) process.exit(1);
          console.log(`post_rest_store_details_code=${b.code}`);
          console.log(`post_rest_status=${status}`);
          console.log(`post_rest_delivery_rest_status=${b?.data?.deliveryRestStatus ?? 'not-present'}`);
          console.log(`post_rest_pickup_rest_status=${b?.data?.pickupRestStatus ?? 'not-present'}`);
          console.log(`post_rest_available_for_order=${available}`);
          NODE
            then
              MATCH=1
              echo "post_rest_read_attempt=$attempt"
              break
            fi
            sleep 2
          done
          if [[ "$MATCH" != '1' ]]; then
            echo "KEETA_STORE_ITEM_07_POST_READ_NOT_SUSPENDED http=$LAST_HTTP" >&2
            exit 1
          fi

      - name: Evidence summary
        shell: bash
        run: |
          printf 'builder_run_id=%s\nsource_sha=%s\napp_id=%s\nshop_id=%s\nhandbook_store_item=07\ntest_store_identity=FRESH_RESET_STORE\nstatus_rest_provider_call=PASS\npre_status=3\npost_status=4\nmutation_request_count=1\nhidden_status_open_rollback=false\nservice_line_availability_inferred=false\n' \
            "$GITHUB_RUN_ID" '${{ steps.source.outputs.sha }}' "$EXPECTED_APP_ID" "$SHOP_ID"
