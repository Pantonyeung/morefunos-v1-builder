name: Diagnose V2 Admin D1 State

on:
  push:
    paths:
      - 'requests/v2-admin-d1-diagnostic-request.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Query non-sensitive SMT pairing state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p evidence
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"

          query() {
            local name="$1"
            local sql="$2"
            SQL="$sql" node -e "require('fs').writeFileSync('/tmp/query.json',JSON.stringify({sql:process.env.SQL}))"
            curl -sS -X POST "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/query.json > "/tmp/${name}.json"
            NAME="$name" node -e "const x=require('/tmp/'+process.env.NAME+'.json');if(!x.success||!x.result?.[0]?.success){console.error(JSON.stringify(x.errors||x.result||x));process.exit(1)};for(const row of x.result[0].results||[])console.log(JSON.stringify(row))" | tee "evidence/${name}.txt"
          }

          query counts "SELECT (SELECT COUNT(*) FROM mfos_device_trust) AS device_total, (SELECT COUNT(*) FROM mfos_device_trust WHERE json_extract(payload_json,'$.lifecycleStatus')='TRUSTED') AS device_trusted, (SELECT COUNT(*) FROM mfos_session) AS session_total, (SELECT COUNT(*) FROM mfos_session WHERE lifecycle_status='ACTIVE') AS session_active, (SELECT COUNT(*) FROM mfos_smt_runtime_binding) AS binding_total, (SELECT COUNT(*) FROM mfos_smt_runtime_binding WHERE lifecycle_status='ACTIVE') AS binding_active"
          query latest "SELECT (SELECT MAX(json_extract(payload_json,'$.issuedAt')) FROM mfos_session) AS latest_session_issued_at, (SELECT MAX(created_at) FROM mfos_smt_runtime_binding) AS latest_binding_created_at"
          query staff_schema "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='mfos_rbac_staff') AS staff_table, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='mfos_staff_pos_credential') AS credential_table, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='mfos_staff_pos_credential_audit') AS credential_audit_table"
          query staff_counts "SELECT (SELECT COUNT(*) FROM mfos_rbac_staff) AS staff_total, (SELECT COUNT(*) FROM mfos_staff_pos_credential) AS credential_total, (SELECT COUNT(*) FROM mfos_staff_pos_credential WHERE status='ACTIVE') AS credential_active"
          query staff_credentials "SELECT c.employee_code,c.staff_id,c.status AS credential_status,c.revision AS credential_revision,json_extract(s.record_json,'$.displayName') AS display_name,json_extract(s.record_json,'$.lifecycleStatus') AS staff_status FROM mfos_staff_pos_credential c LEFT JOIN mfos_rbac_staff s ON s.staff_id=c.staff_id ORDER BY c.updated_at DESC LIMIT 20"
          query staff_manage_grants "SELECT COUNT(*) AS staff_manage_grants FROM mfos_rbac_roles, json_each(mfos_rbac_roles.record_json,'$.permissions') AS p WHERE json_extract(p.value,'$.permission')='staff.manage'"
          query stores "SELECT store_code, store_id, merchant_id FROM mfos_store_code_binding ORDER BY store_code"
          query business_days "SELECT store_id, business_date, lifecycle_status, opened_at, closed_at, revision FROM mfos_business_day ORDER BY opened_at DESC LIMIT 10"
          query reporting_currency "SELECT store_id, currency, COUNT(*) AS active_profiles FROM mfos_pricing_profile WHERE lifecycle_status='ACTIVE' GROUP BY store_id, currency ORDER BY store_id, currency"
          query reporting_orders_health "SELECT store_id, lifecycle_status, COUNT(*) AS orders, SUM(CASE WHEN order_snapshot_json IS NULL THEN 1 ELSE 0 END) AS missing_snapshot, SUM(CASE WHEN json_extract(order_snapshot_json,'$.currency') IS NULL THEN 1 ELSE 0 END) AS missing_currency, SUM(CASE WHEN json_extract(order_snapshot_json,'$.totalMinor') IS NULL THEN 1 ELSE 0 END) AS missing_total FROM mfos_order_state WHERE lifecycle_status IN ('ACCEPTED','COMPLETED') GROUP BY store_id,lifecycle_status ORDER BY store_id,lifecycle_status"
          query order_open_projection_health "SELECT order_id, store_id, lifecycle_status, revision, accepted_at, created_at, updated_at, CASE WHEN accepted_projection_json IS NULL THEN 1 ELSE 0 END AS missing_projection, json_extract(accepted_projection_json,'$.orderId') AS projection_order_id, json_extract(accepted_projection_json,'$.storeId') AS projection_store_id, json_extract(accepted_projection_json,'$.lifecycleStatus') AS projection_status, json_extract(accepted_projection_json,'$.orderRevision') AS projection_order_revision, json_extract(accepted_projection_json,'$.revision') AS projection_revision, json_extract(accepted_projection_json,'$.acceptedAt') AS projection_accepted_at, json_extract(accepted_projection_json,'$.createdAt') AS projection_created_at, json_extract(accepted_projection_json,'$.updatedAt') AS projection_updated_at FROM mfos_order_state WHERE lifecycle_status='ACCEPTED' ORDER BY updated_at DESC LIMIT 30"
          query reporting_projection "SELECT projection_key, store_id, currency, projection_revision, updated_at FROM mfos_reporting_projection ORDER BY updated_at DESC LIMIT 20"
          query reporting_payments_health "SELECT store_id, COUNT(*) AS payments, SUM(CASE WHEN payment_json IS NULL THEN 1 ELSE 0 END) AS missing_json, SUM(CASE WHEN json_extract(payment_json,'$.paymentId') IS NULL THEN 1 ELSE 0 END) AS missing_payment_id, SUM(CASE WHEN json_extract(payment_json,'$.orderId') IS NULL THEN 1 ELSE 0 END) AS missing_order_id, SUM(CASE WHEN json_extract(payment_json,'$.currency') IS NULL THEN 1 ELSE 0 END) AS missing_currency FROM mfos_payment_state GROUP BY store_id ORDER BY store_id"
          query reporting_refunds_health "SELECT store_id, COUNT(*) AS refunds, SUM(CASE WHEN refund_json IS NULL THEN 1 ELSE 0 END) AS missing_json, SUM(CASE WHEN json_extract(refund_json,'$.refundId') IS NULL THEN 1 ELSE 0 END) AS missing_refund_id, SUM(CASE WHEN json_extract(refund_json,'$.paymentId') IS NULL THEN 1 ELSE 0 END) AS missing_payment_id FROM mfos_refund_state GROUP BY store_id ORDER BY store_id"
          query operational_capacity_schema "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('mfos_operational_capacity_pool','mfos_operational_capacity_schedule_rule','mfos_operational_capacity_daily_state','mfos_operational_capacity_consumption_rule','mfos_operational_capacity_stop_policy','mfos_operational_capacity_ledger','mfos_operational_capacity_order_event_state','mfos_operational_holiday_calendar','mfos_operational_holiday_sync_state') ORDER BY name"
          query operational_capacity_counts "SELECT (SELECT COUNT(*) FROM mfos_operational_capacity_pool) AS pools, (SELECT COUNT(*) FROM mfos_operational_capacity_schedule_rule) AS schedules, (SELECT COUNT(*) FROM mfos_operational_capacity_consumption_rule) AS consumption_rules, (SELECT COUNT(*) FROM mfos_operational_capacity_stop_policy) AS stop_policies, (SELECT COUNT(*) FROM mfos_operational_capacity_daily_state) AS daily_states, (SELECT COUNT(*) FROM mfos_operational_capacity_ledger) AS ledger_entries"

          printf 'database_name=morefun-v2-production\nsecrets_or_tokens_logged=NO\n' > evidence/summary.txt
          rm -f /tmp/query.json /tmp/order_open_projection_health.json /tmp/counts.json /tmp/latest.json /tmp/stores.json /tmp/business_days.json /tmp/reporting_currency.json /tmp/reporting_orders_health.json /tmp/reporting_projection.json /tmp/reporting_payments_health.json /tmp/reporting_refunds_health.json /tmp/operational_capacity_schema.json /tmp/operational_capacity_counts.json /tmp/staff_schema.json /tmp/staff_counts.json /tmp/staff_credentials.json /tmp/staff_manage_grants.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-d1-state-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
