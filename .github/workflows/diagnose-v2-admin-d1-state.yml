name: Diagnose V2 Admin D1 State

on:
  push:
    paths:
      - 'requests/v2-admin-d1-diagnostic-request.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Query non-sensitive launch state summary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p evidence
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"

          query() {
            local name="$1"
            local sql="$2"
            SQL="$sql" node -e "require('fs').writeFileSync('/tmp/query.json',JSON.stringify({sql:process.env.SQL}))"
            curl -fsS -X POST "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/query.json > "/tmp/${name}.json"
            NAME="$name" node - <<'NODE' | tee "evidence/${name}.txt"
const x=require('/tmp/'+process.env.NAME+'.json');
if(!x.success || !x.result?.[0]?.success) {
  console.error(JSON.stringify(x.errors||x.result||x));
  process.exit(1);
}
for(const row of x.result[0].results||[]) console.log(JSON.stringify(row));
NODE
          }

          query counts "SELECT
            (SELECT COUNT(*) FROM mfos_device_trust) AS device_total,
            (SELECT COUNT(*) FROM mfos_device_trust WHERE json_extract(payload_json,'$.lifecycleStatus')='TRUSTED') AS device_trusted,
            (SELECT COUNT(*) FROM mfos_session) AS session_total,
            (SELECT COUNT(*) FROM mfos_session WHERE lifecycle_status='ACTIVE') AS session_active,
            (SELECT COUNT(*) FROM mfos_smt_runtime_binding) AS binding_total,
            (SELECT COUNT(*) FROM mfos_smt_runtime_binding WHERE lifecycle_status='ACTIVE') AS binding_active"

          query latest "SELECT
            (SELECT MAX(json_extract(payload_json,'$.issuedAt')) FROM mfos_session) AS latest_session_issued_at,
            (SELECT MAX(created_at) FROM mfos_smt_runtime_binding) AS latest_binding_created_at"

          query stores "SELECT store_code, store_id, merchant_id FROM mfos_store_code_binding ORDER BY store_code"

          query business_days "SELECT store_id, business_date, lifecycle_status, opened_at, closed_at, revision FROM mfos_business_day ORDER BY opened_at DESC LIMIT 10"

          printf 'database_name=morefun-v2-production\nsecrets_or_tokens_logged=NO\n' > evidence/summary.txt
          rm -f /tmp/query.json /tmp/counts.json /tmp/latest.json /tmp/stores.json /tmp/business_days.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-d1-state-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
