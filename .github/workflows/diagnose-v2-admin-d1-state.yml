name: Diagnose V2 Admin D1 State

on:
  push:
    paths:
      - 'requests/v2-admin-d1-diagnostic-request.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Query non-sensitive launch state summary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p evidence
          node - <<'NODE'
          const fs=require('fs');
          const sql=`
          SELECT 'catalog' AS domain, COUNT(*) AS row_count FROM mfos_catalog_state
          UNION ALL SELECT 'business_day_state', COUNT(*) FROM mfos_business_day_state
          UNION ALL SELECT 'availability', COUNT(*) FROM mfos_availability_state
          UNION ALL SELECT 'customer_order_ownership', COUNT(*) FROM mfos_customer_order_ownership
          UNION ALL SELECT 'payment_state', COUNT(*) FROM mfos_payment_state
          UNION ALL SELECT 'device_trust_total', COUNT(*) FROM mfos_device_trust
          UNION ALL SELECT 'device_trust_trusted', COUNT(*) FROM mfos_device_trust WHERE json_extract(payload_json,'$.lifecycleStatus')='TRUSTED'
          UNION ALL SELECT 'session_total', COUNT(*) FROM mfos_session
          UNION ALL SELECT 'session_active', COUNT(*) FROM mfos_session WHERE lifecycle_status='ACTIVE'
          UNION ALL SELECT 'runtime_binding_total', COUNT(*) FROM mfos_smt_runtime_binding
          UNION ALL SELECT 'runtime_binding_active', COUNT(*) FROM mfos_smt_runtime_binding WHERE lifecycle_status='ACTIVE';
          SELECT MAX(json_extract(payload_json,'$.issuedAt')) AS latest_session_issued_at FROM mfos_session;
          SELECT MAX(created_at) AS latest_binding_created_at FROM mfos_smt_runtime_binding;
          SELECT store_code, store_id, merchant_id FROM mfos_store_code_binding ORDER BY store_code;
          SELECT store_id, business_date, lifecycle_status, opened_at, closed_at FROM mfos_business_day ORDER BY opened_at DESC LIMIT 10;
          `;
          fs.writeFileSync('/tmp/query.json',JSON.stringify({sql}));
          NODE
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          curl -fsS -X POST "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/query.json > /tmp/result.json
          node - <<'NODE' | tee evidence/d1-state.txt
          const x=require('/tmp/result.json');
          if(!x.success || !(x.result||[]).every(r=>r.success!==false)) process.exit(1);
          const counts=x.result?.[0]?.results||[];
          console.log('database_name=morefun-v2-production');
          for(const row of counts) console.log(`${row.domain}_rows=${row.row_count}`);
          const latestSession=x.result?.[1]?.results?.[0]||{};
          const latestBinding=x.result?.[2]?.results?.[0]||{};
          const stores=x.result?.[3]?.results||[];
          const businessDays=x.result?.[4]?.results||[];
          console.log('latest_session_issued_at='+(latestSession.latest_session_issued_at||''));
          console.log('latest_binding_created_at='+(latestBinding.latest_binding_created_at||''));
          console.log('store_bindings='+stores.map(r=>`${r.store_code}:${r.store_id}`).join(','));
          console.log('business_days='+businessDays.map(r=>`${r.store_id}:${r.business_date}:${r.lifecycle_status}`).join(','));
          NODE
          rm -f /tmp/query.json /tmp/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-d1-state-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
