name: Runtime Release Request

on:
  push:
    branches: [runtime-release-queue]
    paths: [runtime-release-request.json]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        type: string
      release_channel:
        description: Runtime channel
        required: true
        default: candidate
        type: choice
        options: [candidate, stable, dev]

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      channel: ${{ steps.request.outputs.channel }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Checkout release request
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate exact release request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            SOURCE_SHA="$DISPATCH_SOURCE_SHA"
            CHANNEL="$DISPATCH_CHANNEL"
            REQUEST_ID="dispatch-${GITHUB_RUN_ID}"
          else
            test -s runtime-release-request.json
            mapfile -t VALUES < <(node <<'NODE'
          const fs=require('node:fs');
          const request=JSON.parse(fs.readFileSync('runtime-release-request.json','utf8'));
          const allowed=new Set(['candidate','stable','dev']);
          if (!/^[0-9a-fA-F]{40}$/.test(request.sourceSha ?? '')) process.exit(2);
          if (!allowed.has(request.channel)) process.exit(3);
          if (typeof request.requestId !== 'string' || !/^[A-Za-z0-9._:-]{1,96}$/.test(request.requestId)) process.exit(4);
          console.log(request.sourceSha.toLowerCase());
          console.log(request.channel);
          console.log(request.requestId);
          NODE
            )
            SOURCE_SHA="${VALUES[0]}"
            CHANNEL="${VALUES[1]}"
            REQUEST_ID="${VALUES[2]}"
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "channel=$CHANNEL"
            echo "request_id=$REQUEST_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Publish accepted marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          CHANNEL: ${{ steps.request.outputs.channel }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          gh issue comment 2 --repo Pantonyeung/morefunos-v1-builder --body "runtime-release-request request_id=$REQUEST_ID source_sha=$SOURCE_SHA status=accepted channel=$CHANNEL" >/dev/null

  release:
    needs: prepare
    uses: ./.github/workflows/runtime-release-v2.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      release_channel: ${{ needs.prepare.outputs.channel }}
    secrets: inherit

  report:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final release result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          gh issue comment 2 --repo Pantonyeung/morefunos-v1-builder --body "runtime-release-request request_id=$REQUEST_ID source_sha=$SOURCE_SHA status=$RESULT channel=$CHANNEL" >/dev/null
