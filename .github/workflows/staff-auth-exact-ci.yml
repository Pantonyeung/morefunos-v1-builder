name: Staff Auth Exact CI

on:
  push:
    paths:
      - '.github/workflows/staff-auth-exact-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  SOURCE_SHA: 5c73cbdd285e5e71022bfeb8dcbff55c558217d2

jobs:
  staff-auth:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic
        run: |
          : > "$RUNNER_TEMP/staff-auth.log"
          echo 'workflow=STARTED' >> "$RUNNER_TEMP/staff-auth.log"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          echo 'exact_source=PASS' >> "$RUNNER_TEMP/staff-auth.log"
      - name: Verify Staff Authority and HTTP
        working-directory: source
        run: |
          set -o pipefail
          {
            echo 'staff_auth_tests=STARTED'
            node --experimental-strip-types --test packages/staff/staff-authentication-service.test.ts
            node --experimental-strip-types --test packages/runtime/staff-auth-http.test.ts
            node --experimental-strip-types --test packages/staff/staff-durable-authority.test.ts
            node --experimental-strip-types --test infra/cloudflare/admin-policy-worker/worker.test.ts
            node --experimental-strip-types --test infra/cloudflare/admin-policy-worker/entry.test.ts
            echo 'staff_auth_tests=PASS'
          } 2>&1 | tee -a "$RUNNER_TEMP/staff-auth.log"
      - name: Verify Admin Web build
        working-directory: source/apps/admin-web
        run: |
          set -o pipefail
          {
            echo 'admin_web=STARTED'
            npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
            npm test
            npm run build
            echo 'admin_web=PASS'
          } 2>&1 | tee -a "$RUNNER_TEMP/staff-auth.log"
      - name: Persist diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='diagnostics/staff-auth-latest.log'
          { printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"; cat "$RUNNER_TEMP/staff-auth.log" 2>/dev/null || true; } > /tmp/staff-auth-latest.log
          content="$(base64 -w0 /tmp/staff-auth-latest.log)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='ci: refresh Staff Auth diagnostic' -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null
