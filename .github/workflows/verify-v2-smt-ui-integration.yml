name: V2 SMT UI Integration Verification

on:
  push:
    paths:
      - 'requests/v2-smt-ui-integration-request.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          else
            test -f requests/v2-smt-ui-integration-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smt-ui-integration-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Catalog admission tests
        working-directory: source
        run: npm run test:core-catalog
      - name: Pricing admission tests
        working-directory: source
        run: npm run test:core-pricing
      - name: SMT Node-compatible integration tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find packages/smt-ui-integration -maxdepth 1 -name '*.test.ts' ! -name 't2-smt-worker-mount.test.ts' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

      - name: Record Worker-runtime test separation
        shell: bash
        run: |
          set -euo pipefail
          test -f source/packages/smt-ui-integration/t2-smt-worker-mount.test.ts
          grep -q "infra/cloudflare/admin-web-worker/index.ts" source/packages/smt-ui-integration/t2-smt-worker-mount.test.ts
          echo "t2-smt-worker-mount.test.ts imports Cloudflare Worker runtime code and is intentionally excluded from plain Node SMT UI verification; Workers-runtime verification belongs to the dedicated Cloudflare test/deploy lane." >> "$GITHUB_STEP_SUMMARY"
      - name: Install SMT app dependencies
        working-directory: source/apps/smt-clean
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: SMT app tests
        working-directory: source/apps/smt-clean
        run: npm test
      - name: SMT app typecheck
        working-directory: source/apps/smt-clean
        run: npm run typecheck
      - name: SMT app build
        working-directory: source/apps/smt-clean
        run: npm run build
      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nworkflow=verify-v2-smt-ui-integration.yml\ngates=core-catalog,core-pricing,smt-ui-integration,smt-app-tests,smt-typecheck,smt-build\n' "$SOURCE_SHA" > evidence/summary.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-smt-ui-integration-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
