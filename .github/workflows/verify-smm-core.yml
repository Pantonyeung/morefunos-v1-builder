name: V1 SMM Web Verification Core

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  verify-smm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Validate immutable SMM verification request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED_SOURCE_SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]')"
          if [[ ! "$NORMALIZED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must normalize to an exact 40-character Git commit SHA" >&2
            exit 1
          fi
          echo "source_sha=${NORMALIZED_SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "Validated immutable SMM source SHA input."

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo "Verified immutable private SMM source SHA: $ACTUAL_SOURCE_SHA"

      - name: Execute SMM verification without public source logs
        id: verify_smm
        continue-on-error: true
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/private-smm-verification.log"
          : > "$LOG"

          run_stage() {
            local stage="$1"
            shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            echo "$stage: FAIL (details withheld from public log)"
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            return 1
          }

          cd source
          if [[ ! -f apps/smm-web/package-lock.json ]]; then
            echo "smm-lockfile: FAIL"
            echo "failed_stage=smm-lockfile" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          run_stage "smm-web-locked-install" npm --prefix apps/smm-web ci --no-audit --no-fund || exit 1
          run_stage "smm-active-work-contract" node --experimental-strip-types --test apps/smm-web/src/smm-active-work-port.test.ts || exit 1
          run_stage "smm-authority-static" node --test apps/smm-web/src/b-smm-01a-static.test.mjs || exit 1
          run_stage "smm-web-test" npm --prefix apps/smm-web test || exit 1
          run_stage "smm-web-typecheck" npm --prefix apps/smm-web exec -- tsc --noEmit -p tsconfig.json || exit 1
          run_stage "smm-web-build" npm --prefix apps/smm-web run build || exit 1

          echo "Private SMM verification core: PASS"

      - name: Generate sanitized SMM verification metadata
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify_smm.outcome }}
          FAILED_STAGE: ${{ steps.verify_smm.outputs.failed_stage }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BUILDER_SHA: ${{ github.sha }}
          BUILDER_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          console.log(JSON.stringify({
            sourceSha: process.env.SOURCE_SHA || null,
            verificationSurface: 'smm-web',
            status: process.env.VERIFY_OUTCOME === 'success' ? 'PASS' : 'FAILED',
            failedStage: process.env.FAILED_STAGE || null,
            builderSha: process.env.BUILDER_SHA,
            builderRunId: process.env.BUILDER_RUN_ID,
            verifiedAtUtc: new Date().toISOString()
          }));
          NODE

      - name: Fail SMM workflow after sanitized evidence
        if: steps.verify_smm.outcome == 'failure'
        shell: bash
        run: |
          echo "SMM verification failed. Public details are limited to the failed stage."
          exit 1
