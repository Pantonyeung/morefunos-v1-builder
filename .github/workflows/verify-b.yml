name: Owner V1 Verify B Line

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character MoreFunOS V1 B candidate SHA'
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: morefunos-v1-b-verify
  cancel-in-progress: false

jobs:
  verify-b:
    if: github.actor == 'Pantonyeung'
    uses: ./.github/workflows/verify-core.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      verification_profile: 'b'
    secrets: inherit

  verify-b-smm:
    if: github.actor == 'Pantonyeung'
    uses: ./.github/workflows/verify-smm-core.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
