name: T1 Keeta 0366 Canonical Mapping Repair

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-0366-canonical-mapping-repair.txt'
      - '.github/workflows/t1-keeta-0366-canonical-mapping-repair.yml'

permissions:
  contents: read

concurrency:
  group: t1-keeta-0366-canonical-mapping-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PROD_D1_DATABASE_ID: "1ed17fcb-7e7a-4e13-a922-ae141aff4142"
      STORE_ID: "d2d882b4-5c7b-40f9-ad59-91f8faabb8e8"
      PRODUCT_ID: "4a7fe38e-5cf7-5994-9fa1-00ec0efec7ae"
      MAPPING_ID: "335d9c23-7c40-52ba-a24e-cd78619110f4"
      PROVIDER_SPU_ID: "119024973"
      PROVIDER_SKU_ID: "115907604"
      PRODUCT_NAME: "SIT 測試餐 A 更新"
      PRICE_MINOR: "2100"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read and prove exact preconditions
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="SELECT catalog_revision,revision,snapshot_json FROM mfos_catalog_state WHERE store_id=? LIMIT 1"
          jq -n --arg sql "$SQL" --arg store "$STORE_ID" '{sql:$sql,params:[$store]}' > "$RUNNER_TEMP/catalog-q.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/catalog-q.json" > "$RUNNER_TEMP/catalog.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results|length)==1' "$RUNNER_TEMP/catalog.json" >/dev/null

          MAP_SQL="SELECT mapping_id,provider_menu_item_id,provider_sku_id,canonical_product_id,mapping_type,mapping_status FROM mfos_channel_menu_item WHERE store_id=? AND channel_context='KEETA' AND provider_sku_id=?"
          jq -n --arg sql "$MAP_SQL" --arg store "$STORE_ID" --arg sku "$PROVIDER_SKU_ID" '{sql:$sql,params:[$store,$sku]}' > "$RUNNER_TEMP/map-q.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/map-q.json" > "$RUNNER_TEMP/map.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results|length)==0' "$RUNNER_TEMP/map.json" >/dev/null

          node - "$RUNNER_TEMP/catalog.json" <<'NODE'
          const fs=require('fs');
          const row=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).result[0].results[0];
          const snap=JSON.parse(row.snapshot_json);
          const products=(snap.products||[]).filter(p=>p.productId===process.env.PRODUCT_ID);
          if(products.length!==0) throw new Error('KEETA_SIT_CANONICAL_PRODUCT_PRECONDITION_CONFLICT');
          if(!Array.isArray(snap.products)) throw new Error('CATALOG_PRODUCTS_ARRAY_REQUIRED');
          console.log('precondition_catalog_revision='+row.catalog_revision);
          console.log('precondition_row_revision='+row.revision);
          console.log('precondition_product_absent=PASS');
          console.log('precondition_mapping_absent=PASS');
          NODE

      - name: Build guarded repair batch
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/catalog.json" "$RUNNER_TEMP/batch.json" <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const row=raw.result[0].results[0];
          const snap=JSON.parse(row.snapshot_json);
          const at=new Date().toISOString();
          const newCatalogRevision=String(row.catalog_revision).includes('+keeta-sit-restored-001')
            ? String(row.catalog_revision)
            : String(row.catalog_revision)+'+keeta-sit-restored-001';
          const product={
            productId:process.env.PRODUCT_ID,
            name:process.env.PRODUCT_NAME,
            shortName:'SIT A',
            lifecycleStatus:'ACTIVE',
            revision:1,
            createdAt:at,
            updatedAt:at,
            categoryMemberships:[],
            optionGroups:[]
          };
          const next={...snap,catalogRevision:newCatalogRevision,products:[...(snap.products||[]),product]};
          const eventId='catalog-keeta-sit-restore:'+process.env.STORE_ID+':'+crypto.createHash('sha256').update(process.env.PROVIDER_SKU_ID).digest('hex').slice(0,12);
          const metadata=JSON.stringify({
            reason:'LIVE_0366_KEETA_STANDARD_PRODUCT_ALIAS_NOT_FOUND',
            productId:process.env.PRODUCT_ID,
            mappingId:process.env.MAPPING_ID,
            providerSpuId:process.env.PROVIDER_SPU_ID,
            providerSkuId:process.env.PROVIDER_SKU_ID,
            skuOpenItemCode:'MF-SIT-SKU-01',
            spuOpenItemCode:'MF-SIT-SPU-01'
          });
          const batch=[
            {
              sql:"UPDATE mfos_catalog_state SET catalog_revision=?,snapshot_json=?,revision=revision+1,updated_at=? WHERE store_id=? AND revision=?",
              params:[newCatalogRevision,JSON.stringify(next),at,process.env.STORE_ID,row.revision]
            },
            {
              sql:"INSERT INTO mfos_channel_menu_item (store_id,channel_context,provider_menu_item_id,provider_sku_id,mapping_id,mapping_type,mapping_status,canonical_product_id,provider_display_name,provider_categories_json,option_group_names_json,pickup_price_minor,delivery_price_minor,dine_in_fact_minor,menu_revision,updated_at) VALUES (?,'KEETA',?,?,?,'SINGLE_PRODUCT','ACTIVE',?,?,'[]','[]',?,?,NULL,?,?)",
              params:[process.env.STORE_ID,process.env.PROVIDER_SPU_ID,process.env.PROVIDER_SKU_ID,process.env.MAPPING_ID,process.env.PRODUCT_ID,process.env.PRODUCT_NAME,Number(process.env.PRICE_MINOR),Number(process.env.PRICE_MINOR),newCatalogRevision,at]
            },
            {
              sql:"INSERT INTO mfos_catalog_audit (audit_id,store_id,actor_id,authorization_context_ref,request_id,catalog_revision,event_type,recorded_at,metadata_json) VALUES (?,?,?,?,?,?,?,?,?)",
              params:[eventId,process.env.STORE_ID,'builder:team1-0366-repair','admin:keeta-sit-identity-restore',eventId,newCatalogRevision,'KEETA_SIT_CANONICAL_IDENTITY_RESTORED',at,metadata]
            },
            {
              sql:"INSERT INTO mfos_outbox (event_id,domain,aggregate_id,event_type,metadata_json,payload_json,status,recorded_at,store_id) VALUES (?,'CATALOG',?,'KEETA_SIT_CANONICAL_IDENTITY_RESTORED',?,?,'PENDING',?,?)",
              params:[eventId,process.env.STORE_ID,JSON.stringify({source:'KEETA_SIT_RESTORE',actorId:'builder:team1-0366-repair'}),metadata,at,process.env.STORE_ID]
            }
          ];
          fs.writeFileSync(process.argv[3],JSON.stringify({batch},null,2));
          console.log('repair_batch_build=PASS');
          console.log('repair_event_id='+eventId);
          NODE

      - name: Execute one guarded production D1 batch
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/batch.json" > "$RUNNER_TEMP/batch-out.json"
          jq -e '.success==true and ([.result[]|select(.success!=true)]|length)==0' "$RUNNER_TEMP/batch-out.json" >/dev/null
          jq -e '(.result[0].meta.changes|tonumber)==1 and (.result[1].meta.changes|tonumber)==1' "$RUNNER_TEMP/batch-out.json" >/dev/null
          echo "production_repair_batch=PASS"

      - name: Exact readback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="SELECT provider_menu_item_id,provider_sku_id,mapping_id,mapping_type,mapping_status,canonical_product_id,provider_display_name,pickup_price_minor,delivery_price_minor FROM mfos_channel_menu_item WHERE store_id=? AND channel_context='KEETA' AND provider_sku_id=? LIMIT 1"
          jq -n --arg sql "$SQL" --arg store "$STORE_ID" --arg sku "$PROVIDER_SKU_ID" '{sql:$sql,params:[$store,$sku]}' > "$RUNNER_TEMP/read-map-q.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/read-map-q.json" > "$RUNNER_TEMP/read-map.json"
          jq -e --arg spu "$PROVIDER_SPU_ID" --arg sku "$PROVIDER_SKU_ID" --arg mid "$MAPPING_ID" --arg pid "$PRODUCT_ID" --arg name "$PRODUCT_NAME" '
            .success==true
            and (.result[0].results|length)==1
            and .result[0].results[0].provider_menu_item_id==$spu
            and .result[0].results[0].provider_sku_id==$sku
            and .result[0].results[0].mapping_id==$mid
            and .result[0].results[0].canonical_product_id==$pid
            and .result[0].results[0].mapping_type=="SINGLE_PRODUCT"
            and .result[0].results[0].mapping_status=="ACTIVE"
            and .result[0].results[0].provider_display_name==$name
            and (.result[0].results[0].pickup_price_minor|tonumber)==2100
            and (.result[0].results[0].delivery_price_minor|tonumber)==2100
          ' "$RUNNER_TEMP/read-map.json" >/dev/null

          CAT_SQL="SELECT catalog_revision,revision,json_extract(j.value,'$.productId') AS product_id,json_extract(j.value,'$.name') AS name,json_extract(j.value,'$.lifecycleStatus') AS lifecycle_status,json_extract(j.value,'$.revision') AS product_revision,json_array_length(json_extract(j.value,'$.categoryMemberships')) AS category_count FROM mfos_catalog_state c, json_each(c.snapshot_json,'$.products') j WHERE c.store_id=? AND json_extract(j.value,'$.productId')=? LIMIT 1"
          jq -n --arg sql "$CAT_SQL" --arg store "$STORE_ID" --arg pid "$PRODUCT_ID" '{sql:$sql,params:[$store,$pid]}' > "$RUNNER_TEMP/read-product-q.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_DATABASE_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/read-product-q.json" > "$RUNNER_TEMP/read-product.json"
          jq -e --arg pid "$PRODUCT_ID" --arg name "$PRODUCT_NAME" '
            .success==true
            and (.result[0].results|length)==1
            and .result[0].results[0].product_id==$pid
            and .result[0].results[0].name==$name
            and .result[0].results[0].lifecycle_status=="ACTIVE"
            and (.result[0].results[0].product_revision|tonumber)==1
            and (.result[0].results[0].category_count|tonumber)==0
          ' "$RUNNER_TEMP/read-product.json" >/dev/null
          echo "canonical_product_readback=PASS"
          echo "keeta_mapping_readback=PASS"
          jq -c '.result[0].results[0]' "$RUNNER_TEMP/read-map.json"
          jq -c '.result[0].results[0]' "$RUNNER_TEMP/read-product.json"
