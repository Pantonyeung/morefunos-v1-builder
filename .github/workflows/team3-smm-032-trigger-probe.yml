name: Team3 SMM 032 Trigger Probe

on:
  push:
    paths:
      - 'requests/v2-smm-ui-integration-request.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Write observable probe evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CONTENT="builder_trigger=TEAM3_SMM_032
run_id=$RUN_ID
trigger_sha=$SHA
status=STARTED
"
          ENCODED="$(printf '%s' "$CONTENT" | base64 -w0)"
          PATH_NAME="evidence/team3-smm-032-trigger-probe.txt"
          CURRENT_SHA="$(gh api "/repos/${{ github.repository }}/contents/$PATH_NAME" --jq .sha 2>/dev/null || true)"
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "/repos/${{ github.repository }}/contents/$PATH_NAME"               -f message="evidence(team3): record SMM 032 Builder trigger"               -f content="$ENCODED"               -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "/repos/${{ github.repository }}/contents/$PATH_NAME"               -f message="evidence(team3): record SMM 032 Builder trigger"               -f content="$ENCODED"
          fi
