name: Team1 Owner Bootstrap Production Continuation

on:
  push:
    paths:
      - requests/team1-owner-bootstrap-production-continuation.txt

permissions:
  contents: read

jobs:
  continue:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      CANONICAL_STORE_ID: d2d882b4-5c7b-40f9-ad59-91f8faabb8e8
      CANONICAL_PRODUCT_ID: 29e9e173-087f-46f4-bae3-0c29f4d51417
      CANONICAL_STAFF_ID: 7d61cc4d-e3d1-45b7-9e6c-28e2b8d7f779
      EXISTING_ORDER_ID: 094b2412-df92-4897-b0c2-3d67bcf85ef6
      SUBMISSION_ID: recovery-live-customer-direct-20260903-v1
      IDEMPOTENCY_KEY: recovery-live-customer-direct-20260903-v1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Login session and protected bootstrap replay
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_LOGIN_SECRET"
          mkdir -p evidence
          T3_MODE="$(sed -n 's/^mode=//p' requests/team1-owner-bootstrap-production-continuation.txt | tr -d '[:space:]')"
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          LOGIN_HTTP="$(curl -sS -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$ADMIN_URL/api/admin/session")"
          test "$LOGIN_HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/login.headers | tr -d '\r' | head -n1)"
          test -n "$COOKIE"
          node -e "const x=require('/tmp/login.json');if(!x.authenticated||x.staffId!==process.env.CANONICAL_STAFF_ID||x.scopeRef!==process.env.CANONICAL_STORE_ID||!x.bootstrapAuthorized)process.exit(1)"
          SESSION_HTTP="$(curl -sS -o /tmp/session.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/session")"
          test "$SESSION_HTTP" = 200
          if [ "$T3_MODE" = "T3_SMM_LIVE" ]; then
            TOKEN="$(printf '%s' "$COOKIE" | sed 's/^mf_admin_session=//')"
            test -n "$TOKEN"
            printf '%s' "$TOKEN" > /tmp/t3-smm-bearer-token
            printf 'login_http=%s\nsession_http=%s\nmode=T3_SMM_LIVE\n' "$LOGIN_HTTP" "$SESSION_HTTP" > evidence/admin-live.txt
            exit 0
          fi

          node - <<'NODE'
          const fs=require('fs');
          const now=new Date().toISOString();
          const category={categoryId:'600829b2-ae0a-4b3e-8d0f-baf7b8f418d2',name:'甜品及炸物',lifecycleStatus:'ACTIVE',position:0,revision:1,createdAt:now,updatedAt:now};
          const product={productId:process.env.CANONICAL_PRODUCT_ID,name:'古早鹽酥雞',lifecycleStatus:'ACTIVE',revision:1,createdAt:now,updatedAt:now,categoryMemberships:[{categoryId:category.categoryId,position:0}],optionGroups:[]};
          const body={
            idempotencyKey:'mf01-direct-bootstrap-xlsx-32f79e4463d1-v1',
            catalogIdempotencyKey:'mf01-catalog-bootstrap-xlsx-32f79e4463d1-v1',
            catalogSnapshot:{storeId:process.env.CANONICAL_STORE_ID,catalogRevision:'mf01-temp-xlsx-32f79e4463d1-v1',categories:[category],products:[product]},
            selectedProductId:process.env.CANONICAL_PRODUCT_ID,
            storeOperational:{status:'OPEN',reasonCode:'TEMPORARY_MENU_BOOTSTRAP'},
            availability:[{availabilityId:'cb046a6d-31cb-4f28-9dc5-45786e0290df',targetType:'PRODUCT',targetId:process.env.CANONICAL_PRODUCT_ID,status:'AVAILABLE',reasonCode:'TEMPORARY_MENU_BOOTSTRAP'}],
            pricing:[{pricingProfileId:'315bf882-1fee-4c38-a9e5-7fd4336755cf',subjectType:'PRODUCT',subjectId:process.env.CANONICAL_PRODUCT_ID,currency:'HKD',fixedPriceMinor:2500}],
            businessDay:{businessDayId:'0d2cda16-38f6-4fca-aff1-06d99fd26353',businessDate:'2026-09-03',timezone:'Asia/Hong_Kong',boundaryLocalTime:'05:00',policyRevision:1}
          };
          fs.writeFileSync('/tmp/bootstrap.json',JSON.stringify(body));
          NODE
          BOOT_HTTP="$(curl -sS -o /tmp/bootstrap.out.json -w '%{http_code}' -H 'content-type: application/json' -H "Cookie: $COOKIE" --data-binary @/tmp/bootstrap.json "$ADMIN_URL/api/admin/direct-authority/bootstrap")"
          test "$BOOT_HTTP" = 200
          node -e "const x=require('/tmp/bootstrap.out.json');if(!x.ok||x.storeId!==process.env.CANONICAL_STORE_ID||x.selectedProductId!==process.env.CANONICAL_PRODUCT_ID)process.exit(1)"
          printf 'login_http=%s\nsession_http=%s\nprotected_bootstrap_replay_http=%s\n' "$LOGIN_HTTP" "$SESSION_HTTP" "$BOOT_HTTP" | tee evidence/admin-live.txt

      - name: Canonical business readback
        if: ${{ !contains(github.event.head_commit.message, 'T3-MICRO-003') }}
        shell: bash
        run: |
          set -euo pipefail
          ORDERING_HTTP="$(curl -sS -o /tmp/ordering.json -w '%{http_code}' "$ADMIN_URL/api/customer/ordering")"
          test "$ORDERING_HTTP" = 200
          node -e "const x=require('/tmp/ordering.json');const p=x.products?.find(v=>v.productId===process.env.CANONICAL_PRODUCT_ID);if(x.storeStatus!=='open'||!p||p.name!=='古早鹽酥雞'||p.currency!=='HKD'||Number(p.priceMinor)!==2500||p.available!==true)process.exit(1)"
          printf 'customer_ordering_http=%s\n' "$ORDERING_HTTP" | tee evidence/business-readback.txt
          cp /tmp/ordering.json evidence/ordering.json

      - name: Replay existing Customer Order and prove exactly one
        if: ${{ !contains(github.event.head_commit.message, 'T3-MICRO-003') }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4
          GUEST_TOKEN="$(node -e "const {createHash}=require('node:crypto');process.stdout.write(createHash('sha256').update('morefun-team1-production-live-gate-20260903').digest('base64url'))")"
          node -e "require('fs').writeFileSync('/tmp/order.json',JSON.stringify({submissionId:process.env.SUBMISSION_ID,idempotencyKey:process.env.IDEMPOTENCY_KEY,payload:{lines:[{productId:process.env.CANONICAL_PRODUCT_ID,quantity:1}]}}))"
          REPLAY_HTTP="$(curl -sS -o /tmp/replay.json -w '%{http_code}' -H 'content-type: application/json' -H "Cookie: mf_customer_guest=$GUEST_TOKEN" --data-binary @/tmp/order.json "$ADMIN_URL/api/customer/orders")"
          test "$REPLAY_HTTP" = 200
          node -e "const x=require('/tmp/replay.json');if(!x.ok||x.orderId!==process.env.EXISTING_ORDER_ID||x.submissionId!==process.env.SUBMISSION_ID)process.exit(1)"
          STATUS_HTTP="$(curl -sS -o /tmp/status.json -w '%{http_code}' -H "Cookie: mf_customer_guest=$GUEST_TOKEN" -H "Authorization: Bearer $GUEST_TOKEN" "$ADMIN_URL/api/customer/order-status?submissionId=$SUBMISSION_ID")"
          test "$STATUS_HTTP" = 200
          node -e "const x=require('/tmp/status.json');if(!x.ok||x.orderId!==process.env.EXISTING_ORDER_ID||x.lifecycleStatus!=='ACCEPTED')process.exit(1)"
          npx wrangler d1 execute morefun-v2-production --remote --command "SELECT order_id,submission_id FROM mfos_customer_order_ownership WHERE submission_id='$SUBMISSION_ID';" --json > evidence/d1-order.json
          node -e "const x=require('./evidence/d1-order.json');const r=x?.[0]?.results??[];if(r.length!==1||r[0].order_id!==process.env.EXISTING_ORDER_ID)process.exit(1)"
          printf 'replay_http=%s\nlifecycle_http=%s\norder_id=%s\ncanonical_count=1\n' "$REPLAY_HTTP" "$STATUS_HTTP" "$EXISTING_ORDER_ID" | tee evidence/customer-replay.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team1-owner-bootstrap-production-continuation-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
