name: Deploy V2 Owner Worker

on:
  push:
    paths:
      - 'requests/v2-owner-worker-deploy-request.txt'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-owner-worker-deploy-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Require source equals current V2 main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api repos/Pantonyeung/Morefun-v2/commits/main --jq .sha)"
          test "$SOURCE_SHA" = "$MAIN_SHA" || { echo "::error::STALE_V2_SOURCE_REFUSED source=$SOURCE_SHA main=$MAIN_SHA"; exit 1; }
          echo "v2-main-pin=PASS sha=$MAIN_SHA"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build exact Owner source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund
          cd apps/owner-web
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html
      - name: Deploy Owner Worker and assets
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          CONFIG='infra/cloudflare/owner-web-worker/wrangler.jsonc'
          test -s "$CONFIG"
          npx --yes wrangler@4 deploy --config "$CONFIG" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | sed 's/[),.;]*$//' || true)"
          test -n "$URL"
          printf '%s\n' "$URL" > "$GITHUB_WORKSPACE/evidence/url.txt"
      - name: Verify live Owner fail-closed shell
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat evidence/url.txt)"
          test "$(curl -sS -o /tmp/index.html -w '%{http_code}' "$URL/")" = 200
          test "$(curl -sS -o /tmp/manifest.json -w '%{http_code}' "$URL/manifest.webmanifest")" = 200
          SESSION_CODE="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$URL/api/owner/session")"
          test "$SESSION_CODE" = 401
          printf 'index=200\nmanifest=200\nanonymous_session=%s\n' "$SESSION_CODE" > evidence/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-owner-worker-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30


      - name: Seal Owner deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONCLUSION: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="$(sed -n 's/^request_id=//p' requests/v2-owner-worker-deploy-request.txt | tr -d '\r\n')"
          URL="$(cat evidence/url.txt 2>/dev/null || true)"
          VERSION="$(sed -n 's/.*Current Version ID: *//p' evidence/deploy.log 2>/dev/null | tail -n1 | tr -d '\r\n' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .ci-results
            {
              echo "source_sha=${SOURCE_SHA:-UNKNOWN}"
              echo "request_id=${REQUEST_ID:-UNKNOWN}"
              echo "run_id=$RUN_ID"
              echo "run_attempt=$RUN_ATTEMPT"
              echo "conclusion=$CONCLUSION"
              echo "url=${URL:-UNKNOWN}"
              echo "worker_version=${VERSION:-UNKNOWN}"
            } > .ci-results/v2-owner-worker-deploy.txt
            git add .ci-results/v2-owner-worker-deploy.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "deploy(result): V2 Owner $CONCLUSION ${SOURCE_SHA:-UNKNOWN}"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "OWNER_DEPLOY_RESULT_SEAL_PUSH_FAILED" >&2
          exit 1
