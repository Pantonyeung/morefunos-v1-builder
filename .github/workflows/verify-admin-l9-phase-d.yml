name: Verify Admin L9 Phase D

on:
  push:
    paths:
      - '.github/workflows/verify-admin-l9-phase-d.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  SOURCE_SHA: aaffcd57a62f26ce3ec1e595bd48318cb29adeb2

jobs:
  verify-admin-l9-phase-d:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify production composition contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            packages/durability/google-service-account-token-provider.test.ts \
            packages/runtime/json-admin-staff-token-verifier.test.ts \
            packages/admin/admin-policy-validator.test.ts \
            infra/cloudflare/admin-policy-worker/entry.test.ts \
            2>&1 | tee "$RUNNER_TEMP/admin-l9-phase-d.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-l9-phase-d-evidence-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/admin-l9-phase-d.log
          if-no-files-found: error
          retention-days: 30

      - name: Report Phase D success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=admin-l9-phase-d \
            -f description='Exact-SHA production composition contracts passed' >/dev/null

      - name: Report Phase D failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=admin-l9-phase-d \
            -f description='Exact-SHA production composition contract failed' >/dev/null
