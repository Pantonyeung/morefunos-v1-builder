name: V2 Q-LIVE-02A Pages Preview Live

on:
  workflow_dispatch:
    inputs:
      core_source_sha:
        description: 'Exact MoreFunOS Core/Pages Function SHA'
        required: true
        type: string
      customer_source_sha:
        description: 'Exact MoreFunOS Customer static source SHA'
        required: true
        type: string
      preview_branch:
        description: 'Cloudflare Pages preview branch alias'
        required: false
        default: 'q-live-02-customer'
        type: string

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate exact inputs
        id: req
        shell: bash
        env:
          CORE_SHA: ${{ inputs.core_source_sha }}
          CUSTOMER_SHA: ${{ inputs.customer_source_sha }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: |
          set -euo pipefail
          CORE="$(printf '%s' "$CORE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          CUSTOMER="$(printf '%s' "$CUSTOMER_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          BRANCH="$(printf '%s' "$PREVIEW_BRANCH" | tr -d '[:space:]')"
          [[ "$CORE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CUSTOMER" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRANCH" =~ ^[a-zA-Z0-9._/-]+$ ]]
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret is required'; exit 41; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID secret is required'; exit 42; }
          echo "core_sha=$CORE" >> "$GITHUB_OUTPUT"
          echo "customer_sha=$CUSTOMER" >> "$GITHUB_OUTPUT"
          echo "preview_branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact Core/Pages source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.req.outputs.core_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Checkout exact Customer source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.req.outputs.customer_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: customer
          persist-credentials: false

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "${{ steps.req.outputs.core_sha }}"
          test "$(git -C customer rev-parse HEAD)" = "${{ steps.req.outputs.customer_sha }}"

      - name: Install Core Pages dependencies
        id: core_install
        continue-on-error: true
        working-directory: core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Pages Function boundary tests
        id: pages_test
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            functions/api/customer/ordering.test.ts \
            packages/integration-v2/customer-production-edge.test.ts \
            packages/integration-v2/customer-public-read-adapter.test.ts \
            packages/runtime-v2/operational-state-reader.test.ts \
            2>&1 | tee "$RUNNER_TEMP/q-live-02a-pages-test.log"

      - name: Run Customer browser regression
        id: customer_test
        continue-on-error: true
        working-directory: customer
        shell: bash
        run: |
          set -o pipefail
          node --test \
            apps/customer-web/customer-runtime-bridge.test.mjs \
            apps/customer-web/customer-closure-static.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/q-live-02a-customer.log"
          grep -q '/api/customer/ordering' apps/customer-web/customer-runtime-bridge.js

      - name: Compose Customer static preview assets
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/customer
          for file in \
            index.html \
            customer-shell.css \
            customer-shell.js \
            customer-closure.css \
            customer-closure.js \
            customer-closure-v2.js \
            customer-closure-v3.css \
            customer-closure-v3.js \
            customer-runtime-bridge.js; do
            test -f "customer/apps/customer-web/$file"
            cp "customer/apps/customer-web/$file" "deploy/customer/$file"
          done
          cat > deploy/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoreFunOS Q-LIVE-02A</title></head><body><main><h1>MoreFunOS Q-LIVE-02A</h1><p>Cloudflare Pages preview live acceptance.</p><a href="/customer/">Customer</a></main></body></html>
          HTML
          test -f deploy/customer/index.html

      - name: Build Pages Functions bundle
        id: functions_build
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages functions build --outdir=../deploy \
            2>&1 | tee "$RUNNER_TEMP/q-live-02a-functions-build.log"
          test -f ../deploy/_worker.js

      - name: Run V2 Core regression
        id: core_regression
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npm run test:v2-core 2>&1 | tee "$RUNNER_TEMP/q-live-02a-v2-core.log"

      - name: Run strict typecheck
        id: typecheck
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:v2-core 2>&1 | tee "$RUNNER_TEMP/q-live-02a-typecheck.log"

      - name: Deploy exact bundle to Cloudflare Pages preview
        id: deploy
        continue-on-error: true
        working-directory: core
        shell: bash
        env:
          BRANCH: ${{ steps.req.outputs.preview_branch }}
          CORE_SHA: ${{ steps.req.outputs.core_sha }}
        run: |
          set -o pipefail
          npx wrangler pages deploy ../deploy \
            --project-name=morefunos-v1 \
            --branch="$BRANCH" \
            --commit-hash="$CORE_SHA" \
            2>&1 | tee "$RUNNER_TEMP/q-live-02a-deploy.log"
          URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/q-live-02a-deploy.log" | tail -n 1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify live Customer static endpoint
        id: live_customer
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 2 \
            "$URL/customer/" \
            -o "$RUNNER_TEMP/customer-live.html"
          grep -q '/api/customer/ordering' customer/apps/customer-web/customer-runtime-bridge.js

      - name: Verify live Customer API endpoint
        id: live_api
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -o pipefail
          HTTP_CODE="$(curl --silent --show-error --location \
            --retry 4 --retry-delay 2 \
            --output "$RUNNER_TEMP/customer-api.json" \
            --write-out '%{http_code}' \
            "$URL/api/customer/ordering")"
          cat "$RUNNER_TEMP/customer-api.json"
          test "$HTTP_CODE" = 200
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/customer-api.json','utf8')); if(!x.catalogVersion || !x.presentationRevision || typeof x.operationalRevision!=='number' || !Array.isArray(x.products)) process.exit(1)"

      - name: Record evidence
        if: always()
        shell: bash
        env:
          CORE_SHA: ${{ steps.req.outputs.core_sha }}
          CUSTOMER_SHA: ${{ steps.req.outputs.customer_sha }}
          PREVIEW_BRANCH: ${{ steps.req.outputs.preview_branch }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          CORE_INSTALL: ${{ steps.core_install.outcome }}
          PAGES_TEST: ${{ steps.pages_test.outcome }}
          CUSTOMER_TEST: ${{ steps.customer_test.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          FUNCTIONS_BUILD: ${{ steps.functions_build.outcome }}
          CORE_REGRESSION: ${{ steps.core_regression.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE_CUSTOMER: ${{ steps.live_customer.outcome }}
          LIVE_API: ${{ steps.live_api.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            printf 'core_source_sha=%s\ncustomer_source_sha=%s\n' "$CORE_SHA" "$CUSTOMER_SHA"
            printf 'preview_branch=%s\npreview_url=%s\n' "$PREVIEW_BRANCH" "$PREVIEW_URL"
            printf 'builder_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'core_install=%s\npages_test=%s\ncustomer_test=%s\ncompose=%s\nfunctions_build=%s\ncore_regression=%s\ntypecheck=%s\ndeploy=%s\nlive_customer=%s\nlive_api=%s\n' \
              "$CORE_INSTALL" "$PAGES_TEST" "$CUSTOMER_TEST" "$COMPOSE" "$FUNCTIONS_BUILD" "$CORE_REGRESSION" "$TYPECHECK" "$DEPLOY" "$LIVE_CUSTOMER" "$LIVE_API"
          } > evidence/q-live-02a-summary.txt
          for item in pages-test customer functions-build v2-core typecheck deploy; do
            test -f "$RUNNER_TEMP/q-live-02a-$item.log" && cp "$RUNNER_TEMP/q-live-02a-$item.log" "evidence/$item.log" || true
          done
          test -f "$RUNNER_TEMP/customer-live.html" && cp "$RUNNER_TEMP/customer-live.html" evidence/customer-live.html || true
          test -f "$RUNNER_TEMP/customer-api.json" && cp "$RUNNER_TEMP/customer-api.json" evidence/customer-api.json || true
          cat evidence/q-live-02a-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-q-live-02a-${{ steps.req.outputs.core_sha }}-${{ steps.req.outputs.customer_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Q-LIVE-02A result
        if: always()
        shell: bash
        env:
          CORE_INSTALL: ${{ steps.core_install.outcome }}
          PAGES_TEST: ${{ steps.pages_test.outcome }}
          CUSTOMER_TEST: ${{ steps.customer_test.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          FUNCTIONS_BUILD: ${{ steps.functions_build.outcome }}
          CORE_REGRESSION: ${{ steps.core_regression.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE_CUSTOMER: ${{ steps.live_customer.outcome }}
          LIVE_API: ${{ steps.live_api.outcome }}
        run: |
          [[ "$CORE_INSTALL" == success ]]
          [[ "$PAGES_TEST" == success ]]
          [[ "$CUSTOMER_TEST" == success ]]
          [[ "$COMPOSE" == success ]]
          [[ "$FUNCTIONS_BUILD" == success ]]
          [[ "$CORE_REGRESSION" == success ]]
          [[ "$TYPECHECK" == success ]]
          [[ "$DEPLOY" == success ]]
          [[ "$LIVE_CUSTOMER" == success ]]
          [[ "$LIVE_API" == success ]]
