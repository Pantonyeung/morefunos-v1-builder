name: Admin V2 Operational Transport Agent Verification

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/admin-v2-operational-transport.sha'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Builder request
        uses: actions/checkout@v7
        with:
          path: builder
          persist-credentials: true

      - name: Read and validate exact source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < builder/.ci-requests/admin-v2-operational-transport.sha | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm CLI for Admin verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.19.0"

      - name: Checkout exact MoreFunOS source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git -C source rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          printf 'source_sha=%s\n' "$ACTUAL" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Admin V2 operational transport and production-edge tests
        id: transport_test
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            packages/integration-v2/admin-transport-adapter.test.ts \
            packages/integration-v2/admin-production-edge.test.ts \
            2>&1 | tee "$RUNNER_TEMP/admin-v2-operational-transport-test.log"

      - name: Run daily availability reset runtime test
        id: daily_reset_test
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            packages/runtime-v2/daily-availability-reset-service.test.ts \
            2>&1 | tee "$RUNNER_TEMP/daily-availability-reset-test.log"

      - name: Install Admin Web dependencies
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/admin-install.log"

      - name: Run Admin Web V2 port and Availability UI tests
        id: admin_port_test
        continue-on-error: true
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -o pipefail
          npm test -- admin-v2-port.vitest.test.ts availability.vitest.test.tsx 2>&1 | tee "$RUNNER_TEMP/admin-v2-port-test.log"

      - name: Run V2 strict typecheck
        id: typecheck
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:v2-core 2>&1 | tee "$RUNNER_TEMP/admin-v2-operational-transport-typecheck.log"

      - name: Record exact-SHA evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          TRANSPORT_TEST: ${{ steps.transport_test.outcome }}
          DAILY_RESET_TEST: ${{ steps.daily_reset_test.outcome }}
          ADMIN_PORT_TEST: ${{ steps.admin_port_test.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source_sha=%s\n' "$SOURCE_SHA" > evidence/admin-v2-operational-transport-summary.txt
          printf 'builder_repository=%s\nbuilder_sha=%s\nrun_id=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" >> evidence/admin-v2-operational-transport-summary.txt
          printf 'transport_test=%s\ndaily_reset_test=%s\nadmin_port_test=%s\ntypecheck=%s\n' "$TRANSPORT_TEST" "$DAILY_RESET_TEST" "$ADMIN_PORT_TEST" "$TYPECHECK" >> evidence/admin-v2-operational-transport-summary.txt
          test -f "$RUNNER_TEMP/admin-install.log" && cp "$RUNNER_TEMP/admin-install.log" evidence/admin-install.log || true
          test -f "$RUNNER_TEMP/admin-v2-operational-transport-test.log" && cp "$RUNNER_TEMP/admin-v2-operational-transport-test.log" evidence/transport-test.log || true
          test -f "$RUNNER_TEMP/daily-availability-reset-test.log" && cp "$RUNNER_TEMP/daily-availability-reset-test.log" evidence/daily-reset-test.log || true
          test -f "$RUNNER_TEMP/admin-v2-port-test.log" && cp "$RUNNER_TEMP/admin-v2-port-test.log" evidence/admin-port-test.log || true
          test -f "$RUNNER_TEMP/admin-v2-operational-transport-typecheck.log" && cp "$RUNNER_TEMP/admin-v2-operational-transport-typecheck.log" evidence/typecheck.log || true
          cat evidence/admin-v2-operational-transport-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v2-operational-transport-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Persist bounded result marker
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          TRANSPORT_TEST: ${{ steps.transport_test.outcome }}
          DAILY_RESET_TEST: ${{ steps.daily_reset_test.outcome }}
          ADMIN_PORT_TEST: ${{ steps.admin_port_test.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          set -euo pipefail
          if [[ "$TRANSPORT_TEST" == success && "$DAILY_RESET_TEST" == success && "$ADMIN_PORT_TEST" == success && "$TYPECHECK" == success ]]; then
            CONCLUSION=success
          else
            CONCLUSION=failure
          fi
          mkdir -p builder/.ci-results
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'builder_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'transport_test=%s\n' "$TRANSPORT_TEST"
            printf 'daily_reset_test=%s\n' "$DAILY_RESET_TEST"
            printf 'admin_port_test=%s\n' "$ADMIN_PORT_TEST"
            printf 'typecheck=%s\n' "$TYPECHECK"
            printf 'conclusion=%s\n' "$CONCLUSION"
          } > builder/.ci-results/admin-v2-operational-transport.txt
          git -C builder config user.name 'morefunos-builder-bot'
          git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git -C builder add .ci-results/admin-v2-operational-transport.txt
          if git -C builder diff --cached --quiet; then
            exit 0
          fi
          git -C builder commit -m "ci(result): Admin V2 operational transport $SOURCE_SHA"
          git -C builder push origin HEAD:main

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          TRANSPORT_TEST: ${{ steps.transport_test.outcome }}
          DAILY_RESET_TEST: ${{ steps.daily_reset_test.outcome }}
          ADMIN_PORT_TEST: ${{ steps.admin_port_test.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          [[ "$TRANSPORT_TEST" == success ]]
          [[ "$DAILY_RESET_TEST" == success ]]
          [[ "$ADMIN_PORT_TEST" == success ]]
          [[ "$TYPECHECK" == success ]]
