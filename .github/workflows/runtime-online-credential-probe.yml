name: Owner Runtime Online Credential Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: owner-runtime-online-credential-probe
  cancel-in-progress: false

env:
  SOURCE_REPO: Pantonyeung/morefunos-v1
  WRANGLER_VERSION: '4.118.0'

jobs:
  github_probe:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/probe-runtime-online ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMENT_BODY: ${{ github.event.comment.body || '' }}

    steps:
      - name: Validate GitHub probe request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          read -r VERB RELEASE_TAG EXTRA <<< "$COMMAND"
          if [[ "$VERB" != "/probe-runtime-online" || -z "${RELEASE_TAG:-}" || -n "${EXTRA:-}" ]]; then
            echo "Probe command must contain exactly: /probe-runtime-online <release-tag>." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^builder-v1-runtime-(stable|candidate|dev)-[0-9a-f]{12}-run-[0-9]+$ ]]; then
            echo "Probe release tag shape is invalid." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Probe GitHub private Release credential without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "GITHUB_ARTIFACT_TOKEN=MISSING" >&2; exit 20; }
          API="https://api.github.com/repos/${SOURCE_REPO}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          probe() {
            local name="$1" url="$2" expected="$3"
            local status
            status="$(curl -sS -o "$RUNNER_TEMP/${name}.json" -w '%{http_code}' "${headers[@]}" "$url")"
            if [[ "$status" != "$expected" ]]; then
              echo "${name}=FAIL_HTTP_${status}" >&2
              exit 21
            fi
            echo "${name}=PASS"
          }
          probe GITHUB_REPO_METADATA "$API" 200
          probe GITHUB_TAG_REF "$API/git/ref/tags/${RELEASE_TAG}" 200
          probe GITHUB_RELEASE_BY_TAG "$API/releases/tags/${RELEASE_TAG}" 200
          echo "GITHUB_RUNTIME_RELEASE_ACCESS=PASS"

  cloudflare_probe:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/probe-runtime-online ')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COMMENT_BODY: ${{ github.event.comment.body || '' }}

    steps:
      - name: Validate Cloudflare probe request
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          read -r VERB RELEASE_TAG EXTRA <<< "$COMMAND"
          if [[ "$VERB" != "/probe-runtime-online" || -z "${RELEASE_TAG:-}" || -n "${EXTRA:-}" ]]; then
            echo "Probe command must contain exactly: /probe-runtime-online <release-tag>." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^builder-v1-runtime-(stable|candidate|dev)-[0-9a-f]{12}-run-[0-9]+$ ]]; then
            echo "Probe release tag shape is invalid." >&2
            exit 1
          fi

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent "wrangler@${WRANGLER_VERSION}"
          wrangler --version | grep -F "$WRANGLER_VERSION" >/dev/null
          echo "WRANGLER_PIN=PASS"

      - name: Probe Cloudflare identity without mutation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN=MISSING" >&2; exit 30; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID=MISSING" >&2; exit 31; }
          wrangler whoami > "$RUNNER_TEMP/wrangler-whoami.txt" 2>&1 || { echo "CLOUDFLARE_WHOAMI=FAIL" >&2; exit 32; }
          wrangler r2 bucket list > "$RUNNER_TEMP/wrangler-r2-buckets.txt" 2>&1 || { echo "CLOUDFLARE_R2_READ=FAIL" >&2; exit 33; }
          if ! grep -F 'morefunos-v1-ota' "$RUNNER_TEMP/wrangler-r2-buckets.txt" >/dev/null; then
            echo "CLOUDFLARE_R2_BUCKET=NOT_VISIBLE" >&2
            exit 34
          fi
          echo "CLOUDFLARE_IDENTITY=PASS"
          echo "CLOUDFLARE_R2_READ=PASS"
          echo "CLOUDFLARE_R2_BUCKET=PASS"
