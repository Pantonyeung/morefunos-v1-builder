name: Owner Runtime Online Credential Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: owner-runtime-online-credential-probe
  cancel-in-progress: false

env:
  SOURCE_REPO: Pantonyeung/morefunos-v1
  WRANGLER_VERSION: '4.118.0'

jobs:
  github_probe:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/probe-runtime-online ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMENT_BODY: ${{ github.event.comment.body || '' }}

    steps:
      - name: Validate GitHub probe request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          read -r VERB RELEASE_TAG EXTRA <<< "$COMMAND"
          if [[ "$VERB" != "/probe-runtime-online" || -z "${RELEASE_TAG:-}" || -n "${EXTRA:-}" ]]; then
            echo "Probe command must contain exactly: /probe-runtime-online <release-tag>." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^builder-v1-runtime-(stable|candidate|dev)-[0-9a-f]{12}-run-[0-9]+$ ]]; then
            echo "Probe release tag shape is invalid." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Probe GitHub private Release credential without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "GITHUB_ARTIFACT_TOKEN=MISSING" >&2; exit 20; }
          API="https://api.github.com/repos/${SOURCE_REPO}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          safe_header() {
            local file="$1" key="$2"
            awk -v k="$key" 'BEGIN{IGNORECASE=1} index($0,k ":")==1 {sub(/^[^:]+:[[:space:]]*/,""); gsub("\r",""); print; exit}' "$file"
          }

          probe() {
            local name="$1" url="$2" expected="$3"
            local body="$RUNNER_TEMP/${name}.json"
            local response_headers="$RUNNER_TEMP/${name}.headers"
            local status accepted remaining reset resource used retry request_id message
            status="$(curl -sS -D "$response_headers" -o "$body" -w '%{http_code}' "${headers[@]}" "$url")"
            accepted="$(safe_header "$response_headers" 'x-accepted-github-permissions')"
            remaining="$(safe_header "$response_headers" 'x-ratelimit-remaining')"
            reset="$(safe_header "$response_headers" 'x-ratelimit-reset')"
            resource="$(safe_header "$response_headers" 'x-ratelimit-resource')"
            used="$(safe_header "$response_headers" 'x-ratelimit-used')"
            retry="$(safe_header "$response_headers" 'retry-after')"
            request_id="$(safe_header "$response_headers" 'x-github-request-id')"
            message="$(node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(typeof x.message==="string"?x.message:"NO_JSON_MESSAGE")}catch{process.stdout.write("NON_JSON_RESPONSE")}' "$body")"

            echo "${name}_HTTP=${status}"
            echo "${name}_ACCEPTED_PERMISSIONS=${accepted:-UNSPECIFIED}"
            echo "${name}_RATELIMIT_REMAINING=${remaining:-UNSPECIFIED}"
            echo "${name}_RATELIMIT_RESET=${reset:-UNSPECIFIED}"
            echo "${name}_RATELIMIT_RESOURCE=${resource:-UNSPECIFIED}"
            echo "${name}_RATELIMIT_USED=${used:-UNSPECIFIED}"
            echo "${name}_RETRY_AFTER=${retry:-UNSPECIFIED}"
            echo "${name}_REQUEST_ID=${request_id:-UNSPECIFIED}"
            echo "${name}_MESSAGE=${message}"

            if [[ "$status" != "$expected" ]]; then
              if [[ "$remaining" == "0" || -n "$retry" ]]; then
                echo "${name}_CLASSIFICATION=RATE_LIMIT_OR_SECONDARY_LIMIT" >&2
              elif [[ "$status" == "403" && "$message" == Resource\ not\ accessible* ]]; then
                echo "${name}_CLASSIFICATION=TOKEN_PERMISSION_OR_RESOURCE_ACCESS" >&2
              elif [[ "$status" =~ ^5 ]]; then
                echo "${name}_CLASSIFICATION=GITHUB_SERVER_ERROR" >&2
              else
                echo "${name}_CLASSIFICATION=UNCLASSIFIED_HTTP_FAILURE" >&2
              fi
              exit 21
            fi
            echo "${name}=PASS"
          }

          probe GITHUB_REPO_METADATA "$API" 200
          probe GITHUB_TAG_REF "$API/git/ref/tags/${RELEASE_TAG}" 200
          probe GITHUB_RELEASE_BY_TAG "$API/releases/tags/${RELEASE_TAG}" 200
          echo "GITHUB_RUNTIME_RELEASE_ACCESS=PASS"

  cloudflare_probe:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/probe-runtime-online ')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COMMENT_BODY: ${{ github.event.comment.body || '' }}

    steps:
      - name: Validate Cloudflare probe request
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          read -r VERB RELEASE_TAG EXTRA <<< "$COMMAND"
          if [[ "$VERB" != "/probe-runtime-online" || -z "${RELEASE_TAG:-}" || -n "${EXTRA:-}" ]]; then
            echo "Probe command must contain exactly: /probe-runtime-online <release-tag>." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^builder-v1-runtime-(stable|candidate|dev)-[0-9a-f]{12}-run-[0-9]+$ ]]; then
            echo "Probe release tag shape is invalid." >&2
            exit 1
          fi

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent "wrangler@${WRANGLER_VERSION}"
          wrangler --version | grep -F "$WRANGLER_VERSION" >/dev/null
          echo "WRANGLER_PIN=PASS"

      - name: Probe Cloudflare identity without mutation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN=MISSING" >&2; exit 30; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID=MISSING" >&2; exit 31; }
          wrangler whoami > "$RUNNER_TEMP/wrangler-whoami.txt" 2>&1 || { echo "CLOUDFLARE_WHOAMI=FAIL" >&2; exit 32; }
          wrangler r2 bucket list > "$RUNNER_TEMP/wrangler-r2-buckets.txt" 2>&1 || { echo "CLOUDFLARE_R2_READ=FAIL" >&2; exit 33; }
          if ! grep -F 'morefunos-v1-ota' "$RUNNER_TEMP/wrangler-r2-buckets.txt" >/dev/null; then
            echo "CLOUDFLARE_R2_BUCKET=NOT_VISIBLE" >&2
            exit 34
          fi
          echo "CLOUDFLARE_IDENTITY=PASS"
          echo "CLOUDFLARE_R2_READ=PASS"
          echo "CLOUDFLARE_R2_BUCKET=PASS"
