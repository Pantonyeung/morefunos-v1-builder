name: Team A Keeta Cross Port Live Read

on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-keeta-cross-port-live-read.txt'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
      SMM_ORIGIN: https://morefun-v2-smm.pantonyeung.workers.dev
      ADMIN_ORIGIN: https://morefun-v2-admin.pantonyeung.workers.dev

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          ORDER_ID="$(sed -n 's/^order_id=//p' requests/team-a-keeta-cross-port-live-read.txt | tr -d '[:space:]')"
          SHORT_CODE="$(sed -n 's/^short_code=//p' requests/team-a-keeta-cross-port-live-read.txt | tr -d '[:space:]')"
          PROVIDER_ORDER_ID="$(sed -n 's/^provider_order_id=//p' requests/team-a-keeta-cross-port-live-read.txt | tr -d '[:space:]')"
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team-a-keeta-cross-port-live-read.txt | tr -d '[:space:]')"
          [[ "$ORDER_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$SHORT_CODE" =~ ^[0-9]{4}$ ]]
          [[ "$PROVIDER_ORDER_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$ADMIN_LOGIN_SECRET"
          echo "order_id=$ORDER_ID" >> "$GITHUB_OUTPUT"
          echo "short_code=$SHORT_CODE" >> "$GITHUB_OUTPUT"
          echo "provider_order_id=$PROVIDER_ORDER_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p evidence

      - name: Read exact canonical Order from production D1
        shell: bash
        env:
          ORDER_ID: ${{ steps.req.outputs.order_id }}
          SHORT_CODE: ${{ steps.req.outputs.short_code }}
          PROVIDER_ORDER_ID: ${{ steps.req.outputs.provider_order_id }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          SQL="SELECT order_id,store_id,lifecycle_status,revision,accepted_projection_json FROM mfos_order_state WHERE order_id=? LIMIT 1"
          SQL="$SQL" ORDER_ID="$ORDER_ID" node -e "require('fs').writeFileSync('/tmp/d1q.json',JSON.stringify({sql:process.env.SQL,params:[process.env.ORDER_ID]}))"
          curl -fsS -X POST "$URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/d1q.json > /tmp/d1r.json
          node - <<'NODE' | tee evidence/d1.txt
          const fs=require('fs');
          const x=require('/tmp/d1r.json');
          const r=x.result?.[0]?.results?.[0];
          if(!x.success||!r) throw new Error('CANONICAL_ORDER_NOT_FOUND');
          const p=JSON.parse(r.accepted_projection_json||'null');
          const id=p?.canonicalIdentity;
          const expectedKey='KEETA:'+process.env.PROVIDER_ORDER_ID;
          const checks={
            orderId:r.order_id===process.env.ORDER_ID,
            projectionOrderId:p?.orderId===process.env.ORDER_ID,
            sourceType:id?.sourceType==='PLATFORM',
            sourceProvider:id?.sourceProvider==='KEETA',
            sourceChannel:id?.sourceChannel==='DELIVERY_PLATFORM',
            externalOrderId:id?.externalOrderId===process.env.PROVIDER_ORDER_ID,
            displayOrderCode:id?.displayOrderCode===process.env.SHORT_CODE,
            sourceOrderKey:id?.sourceOrderKey===expectedKey,
          };
          console.log(JSON.stringify({orderId:r.order_id,lifecycleStatus:r.lifecycle_status,revision:r.revision,canonicalIdentity:id,checks},null,2));
          if(Object.values(checks).some(v=>!v)) throw new Error('CANONICAL_IDENTITY_CHECK_FAILED');
          fs.writeFileSync('evidence/d1-order.json',JSON.stringify({row:r,projection:p,checks},null,2));
          NODE

      - name: Read exact order from live SMM
        shell: bash
        env:
          ORDER_ID: ${{ steps.req.outputs.order_id }}
          SHORT_CODE: ${{ steps.req.outputs.short_code }}
        run: |
          set -euo pipefail
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          HTTP="$(curl -sS -o /tmp/smm-session.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$SMM_ORIGIN/api/smm/session")"
          test "$HTTP" = 200
          TOKEN="$(node -e "const x=require('/tmp/smm-session.json');if(!x.sessionToken)process.exit(1);process.stdout.write(x.sessionToken)")"
          for OP in order.open-list.read.v1 order.history-list.read.v1; do
            SAFE="$(printf '%s' "$OP" | tr '.-' '__')"
            OP="$OP" node -e "require('fs').writeFileSync('/tmp/smm-req.json',JSON.stringify({operationId:process.env.OP,request:{limit:100}}))"
            curl -fsS -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' --data-binary @/tmp/smm-req.json "$SMM_ORIGIN/api/smm/runtime" > "/tmp/$SAFE.json"
          done
          node - <<'NODE' | tee evidence/smm.txt
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8')).orders||[]}catch{return []}};
          const orders=[...read('/tmp/order_open_list_read_v1.json'),...read('/tmp/order_history_list_read_v1.json')];
          const o=orders.find(x=>x.orderId===process.env.ORDER_ID);
          if(!o) throw new Error('SMM_ORDER_NOT_FOUND');
          const id=o.canonicalIdentity;
          const checks={
            orderId:o.orderId===process.env.ORDER_ID,
            shortCode:String(o?.providerOrderAlias?.providerOrderCode||'')===process.env.SHORT_CODE,
            sourceProvider:id?.sourceProvider==='KEETA',
            displayOrderCode:id?.displayOrderCode===process.env.SHORT_CODE,
          };
          console.log(JSON.stringify({orderId:o.orderId,lifecycleStatus:o.lifecycleStatus,canonicalIdentity:id,providerOrderAlias:o.providerOrderAlias,checks},null,2));
          if(Object.values(checks).some(v=>!v)) throw new Error('SMM_CANONICAL_CHECK_FAILED');
          fs.writeFileSync('evidence/smm-order.json',JSON.stringify(o,null,2));
          NODE

      - name: Read exact order from live SMT runtime
        shell: bash
        env:
          ORDER_ID: ${{ steps.req.outputs.order_id }}
        run: |
          set -euo pipefail
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          LOGIN_HTTP="$(curl -sS -D /tmp/admin.headers -o /tmp/admin.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$ADMIN_ORIGIN/api/admin/session")"
          test "$LOGIN_HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/admin.headers | tr -d '\r' | head -n1)"
          TOKEN="${COOKIE#mf_admin_session=}"
          test -n "$TOKEN"
          ORDER_ID="$ORDER_ID" node -e "require('fs').writeFileSync('/tmp/smt-req.json',JSON.stringify({operationId:'order.detail.read.v1',request:{orderId:process.env.ORDER_ID}}))"
          HTTP="$(curl -sS -o /tmp/smt.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' --data-binary @/tmp/smt-req.json "$ADMIN_ORIGIN/api/smt/runtime")"
          echo "smt_http=$HTTP"
          test "$HTTP" = 200
          node - <<'NODE' | tee evidence/smt.txt
          const x=require('/tmp/smt.json');
          if(x.orderId!==process.env.ORDER_ID) throw new Error('SMT_ORDER_ID_MISMATCH');
          console.log(JSON.stringify({orderId:x.orderId,lifecycleStatus:x.lifecycleStatus,revision:x.revision,canonicalIdentity:x.canonicalIdentity,providerOrderAlias:x.providerOrderAlias},null,2));
          require('fs').writeFileSync('evidence/smt-order.json',JSON.stringify(x,null,2));
          NODE

      - name: Cross-port verdict
        shell: bash
        env:
          ORDER_ID: ${{ steps.req.outputs.order_id }}
          SHORT_CODE: ${{ steps.req.outputs.short_code }}
          PROVIDER_ORDER_ID: ${{ steps.req.outputs.provider_order_id }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
        run: |
          printf 'source_sha=%s\nshort_code=%s\nprovider_order_id=%s\ncanonical_order_id=%s\nd1_canonical_identity=PASS\nsmm_same_order_id=PASS\nsmt_same_order_id=PASS\nverdict=PASS\n'             "$SOURCE_SHA" "$SHORT_CODE" "$PROVIDER_ORDER_ID" "$ORDER_ID" | tee evidence/verdict.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: team-a-keeta-cross-port-live-read-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
