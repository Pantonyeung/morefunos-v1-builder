name: Verify Admin L9 Phase E

on:
  push:
    paths:
      - '.github/workflows/verify-admin-l9-phase-e.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  SOURCE_SHA: d528303a2d69c22d4b114348eaa6234ccd469068

jobs:
  verify-admin-l9-phase-e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Use npm 11
        run: npm install -g npm@11 --no-audit --no-fund
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify Runtime and Worker composition
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            packages/runtime/admin-policy-http-client.test.ts \
            packages/admin/admin-policy-validator.test.ts \
            infra/cloudflare/admin-policy-worker/entry.test.ts
      - name: Install Admin Web
        working-directory: source/apps/admin-web
        run: npm install --no-audit --no-fund
      - name: Test Admin Web
        working-directory: source/apps/admin-web
        run: npm test
      - name: Build Admin Web
        working-directory: source/apps/admin-web
        run: npm run build
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=admin-l9-phase-e \
            -f description='Exact-SHA HTTP bootstrap and Admin Web build passed' >/dev/null
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=admin-l9-phase-e \
            -f description='HTTP bootstrap or Admin Web build failed' >/dev/null
