name: T3 SMM Same-Order Proof

on:
  push:
    paths:
      - 'requests/t3-smm-same-order-proof.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact sources
        id: req
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_SHA="$(sed -n 's/^client_source_sha=//p' requests/t3-smm-same-order-proof.txt | tr -d '[:space:]')"
          SERVER_SHA="$(sed -n 's/^server_source_sha=//p' requests/t3-smm-same-order-proof.txt | tr -d '[:space:]')"
          [[ "$CLIENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "client_sha=$CLIENT_SHA" >> "$GITHUB_OUTPUT"
          echo "server_sha=$SERVER_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.client_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: client-source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.server_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: server-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install client dependencies
        working-directory: client-source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Install server dependencies
        working-directory: server-source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Execute SMM same-order trusted canonical proof
        env:
          CLIENT_ROOT: ${{ github.workspace }}/client-source
          SERVER_ROOT: ${{ github.workspace }}/server-source
        run: node --experimental-strip-types scripts/t3-smm-same-order-proof.mjs | tee evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t3-smm-same-order-${{ steps.req.outputs.client_sha }}
          path: evidence.txt
          if-no-files-found: error
          retention-days: 30
