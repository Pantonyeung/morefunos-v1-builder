name: V2 Admin UI Integration Verification

on:
  push:
    paths:
      - 'requests/v2-admin-ui-integration-request.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          else
            test -f requests/v2-admin-ui-integration-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-admin-ui-integration-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Admin UI integration tests
        working-directory: source
        run: node --test packages/admin-ui-integration/*.test.ts

      - name: Admin integration TypeScript
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../evidence
          set -o pipefail
          tsc --noEmit --allowImportingTsExtensions --module NodeNext --moduleResolution NodeNext --target ES2022 --types node packages/admin-ui-integration/runtime-provider.ts packages/admin-ui-integration/runtime-provider.test.ts 2>&1 | tee ../evidence/admin-typecheck.txt

      - name: Admin app typecheck
        if: ${{ hashFiles('source/apps/admin-web/package.json') != '' }}
        working-directory: source/apps/admin-web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck

      - name: Admin app build
        if: ${{ hashFiles('source/apps/admin-web/package.json') != '' }}
        working-directory: source/apps/admin-web
        run: npm run build

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nworkflow=verify-v2-admin-ui-integration.yml\n' "$SOURCE_SHA" > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-admin-ui-integration-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
