name: Team1 Owner Bootstrap Production Replay

on:
  push:
    paths:
      - requests/team1-owner-bootstrap-production-replay.txt

permissions:
  contents: read

jobs:
  production:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      CANONICAL_STORE_ID: d2d882b4-5c7b-40f9-ad59-91f8faabb8e8
      CANONICAL_PRODUCT_ID: 29e9e173-087f-46f4-bae3-0c29f4d51417
      CANONICAL_STAFF_ID: 7d61cc4d-e3d1-45b7-9e6c-28e2b8d7f779
      EXISTING_ORDER_ID: 094b2412-df92-4897-b0c2-3d67bcf85ef6
      SUBMISSION_ID: recovery-live-customer-direct-20260903-v1
      IDEMPOTENCY_KEY: recovery-live-customer-direct-20260903-v1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact main
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team1-owner-bootstrap-production-replay.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_LOGIN_SECRET"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build exact admitted main
        working-directory: source
        shell: bash
        env:
          EXPECTED: ${{ steps.req.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          npm install --no-save --ignore-scripts --no-audit --no-fund
          npm run typecheck
          cd apps/admin-web
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Configure explicit owner authority only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          PRINCIPAL="$(node -e "process.stdout.write(JSON.stringify({actorId:'admin:owner',staffId:process.env.CANONICAL_STAFF_ID,scopeRef:process.env.CANONICAL_STORE_ID,permissions:['admin.direct_authority.bootstrap.v1','admin.merchant_store.initialize.v1']}))")"
          printf '%s' "$PRINCIPAL" | npx --yes wrangler@4 secret put ADMIN_AUTH_PRINCIPAL_JSON --config infra/cloudflare/admin-web-worker/wrangler.jsonc >/dev/null
          printf '%s' "$ADMIN_LOGIN_SECRET" | npx --yes wrangler@4 secret put ADMIN_LOGIN_SECRET --config infra/cloudflare/admin-web-worker/wrangler.jsonc >/dev/null
          printf 'default_principal_fallback=FORBIDDEN\nexplicit_owner_principal=CONFIGURED\ncredential_source=CLOUDFLARE_WORKER_SECRET\n' > "$GITHUB_WORKSPACE/evidence/authority.txt"

      - name: Deploy exact admitted main
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config infra/cloudflare/admin-web-worker/wrangler.jsonc 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          grep -E 'Current Version ID:' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | tee "$GITHUB_WORKSPACE/evidence/version.txt"

      - name: Login session and protected bootstrap replay
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          LOGIN_HTTP="$(curl -sS -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$ADMIN_URL/api/admin/session")"
          test "$LOGIN_HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/login.headers | tr -d '\r' | head -n1)"
          test -n "$COOKIE"
          node -e "const x=require('/tmp/login.json');if(!x.authenticated||x.staffId!==process.env.CANONICAL_STAFF_ID||x.scopeRef!==process.env.CANONICAL_STORE_ID||!x.bootstrapAuthorized)process.exit(1)"
          SESSION_HTTP="$(curl -sS -o /tmp/session.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/session")"
          test "$SESSION_HTTP" = 200

          node - <<'NODE'
          const fs=require('fs');
          const m=require('./docs/recovery/team1/MF01-TEMPORARY-BOOTSTRAP-MANIFEST-2026-09-03.json');
          const now=new Date().toISOString();
          const category={categoryId:m.catalog.category.categoryId,name:m.catalog.category.name,lifecycleStatus:'ACTIVE',position:0,revision:1,createdAt:now,updatedAt:now};
          const product={productId:m.catalog.product.productId,name:m.catalog.product.name,lifecycleStatus:'ACTIVE',revision:1,createdAt:now,updatedAt:now,categoryMemberships:[{categoryId:category.categoryId,position:0}],optionGroups:[]};
          const body={idempotencyKey:'mf01-direct-bootstrap-xlsx-32f79e4463d1-v1',catalogIdempotencyKey:'mf01-catalog-bootstrap-xlsx-32f79e4463d1-v1',catalogSnapshot:{storeId:m.store.storeId,catalogRevision:m.catalog.catalogRevision,categories:[category],products:[product]},selectedProductId:m.catalog.product.productId,storeOperational:m.storeOperational,availability:[m.availability],pricing:[m.pricing],businessDay:{businessDayId:m.businessDayPolicy.businessDayId,businessDate:'2026-09-03',timezone:m.businessDayPolicy.timezone,boundaryLocalTime:m.businessDayPolicy.boundaryLocalTime,policyRevision:m.businessDayPolicy.policyRevision}};
          fs.writeFileSync('/tmp/bootstrap.json',JSON.stringify(body));
          NODE
          BOOT_HTTP="$(curl -sS -o /tmp/bootstrap.json.out -w '%{http_code}' -H 'content-type: application/json' -H "Cookie: $COOKIE" --data-binary @/tmp/bootstrap.json "$ADMIN_URL/api/admin/direct-authority/bootstrap")"
          test "$BOOT_HTTP" = 200
          node -e "const x=require('/tmp/bootstrap.json.out');if(!x.ok||x.storeId!==process.env.CANONICAL_STORE_ID||x.selectedProductId!==process.env.CANONICAL_PRODUCT_ID)process.exit(1)"
          printf 'login_http=%s\nsession_http=%s\nprotected_bootstrap_replay_http=%s\n' "$LOGIN_HTTP" "$SESSION_HTTP" "$BOOT_HTTP" | tee "$GITHUB_WORKSPACE/evidence/admin-live.txt"

      - name: Canonical business readback
        shell: bash
        run: |
          set -euo pipefail
          ORDERING_HTTP="$(curl -sS -o /tmp/ordering.json -w '%{http_code}' "$ADMIN_URL/api/customer/ordering")"
          test "$ORDERING_HTTP" = 200
          node -e "const x=require('/tmp/ordering.json');const p=x.products?.find(v=>v.productId===process.env.CANONICAL_PRODUCT_ID);if(x.storeStatus!=='open'||!p||p.currency!=='HKD'||Number(p.priceMinor)!==2500||p.available!==true)process.exit(1)"
          printf 'customer_ordering_http=%s\n' "$ORDERING_HTTP" | tee "$GITHUB_WORKSPACE/evidence/business-readback.txt"
          cp /tmp/ordering.json "$GITHUB_WORKSPACE/evidence/ordering.json"

      - name: Replay existing Customer Order without creating second truth
        shell: bash
        run: |
          set -euo pipefail
          GUEST_TOKEN="$(node -e "const {createHash}=require('node:crypto');process.stdout.write(createHash('sha256').update('morefun-team1-production-live-gate-20260903').digest('base64url'))")"
          node -e "require('fs').writeFileSync('/tmp/order.json',JSON.stringify({submissionId:process.env.SUBMISSION_ID,idempotencyKey:process.env.IDEMPOTENCY_KEY,payload:{lines:[{productId:process.env.CANONICAL_PRODUCT_ID,quantity:1}]}}))"
          REPLAY_HTTP="$(curl -sS -o /tmp/replay.json -w '%{http_code}' -H 'content-type: application/json' -H "Cookie: mf_customer_guest=$GUEST_TOKEN" --data-binary @/tmp/order.json "$ADMIN_URL/api/customer/orders")"
          test "$REPLAY_HTTP" = 200
          node -e "const x=require('/tmp/replay.json');if(!x.ok||x.orderId!==process.env.EXISTING_ORDER_ID||x.submissionId!==process.env.SUBMISSION_ID)process.exit(1)"
          STATUS_HTTP="$(curl -sS -o /tmp/status.json -w '%{http_code}' -H "Cookie: mf_customer_guest=$GUEST_TOKEN" -H "Authorization: Bearer $GUEST_TOKEN" "$ADMIN_URL/api/customer/order-status?submissionId=$SUBMISSION_ID")"
          test "$STATUS_HTTP" = 200
          node -e "const x=require('/tmp/status.json');if(!x.ok||x.orderId!==process.env.EXISTING_ORDER_ID||x.lifecycleStatus!=='ACCEPTED')process.exit(1)"
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --command "SELECT o.order_id,o.submission_id,COUNT(*) OVER() AS canonical_count FROM mfos_customer_order_ownership o WHERE o.submission_id='$SUBMISSION_ID';" --json > "$GITHUB_WORKSPACE/evidence/d1-order.json"
          node -e "const x=require(process.env.GITHUB_WORKSPACE+'/evidence/d1-order.json');const r=x?.[0]?.results??[];if(r.length!==1||r[0].order_id!==process.env.EXISTING_ORDER_ID||Number(r[0].canonical_count)!==1)process.exit(1)"
          printf 'replay_http=%s\nlifecycle_http=%s\norder_id=%s\ncanonical_count=1\n' "$REPLAY_HTTP" "$STATUS_HTTP" "$EXISTING_ORDER_ID" | tee "$GITHUB_WORKSPACE/evidence/customer-replay.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team1-owner-bootstrap-production-replay-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
