name: Temporary Channel Attribution Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-channel-attribution-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung' && github.event.issue.number == 2 && startsWith(github.event.comment.body, '/diagnose-channel ')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Parse exact diagnostic request
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r VERB SHA EXTRA <<< "$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | xargs)"
          test "$VERB" = "/diagnose-channel"
          test -z "${EXTRA:-}"
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "source_sha=${SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pinned TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"

      - name: Diagnose sanitized stage
        id: diagnose
        shell: bash
        run: |
          set -u
          LOG="$RUNNER_TEMP/channel-diagnostic-private.log"
          : > "$LOG"
          cd source

          if ! node --experimental-strip-types --test packages/runtime/operator-sales-channel-attribution.test.ts >> "$LOG" 2>&1; then
            echo "stage=attribution-contract" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shopt -s nullglob
          FILES=(
            packages/contracts/*.test.ts
            packages/customer/*.test.ts
            packages/loyalty/*.test.ts
            packages/order/*.test.ts
            packages/pricing/*.test.ts
            packages/payment/*.test.ts
            packages/fulfillment/*.test.ts
            packages/printing/*.test.ts
            packages/durability/*.test.ts
            packages/native/*.test.ts
            packages/admin/*.test.ts
            packages/staff/*.test.ts
            packages/store-settings/*.test.ts
            packages/catalog/*.test.ts
            packages/availability/*.test.ts
            packages/inventory/*.test.ts
            packages/procurement/*.test.ts
            packages/table/*.test.ts
            packages/channels/*.test.ts
            packages/facts/*.test.ts
            packages/runtime/*.test.ts
            packages/business-day/*.test.ts
            packages/reporting/*.test.ts
            packages/ui/module-contract.test.ts
            apps/smt-web/src/ui-state.test.ts
            apps/smt-web/src/smt-runtime-adapter.test.ts
            apps/smt-web/src/smt-active-work-port.test.ts
            apps/smt-web/src/smt-active-work-lifecycle.test.ts
            apps/smt-web/src/smt-dine-in-port.test.ts
            apps/smt-web/src/smt-availability-port.test.ts
            apps/smt-web/src/smt-business-day-port.test.ts
            apps/smt-web/src/smt-reporting-port.test.ts
            apps/smt-web/src/smt-printing-port.test.ts
            apps/smt-web/src/smt-orders-port.test.ts
          )
          for file in "${FILES[@]}"; do
            [[ "$file" == "packages/runtime/operator-sales-channel-attribution.test.ts" ]] && continue
            if ! node --experimental-strip-types --test "$file" >> "$LOG" 2>&1; then
              if [[ "$file" =~ ^[A-Za-z0-9_./-]+$ ]]; then
                echo "stage=test-file:$file" >> "$GITHUB_OUTPUT"
              else
                echo "stage=test-file:UNAVAILABLE" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
          done

          STATIC_FILES=(
            packages/ui/ui-authority-boundary.test.mjs
            packages/ui/sdk-passthrough.test.mjs
            apps/smt-web/src/g1g-static.test.mjs
            apps/smt-web/src/g5-static.test.mjs
            apps/smt-web/src/b3-static.test.mjs
            apps/smt-web/src/ui-smt-01-static.test.mjs
            apps/smt-web/src/ui-smt-02-static.test.mjs
            apps/smt-web/src/ui-smt-03-static.test.mjs
            apps/smt-web/src/ui-smt-04-static.test.mjs
            apps/smt-web/src/ui-smt-05-static.test.mjs
            apps/smt-web/src/ui-smt-06a-static.test.mjs
            apps/smt-web/src/ui-smt-07-static.test.mjs
            apps/smt-android/g6-carrier-static.test.mjs
          )
          for file in "${STATIC_FILES[@]}"; do
            if ! node --test "$file" >> "$LOG" 2>&1; then
              echo "stage=test-file:$file" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if ! npm run typecheck:current >> "$LOG" 2>&1; then
            echo "stage=current-typecheck" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stage=pass" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.request.outputs.source_sha }}
          STAGE: ${{ steps.diagnose.outputs.stage }}
        run: |
          set -euo pipefail
          if [[ "$STAGE" != "attribution-contract" && "$STAGE" != "current-typecheck" && "$STAGE" != "pass" && ! "$STAGE" =~ ^test-file:[A-Za-z0-9_./-]+$ ]]; then
            STAGE=diagnostic-unknown
          fi
          gh issue comment 2 --repo Pantonyeung/morefunos-v1-builder --body "diagnose-channel source_sha=$SHA stage=$STAGE" >/dev/null
