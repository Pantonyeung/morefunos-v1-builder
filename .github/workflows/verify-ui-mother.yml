name: Owner V1 Verify SMT Mother UI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      artifact_name:
        description: 'Verified SMT Mother dist artifact name'
        value: ${{ jobs.verify-ui-mother.outputs.artifact_name }}
      failure_stage:
        description: 'Sanitized failing stage, or none'
        value: ${{ jobs.verify-ui-mother.outputs.failure_stage }}
      failure_detail:
        description: 'Sanitized compiler location/code detail when available'
        value: ${{ jobs.verify-ui-mother.outputs.failure_detail }}
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character MoreFunOS V1 SMT Mother UI source SHA'
        required: true
        type: string

permissions:
  contents: read

env:
  VERIFIED_DIST_PREFIX: smt-mother-dist

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  verify-ui-mother:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      failure_stage: ${{ steps.stage.outputs.failure_stage }}
      failure_detail: ${{ steps.diagnostic.outputs.detail }}
    env:
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha must be an exact 40-character Git SHA' >&2; exit 1; }
          echo "source_sha=${SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout Builder definition
        id: builder_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact private MoreFunOS V1 source
        id: source_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        id: identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Setup supported Node with npm lockfile cache
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: source/apps/smt-web/package-lock.json

      - name: Verify runtime toolchain floor
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const [M,m]=process.versions.node.split(".").map(Number); if (!(M>22 || (M===22 && m>=12))) process.exit(1)'
          test -f source/apps/smt-web/package-lock.json

      - name: Clean install from committed lockfile
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source/apps/smt-web ci --no-audit --no-fund

      - name: Verify maintained dependency graph
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source/apps/smt-web ls react react-dom react-router lucide-react vite typescript vitest --depth=0

      - name: Run SMT P01 interaction regression tests
        id: p01_tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source/apps/smt-web run test:p01

      - name: Run SMT carrier/runtime adapter regression tests
        id: carrier_tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            source/apps/smt-web/src/smt-device-gate-bootstrap-consumer.test.ts \
            source/apps/smt-web/src/runtime-carrier-ready.test.ts \
            source/apps/smt-web/src/carrier-ota-port.test.ts

      - name: Run current Mother contract
        id: mother_contract
        shell: bash
        run: |
          set -euo pipefail
          node --test source/apps/smt-web/src/mother-ui-contract.test.mjs

      - name: Run TypeScript project gate
        id: typescript
        shell: bash
        run: |
          set -o pipefail
          cd source/apps/smt-web
          ./node_modules/.bin/tsc -b --pretty false 2>&1 | tee "$RUNNER_TEMP/mother-tsc.log"

      - name: Capture sanitized TypeScript diagnostics
        id: diagnostic
        if: ${{ always() && steps.typescript.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          DETAIL="$(sed -nE \
            -e 's#^([^(:]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+):.*#\1:\2:\3-\4#p' \
            -e 's#^error (TS[0-9]+):.*#\1#p' \
            "$RUNNER_TEMP/mother-tsc.log" | head -5 | paste -sd ',' -)"
          if [[ -z "$DETAIL" ]]; then DETAIL='typescript-error-detail-unavailable'; fi
          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"
          echo "sanitized-typescript-detail=$DETAIL"

      - name: Run Vite production build
        id: vite_build
        shell: bash
        run: |
          set -euo pipefail
          cd source/apps/smt-web
          ./node_modules/.bin/vite build

      - name: Verify Vite production output integrity
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          DIST=source/apps/smt-web/dist
          test -s "$DIST/index.html"
          find "$DIST" -maxdepth 2 -type f -size +0c | grep -q .
          node - "$DIST/index.html" <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          if (/<script\b[^>]*\bsrc=["']https?:\/\//i.test(html) || /<link\b[^>]*\bhref=["']https?:\/\//i.test(html)) throw new Error('REMOTE_CORE_STARTUP_DEPENDENCY_DETECTED');
          NODE

      - name: Name immutable verified artifact
        id: artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          echo "name=${VERIFIED_DIST_PREFIX}-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload verified production dist
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: source/apps/smt-web/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Derive sanitized verification stage
        id: stage
        if: always()
        shell: bash
        env:
          REQUEST: ${{ steps.request.outcome }}
          BUILDER_CHECKOUT: ${{ steps.builder_checkout.outcome }}
          SOURCE_CHECKOUT: ${{ steps.source_checkout.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          NODE_SETUP: ${{ steps.node.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          P01_TESTS: ${{ steps.p01_tests.outcome }}
          CARRIER_TESTS: ${{ steps.carrier_tests.outcome }}
          MOTHER_CONTRACT: ${{ steps.mother_contract.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          VITE_BUILD: ${{ steps.vite_build.outcome }}
          DIST: ${{ steps.dist.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          STAGE=none
          if [[ "$REQUEST" == failure ]]; then STAGE=request;
          elif [[ "$BUILDER_CHECKOUT" == failure ]]; then STAGE=builder_checkout;
          elif [[ "$SOURCE_CHECKOUT" == failure ]]; then STAGE=source_checkout;
          elif [[ "$IDENTITY" == failure ]]; then STAGE=identity;
          elif [[ "$NODE_SETUP" == failure ]]; then STAGE=node_setup;
          elif [[ "$TOOLCHAIN" == failure ]]; then STAGE=toolchain;
          elif [[ "$INSTALL" == failure ]]; then STAGE=npm_ci;
          elif [[ "$DEPENDENCIES" == failure ]]; then STAGE=dependency_graph;
          elif [[ "$P01_TESTS" == failure ]]; then STAGE=p01_tests;
          elif [[ "$CARRIER_TESTS" == failure ]]; then STAGE=carrier_tests;
          elif [[ "$MOTHER_CONTRACT" == failure ]]; then STAGE=mother_contract;
          elif [[ "$TYPESCRIPT" == failure ]]; then STAGE=typescript;
          elif [[ "$VITE_BUILD" == failure ]]; then STAGE=vite_build;
          elif [[ "$DIST" == failure ]]; then STAGE=dist_integrity;
          elif [[ "$ARTIFACT" == failure ]]; then STAGE=artifact_name;
          elif [[ "$UPLOAD" == failure ]]; then STAGE=artifact_upload;
          fi
          echo "failure_stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "mother-verify-stage=$STAGE"

      - name: Publish verification summary
        if: always()
        shell: bash
        run: echo "SMT Mother UI evidence gate source=${{ steps.request.outputs.source_sha }} stage=${{ steps.stage.outputs.failure_stage }}"
