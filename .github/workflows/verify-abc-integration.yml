name: Owner V1 Verify ABC Integration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character Merge-Audit-prepared integration SHA'
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: morefunos-v1-abc-integration
  cancel-in-progress: false

jobs:
  verify-abc-integration:
    if: github.actor == 'Pantonyeung'
    uses: ./.github/workflows/verify-core.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      verification_profile: 'integration'
    secrets: inherit

  verify-abc-smm:
    if: github.actor == 'Pantonyeung'
    uses: ./.github/workflows/verify-smm-core.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
