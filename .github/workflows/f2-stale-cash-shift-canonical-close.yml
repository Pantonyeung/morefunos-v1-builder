name: F2 Stale Cash Shift Canonical Close

on:
  push:
    branches: [main]
    paths:
      - 'requests/f2-stale-cash-shift-canonical-close-request.txt'

permissions:
  contents: read

jobs:
  close:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
      SHIFT_ID: 595a9027-e880-4580-9b9c-65aab942c70b
      DAY_ID: 0d2cda16-38f6-4fca-aff1-06d99fd26353
      EXPECTED_CASH_MINOR: '100000'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/f2-stale-cash-shift-canonical-close-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$ADMIN_LOGIN_SECRET"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Preflight stale shift remains cleanup-safe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          query(){ NAME="$1"; SQL="$2"; SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL}))"; curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json > "evidence/$NAME.json"; }
          query shift "SELECT cash_shift_id,business_day_id,lifecycle_status,revision,record_json FROM mfos_cash_shift WHERE cash_shift_id='$SHIFT_ID' LIMIT 1"
          query movements "SELECT COUNT(*) AS count_value FROM mfos_cash_movement WHERE cash_shift_id='$SHIFT_ID'"
          query cash_payments "SELECT COUNT(*) AS count_value FROM mfos_payment_state WHERE lifecycle_status='COMPLETED' AND json_extract(payment_json,'$.tenderMethod')='CASH' AND updated_at>='2026-09-11T00:15:57.460Z'"
          query refunds "SELECT COUNT(*) AS count_value FROM mfos_refund_state WHERE status='COMPLETED' AND created_at>='2026-09-11T00:15:57.460Z'"
          node - <<'NODE' | tee evidence/preflight.txt
          const fs=require('fs');
          const rows=n=>JSON.parse(fs.readFileSync('evidence/'+n+'.json','utf8')).result?.[0]?.results||[];
          const r=rows('shift')[0];
          if(!r)throw new Error('STALE_SHIFT_MISSING');
          const s=JSON.parse(r.record_json);
          const count=n=>Number(rows(n)[0]?.count_value??-1);
          console.log('shift_status='+r.lifecycle_status);
          console.log('shift_revision='+r.revision);
          console.log('opening_cash_minor='+s.openingCashMinor);
          console.log('movement_count='+count('movements'));
          console.log('cash_payment_count='+count('cash_payments'));
          console.log('refund_count='+count('refunds'));
          if(r.business_day_id!==process.env.DAY_ID||r.lifecycle_status!=='OPEN'||Number(r.revision)!==1||Number(s.openingCashMinor)!==Number(process.env.EXPECTED_CASH_MINOR)||count('movements')!==0||count('cash_payments')!==0||count('refunds')!==0)throw new Error('STALE_SHIFT_PREFLIGHT_CHANGED_FAIL_CLOSED');
          console.log('cleanup_safe=PASS');
          NODE

      - name: Login Admin canonical authority
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          HTTP="$(curl -sS -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$BODY" "$ADMIN_URL/api/admin/session")"
          echo "login_http=$HTTP" | tee evidence/login.txt
          test "$HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/login.headers | tr -d '\r' | head -n1)"
          test -n "$COOKIE"
          echo "$COOKIE" >/tmp/cookie

      - name: Ensure strict close variance policy without overwriting configured policy
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$(cat /tmp/cookie)"
          HTTP="$(curl -sS -o /tmp/policy.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/business-day/close-policy")"
          echo "policy_get_http=$HTTP" | tee evidence/policy.txt
          test "$HTTP" = 200
          MODE="$(node -e "const x=require('/tmp/policy.json');const v=x.value; if(!v){process.stdout.write('MISSING')}else if(v.basis==='ABSOLUTE_MINOR'&&Number(v.configuredValue)===0){process.stdout.write('STRICT_ZERO')}else{process.stdout.write('OTHER')}" )"
          echo "policy_mode=$MODE" | tee -a evidence/policy.txt
          if [[ "$MODE" = OTHER ]]; then cat /tmp/policy.json >> evidence/policy.txt; exit 41; fi
          if [[ "$MODE" = MISSING ]]; then
            node -e "require('fs').writeFileSync('/tmp/policy-put.json',JSON.stringify({basis:'ABSOLUTE_MINOR',configuredValue:0,changeReason:'PRE_GO_LIVE_STALE_SHIFT_CLEANUP_STRICT_ZERO_TOLERANCE',idempotencyKey:'pre-go-live-close-policy-v1'}))"
            PUT_HTTP="$(curl -sS -o /tmp/policy-put.out.json -w '%{http_code}' -X PUT -H "Cookie: $COOKIE" -H 'content-type: application/json' --data-binary @/tmp/policy-put.json "$ADMIN_URL/api/admin/business-day/close-policy")"
            echo "policy_put_http=$PUT_HTTP" | tee -a evidence/policy.txt
            cat /tmp/policy-put.out.json >> evidence/policy.txt
            test "$PUT_HTTP" = 200
          fi

      - name: Preview and seal stale test shift at canonical expected balance
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$(cat /tmp/cookie)"
          node -e "require('fs').writeFileSync('/tmp/preview.json',JSON.stringify({action:'PREVIEW_CLOSE',idempotencyKey:'round020-shift-preview:'+process.env.SHIFT_ID,payload:{actualClosingCashMinor:Number(process.env.EXPECTED_CASH_MINOR)}}))"
          PHTTP="$(curl -sS -o /tmp/preview.out.json -w '%{http_code}' -H "Cookie: $COOKIE" -H 'content-type: application/json' --data-binary @/tmp/preview.json "$ADMIN_URL/api/admin/business-day/cash-shift")"
          echo "preview_http=$PHTTP" | tee evidence/close.txt
          cat /tmp/preview.out.json | tee -a evidence/close.txt
          test "$PHTTP" = 200
          node -e "const x=require('/tmp/preview.out.json');const v=x.value;if(!x.ok||Number(v.expectedClosingCashMinor)!==Number(process.env.EXPECTED_CASH_MINOR)||Number(v.actualClosingCashMinor)!==Number(process.env.EXPECTED_CASH_MINOR)||Number(v.overShortMinor)!==0)process.exit(1)"
          node -e "require('fs').writeFileSync('/tmp/seal.json',JSON.stringify({action:'SEAL',idempotencyKey:'round020-shift-seal:'+process.env.SHIFT_ID+':1',payload:{expectedRevision:1,actualClosingCashMinor:Number(process.env.EXPECTED_CASH_MINOR)}}))"
          SHTTP="$(curl -sS -o /tmp/seal.out.json -w '%{http_code}' -H "Cookie: $COOKIE" -H 'content-type: application/json' --data-binary @/tmp/seal.json "$ADMIN_URL/api/admin/business-day/cash-shift")"
          echo "seal_http=$SHTTP" | tee -a evidence/close.txt
          cat /tmp/seal.out.json | tee -a evidence/close.txt
          test "$SHTTP" = 200
          node -e "const x=require('/tmp/seal.out.json');if(!x.ok||!x.value?.shift?.latestCloseResultId||Number(x.value.shift.revision)!==2)process.exit(1)"

      - name: Finalize handover without claiming physical withdrawal
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$(cat /tmp/cookie)"
          node -e "require('fs').writeFileSync('/tmp/handover.json',JSON.stringify({action:'HANDOVER',idempotencyKey:'round020-shift-handover:'+process.env.SHIFT_ID+':2',payload:{expectedRevision:2,withdrawalMinor:0}}))"
          HTTP="$(curl -sS -o /tmp/handover.out.json -w '%{http_code}' -H "Cookie: $COOKIE" -H 'content-type: application/json' --data-binary @/tmp/handover.json "$ADMIN_URL/api/admin/business-day/cash-shift")"
          echo "handover_http=$HTTP" | tee evidence/handover.txt
          cat /tmp/handover.out.json | tee -a evidence/handover.txt
          test "$HTTP" = 200
          node -e "const x=require('/tmp/handover.out.json');if(!x.ok||x.value?.closedShift?.lifecycleStatus!=='CLOSED'||Number(x.value.closedShift.revision)!==3)process.exit(1)"

      - name: Verify shift closed canonically
        shell: bash
        run: |
          set -euo pipefail
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          SQL="SELECT lifecycle_status,revision,record_json FROM mfos_cash_shift WHERE cash_shift_id='$SHIFT_ID' LIMIT 1"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL}))"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json > evidence/post.json
          node -e "const x=require('./evidence/post.json');const r=x.result?.[0]?.results?.[0];console.log('shift_status='+r?.lifecycle_status);console.log('shift_revision='+r?.revision);if(r?.lifecycle_status!=='CLOSED'||Number(r.revision)!==3)process.exit(1)" | tee evidence/post.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-stale-cash-shift-canonical-close-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
