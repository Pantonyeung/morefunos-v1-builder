name: T1 Keeta 0111 Replay Preflight
on:
  push:
    branches: [main]
    paths: ['requests/t1-keeta-0111-replay-preflight.txt']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      SIT_D1_DATABASE_ID: "e7e33e6f-9bc5-4f2b-89ce-acb3bb19e492"
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Inspect evidence schema and 0111 row shape
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="PRAGMA table_info(keeta_webhook_evidence)"
          jq -n --arg sql "$SQL" '{sql:$sql}' > "$RUNNER_TEMP/q1.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$SIT_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/q1.json" > "$RUNNER_TEMP/o1.json"
          jq -e '.success==true and .result[0].success==true' "$RUNNER_TEMP/o1.json" >/dev/null
          echo "schema_columns=$(jq -r '[.result[0].results[].name]|join(",")' "$RUNNER_TEMP/o1.json")"

          SQL="SELECT * FROM keeta_webhook_evidence WHERE event_id=1001 AND message LIKE '%0111%' ORDER BY received_at DESC LIMIT 1"
          jq -n --arg sql "$SQL" '{sql:$sql}' > "$RUNNER_TEMP/q2.json"
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$SIT_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/q2.json" > "$RUNNER_TEMP/o2.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results|length)==1' "$RUNNER_TEMP/o2.json" >/dev/null
          echo "row_keys=$(jq -r '[.result[0].results[0]|keys[]]|join(",")' "$RUNNER_TEMP/o2.json")"
          echo "has_sig_column=$(jq -r '(.result[0].results[0]|has("sig"))' "$RUNNER_TEMP/o2.json")"
