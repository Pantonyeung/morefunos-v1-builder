name: T1 Keeta 0111 Replay Preflight
on:
  push:
    branches: [main]
    paths: ['requests/t1-keeta-0111-replay-preflight.txt']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      SIT_D1_DATABASE_ID: "e7e33e6f-9bc5-4f2b-89ce-acb3bb19e492"
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Inspect evidence schema and 0111 row shape
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for SQL in "PRAGMA table_info(keeta_webhook_evidence)" "SELECT * FROM keeta_webhook_evidence WHERE event_id=1001 AND message LIKE '%0111%' ORDER BY received_at DESC LIMIT 1"; do
            jq -n --arg sql "$SQL" '{sql:$sql}' > "$RUNNER_TEMP/q.json"
            curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$SIT_D1_DATABASE_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/q.json" > "$RUNNER_TEMP/out.json"
            jq -e '.success==true and .result[0].success==true' "$RUNNER_TEMP/out.json" >/dev/null
            node - "$RUNNER_TEMP/out.json" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).result[0].results||[];
          console.log(JSON.stringify(r.map(x=>{const y={...x};for(const k of Object.keys(y)){if(/sig|secret|token|phone|address|recipient|customer|user/i.test(k))y[k]='[REDACTED]'}return y})));
NODE
          done
