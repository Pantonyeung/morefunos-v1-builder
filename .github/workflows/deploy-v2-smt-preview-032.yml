name: Deploy V2 SMT Preview 032

on:
  push:
    paths:
      - 'requests/v2-smt-preview-032-request.txt'

permissions:
  contents: read
  statuses: write

jobs:
  deploy-browser:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context='builder/v2-smt-preview-032' \
            -f description='SMT Preview 032 deploy/browser running' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smt-preview-032-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require trusted credentials
        env:
          V2_SOURCE_READ_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_LOGIN_SECRET"
          test -n "$V2_SOURCE_READ_TOKEN"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact source and build SMT
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.req.outputs.source_sha }}"
          npm install --no-save --ignore-scripts --no-audit --no-fund
          npm run typecheck
          mapfile -t SMT_TESTS < <(find packages/smt-ui-integration -maxdepth 1 -name '*.test.ts' ! -name 't2-smt-worker-mount.test.ts' -print | sort)
          node --test "${SMT_TESTS[@]}"
          npm --prefix apps/smt-clean install --ignore-scripts --no-audit --no-fund
          npm --prefix apps/smt-clean run typecheck
          npm --prefix apps/smt-clean run build
          test -s apps/smt-clean/dist/index.html
          test -s infra/cloudflare/smt-preview-worker/index.ts
          test -s infra/cloudflare/smt-preview-worker/wrangler.jsonc

      - name: Deploy exact SMT Preview Worker
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          npm exec --yes --package=wrangler@4.125.0 -- wrangler deploy --config infra/cloudflare/smt-preview-worker/wrangler.jsonc 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | sed 's/[),.;]*$//' || true)"
          test -n "$URL"
          printf '%s\n' "$URL" > "$GITHUB_WORKSPACE/evidence/url.txt"

      - name: 1920x1080 public Preview browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          URL="$(cat evidence/url.txt)"
          export URL ADMIN_LOGIN_SECRET
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const pageErrors=[];
            const requestFailures=[];
            const apiNetwork=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()?.errorText||'unknown'}));
            page.on('request',r=>{
              const u=new URL(r.url());
              if(u.pathname.startsWith('/api/'))apiNetwork.push({origin:u.origin,path:u.pathname,method:r.method()});
            });
            await page.goto(process.env.URL+'/',{waitUntil:'networkidle'});
            const pre=await page.evaluate(()=>({
              w:innerWidth,h:innerHeight,
              bodyText:document.body.innerText,
              scrollWidth:document.documentElement.scrollWidth,
              scrollHeight:document.documentElement.scrollHeight,
            }));
            if(pre.w!==1920||pre.h!==1080)throw new Error('SMT_PREVIEW_VIEWPORT_MISMATCH');
            if(pre.bodyText.includes('Runtime 已連接'))throw new Error('SMT_PREVIEW_PREAUTH_FALSE_CONNECTED');
            const pair=await page.evaluate(async(secret)=>{
              const response=await fetch('/api/smt/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({loginSecret:secret}),cache:'no-store'});
              const session=await response.json();
              return {status:response.status,session};
            },process.env.ADMIN_LOGIN_SECRET);
            if(pair.status!==200||!pair.session?.sessionToken||!Array.isArray(pair.session?.mountedOperationIds))throw new Error('SMT_PREVIEW_PAIR_FAILED');
            const requiredOperations=['catalog.menu.active.read.v1','order.open-list.read.v1','order.direct.staff.submit.v1'];
            const missingOperations=requiredOperations.filter(operationId=>!pair.session.mountedOperationIds.includes(operationId));
            if(missingOperations.length)throw new Error('SMT_PREVIEW_REQUIRED_OPS_MISSING:'+missingOperations.join(','));
            await page.evaluate(session=>localStorage.setItem('morefunos.smt.device-session.v1',JSON.stringify(session)),pair.session);
            await page.reload({waitUntil:'networkidle'});
            await page.getByRole('main',{name:'SMT 員工登入'}).waitFor({state:'visible'});
            await page.getByLabel('員工編號').waitFor({state:'visible'});
            await page.getByLabel('員工 PIN').waitFor({state:'visible'});
            await page.getByRole('button',{name:'登入並開始營運'}).waitFor({state:'visible'});
            if(await page.getByLabel('Owner 管理密碼').count()!==0)throw new Error('SMT_PREVIEW_OWNER_PASSWORD_REPROMPTED');
            if((await page.locator('body').innerText()).includes('Runtime 已連接'))throw new Error('SMT_PREVIEW_FALSE_RUNTIME_CONNECTED_BEFORE_STAFF_AUTH');
            const publicOrigin=new URL(process.env.URL).origin;
            if(apiNetwork.some(x=>x.origin!==publicOrigin))throw new Error('SMT_PREVIEW_CROSS_ORIGIN_API_FORBIDDEN');
            if(pageErrors.length)throw new Error('SMT_PREVIEW_PAGE_ERROR:'+pageErrors.join('|'));
            if(requestFailures.length)throw new Error('SMT_PREVIEW_REQUEST_FAILED:'+requestFailures.map(x=>x.url).join('|'));
            const result={
              sourceSha:process.env.SOURCE_SHA||null,
              publicOrigin,
              viewport:{width:1920,height:1080},
              documentSize:{scrollWidth:pre.scrollWidth,scrollHeight:pre.scrollHeight},
              devicePaired:true,
              staffLoginGateVisible:true,
              runtimeConnected:false,
              runtimeAcceptance:'BLOCKED_BY_REQUIRED_STAFF_AUTH',
              mountedOperations:pair.session.mountedOperationIds.length,
              productCount:null,
              openOrderCount:null,
              nativeOnlyNotice:false,
              browserPhysicalPrintSuccessClaim:false,
              directBrowserD1:false,
              apiNetwork,
              pageErrors,
              requestFailures,
            };
            fs.writeFileSync('evidence/browser.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-smt-preview-032-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context='builder/v2-smt-preview-032' \
            -f description='SMT Preview 032 deploy/browser passed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context='builder/v2-smt-preview-032' \
            -f description='SMT Preview 032 deploy/browser failed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
