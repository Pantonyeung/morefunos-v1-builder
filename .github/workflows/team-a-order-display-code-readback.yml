name: Team A Order Display Code Production Readback

on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-order-display-code-readback.txt'

permissions:
  contents: read

jobs:
  readback:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team-a-order-display-code-readback.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA"

      - name: Read production D1 schema
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          SQL="SELECT type,name,tbl_name FROM sqlite_master WHERE name IN ('mfos_order_display_code_counter','mfos_order_display_code','mfos_order_display_code_order_idx','mfos_order_display_code_store_date_idx') ORDER BY type,name;"
          jq -n --arg sql "$SQL" '{sql:$sql,params:[]}' > "$RUNNER_TEMP/readback.json"
          curl -fsS -X POST "$URL"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'content-type: application/json'             --data-binary @"$RUNNER_TEMP/readback.json" > "$RUNNER_TEMP/readback-result.json"
          cat "$RUNNER_TEMP/readback-result.json"
          node - <<'NODE'
          const x=require(process.env.RUNNER_TEMP + '/readback-result.json');
          if (x.success !== true || x.result?.[0]?.success !== true) process.exit(2);
          const rows=x.result[0].results||[];
          const names=rows.map(r=>r.name).sort();
          const expected=[
            'mfos_order_display_code',
            'mfos_order_display_code_counter',
            'mfos_order_display_code_order_idx',
            'mfos_order_display_code_store_date_idx'
          ].sort();
          if (JSON.stringify(names)!==JSON.stringify(expected)) {
            console.error('DISPLAY_CODE_SCHEMA_MISMATCH', names);
            process.exit(3);
          }
          console.log('ORDER_DISPLAY_CODE_SCHEMA_READBACK=PASS '+names.join(','));
          NODE

      - name: Upload readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-a-order-display-code-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/readback-result.json
          if-no-files-found: error
          retention-days: 30
