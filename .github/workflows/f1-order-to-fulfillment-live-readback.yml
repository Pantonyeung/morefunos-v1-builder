name: F1 Order To Fulfillment Live Readback

on:
  push:
    branches: [main]
    paths:
      - 'requests/f1-order-to-fulfillment-live-readback-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact deployed source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/f1-order-to-fulfillment-live-readback-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          DEPLOYED_SHA="$(sed -n 's/^source_sha=//p' .ci-results/v2-admin-worker-deploy.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$DEPLOYED_SHA" ]] || { echo "::error::FULFILLMENT_SOURCE_NOT_DEPLOYED requested=$SOURCE_SHA deployed=$DEPLOYED_SHA"; exit 1; }
          test -n "$ADMIN_LOGIN_SECRET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Capture accepted orders missing Fulfillment before trigger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          SQL="SELECT s.order_id,s.store_id,s.revision,s.lifecycle_status,s.created_at FROM mfos_order_state s LEFT JOIN mfos_fulfillment_state f ON f.order_id=s.order_id WHERE s.lifecycle_status='ACCEPTED' AND f.order_id IS NULL ORDER BY s.created_at ASC LIMIT 20"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/pre.json',JSON.stringify({sql:process.env.SQL}))"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/pre.json > evidence/pre.json
          node - <<'NODE' | tee evidence/pre.txt
          const x=require('./evidence/pre.json');
          const rows=x.result?.[0]?.results||[];
          if(!x.success)throw new Error('PRE_READ_FAILED');
          console.log('accepted_missing_before='+rows.length);
          if(rows[0]){
            console.log('target_order_id='+rows[0].order_id);
            console.log('target_store_id='+rows[0].store_id);
            console.log('target_revision='+rows[0].revision);
            require('fs').writeFileSync('/tmp/target-order',String(rows[0].order_id));
          }
          NODE

      - name: Diagnose first missing Order against Fulfillment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          TARGET="$(cat /tmp/target-order)"
          query(){
            NAME="$1"; SQL="$2"
            SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/query.json',JSON.stringify({sql:process.env.SQL}))"
            curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/query.json > "evidence/diag-$NAME.json"
          }
          query order "SELECT order_id,store_id,revision,lifecycle_status,order_snapshot_json,accepted_projection_json FROM mfos_order_state WHERE order_id='$TARGET' LIMIT 1"
          query policy "SELECT store_id,intent,scope_key,policy_ref,policy_version,mode,active FROM mfos_fulfillment_policy ORDER BY updated_at DESC LIMIT 10"
          query idempotency "SELECT idempotency_key,completed_at FROM mfos_fulfillment_idempotency ORDER BY completed_at DESC LIMIT 10"
          TARGET="$TARGET" node - <<'NODE' | tee evidence/prerequisites.txt
          const fs=require('fs');
          const rows=n=>JSON.parse(fs.readFileSync('evidence/diag-'+n+'.json','utf8')).result?.[0]?.results||[];
          const row=rows('order')[0];
          if(!row)throw new Error('TARGET_ORDER_MISSING');
          const raw=row.order_snapshot_json||row.accepted_projection_json||'{}';
          let p={};try{p=JSON.parse(raw)}catch{}
          console.log('db_order_id='+row.order_id);
          console.log('db_store_id='+row.store_id);
          console.log('db_revision='+row.revision);
          console.log('db_lifecycle='+row.lifecycle_status);
          console.log('projection_orderId='+String(p.orderId??''));
          console.log('projection_storeId='+String(p.storeId??''));
          console.log('projection_orderRevision='+String(p.orderRevision??''));
          console.log('projection_revision='+String(p.revision??''));
          console.log('policy_rows='+rows('policy').length);
          console.log('fulfillment_idempotency_rows='+rows('idempotency').length);
          NODE

      - name: Trigger post-commit recovery without creating business data
        shell: bash
        run: |
          set -euo pipefail
          printf '{}' >/tmp/invalid-customer-order.json
          HTTP="$(curl -sS -o /tmp/trigger.out.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/invalid-customer-order.json "$ADMIN_URL/api/customer/orders")"
          echo "customer_invalid_post_http=$HTTP" | tee evidence/trigger.txt
          cat /tmp/trigger.out.json | tee -a evidence/trigger.txt
          # Invalid request must fail before Order creation. The top-level Worker still schedules
          # only the existing post-commit recovery drains after handling any Customer POST.
          [[ "$HTTP" =~ ^4[0-9][0-9]$ ]]

      - name: Prove canonical Fulfillment release after trigger
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          SQL="SELECT f.fulfillment_id,f.order_id,f.store_id,f.revision,f.lifecycle_status,f.updated_at FROM mfos_fulfillment_state f JOIN mfos_order_state s ON s.order_id=f.order_id WHERE s.lifecycle_status='ACCEPTED' ORDER BY f.updated_at DESC LIMIT 20"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/post.json',JSON.stringify({sql:process.env.SQL}))"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/post.json > evidence/post.json
          node - <<'NODE' | tee evidence/post.txt
          const fs=require('fs');
          const x=require('./evidence/post.json');
          const rows=x.result?.[0]?.results||[];
          if(!x.success)throw new Error('POST_READ_FAILED');
          const target=fs.existsSync('/tmp/target-order')?fs.readFileSync('/tmp/target-order','utf8').trim():'';
          const matched=target?rows.find(r=>r.order_id===target):rows[0];
          console.log('fulfillment_rows_after='+rows.length);
          console.log('target_order_id='+target);
          console.log('matched='+String(Boolean(matched)));
          if(!matched)throw new Error('ORDER_TO_FULFILLMENT_RELEASE_NOT_OBSERVED');
          if(matched.lifecycle_status!=='PRODUCTION_AUTHORIZED')throw new Error('FULFILLMENT_RELEASE_STATE_INVALID:'+matched.lifecycle_status);
          console.log('fulfillment_id='+matched.fulfillment_id);
          console.log('fulfillment_status='+matched.lifecycle_status);
          console.log('order_to_fulfillment_live=PASS');
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-order-to-fulfillment-live-readback-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
