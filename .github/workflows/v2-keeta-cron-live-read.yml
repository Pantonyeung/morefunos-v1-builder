name: V2 Keeta Cron Live Read

on:
  push:
    branches: [main]
    paths:
      - 'requests/v2-keeta-cron-live-read.txt'
      - '.github/workflows/v2-keeta-cron-live-read.yml'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: morefun-v2-keeta-sit
      WRANGLER_VERSION: '4.125.0'
      SOURCE_SHA: d37266077847e9c0c46cdfa73eb4b4afc2673875
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read deployed Cron Triggers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/schedules"
          HTTP="$(curl -sS -o evidence/schedules.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL")"
          echo "http=$HTTP" | tee evidence/summary.txt
          test "$HTTP" = 200
          node - <<'NODE' | tee -a evidence/summary.txt
          const x=require('./evidence/schedules.json');
          if(!x.success) throw new Error('KEETA_CRON_READ_FAILED:'+JSON.stringify(x.errors||[]));
          const schedules=x.result?.schedules ?? x.result ?? [];
          const crons=Array.isArray(schedules)?schedules.map(s=>s.cron):[];
          console.log('crons='+JSON.stringify(crons));
          if(!crons.includes('* * * * *')) throw new Error('KEETA_CANONICAL_RECOVERY_CRON_NOT_REGISTERED');
          console.log('cron_registered=PASS');
          NODE
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install source and Wrangler
        working-directory: source
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --global "wrangler@$WRANGLER_VERSION" --no-audit --no-fund
      - name: Controlled remote scheduled invocation
        working-directory: source/workers/keeta
        shell: bash
        run: |
          set -euo pipefail
          wrangler dev --remote --test-scheduled --config wrangler.jsonc --port 8787 > "$GITHUB_WORKSPACE/evidence/dev.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8787/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl --fail-with-body --silent --show-error "http://127.0.0.1:8787/__scheduled?cron=*+*+*+*+*" | tee "$GITHUB_WORKSPACE/evidence/scheduled-response.txt"
          sleep 2
          cat "$GITHUB_WORKSPACE/evidence/dev.log" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-keeta-cron-live-read-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
