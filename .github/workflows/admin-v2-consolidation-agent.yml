name: Admin V2 Consolidation Agent

on:
  push:
    paths:
      - '.github/workflows/admin-v2-consolidation-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 342d7bc527894dc606ec3074e811ac2e481113c9

jobs:
  admin-consolidation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install Admin Web dependencies
        working-directory: source/apps/admin-web
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Full Admin Web tests
        working-directory: source/apps/admin-web
        run: npm test
      - name: Admin Web typecheck and build
        working-directory: source/apps/admin-web
        run: npm run build
