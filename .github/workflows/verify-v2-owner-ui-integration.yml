name: V2 Owner UI Integration Verification

on:
  push:
    paths:
      - 'requests/v2-owner-ui-integration-request.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          else
            test -f requests/v2-owner-ui-integration-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-owner-ui-integration-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Owner model tests
        working-directory: source
        run: node --experimental-strip-types --test apps/owner-web/src/model.test.ts

      - name: Management shared session tests
        working-directory: source
        run: node --test packages/management-ui-integration/*.test.ts

      - name: Owner runtime integration tests
        working-directory: source
        run: node --experimental-strip-types --test packages/owner-ui-integration/runtime-provider.test.ts

      - name: Owner runtime TypeScript
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../evidence
          set -o pipefail
          tsc --ignoreConfig --noEmit --allowImportingTsExtensions --module NodeNext --moduleResolution NodeNext --target ES2022 --types node packages/owner-ui-integration/runtime-provider.ts packages/owner-ui-integration/runtime-provider.test.ts 2>&1 | tee ../evidence/owner-runtime-typecheck.txt

      - name: Owner app typecheck
        working-directory: source/apps/owner-web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck

      - name: Owner app build
        working-directory: source/apps/owner-web
        run: npm run build

      - name: Owner fail-closed boundary
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OwnerProductionRoot' apps/owner-web/src/main.tsx
          grep -q 'createOwnerNetworkRuntime' apps/owner-web/src/OwnerProductionRoot.tsx
          grep -q "'/api/owner/runtime'" apps/owner-web/src/owner-network-runtime.ts
          grep -q "'/api/owner/session'" apps/owner-web/src/owner-session-network.ts
          grep -q "'/api/owner/bootstrap'" apps/owner-web/src/owner-session-network.ts
          grep -q 'OWNER_REPORTING_BINDING_NOT_FOUND' packages/owner-ui-integration/runtime-provider.ts
          ! grep -RniE 'fixture|mock|localStorage|/api/v2/owner|HttpOwner' apps/owner-web/src packages/owner-ui-integration --exclude='*.test.ts'
          ! grep -RniE 'production-persistence/d1|d1-admin-|D1DatabaseLike' apps/owner-web/src --exclude='*.test.ts'

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nworkflow=verify-v2-owner-ui-integration.yml\n' "$SOURCE_SHA" > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-owner-ui-integration-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
