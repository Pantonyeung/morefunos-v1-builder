name: Verify V2 Admin Control Plane Persistence

on:
  push:
    paths:
      - 'requests/v2-admin-control-plane-persistence-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-admin-control-plane-persistence-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exact source
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Control-plane D1 persistence contract
        working-directory: source
        run: node --test packages/production-persistence/d1-control-plane-state.test.ts
      - name: Merchant-store D1 repository contract
        working-directory: source
        run: node --test packages/merchant-store/d1-merchant-store-repository.test.ts
      - name: Identity RBAC D1 repository contract
        working-directory: source
        run: node --test packages/identity-rbac/d1-identity-rbac-repository.test.ts
      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck