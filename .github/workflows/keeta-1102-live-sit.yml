name: Keeta 1102 Live SIT Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morefun-v2-keeta-1102-live-sit
  cancel-in-progress: false

jobs:
  prove-1102:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_VERSION: '4.125.0'
      SHOP_ID: '721517434'
      WORKER_URL: 'https://morefun-v2-keeta-sit.pantonyeung.workers.dev'
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/morefun-v2-keeta-sit.sha | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Require Builder credentials
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f source/workers/keeta/src/index.ts
          printf 'verified_exact_sha=%s\n' "$EXPECTED_SHA"

      - name: Require handbook 1102 step authorization
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CURRENT_STORE_API_ITEM:.*1102' source/docs/rooms/integration/INTG-CUR.md || {
            echo 'HANDBOOK_STEP_NOT_AUTHORIZED_FOR_1102' >&2
            exit 1
          }

      - name: Prepare protected SIT probe secret
        shell: bash
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf 'KEETA_SIT_PROBE_KEY=%s\n' "$PROBE_KEY" > "$RUNNER_TEMP/keeta-1102-secrets.env"
          chmod 600 "$RUNNER_TEMP/keeta-1102-secrets.env"
          echo "PROBE_KEY=$PROBE_KEY" >> "$GITHUB_ENV"

      - name: Deploy exact source and probe secret in one Worker version
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc --secrets-file "$RUNNER_TEMP/keeta-1102-secrets.env"

      - name: Wait for protected Worker version readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            STATUS="$(curl --silent --output "$RUNNER_TEMP/readiness.json" --write-out '%{http_code}' -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-details?shopId=$SHOP_ID")"
            if [[ "$STATUS" == "200" ]]; then
              node - "$RUNNER_TEMP/readiness.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId) !== 721517434) process.exit(1);
          NODE
              exit 0
            fi
            sleep 2
          done
          echo 'KEETA_PROTECTED_RUNTIME_NOT_READY' >&2
          exit 1

      - name: Require live Open baseline before any mutation
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/readiness.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (Number(body.data?.status) !== 3) throw new Error(`STORE_NOT_OPEN status=${body.data?.status}`);
          NODE

      - name: Configure Keeta test webhook event 1102
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/configure-webhook-1102" > "$RUNNER_TEMP/configure-1102.json"
          node - "$RUNNER_TEMP/configure-1102.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || body.data?.eventId !== 1102 || body.data?.isTest !== 1) throw new Error(`KEETA_1102_CONFIG_FAILED ${JSON.stringify(body)}`);
          NODE

      - name: Record D1 baseline
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT COALESCE(MAX(updated_at),0) AS updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID; SELECT COUNT(*) AS dedup_count FROM keeta_webhook_dedup;" > "$RUNNER_TEMP/baseline.json"
          node - "$RUNNER_TEMP/baseline.json" <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const sets = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = sets.flatMap((set) => set.results ?? []);
          console.log(`BASE_UPDATED_AT=${Number(rows.find((r) => Object.hasOwn(r, 'updated_at'))?.updated_at ?? 0)}`);
          console.log(`BASE_DEDUP_COUNT=${Number(rows.find((r) => Object.hasOwn(r, 'dedup_count'))?.dedup_count ?? 0)}`);
          NODE

      - name: Suspend API test store
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-rest?shopId=$SHOP_ID" > "$RUNNER_TEMP/store-rest.json"
          node - "$RUNNER_TEMP/store-rest.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId) !== 721517434) throw new Error(`KEETA_TEST_STORE_REST_FAILED ${JSON.stringify(body)}`);
          NODE

      - name: Wait for live 1102 suspended webhook evidence
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json --command "SELECT shop_id,status,source,updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID; SELECT COUNT(*) AS dedup_count FROM keeta_webhook_dedup;" > "$RUNNER_TEMP/rest-evidence.json"
            if node - "$RUNNER_TEMP/rest-evidence.json" "$BASE_UPDATED_AT" "$BASE_DEDUP_COUNT" <<'NODE'
          const fs=require('fs'); const sets=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); const rows=sets.flatMap(x=>x.results??[]); const s=rows.find(r=>r.shop_id!==undefined); const d=Number(rows.find(r=>Object.hasOwn(r,'dedup_count'))?.dedup_count??0); if (!(s?.source==='WEBHOOK_1102' && Number(s.status)===4 && Number(s.updated_at)>Number(process.argv[3]) && d>Number(process.argv[4]))) process.exit(1);
          NODE
            then exit 0; fi
            sleep 5
          done
          echo 'KEETA_1102_REST_WEBHOOK_NOT_OBSERVED' >&2
          exit 1

      - name: Restore API test store to Open
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/store-open?shopId=$SHOP_ID" > "$RUNNER_TEMP/store-open.json"
          node - "$RUNNER_TEMP/store-open.json" <<'NODE'
          const fs=require('fs'); const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(body.code!==0||Number(body.data?.shopId)!==721517434) throw new Error(`KEETA_TEST_STORE_OPEN_FAILED ${JSON.stringify(body)}`);
          NODE

      - name: Record live SIT evidence
        if: success()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: printf 'builder_run_id=%s\nsource_sha=%s\nshop_id=%s\nevent_id=1102\nhandbook_order_guard=PASS\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$SHOP_ID"
