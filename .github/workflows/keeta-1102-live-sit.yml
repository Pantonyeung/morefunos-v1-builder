name: Keeta 1102 Live SIT Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keeta-1102-live-sit.yml'
      - '.ci-requests/morefun-v2-keeta-sit.sha'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morefun-v2-keeta-1102-live-sit
  cancel-in-progress: false

jobs:
  prove-1102:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_VERSION: '4.125.0'
      SHOP_ID: '721517434'
      WORKER_URL: 'https://morefun-v2-keeta-sit.pantonyeung.workers.dev'
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/morefun-v2-keeta-sit.sha | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Require Builder credentials
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f source/workers/keeta/src/index.ts
          printf 'verified_exact_sha=%s\n' "$EXPECTED_SHA"

      - name: Prepare protected SIT probe secret
        shell: bash
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf 'KEETA_SIT_PROBE_KEY=%s\n' "$PROBE_KEY" > "$RUNNER_TEMP/keeta-1102-secrets.env"
          chmod 600 "$RUNNER_TEMP/keeta-1102-secrets.env"
          echo "PROBE_KEY=$PROBE_KEY" >> "$GITHUB_ENV"

      - name: Deploy exact source and probe secret in one Worker version
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc --secrets-file "$RUNNER_TEMP/keeta-1102-secrets.env"

      - name: Wait for protected Worker version readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            STATUS="$(curl --silent --output "$RUNNER_TEMP/readiness.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $PROBE_KEY" \
              "$WORKER_URL/sit/store-details?shopId=$SHOP_ID")"
            if [[ "$STATUS" == "200" ]]; then
              node - "$RUNNER_TEMP/readiness.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId) !== 721517434) process.exit(1);
          NODE
              exit 0
            fi
            sleep 2
          done
          echo 'KEETA_PROTECTED_RUNTIME_NOT_READY' >&2
          cat "$RUNNER_TEMP/readiness.json" >&2 || true
          exit 1

      - name: Configure Keeta test webhook event 1102
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/configure-webhook-1102" > "$RUNNER_TEMP/configure-1102.json"
          node - "$RUNNER_TEMP/configure-1102.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0) throw new Error(`KEETA_1102_CONFIG_FAILED ${JSON.stringify(body)}`);
          if (body.data?.eventId !== 1102 || body.data?.isTest !== 1) throw new Error('KEETA_1102_CONFIG_EVIDENCE_INVALID');
          console.log(`keeta_1102_callback=${body.data.url}`);
          NODE

      - name: Record D1 baseline
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COALESCE(MAX(updated_at),0) AS updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID; SELECT COUNT(*) AS dedup_count FROM keeta_webhook_dedup;" \
            > "$RUNNER_TEMP/baseline.json"
          node - "$RUNNER_TEMP/baseline.json" <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const sets = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = sets.flatMap((set) => set.results ?? []);
          const updated = Number(rows.find((r) => Object.hasOwn(r, 'updated_at'))?.updated_at ?? 0);
          const count = Number(rows.find((r) => Object.hasOwn(r, 'dedup_count'))?.dedup_count ?? 0);
          console.log(`BASE_UPDATED_AT=${updated}`);
          console.log(`BASE_DEDUP_COUNT=${count}`);
          NODE

      - name: Open API test store
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/store-open?shopId=$SHOP_ID" > "$RUNNER_TEMP/store-open.json"
          node - "$RUNNER_TEMP/store-open.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId) !== 721517434) throw new Error(`KEETA_TEST_STORE_OPEN_FAILED ${JSON.stringify(body)}`);
          NODE

      - name: Wait for live 1102 open webhook evidence
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
              --command "SELECT shop_id,status,delivery_rest_status,pickup_rest_status,source,provider_timestamp,updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID; SELECT COUNT(*) AS dedup_count FROM keeta_webhook_dedup;" \
              > "$RUNNER_TEMP/open-evidence.json"
            if node - "$RUNNER_TEMP/open-evidence.json" "$BASE_UPDATED_AT" "$BASE_DEDUP_COUNT" <<'NODE'
          const fs = require('fs');
          const sets = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = sets.flatMap((set) => set.results ?? []);
          const status = rows.find((r) => r.shop_id !== undefined);
          const dedup = Number(rows.find((r) => Object.hasOwn(r, 'dedup_count'))?.dedup_count ?? 0);
          if (!(status?.source === 'WEBHOOK_1102' && Number(status.status) === 3 && Number(status.updated_at) > Number(process.argv[3]) && dedup > Number(process.argv[4]))) process.exit(1);
          NODE
            then
              node - "$RUNNER_TEMP/open-evidence.json" <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const sets = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = sets.flatMap((set) => set.results ?? []);
          const status = rows.find((r) => r.shop_id !== undefined);
          const dedup = Number(rows.find((r) => Object.hasOwn(r, 'dedup_count'))?.dedup_count ?? 0);
          console.log(`OPEN_UPDATED_AT=${status.updated_at}`);
          console.log(`OPEN_DEDUP_COUNT=${dedup}`);
          NODE
              cat "$RUNNER_TEMP/open-evidence.json"
              exit 0
            fi
            sleep 5
          done
          echo 'KEETA_1102_OPEN_WEBHOOK_NOT_OBSERVED' >&2
          exit 1

      - name: Restore API test store to rest
        if: always() && env.BASE_UPDATED_AT != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/store-rest?shopId=$SHOP_ID" > "$RUNNER_TEMP/store-rest.json"
          node - "$RUNNER_TEMP/store-rest.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId) !== 721517434) throw new Error(`KEETA_TEST_STORE_REST_FAILED ${JSON.stringify(body)}`);
          NODE

      - name: Wait for live 1102 rest webhook evidence
        if: always() && env.OPEN_UPDATED_AT != ''
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
              --command "SELECT shop_id,status,delivery_rest_status,pickup_rest_status,source,provider_timestamp,updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID; SELECT COUNT(*) AS dedup_count FROM keeta_webhook_dedup;" \
              > "$RUNNER_TEMP/rest-evidence.json"
            if node - "$RUNNER_TEMP/rest-evidence.json" "$OPEN_UPDATED_AT" "$OPEN_DEDUP_COUNT" <<'NODE'
          const fs = require('fs');
          const sets = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = sets.flatMap((set) => set.results ?? []);
          const status = rows.find((r) => r.shop_id !== undefined);
          const dedup = Number(rows.find((r) => Object.hasOwn(r, 'dedup_count'))?.dedup_count ?? 0);
          if (!(status?.source === 'WEBHOOK_1102' && Number(status.status) === 4 && Number(status.updated_at) > Number(process.argv[3]) && dedup > Number(process.argv[4]))) process.exit(1);
          NODE
            then
              cat "$RUNNER_TEMP/rest-evidence.json"
              exit 0
            fi
            sleep 5
          done
          echo 'KEETA_1102_REST_WEBHOOK_NOT_OBSERVED' >&2
          exit 1

      - name: Record live SIT evidence
        if: success()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          printf 'builder_run_id=%s\nsource_sha=%s\nshop_id=%s\nevent_id=1102\nopen_and_restore_webhooks=PASS\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$SHOP_ID"
