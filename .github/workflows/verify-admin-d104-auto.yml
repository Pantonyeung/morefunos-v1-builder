name: Admin D-104 Auto Verify

on:
  push:
    branches:
      - verify/admin-d104-20260821
    paths:
      - .github/workflows/verify-admin-d104-auto.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-admin-d104-auto.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-admin:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 396334154d77c160bece5d7dbae5e2f92a3abde2
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use npm 11
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11 --no-audit --no-fund
          npm --version

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Admin dependencies and generate lockfile
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          test -f package-lock.json

      - name: Run Admin tests
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/admin-test.log"

      - name: Run Admin typecheck and build
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/admin-build.log"
          test -f dist/index.html

      - name: Install Playwright Chromium for D-103 capture
        shell: bash
        run: |
          set -euo pipefail
          npx -y playwright@1.61.0 install --with-deps chromium

      - name: Start deterministic Admin preview
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          nohup npm exec vite -- preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/admin-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/admin-preview.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/admin/overview >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/admin-preview.log"
          exit 1

      - name: Capture locked desktop tablet and mobile routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/screenshots/desktop evidence/screenshots/tablet evidence/screenshots/mobile
          cat > "$RUNNER_TEMP/capture-admin.mjs" <<'EOF'
          import { chromium } from 'playwright';
          const routes = [
            ['GR-ADM-01','/admin/overview'],
            ['GR-ADM-02','/admin/catalog/products/PRC-001'],
            ['GR-ADM-03','/admin/catalog/options/OPT-001'],
            ['GR-ADM-04','/admin/catalog/combos/COM-001'],
            ['GR-ADM-05','/admin/storefront'],
            ['GR-ADM-06','/admin/operations/pickup-queue'],
            ['GR-ADM-07','/admin/settings/port-exposure'],
            ['GR-ADM-08','/admin/print-kitchen'],
            ['GR-ADM-09','/admin/publish'],
          ];
          const viewports = [
            ['desktop', {width:1448,height:1086}],
            ['tablet', {width:1024,height:1366}],
            ['mobile', {width:390,height:844}],
          ];
          const browser = await chromium.launch({headless:true});
          const overflowFailures = [];
          for (const [name, viewport] of viewports) {
            const context = await browser.newContext({viewport, deviceScaleFactor:1, reducedMotion:'reduce'});
            const page = await context.newPage();
            for (const [id, route] of routes) {
              await page.goto(`http://127.0.0.1:4173${route}`, {waitUntil:'networkidle'});
              await page.evaluate(() => document.fonts?.ready);
              const overflow = await page.evaluate(() => ({width: window.innerWidth, scrollWidth: document.documentElement.scrollWidth, bodyScrollWidth: document.body.scrollWidth}));
              if (overflow.scrollWidth > overflow.width + 2 || overflow.bodyScrollWidth > overflow.width + 2) overflowFailures.push({name,id,route,...overflow});
              await page.screenshot({path:`evidence/screenshots/${name}/${id}.png`, fullPage:false, animations:'disabled'});
            }
            await context.close();
          }
          await browser.close();
          if (overflowFailures.length) { console.error(JSON.stringify(overflowFailures,null,2)); process.exit(2); }
          EOF
          mkdir -p "$RUNNER_TEMP/playwright-runner"
          cd "$RUNNER_TEMP/playwright-runner"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.61.0 --no-audit --no-fund >/dev/null
          cp "$RUNNER_TEMP/capture-admin.mjs" ./capture-admin.mjs
          ln -s "$GITHUB_WORKSPACE/evidence" ./evidence
          node ./capture-admin.mjs
          test "$(find evidence/screenshots -name 'GR-ADM-*.png' | wc -l)" -eq 27

      - name: Run D-105 browser interaction acceptance
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/interaction-admin.mjs" <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1024,height:900}, reducedMotion:'reduce'});
          const page = await context.newPage();
          const base = 'http://127.0.0.1:4173';
          await page.goto(`${base}/admin/overview`, {waitUntil:'networkidle'});
          await page.getByRole('link', {name:'Catalog'}).click();
          await page.getByRole('heading', {name:'Product', level:1}).waitFor();
          const firstSwitch = page.locator('.fake-toggle').first();
          const switchBefore = await firstSwitch.getAttribute('aria-checked'); await firstSwitch.click();
          if (switchBefore === await firstSwitch.getAttribute('aria-checked')) throw new Error('Toggle did not change');
          await page.getByRole('status').filter({hasText:'not published'}).waitFor();
          const optionsCapability = page.getByRole('button', {name:'Options'});
          const capBefore = await optionsCapability.getAttribute('aria-pressed'); await optionsCapability.click();
          if (capBefore === await optionsCapability.getAttribute('aria-pressed')) throw new Error('Capability did not change');
          await page.goto(`${base}/admin/operations/pickup-queue`, {waitUntil:'networkidle'});
          const timing = page.getByText('10 min', {exact:true}).first(); await timing.click();
          if (!(await timing.evaluate(el=>el.classList.contains('is-selected')))) throw new Error('Timing not selected');
          await page.goto(`${base}/admin/storefront`, {waitUntil:'networkidle'});
          await page.getByRole('button', {name:'Apply Changes'}).click(); await page.getByRole('status').filter({hasText:'Runtime Authority not invoked'}).waitFor();
          await page.goto(`${base}/admin/settings/port-exposure`, {waitUntil:'networkidle'});
          const ex = page.locator('.exposure-table .fake-toggle').first(); const exBefore=await ex.getAttribute('aria-checked'); await ex.click(); if(exBefore===await ex.getAttribute('aria-checked')) throw new Error('Exposure toggle did not change');
          await page.goto(`${base}/admin/print-kitchen`, {waitUntil:'networkidle'});
          await page.getByRole('button', {name:'Open Print Center'}).click(); await page.getByRole('status').filter({hasText:'Runtime Authority not invoked'}).waitFor();
          await page.goto(`${base}/admin/publish`, {waitUntil:'networkidle'});
          await page.getByRole('button', {name:/Publish v1\.8\.5/i}).click(); await page.getByRole('status').filter({hasText:'Runtime Authority not invoked'}).waitFor();
          await page.getByRole('button', {name:/Prepare Rollback/i}).click(); await page.getByRole('status').filter({hasText:'Runtime Authority not invoked'}).waitFor();
          await browser.close(); console.log('D-105 browser interactions PASS');
          EOF
          cd "$RUNNER_TEMP/playwright-runner"
          cp "$RUNNER_TEMP/interaction-admin.mjs" ./interaction-admin.mjs
          node ./interaction-admin.mjs 2>&1 | tee "$RUNNER_TEMP/admin-interaction.log"

      - name: Prepare evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp source/apps/admin-web/package-lock.json evidence/package-lock.json 2>/dev/null || true
          cp "$RUNNER_TEMP/admin-test.log" evidence/admin-test.log 2>/dev/null || true
          cp "$RUNNER_TEMP/admin-build.log" evidence/admin-build.log 2>/dev/null || true
          cp "$RUNNER_TEMP/admin-preview.log" evidence/admin-preview.log 2>/dev/null || true
          cp "$RUNNER_TEMP/admin-interaction.log" evidence/admin-interaction.log 2>/dev/null || true
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
          if [ -d source/apps/admin-web/dist ]; then cp -R source/apps/admin-web/dist evidence/dist; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-d104-evidence-${{ env.SOURCE_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
