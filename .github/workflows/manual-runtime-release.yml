name: Owner Manual V1 Runtime Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA from Pantonyeung/morefunos-v1'
        required: true
        type: string
      release_channel:
        description: 'Runtime channel'
        required: true
        default: candidate
        type: choice
        options:
          - stable
          - candidate
          - dev
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: owner-manual-v1-runtime-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.actor == 'Pantonyeung' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 2 &&
        startsWith(github.event.comment.body, '/release-runtime ')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_REPO: Pantonyeung/morefunos-v1
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || '' }}
      RELEASE_CHANNEL: ${{ inputs.release_channel || '' }}
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      EXPECTED_APP_SIGNING_CERT_SHA256: 8f66270541c419a90ae0e8b94a2c7796e13d5c06805b0919ce3f7f5b3602857a
      MIN_CARRIER_VERSION_CODE: '15'
      BRIDGE_VERSION: '1'

    steps:
      - name: Validate immutable runtime release request
        id: request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            EXPECTED_VERB='/release-runtime'
            read -r COMMAND_VERB COMMAND_SHA COMMAND_CHANNEL COMMAND_EXTRA <<< "$COMMAND"
            if [[ "$COMMAND_VERB" != "$EXPECTED_VERB" || -z "${COMMAND_SHA:-}" || -z "${COMMAND_CHANNEL:-}" || -n "${COMMAND_EXTRA:-}" ]]; then
              echo "Runtime release command must contain exactly: /release-runtime <sha> <channel>." >&2
              exit 1
            fi
            REQUESTED_SOURCE_SHA="$COMMAND_SHA"
            RELEASE_CHANNEL="$COMMAND_CHANNEL"
          fi

          NORMALIZED_SOURCE_SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]')"
          if [[ ! "$NORMALIZED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must normalize to an exact 40-character Git commit SHA" >&2
            exit 1
          fi
          case "$RELEASE_CHANNEL" in
            stable|candidate|dev) ;;
            *) echo "release_channel invalid" >&2; exit 1 ;;
          esac
          echo "source_sha=${NORMALIZED_SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_CHANNEL=$RELEASE_CHANNEL" >> "$GITHUB_ENV"
          echo "Accepted Owner runtime release request on channel: $RELEASE_CHANNEL"

      - name: Checkout builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup JDK 17 for standard JAR signing
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify builder remains policy-constrained
        run: node scripts/verify-builder-policy.mjs

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo "Verified immutable private source SHA."

      - name: Install pinned TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"

      - name: Verify and build runtime privately
        id: build_core
        continue-on-error: true
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/private-runtime-release.log"
          : > "$LOG"
          run_stage() {
            local stage="$1"; shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            echo "$stage: FAIL (details withheld from public log)"
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            return 1
          }
          cd source
          run_stage "runtime-g6-static" npm run test:g6 || exit 1
          run_stage "runtime-g6-typecheck" npm run typecheck:g6 || exit 1
          run_stage "runtime-smt-web-locked-install" npm --prefix apps/smt-web ci --no-audit --no-fund || exit 1
          run_stage "runtime-smt-web-tests" npm --prefix apps/smt-web test || exit 1
          run_stage "runtime-smt-web-build" npm --prefix apps/smt-web run build || exit 1
          test -f apps/smt-web/dist/index.html || { echo "failed_stage=runtime-entrypoint" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "Private runtime verification/build core: PASS"

      - name: Sign runtime bundle with stable app-signing identity
        if: steps.build_core.outcome == 'success'
        id: signing
        shell: bash
        env:
          V1_ANDROID_KEYSTORE_B64: ${{ secrets.V1_ANDROID_KEYSTORE_B64 }}
          V1_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V1_ANDROID_KEYSTORE_PASSWORD }}
          V1_ANDROID_KEY_ALIAS: ${{ secrets.V1_ANDROID_KEY_ALIAS }}
          V1_ANDROID_KEY_PASSWORD: ${{ secrets.V1_ANDROID_KEY_PASSWORD }}
          NORMALIZED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          for required_name in V1_ANDROID_KEYSTORE_B64 V1_ANDROID_KEYSTORE_PASSWORD V1_ANDROID_KEY_ALIAS V1_ANDROID_KEY_PASSWORD; do
            test -n "${!required_name:-}" || { echo "Stable signing configuration incomplete: $required_name" >&2; exit 1; }
          done

          KEYSTORE="$RUNNER_TEMP/morefunos-v1-app-signing.p12"
          CERT_DER="$RUNNER_TEMP/morefunos-v1-app-signing.der"
          printf '%s' "$V1_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -exportcert \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$V1_ANDROID_KEY_ALIAS" \
            -file "$CERT_DER" >/dev/null 2>&1
          CERT_SHA256="$(sha256sum "$CERT_DER" | awk '{print $1}')"
          test "$CERT_SHA256" = "$EXPECTED_APP_SIGNING_CERT_SHA256"

          SHORT_SHA="${NORMALIZED_SOURCE_SHA:0:12}"
          RELEASE_ID="runtime-${RELEASE_CHANNEL}-${SHORT_SHA}"
          RUNTIME_VERSION="${SHORT_SHA}"
          RUNTIME_FILENAME="MoreFunOS-SMT-${RELEASE_ID}.mfos"
          RUNTIME_BUNDLE="$GITHUB_WORKSPACE/$RUNTIME_FILENAME"
          MANIFEST="$RUNNER_TEMP/MANIFEST.MF"
          cat > "$MANIFEST" <<EOF
          Manifest-Version: 1.0
          MoreFun-Release-Id: ${RELEASE_ID}
          MoreFun-Runtime-Version: ${RUNTIME_VERSION}
          MoreFun-Channel: ${RELEASE_CHANNEL}
          MoreFun-Min-Carrier-Version-Code: ${MIN_CARRIER_VERSION_CODE}
          MoreFun-Bridge-Version: ${BRIDGE_VERSION}
          EOF
          sed -i 's/^          //' "$MANIFEST"

          jar cfm "$RUNTIME_BUNDLE" "$MANIFEST" -C source/apps/smt-web/dist .
          jarsigner \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$V1_ANDROID_KEY_PASSWORD" \
            "$RUNTIME_BUNDLE" "$V1_ANDROID_KEY_ALIAS" >/dev/null
          jarsigner -verify -strict "$RUNTIME_BUNDLE" >/dev/null

          BUNDLE_SHA256="$(sha256sum "$RUNTIME_BUNDLE" | awk '{print $1}')"
          BUNDLE_BYTES="$(stat -c%s "$RUNTIME_BUNDLE")"
          echo "runtime_bundle=$RUNTIME_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "runtime_filename=$RUNTIME_FILENAME" >> "$GITHUB_OUTPUT"
          echo "runtime_sha256=$BUNDLE_SHA256" >> "$GITHUB_OUTPUT"
          echo "runtime_bytes=$BUNDLE_BYTES" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Stable runtime signing identity verified: PASS"

          rm -f "$KEYSTORE" "$CERT_DER" "$MANIFEST"

      - name: Generate provider-neutral runtime OTA manifest
        if: steps.build_core.outcome == 'success' && steps.signing.outcome == 'success'
        id: metadata
        shell: bash
        env:
          NORMALIZED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RELEASE_ID: ${{ steps.signing.outputs.release_id }}
          RUNTIME_VERSION: ${{ steps.signing.outputs.runtime_version }}
          RUNTIME_FILENAME: ${{ steps.signing.outputs.runtime_filename }}
          RUNTIME_SHA256: ${{ steps.signing.outputs.runtime_sha256 }}
          RUNTIME_BYTES: ${{ steps.signing.outputs.runtime_bytes }}
          CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          export NORMALIZED_SOURCE_SHA RELEASE_ID RUNTIME_VERSION RUNTIME_FILENAME RUNTIME_SHA256 RUNTIME_BYTES CERT_SHA256 RELEASE_CHANNEL MIN_CARRIER_VERSION_CODE BRIDGE_VERSION
          node <<'NODE'
          const fs = require('node:fs');
          const update = {
            releaseId: process.env.RELEASE_ID,
            runtimeVersion: process.env.RUNTIME_VERSION,
            channel: process.env.RELEASE_CHANNEL,
            minCarrierVersionCode: Number(process.env.MIN_CARRIER_VERSION_CODE),
            bridgeVersion: Number(process.env.BRIDGE_VERSION),
            bundleUrl: process.env.RUNTIME_FILENAME,
            archiveSha256: process.env.RUNTIME_SHA256,
          };
          const metadata = {
            sourceRepository: process.env.SOURCE_REPO,
            sourceSha: process.env.NORMALIZED_SOURCE_SHA,
            ...update,
            runtimeFilename: process.env.RUNTIME_FILENAME,
            runtimeBytes: Number(process.env.RUNTIME_BYTES),
            signingCertificateSha256: process.env.CERT_SHA256,
            builderRepository: process.env.GITHUB_REPOSITORY,
            builderSha: process.env.GITHUB_SHA,
            builderRunId: process.env.GITHUB_RUN_ID,
            builtAtUtc: new Date().toISOString(),
          };
          fs.writeFileSync('runtime-update.json', JSON.stringify(update, null, 2) + '\n');
          fs.writeFileSync('runtime-build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          fs.writeFileSync('RUNTIME_SHA256SUMS', `${process.env.RUNTIME_SHA256}  ${process.env.RUNTIME_FILENAME}\n`);
          NODE

      - name: Deliver signed runtime privately to V1 source repository Release
        if: steps.build_core.outcome == 'success' && steps.signing.outcome == 'success'
        id: delivery
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
          NORMALIZED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RUNTIME_BUNDLE: ${{ steps.signing.outputs.runtime_bundle }}
          RUNTIME_FILENAME: ${{ steps.signing.outputs.runtime_filename }}
          RELEASE_ID: ${{ steps.signing.outputs.release_id }}
          RUNTIME_SHA256: ${{ steps.signing.outputs.runtime_sha256 }}
          CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Private artifact delivery configuration is incomplete: missing V1_ARTIFACT_DELIVERY_TOKEN" >&2; exit 1; }
          TAG="builder-v1-${RELEASE_ID}-run-${GITHUB_RUN_ID}"
          EXTRA=(--prerelease)
          gh release create "$TAG" \
            "$RUNTIME_BUNDLE" \
            runtime-update.json \
            runtime-build-metadata.json \
            RUNTIME_SHA256SUMS \
            --repo "$SOURCE_REPO" \
            --target "$NORMALIZED_SOURCE_SHA" \
            --title "MoreFunOS SMT ${RELEASE_ID}" \
            --notes "Owner-manual immutable V1 Runtime package from ${NORMALIZED_SOURCE_SHA}. Channel: ${RELEASE_CHANNEL}. Minimum carrier versionCode: ${MIN_CARRIER_VERSION_CODE}. Stable signing certificate SHA-256: ${CERT_SHA256}. Bundle SHA-256: ${RUNTIME_SHA256}. Private artifact delivery only; not Device/Hardware/Operational PASS." \
            "${EXTRA[@]}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Private V1 Runtime delivery: PASS"

      - name: Generate sanitized runtime release evidence
        if: steps.delivery.outcome == 'success'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.delivery.outputs.release_tag }}
          RELEASE_ID: ${{ steps.signing.outputs.release_id }}
          RUNTIME_SHA256: ${{ steps.signing.outputs.runtime_sha256 }}
          RUNTIME_BYTES: ${{ steps.signing.outputs.runtime_bytes }}
          CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          echo "runtime-release-tag=$RELEASE_TAG"
          echo "runtime-release-id=$RELEASE_ID"
          echo "runtime-release-sha256=$RUNTIME_SHA256"
          echo "runtime-release-bytes=$RUNTIME_BYTES"
          echo "runtime-release-signing-cert-sha256=$CERT_SHA256"
          echo "runtime-release-min-carrier-version-code=$MIN_CARRIER_VERSION_CODE"

      - name: Fail after sanitized evidence
        if: steps.build_core.outcome != 'success' || steps.signing.outcome == 'failure' || steps.delivery.outcome == 'failure'
        shell: bash
        env:
          BUILD_FAILED_STAGE: ${{ steps.build_core.outputs.failed_stage }}
        run: |
          set -euo pipefail
          echo "Runtime release failed at ${BUILD_FAILED_STAGE:-signing-or-delivery}. Private details withheld." >&2
          exit 1
