name: Owner Manual V1 Runtime OTA Package

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA from Pantonyeung/morefunos-v1'
        required: true
        type: string
      runtime_version:
        description: 'Runtime version label, e.g. 0.1.0'
        required: true
        type: string
      channel:
        description: 'Runtime release channel'
        required: true
        type: choice
        options:
          - candidate
          - stable
          - dev
        default: candidate
      min_carrier_version_code:
        description: 'Minimum compatible SMT carrier versionCode'
        required: true
        type: string
        default: '13'

permissions:
  contents: read

concurrency:
  group: owner-manual-v1-runtime-ota
  cancel-in-progress: false

jobs:
  package:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: Pantonyeung/morefunos-v1
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUESTED_RUNTIME_VERSION: ${{ inputs.runtime_version }}
      REQUESTED_CHANNEL: ${{ inputs.channel }}
      REQUESTED_MIN_CARRIER: ${{ inputs.min_carrier_version_code }}
      BRIDGE_VERSION: '1'
      EXPECTED_APP_SIGNING_CERT_SHA256: 8f66270541c419a90ae0e8b94a2c7796e13d5c06805b0919ce3f7f5b3602857a

    steps:
      - name: Validate immutable runtime package request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          RUNTIME_VERSION="$(printf '%s' "$REQUESTED_RUNTIME_VERSION" | tr -d '[:space:]')"
          MIN_CARRIER="$(printf '%s' "$REQUESTED_MIN_CARRIER" | tr -d '[:space:]')"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must normalize to an exact 40-character Git commit SHA" >&2
            exit 1
          fi
          if [[ ! "$RUNTIME_VERSION" =~ ^[A-Za-z0-9._-]{1,48}$ ]]; then
            echo "runtime_version must use only A-Z a-z 0-9 . _ - and be <= 48 characters" >&2
            exit 1
          fi
          if [[ "$REQUESTED_CHANNEL" != "candidate" && "$REQUESTED_CHANNEL" != "stable" && "$REQUESTED_CHANNEL" != "dev" ]]; then
            echo "channel invalid" >&2
            exit 1
          fi
          if [[ ! "$MIN_CARRIER" =~ ^[0-9]+$ ]] || (( MIN_CARRIER < 12 )); then
            echo "min_carrier_version_code must be an integer >= 12" >&2
            exit 1
          fi
          RELEASE_ID="runtime-${RUNTIME_VERSION}-${SOURCE_SHA:0:12}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$REQUESTED_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "min_carrier=$MIN_CARRIER" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Validated immutable V1 Runtime OTA request."

      - name: Checkout builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify builder remains policy-constrained
        run: |
          node scripts/verify-builder-policy.mjs
          node scripts/verify-runtime-ota-policy.mjs
          node scripts/verify-runtime-ota-manifest-contract.mjs

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo "Verified immutable private source SHA: $ACTUAL_SOURCE_SHA"

      - name: Install pinned TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"
          echo "Pinned TypeScript 5.8.3: PASS"

      - name: Verify and build SMT Web Runtime
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npm --prefix apps/smt-web ci --no-audit --no-fund
          npm run test:g5
          npm run typecheck:g5
          npm --prefix apps/smt-web test
          npm --prefix apps/smt-web run build
          test -f apps/smt-web/dist/index.html
          echo "SMT Web Runtime verification/build: PASS"

      - name: Stable-sign Runtime OTA package
        id: package
        working-directory: source
        shell: bash
        env:
          V1_ANDROID_KEYSTORE_B64: ${{ secrets.V1_ANDROID_KEYSTORE_B64 }}
          V1_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V1_ANDROID_KEYSTORE_PASSWORD }}
          V1_ANDROID_KEY_ALIAS: ${{ secrets.V1_ANDROID_KEY_ALIAS }}
          V1_ANDROID_KEY_PASSWORD: ${{ secrets.V1_ANDROID_KEY_PASSWORD }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RUNTIME_VERSION: ${{ steps.request.outputs.runtime_version }}
          CHANNEL: ${{ steps.request.outputs.channel }}
          MIN_CARRIER: ${{ steps.request.outputs.min_carrier }}
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
        run: |
          set -euo pipefail
          for required_name in \
            V1_ANDROID_KEYSTORE_B64 \
            V1_ANDROID_KEYSTORE_PASSWORD \
            V1_ANDROID_KEY_ALIAS \
            V1_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Stable runtime-signing configuration is incomplete: missing $required_name" >&2
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/morefunos-v1-runtime-signing.p12"
          CERT_PEM="$RUNNER_TEMP/morefunos-v1-runtime-cert.pem"
          MANIFEST="$RUNNER_TEMP/MANIFEST.MF"
          BUNDLE="MoreFunOS-Runtime-${RUNTIME_VERSION}-${SOURCE_SHA:0:12}.mfos"

          printf '%s' "$V1_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -exportcert -rfc \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$V1_ANDROID_KEY_ALIAS" \
            -file "$CERT_PEM" >/dev/null
          CERT_SHA256="$(openssl x509 -in "$CERT_PEM" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$CERT_SHA256" = "$EXPECTED_APP_SIGNING_CERT_SHA256"

          cat > "$MANIFEST" <<EOF
          Manifest-Version: 1.0
          MoreFun-Release-Id: ${RELEASE_ID}
          MoreFun-Runtime-Version: ${RUNTIME_VERSION}
          MoreFun-Channel: ${CHANNEL}
          MoreFun-Min-Carrier-Version-Code: ${MIN_CARRIER}
          MoreFun-Bridge-Version: ${BRIDGE_VERSION}

          EOF
          sed -i 's/^          //' "$MANIFEST"

          jar --create --file "$BUNDLE" --manifest "$MANIFEST" -C apps/smt-web/dist .
          jarsigner \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$V1_ANDROID_KEY_PASSWORD" \
            "$BUNDLE" "$V1_ANDROID_KEY_ALIAS" >/dev/null
          jarsigner -verify -strict \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$V1_ANDROID_KEYSTORE_PASSWORD" \
            "$BUNDLE" >/dev/null

          BUNDLE_SHA256="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          BUNDLE_BYTES="$(stat -c%s "$BUNDLE")"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$BUNDLE" > RUNTIME_SHA256SUMS

          export BUNDLE BUNDLE_SHA256 BUNDLE_BYTES CERT_SHA256 SOURCE_SHA RUNTIME_VERSION CHANNEL MIN_CARRIER RELEASE_ID BRIDGE_VERSION
          node <<'NODE'
          const fs = require('node:fs');
          const metadata = {
            sourceRepository: 'Pantonyeung/morefunos-v1',
            sourceSha: process.env.SOURCE_SHA,
            releaseId: process.env.RELEASE_ID,
            runtimeVersion: process.env.RUNTIME_VERSION,
            channel: process.env.CHANNEL,
            minCarrierVersionCode: Number(process.env.MIN_CARRIER),
            bridgeVersion: Number(process.env.BRIDGE_VERSION),
            bundleFilename: process.env.BUNDLE,
            bundleSha256: process.env.BUNDLE_SHA256,
            bundleBytes: Number(process.env.BUNDLE_BYTES),
            signerCertificateSha256: process.env.CERT_SHA256,
            builtAtUtc: new Date().toISOString()
          };
          const updateManifest = {
            releaseId: process.env.RELEASE_ID,
            runtimeVersion: process.env.RUNTIME_VERSION,
            channel: process.env.CHANNEL,
            minCarrierVersionCode: Number(process.env.MIN_CARRIER),
            bridgeVersion: Number(process.env.BRIDGE_VERSION),
            bundleUrl: process.env.BUNDLE,
            archiveSha256: process.env.BUNDLE_SHA256
          };
          fs.writeFileSync('runtime-build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          fs.writeFileSync('runtime-update.json', JSON.stringify(updateManifest, null, 2) + '\n');
          NODE

          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$BUNDLE_SHA256" >> "$GITHUB_OUTPUT"
          echo "bundle_bytes=$BUNDLE_BYTES" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Stable Runtime OTA signing identity verified: PASS"

      - name: Deliver Runtime OTA package privately to V1 source repository Release
        id: delivery
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
          RUNTIME_VERSION: ${{ steps.request.outputs.runtime_version }}
          CHANNEL: ${{ steps.request.outputs.channel }}
          BUNDLE: ${{ steps.package.outputs.bundle }}
          BUNDLE_SHA256: ${{ steps.package.outputs.bundle_sha256 }}
          CERT_SHA256: ${{ steps.package.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Private artifact delivery configuration is incomplete: missing V1_ARTIFACT_DELIVERY_TOKEN" >&2
            exit 1
          fi
          TAG="builder-v1-runtime-${RUNTIME_VERSION}-${SOURCE_SHA:0:12}-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            "$BUNDLE" \
            runtime-build-metadata.json \
            runtime-update.json \
            RUNTIME_SHA256SUMS \
            --repo "$SOURCE_REPO" \
            --target "$SOURCE_SHA" \
            --title "Runtime ${RUNTIME_VERSION} | ${CHANNEL} | ${SOURCE_SHA:0:12}" \
            --notes "Owner-manual immutable V1 Runtime OTA package ${RELEASE_ID}. Source ${SOURCE_SHA}. Stable signer certificate SHA-256: ${CERT_SHA256}. Bundle SHA-256: ${BUNDLE_SHA256}. Runtime package evidence only; not Device/Operational/Production PASS." \
            --prerelease
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Private V1 Runtime OTA delivery: PASS"

      - name: Generate sanitized Runtime OTA evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.delivery.outputs.release_tag }}
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
          BUNDLE_SHA256: ${{ steps.package.outputs.bundle_sha256 }}
          BUNDLE_BYTES: ${{ steps.package.outputs.bundle_bytes }}
          CERT_SHA256: ${{ steps.package.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          echo "runtime-ota-release-tag=$RELEASE_TAG"
          echo "runtime-ota-release-id=$RELEASE_ID"
          echo "runtime-ota-bundle-sha256=$BUNDLE_SHA256"
          echo "runtime-ota-bundle-bytes=$BUNDLE_BYTES"
          echo "runtime-ota-signing-cert-sha256=$CERT_SHA256"

      - name: Remove temporary runtime signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/morefunos-v1-runtime-signing.p12" "$RUNNER_TEMP/morefunos-v1-runtime-cert.pem" "$RUNNER_TEMP/MANIFEST.MF"
