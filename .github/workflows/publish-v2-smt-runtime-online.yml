name: V2 SMT Runtime Online Publication

on:
  push:
    paths:
      - 'requests/v2-smt-runtime-online-publish-request.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string
      package_run_id:
        description: Successful V2 SMT signed runtime package run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-smt-ota-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORKER_NAME: morefunos-v2-smt-ota
      BUCKET_NAME: morefunos-v2-smt-ota
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve immutable request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            PACKAGE_RUN_ID="$(printf '%s' "$INPUT_PACKAGE_RUN_ID" | tr -d '[:space:]')"
          else
            test -f requests/v2-smt-runtime-online-publish-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smt-runtime-online-publish-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            PACKAGE_RUN_ID="$(sed -n 's/^package_run_id=//p' requests/v2-smt-runtime-online-publish-request.txt | tr -d '[:space:]')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "package_run_id=$PACKAGE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=v2-smt-runtime-runtime-candidate-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Require credentials
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact V2 source identity and publisher boundary
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          test -f source/infra/cloudflare/smt-ota-worker/scripts/publish-runtime.mjs
          test -f source/infra/cloudflare/smt-ota-worker/wrangler.jsonc
          node source/infra/cloudflare/smt-ota-worker/test/publish-runtime.test.mjs
          ! grep -R -F 'morefunos-v1' source/infra/cloudflare/smt-ota-worker

      - name: Download exact signed Runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: package
          run-id: ${{ steps.request.outputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Verify package source identity and local hashes before publication
        id: package
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
          EXPECTED_RUN: ${{ steps.request.outputs.package_run_id }}
        run: |
          set -euo pipefail
          test -f package/runtime-build-metadata.json
          test -f package/runtime-update.json
          test -f package/RUNTIME_SHA256SUMS
          BUNDLE="$(find package -maxdepth 1 -type f -name 'MoreFunOS-SMT-runtime-*.mfos' -print -quit)"
          test -n "$BUNDLE"
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const meta=JSON.parse(fs.readFileSync('package/runtime-build-metadata.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('package/runtime-update.json','utf8'));
          const expected=process.env.EXPECTED_SHA;
          const run=process.env.EXPECTED_RUN;
          if(meta.sourceSha!==expected) throw new Error('PACKAGE_SOURCE_SHA_MISMATCH');
          if(String(meta.builderRunId)!==run) throw new Error('PACKAGE_RUN_ID_MISMATCH');
          if(meta.publicationStatus!=='UNPUBLISHED'||meta.deviceAcceptance!=='NOT_EXECUTED') throw new Error('PACKAGE_PREPUBLICATION_STATE_INVALID');
          if(meta.releaseId!==manifest.releaseId||meta.runtimeVersion!==manifest.runtimeVersion||meta.bundleUrl!==manifest.bundleUrl||meta.archiveSha256!==manifest.archiveSha256) throw new Error('PACKAGE_MANIFEST_IDENTITY_MISMATCH');
          if(meta.minCarrierVersionCode!==24||meta.bridgeVersion!==1||manifest.minCarrierVersionCode!==24||manifest.bridgeVersion!==1) throw new Error('PACKAGE_CARRIER_CONTRACT_MISMATCH');
          if(path.basename(meta.bundleUrl)!==meta.bundleUrl) throw new Error('PACKAGE_BUNDLE_PATH_INVALID');
          NODE
          EXPECTED_HASH="$(node -p "JSON.parse(require('fs').readFileSync('package/runtime-update.json','utf8')).archiveSha256")"
          ACTUAL_HASH="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          test "$ACTUAL_HASH" = "$EXPECTED_HASH"
          grep -Fx "$EXPECTED_HASH  $(basename "$BUNDLE")" package/RUNTIME_SHA256SUMS >/dev/null
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "release_id=$(node -p "JSON.parse(require('fs').readFileSync('package/runtime-update.json','utf8')).releaseId")" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$EXPECTED_HASH" >> "$GITHUB_OUTPUT"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pinned Worker dependencies
        working-directory: source/infra/cloudflare/smt-ota-worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify V2 bucket and Worker identity before mutation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --prefix source/infra/cloudflare/smt-ota-worker wrangler r2 bucket list | grep -F "$BUCKET_NAME" >/dev/null
          npx --prefix source/infra/cloudflare/smt-ota-worker wrangler deployments status --name "$WORKER_NAME" >/tmp/deploy-status.txt
          test -s /tmp/deploy-status.txt

      - name: Resolve V2 public origin
        id: public
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            > "$RUNNER_TEMP/workers-subdomain.json"
          SUBDOMAIN="$(node -e "const r=require(process.argv[1]); if(!r.success||!r.result?.subdomain) process.exit(1); process.stdout.write(r.result.subdomain)" "$RUNNER_TEMP/workers-subdomain.json")"
          echo "origin=https://$WORKER_NAME.$SUBDOMAIN.workers.dev/" >> "$GITHUB_OUTPUT"

      - name: Publish package-first public-proof manifest-last
        id: publish
        working-directory: source/infra/cloudflare/smt-ota-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOREFUN_V2_SMT_OTA_BUCKET: morefunos-v2-smt-ota
          BUNDLE: ${{ github.workspace }}/${{ steps.package.outputs.bundle }}
          MANIFEST: ${{ github.workspace }}/package/runtime-update.json
          PUBLIC_BASE: ${{ steps.public.outputs.origin }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            if node scripts/publish-runtime.mjs "$BUNDLE" "$MANIFEST" "$PUBLIC_BASE" | tee "$RUNNER_TEMP/publish-result.json"; then
              exit 0
            fi
            if [[ "$attempt" == '3' ]]; then exit 1; fi
            sleep 5
          done

      - name: Final independent public proof
        shell: bash
        env:
          ORIGIN: ${{ steps.public.outputs.origin }}
          EXPECTED_RELEASE: ${{ steps.package.outputs.release_id }}
          EXPECTED_HASH: ${{ steps.package.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -H 'Cache-Control: no-cache' "$ORIGIN/runtime-update.json" > "$RUNNER_TEMP/public-manifest.json"
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/public-manifest.json','utf8'));
          if(m.releaseId!==process.env.EXPECTED_RELEASE) throw new Error('PUBLIC_RELEASE_ID_MISMATCH');
          if(m.archiveSha256!==process.env.EXPECTED_HASH) throw new Error('PUBLIC_ARCHIVE_HASH_MISMATCH');
          if(m.bridgeVersion!==1||m.minCarrierVersionCode!==24) throw new Error('PUBLIC_CARRIER_CONTRACT_MISMATCH');
          process.stdout.write(m.bundleUrl);
          NODE
          BUNDLE_KEY="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/public-manifest.json','utf8')).bundleUrl")"
          curl --fail-with-body --silent --show-error "$ORIGIN/$BUNDLE_KEY" -o "$RUNNER_TEMP/public-runtime.mfos"
          test "$(sha256sum "$RUNNER_TEMP/public-runtime.mfos" | awk '{print $1}')" = "$EXPECTED_HASH"

      - name: Record publication evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          PACKAGE_RUN_ID: ${{ steps.request.outputs.package_run_id }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          ORIGIN: ${{ steps.public.outputs.origin }}
        run: |
          mkdir -p evidence
          printf 'scope=v2-smt-runtime-online-publication\nsource_sha=%s\npackage_run_id=%s\nrelease_id=%s\narchive_sha256=%s\npublic_origin=%s\ndevice_acceptance=NOT_EXECUTED\n' \
            "$SOURCE_SHA" "$PACKAGE_RUN_ID" "$RELEASE_ID" "$ARCHIVE_SHA256" "$ORIGIN" > evidence/summary.txt
          cat evidence/summary.txt

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-smt-runtime-online-publication-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
