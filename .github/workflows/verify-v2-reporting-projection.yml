name: V2 Reporting Projection Verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string
      branch_name:
        description: Source branch represented by the SHA
        required: true
        type: string
  push:
    paths:
      - 'requests/v2-reporting-projection-request.txt'

permissions:
  contents: read

jobs:
  verify-reporting-projection:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            BRANCH_NAME="$(printf '%s' "$INPUT_BRANCH_NAME" | tr -d '\r\n')"
          else
            test -f requests/v2-reporting-projection-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-reporting-projection-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            BRANCH_NAME="$(sed -n 's/^branch_name=//p' requests/v2-reporting-projection-request.txt | tr -d '\r\n')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$BRANCH_NAME" ]]
          {
            echo "source_sha=$SOURCE_SHA"
            echo "branch_name=$BRANCH_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          echo "source-identity=PASS sha=$EXPECTED"

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install source dependencies
        working-directory: source
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Core Reporting Projection tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run test:core-reporting-projection | tee "$RUNNER_TEMP/v2-core-reporting-projection-tests.log"

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BRANCH_NAME: ${{ steps.request.outputs.branch_name }}
        run: |
          cat > "$RUNNER_TEMP/v2-reporting-projection-evidence.txt" <<EOF
          builder_repo=Pantonyeung/morefunos-v1-builder
          builder_run_id=${GITHUB_RUN_ID}
          source_repo=Pantonyeung/Morefun-v2
          source_sha=${SOURCE_SHA}
          branch_name=${BRANCH_NAME}
          test_command=npm run test:core-reporting-projection
          EOF

      - name: Upload Reporting Projection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-reporting-projection-evidence-${{ steps.request.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/v2-reporting-projection-evidence.txt
            ${{ runner.temp }}/v2-core-reporting-projection-tests.log
          if-no-files-found: error
          retention-days: 30
