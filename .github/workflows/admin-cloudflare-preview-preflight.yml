name: Admin Cloudflare Preview Preflight

on:
  push:
    paths:
      - '.github/workflows/admin-cloudflare-preview-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  SOURCE_SHA: 403b297b4e3e9bcafb6f4a40a606dc5eb8086bfc
  PREFLIGHT_REVISION: '4'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Builder-only credentials without exposing values
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V1_SOURCE_READ_TOKEN: ${{ secrets.V1_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            V1_SOURCE_READ_TOKEN
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'missing=%s\n' "$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
            printf 'MISSING_BUILDER_CREDENTIALS=%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          echo 'missing=' >> "$GITHUB_OUTPUT"
          echo 'ADMIN_CLOUDFLARE_PREVIEW_PREFLIGHT=PASS'
          echo 'RUNTIME_SECRET_POLICY=Cloudflare Worker only'

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=admin-cloudflare-preview-preflight \
            -f description='Builder credentials present; runtime secrets stay in Cloudflare' >/dev/null

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ steps.check.outputs.missing }}
        shell: bash
        run: |
          desc='Builder credentials missing'
          if [ -n "$MISSING" ]; then desc="$desc: $MISSING"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=admin-cloudflare-preview-preflight \
            -f description="$desc" >/dev/null
