name: Admin Core SMT Connected Acceptance

on:
  workflow_dispatch:
    inputs:
      admin_source_sha:
        description: Exact morefunos-v1 Admin source SHA
        required: true
        default: 16e215f69015dd00c25b7766241a62cfe23e0caa
        type: string
      smt_source_sha:
        description: Exact morefunos-v1 SMT source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  connected-acceptance:
    runs-on: ubuntu-24.04
    env:
      ADMIN_SHA: ${{ inputs.admin_source_sha }}
      SMT_SHA: ${{ inputs.smt_source_sha }}
      MOREFUNOS_SHARED_UI_FIXTURES_DIR: ${{ github.workspace }}/fixture-registry
    steps:
      - name: Validate exact SHA inputs
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_SHA="$(printf '%s' "$ADMIN_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          SMT_SHA="$(printf '%s' "$SMT_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$ADMIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SMT_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "ADMIN_SHA=$ADMIN_SHA" >> "$GITHUB_ENV"
          echo "SMT_SHA=$SMT_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact Admin source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.ADMIN_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: admin-source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact SMT source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SMT_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: smt-source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout shared UI fixture registry
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: test-v2/shared-ui-fixtures
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: fixture-registry
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C admin-source rev-parse HEAD)" = "$ADMIN_SHA"
          test "$(git -C smt-source rev-parse HEAD)" = "$SMT_SHA"
          test -f "$MOREFUNOS_SHARED_UI_FIXTURES_DIR/test-data/ui-shared-v2/manifest.json"
          grep -q 'TEST_ONLY_NON_PRODUCTION' "$MOREFUNOS_SHARED_UI_FIXTURES_DIR/test-data/ui-shared-v2/manifest.json"

      - name: Verify Admin SMT integration authority
        shell: bash
        run: |
          set -euo pipefail
          MATRIX='admin-source/docs/qa/ADMIN_PORT_IO_CONTRACT_TEST_MATRIX_2026-08-24.md'
          test -f "$MATRIX"
          for token in IO-001 IO-002 IO-004 IO-005 IO-006 IO-037 IO-038 IO-039 IO-041 IO-042 PORT-001 PORT-005; do
            grep -q "$token" "$MATRIX"
          done
          grep -q 'Admin -> Core Print Authority -> SMT execution carrier -> printer' "$MATRIX"
          grep -q 'Admin App 100% does not mean Core Integration PASS' "$MATRIX"

      - name: Verify SMT consumes existing canonical seams
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'readOrders' smt-source/apps/smt-clean/src
          grep -R -q 'dispatchOrders' smt-source/apps/smt-clean/src
          grep -R -q 'readOrderPrinting' smt-source/apps/smt-clean/src
          grep -R -q 'retryFailedOrderPrint' smt-source/apps/smt-clean/src
          grep -R -q 'reprintOrderPrint' smt-source/apps/smt-clean/src
          grep -R -q 'resolveSmtRuntime' smt-source/apps/smt-clean/src/runtime

      - name: Install Admin dependencies
        working-directory: admin-source/apps/admin-web
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Admin full tests
        working-directory: admin-source/apps/admin-web
        run: npm test

      - name: Admin typecheck and build
        working-directory: admin-source/apps/admin-web
        run: npm run build

      - name: SMT D-103 exact-source verification
        working-directory: smt-source
        env:
          MOREFUNOS_SHARED_UI_FIXTURES_DIR: ${{ github.workspace }}/fixture-registry
        run: npm run verify:smt-p01-d103

      - name: Write dual-SHA evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p connected-evidence
          cat > connected-evidence/summary.txt <<EOF
          ADMIN_SOURCE_SHA=$ADMIN_SHA
          SMT_SOURCE_SHA=$SMT_SHA
          ADMIN_SELF_GATE=PASS
          SMT_D103_GATE=PASS
          ADMIN_IO_MATRIX_GATE=PASS
          SMT_CANONICAL_SEAM_GATE=PASS
          CONNECTED_COMPATIBILITY=PASS
          LIVE_PASS=NOT_CLAIMED
          DEVICE_PASS=NOT_CLAIMED
          EOF

      - name: Upload connected acceptance evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: admin-core-smt-connected-${{ env.ADMIN_SHA }}-${{ env.SMT_SHA }}
          path: connected-evidence
          if-no-files-found: error
          retention-days: 30
