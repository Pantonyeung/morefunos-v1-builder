name: MFK Local Runtime OTA

on:
  push:
    paths:
      - 'requests/mfk-local-runtime-publish-request.txt'

permissions:
  contents: read

concurrency:
  group: mfk-local-runtime-ota
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLISHER_SHA: 3535324fa75fe100c0b4bb4c80ce1289d9a884e9
      EXPECTED_CERT_SHA256: 8f66270541c419a90ae0e8b94a2c7796e13d5c06805b0919ce3f7f5b3602857a
      MIN_CARRIER_VERSION_CODE: '106'
      BRIDGE_VERSION: '1'
      OTA_ORIGIN: https://morefunos-v2-smt-ota.pantonyeung.workers.dev/
    steps:
      - name: Checkout request
        uses: actions/checkout@v4

      - name: Resolve MFK source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/mfk-local-runtime-publish-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact MFK source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/mfk
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: mfk
          persist-credentials: false

      - name: Checkout OTA publisher
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ env.PUBLISHER_SHA }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: publisher
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Local-only tests
        shell: bash
        run: |
          set -euo pipefail
          node --check mfk/app.js
          node --test mfk/tests/local-pos.test.mjs
          ! grep -Eq '\b(fetch|XMLHttpRequest|WebSocket|EventSource)\b' mfk/app.js
          python3 -m http.server 8765 --directory mfk >/tmp/mfk-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ >/tmp/index.html; then break; fi
            sleep 0.25
          done
          grep -F '<div id="app"></div>' /tmp/index.html
          curl -fsS http://127.0.0.1:8765/app.js >/tmp/app.js
          curl -fsS http://127.0.0.1:8765/styles.css >/tmp/styles.css
          test -s /tmp/app.js
          test -s /tmp/styles.css

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and sign runtime
        id: package
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          KEYSTORE_B64: ${{ secrets.V1_ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.V1_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.V1_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.V1_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}"
          test -n "${STORE_PASS:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASS:-}"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          RELEASE_ID="runtime-candidate-mfk-${SHORT_SHA}"
          FILENAME="MoreFunOS-SMT-${RELEASE_ID}.mfos"
          STAGE="$RUNNER_TEMP/mfk-runtime"
          mkdir -p "$STAGE"
          cp mfk/index.html mfk/app.js mfk/styles.css "$STAGE/"
          KEYSTORE="$RUNNER_TEMP/morefunos-app-signing.p12"
          CERT="$RUNNER_TEMP/morefunos-app-signing.der"
          MANIFEST="$RUNNER_TEMP/MANIFEST.MF"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -file "$CERT" >/dev/null 2>&1
          CERT_SHA="$(sha256sum "$CERT" | awk '{print $1}')"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          cat > "$MANIFEST" <<EOF
          Manifest-Version: 1.0
          MoreFun-Release-Id: ${RELEASE_ID}
          MoreFun-Runtime-Version: ${RELEASE_ID}
          MoreFun-Channel: candidate
          MoreFun-Min-Carrier-Version-Code: ${MIN_CARRIER_VERSION_CODE}
          MoreFun-Bridge-Version: ${BRIDGE_VERSION}
          MoreFun-Source-Sha: ${SOURCE_SHA}
          MoreFun-Product-Root: mfk
          EOF
          sed -i 's/^          //' "$MANIFEST"
          jar cfm "$FILENAME" "$MANIFEST" -C "$STAGE" .
          jarsigner -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$STORE_PASS" -keypass "$KEY_PASS" "$FILENAME" "$KEY_ALIAS" >/dev/null
          jarsigner -verify -strict -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$STORE_PASS" "$FILENAME" "$KEY_ALIAS" >/dev/null
          ARCHIVE_SHA="$(sha256sum "$FILENAME" | awk '{print $1}')"
          cat > runtime-update.json <<EOF
          {
            "releaseId": "${RELEASE_ID}",
            "runtimeVersion": "${RELEASE_ID}",
            "channel": "candidate",
            "minCarrierVersionCode": ${MIN_CARRIER_VERSION_CODE},
            "bridgeVersion": ${BRIDGE_VERSION},
            "bundleUrl": "${FILENAME}",
            "archiveSha256": "${ARCHIVE_SHA}"
          }
          EOF
          sed -i 's/^          //' runtime-update.json
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$ARCHIVE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install OTA publisher dependencies
        working-directory: publisher/infra/cloudflare/smt-ota-worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Publish Runtime OTA
        working-directory: publisher/infra/cloudflare/smt-ota-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOREFUN_V2_SMT_OTA_BUCKET: morefunos-v2-smt-ota
          BUNDLE: ${{ github.workspace }}/${{ steps.package.outputs.filename }}
          MANIFEST: ${{ github.workspace }}/runtime-update.json
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node scripts/publish-runtime.mjs "$BUNDLE" "$MANIFEST" "$OTA_ORIGIN"

      - name: Public OTA proof
        shell: bash
        env:
          EXPECTED_RELEASE: ${{ steps.package.outputs.release_id }}
          EXPECTED_HASH: ${{ steps.package.outputs.archive_sha256 }}
          EXPECTED_FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "${OTA_ORIGIN}runtime-update.json" > /tmp/public-manifest.json
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('/tmp/public-manifest.json','utf8'));
          if(m.releaseId!==process.env.EXPECTED_RELEASE) throw new Error('PUBLIC_RELEASE_ID_MISMATCH');
          if(m.archiveSha256!==process.env.EXPECTED_HASH) throw new Error('PUBLIC_HASH_MISMATCH');
          if(m.bundleUrl!==process.env.EXPECTED_FILENAME) throw new Error('PUBLIC_FILENAME_MISMATCH');
          if(m.minCarrierVersionCode!==106||m.bridgeVersion!==1) throw new Error('PUBLIC_CARRIER_CONTRACT_MISMATCH');
          NODE
          curl -fsS "${OTA_ORIGIN}${EXPECTED_FILENAME}" -o /tmp/runtime.mfos
          test "$(sha256sum /tmp/runtime.mfos | awk '{print $1}')" = "$EXPECTED_HASH"
