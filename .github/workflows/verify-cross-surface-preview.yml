name: Owner V1 Verify Cross-Surface Preview

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/verify-cross-surface ')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - name: Validate exact source SHA
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SOURCE_SHA="${COMMAND#'/verify-cross-surface '}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$COMMAND" == "/verify-cross-surface ${SOURCE_SHA}" ]]
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

  surface:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: smt
            label: SMT
            dir: apps/smt-web
          - id: smm
            label: SMM
            dir: apps/smm-web
          - id: admin
            label: Admin
            dir: apps/admin-web
          - id: customer
            label: Customer
            dir: apps/customer-web
          - id: owner
            label: Owner
            dir: apps/owner-web
    name: ${{ matrix.label }} Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      APP_DIR: ${{ matrix.dir }}
      SURFACE_ID: ${{ matrix.id }}
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify surface
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -u
          cd source

          fail_stage() {
            echo "stage=$1" >> "$GITHUB_OUTPUT"
            echo "$1: FAIL"
            exit 1
          }

          if [[ -f "$APP_DIR/package-lock.json" ]]; then
            npm --prefix "$APP_DIR" ci --no-audit --no-fund >/dev/null 2>&1 || fail_stage "${SURFACE_ID}-install"
          else
            npm --prefix "$APP_DIR" install --no-audit --no-fund --package-lock=false >/dev/null 2>&1 || fail_stage "${SURFACE_ID}-install"
          fi
          echo "${SURFACE_ID}-install: PASS"

          case "$SURFACE_ID" in
            admin|customer|owner)
              npm --prefix "$APP_DIR" run test:contract >/dev/null 2>&1 || fail_stage "${SURFACE_ID}-contract-test"
              echo "${SURFACE_ID}-contract-test: PASS"
              npm --prefix "$APP_DIR" run test:ui >/dev/null 2>&1 || fail_stage "${SURFACE_ID}-ui-test"
              echo "${SURFACE_ID}-ui-test: PASS"
              ;;
            *)
              npm --prefix "$APP_DIR" test >/dev/null 2>&1 || fail_stage "${SURFACE_ID}-test"
              echo "${SURFACE_ID}-test: PASS"
              ;;
          esac

          "$APP_DIR/node_modules/.bin/tsc" --noEmit -p "$APP_DIR/tsconfig.json" >/dev/null 2>&1 || fail_stage "${SURFACE_ID}-typecheck"
          echo "${SURFACE_ID}-typecheck: PASS"

          npm --prefix "$APP_DIR" run build >/dev/null 2>&1 || fail_stage "${SURFACE_ID}-build"
          echo "${SURFACE_ID}-build: PASS"
          echo "stage=complete" >> "$GITHUB_OUTPUT"

      - name: Report sanitized surface result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          STAGE: ${{ steps.verify.outputs.stage }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" == 'success' ]]; then
            RESULT="PASS"
          else
            RESULT="FAIL stage=${STAGE:-UNAVAILABLE}"
          fi
          gh issue comment 2 --body "cross-surface-${SURFACE_ID} ${SOURCE_SHA} ${RESULT}" >/dev/null

      - name: Enforce surface pass
        if: steps.verify.outcome == 'failure'
        run: exit 1

  preview-contract:
    needs: validate
    name: Preview Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Checkout exact private V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Run preview contract
        id: preview
        continue-on-error: true
        shell: bash
        run: |
          cd source
          npm run test:preview >/dev/null 2>&1
      - name: Report sanitized preview result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.preview.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" == 'success' ]]; then RESULT='PASS'; else RESULT='FAIL'; fi
          gh issue comment 2 --body "cross-surface-preview-contract ${SOURCE_SHA} ${RESULT}" >/dev/null
      - name: Enforce preview pass
        if: steps.preview.outcome == 'failure'
        run: exit 1
