name: Android Release V2

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
      V1_ARTIFACT_DELIVERY_TOKEN:
        required: true
      V1_ANDROID_KEYSTORE_B64:
        required: true
      V1_ANDROID_KEYSTORE_PASSWORD:
        required: true
      V1_ANDROID_KEY_ALIAS:
        required: true
      V1_ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact MoreFunOS V1 source SHA'
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_REPO: Pantonyeung/morefunos-v1
  EXPECTED_APP_SIGNING_CERT_SHA256: 8f66270541c419a90ae0e8b94a2c7796e13d5c06805b0919ce3f7f5b3602857a

concurrency:
  group: android-release-v2-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  verify-ui:
    uses: ./.github/workflows/verify-ui-mother.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    secrets:
      V1_SOURCE_READ_TOKEN: ${{ secrets.V1_SOURCE_READ_TOKEN }}

  build-sign-deliver:
    needs: verify-ui
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERIFIED_ARTIFACT: ${{ needs.verify-ui.outputs.artifact_name }}
    steps:
      - name: Validate exact source identity input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$VERIFIED_ARTIFACT"

      - name: Checkout exact private MoreFunOS V1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify checked out source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Restore exact verified web dist into carrier source
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ env.VERIFIED_ARTIFACT }}
          path: source/apps/smt-web/dist

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.5.0'

      - name: Verify Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Android official static and compile gates
        shell: bash
        run: |
          set -euo pipefail
          gradle -p source/apps/smt-android :app:lintDebug --no-daemon
          gradle -p source/apps/smt-android :app:assembleDebug --no-daemon
          test -s source/apps/smt-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Stable-sign generated APK
        id: signing
        shell: bash
        env:
          V1_ANDROID_KEYSTORE_B64: ${{ secrets.V1_ANDROID_KEYSTORE_B64 }}
          V1_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V1_ANDROID_KEYSTORE_PASSWORD }}
          V1_ANDROID_KEY_ALIAS: ${{ secrets.V1_ANDROID_KEY_ALIAS }}
          V1_ANDROID_KEY_PASSWORD: ${{ secrets.V1_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/morefunos-v1-app-signing.p12"
          APK="$GITHUB_WORKSPACE/source/apps/smt-android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          cleanup() { rm -f "$KEYSTORE"; }
          trap cleanup EXIT
          printf '%s' "$V1_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$V1_ANDROID_KEY_ALIAS" --ks-pass env:V1_ANDROID_KEYSTORE_PASSWORD --key-pass env:V1_ANDROID_KEY_PASSWORD "$APK"
          VERIFY_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          test "$CERT_SHA256" = "$EXPECTED_APP_SIGNING_CERT_SHA256"
          echo "certificate_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate immutable Android release metadata
        id: metadata
        working-directory: source
        shell: bash
        env:
          APP_SIGNING_CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          APK="apps/smt-android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_FILE="apps/smt-android/app/build.gradle.kts"
          VERSION_NAME="$(awk -F'"' '/versionName = / {print $2; exit}' "$BUILD_FILE")"
          VERSION_CODE="$(awk '/versionCode = / {print $3; exit}' "$BUILD_FILE")"
          PACKAGE_ID="$(awk -F'"' '/applicationId = / {print $2; exit}' "$BUILD_FILE")"
          test "$PACKAGE_ID" = 'com.morefunos.smt'
          test "$VERSION_CODE" -ge 12
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "$APK")"
          APK_FILENAME="MoreFunOS-SMT-${VERSION_NAME}-${SOURCE_SHA:0:12}.apk"
          cp "$APK" "$APK_FILENAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_FILENAME" > SHA256SUMS
          export VERSION_NAME VERSION_CODE PACKAGE_ID APK_SHA256 APK_BYTES APK_FILENAME APP_SIGNING_CERT_SHA256 SOURCE_SHA SOURCE_REPO
          node <<'NODE'
          const fs=require('node:fs');
          const m={sourceRepository:process.env.SOURCE_REPO,sourceSha:process.env.SOURCE_SHA,packageId:process.env.PACKAGE_ID,versionName:process.env.VERSION_NAME,versionCode:Number(process.env.VERSION_CODE),apkFilename:process.env.APK_FILENAME,apkSha256:process.env.APK_SHA256,apkBytes:Number(process.env.APK_BYTES),appSigningCertificateSha256:process.env.APP_SIGNING_CERT_SHA256,builderRepository:process.env.GITHUB_REPOSITORY,builderSha:process.env.GITHUB_SHA,builderRunId:process.env.GITHUB_RUN_ID,builtAtUtc:new Date().toISOString()};
          fs.writeFileSync('build-metadata.json',JSON.stringify(m,null,2)+'\n');
          NODE
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "apk_filename=$APK_FILENAME"
            echo "apk_sha256=$APK_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Deliver signed APK privately to V1 Release
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          APK_FILENAME: ${{ steps.metadata.outputs.apk_filename }}
          APK_SHA256: ${{ steps.metadata.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          TAG="builder-v2-android-${VERSION_NAME}-${SOURCE_SHA:0:12}-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$APK_FILENAME" build-metadata.json SHA256SUMS --repo "$SOURCE_REPO" --target "$SOURCE_SHA" --title "SMT ${VERSION_NAME} (${VERSION_CODE}) | ${SOURCE_SHA:0:12}" --notes "Builder V2 Android release. APK SHA-256 ${APK_SHA256}. Build + private delivery evidence only; not Device/Hardware/Operational PASS." --prerelease

      - name: Android V2 summary
        shell: bash
        run: echo "android-release-v2=PASS source_sha=$SOURCE_SHA version=${{ steps.metadata.outputs.version_name }}"
