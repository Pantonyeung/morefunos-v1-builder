name: V2 Canonical Order Firebase Qualify

on:
  push:
    branches: [main]
    paths:
      - '.ci-trigger/canonical-order-firebase-qualify.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 39e3ae537ee1bc6e69e81d7a12b135c44c14856c
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Qualify with persistent phase evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          PHASE=bootstrap; mkdir -p evidence
          persist(){ rc=$?; conclusion=success; [ "$rc" -eq 0 ] || conclusion=failure; RESULT="$RUNNER_TEMP/result.txt"; {
            printf 'source_sha=%s\nbuilder_sha=%s\nrun_id=%s\nphase=%s\nconclusion=%s\n' "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PHASE" "$conclusion";
            [ "$conclusion" = success ] && printf 'canonical_order_firebase_normalization=success\nrules_codec=success\ntypescript=success\npages_functions=success\n' || true;
          } > "$RESULT"; cp "$RESULT" evidence/result.txt; for f in order.log rules.log ts.log pages.log; do test -f "$RUNNER_TEMP/$f" && cp "$RUNNER_TEMP/$f" evidence/ || true; done;
          git -C builder config user.name morefunos-builder-bot; git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'; git -C builder fetch origin main || true; git -C builder rebase origin/main || true; mkdir -p builder/.ci-results; cp "$RESULT" builder/.ci-results/v2-canonical-order-firebase-qualify.txt; git -C builder add .ci-results/v2-canonical-order-firebase-qualify.txt; git -C builder commit -m "ci(result): canonical Order Firebase $conclusion phase $PHASE $SOURCE_SHA" || true; git -C builder push origin HEAD:main || true; exit "$rc"; }
          trap persist EXIT
          PHASE=exact-source; test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"; grep -q 'normalizeCanonicalOrderFromFirebaseV1' source/packages/integration-v2/canonical-order-durable-store.ts
          PHASE=install; (cd source && npm install --ignore-scripts --no-audit --no-fund)
          PHASE=order-tests; (cd source && node --experimental-strip-types --test packages/integration-v2/canonical-order-durable-store.test.ts) 2>&1 | tee "$RUNNER_TEMP/order.log"
          PHASE=rules-tests; (cd source && node --experimental-strip-types --test packages/runtime-v2/rules-authority.test.ts packages/runtime-v2/rules-firebase-authority.test.ts) 2>&1 | tee "$RUNNER_TEMP/rules.log"
          PHASE=typescript; (cd source && npm exec --yes --package=typescript@5.9.2 -- tsc --noEmit -p tsconfig.json) 2>&1 | tee "$RUNNER_TEMP/ts.log"
          PHASE=pages-build; rm -rf /tmp/order-firebase-pages; (cd source && npm exec --yes --package=wrangler@4.125.0 -- wrangler pages functions build --outdir=/tmp/order-firebase-pages) 2>&1 | tee "$RUNNER_TEMP/pages.log"; grep -q 'Compiled Worker successfully' "$RUNNER_TEMP/pages.log"
          PHASE=complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-canonical-order-firebase-${{ env.SOURCE_SHA }}
          path: evidence
          retention-days: 30