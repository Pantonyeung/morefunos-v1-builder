name: Admin Functional Reality CI

on:
  push:
    paths:
      - '.github/workflows/admin-functional-reality-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  SOURCE_SHA: dd5d91ae23eca77d76b75f2388d1fd4abbd9c534

jobs:
  functional-reality:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostics
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/admin-functional-reality.log"
          echo 'workflow=STARTED' >> "$RUNNER_TEMP/admin-functional-reality.log"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact V1 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          echo 'exact_source=PASS' >> "$RUNNER_TEMP/admin-functional-reality.log"

      - name: Verify Admin domain and cross-runtime contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'admin_domain_tests=STARTED'
            node --experimental-strip-types --test packages/contracts/infrastructure-capacity.test.ts
            node --experimental-strip-types --test packages/catalog/product-interaction-contract.test.ts
            node --experimental-strip-types --test packages/catalog/product-catalog.test.ts
            node --experimental-strip-types --test packages/policy/business-policy-durable-authority.test.ts
            node --experimental-strip-types --test packages/table/dine-in-configuration.test.ts
            node --experimental-strip-types --test packages/store-settings/payment-channel-configuration.test.ts
            node --experimental-strip-types --test packages/printing/print-routing.test.ts
            node --experimental-strip-types --test packages/native/hardware-route-configuration.test.ts
            node --experimental-strip-types --test packages/admin/port-exposure-projection.test.ts
            node --experimental-strip-types --test packages/admin/admin-overview-projection.test.ts
            node --experimental-strip-types --test packages/reporting/admin-live-operational-projection.test.ts
            node --experimental-strip-types --test packages/store-settings/store-settings.test.ts
            node --experimental-strip-types --test packages/store-settings/store-settings-dine-in.test.ts
            node --experimental-strip-types --test packages/store-settings/store-settings-payment-channel.test.ts
            node --experimental-strip-types --test packages/store-settings/store-settings-print-routing.test.ts
            node --experimental-strip-types --test packages/store-settings/print-presentation-config.test.ts
            node --experimental-strip-types --test packages/store-settings/store-settings-durable-authority.test.ts
            node --experimental-strip-types --test packages/runtime/store-settings-payment-channel-projection.test.ts
            node --experimental-strip-types --test packages/runtime/store-settings-dine-in-bootstrap.test.ts
            node --experimental-strip-types --test packages/runtime/store-settings-printing-projection.test.ts
            node --experimental-strip-types --test packages/runtime/smt-runtime-device-gate-provider.test.ts
            node --experimental-strip-types --test packages/availability/availability-authority.test.ts
            node --experimental-strip-types --test packages/availability/availability-durable-authority.test.ts
            node --experimental-strip-types --test packages/business-day/admin-business-day-durable-control.test.ts
            node --experimental-strip-types --test packages/runtime/admin-policy-http.test.ts
            node --experimental-strip-types --test packages/runtime/admin-policy-http-prefix.test.ts
            node --experimental-strip-types --test packages/runtime/admin-availability-http.test.ts
            node --experimental-strip-types --test packages/runtime/admin-port-exposure-http.test.ts
            node --experimental-strip-types --test packages/runtime/admin-overview-http.test.ts
            node --experimental-strip-types --test packages/durability/google-service-account-token-provider.test.ts
            node --experimental-strip-types --test infra/cloudflare/admin-policy-worker/worker.test.ts
            node --experimental-strip-types --test infra/cloudflare/admin-policy-worker/entry.test.ts
            echo 'admin_domain_tests=PASS'
          } 2>&1 | tee -a "$RUNNER_TEMP/admin-functional-reality.log"

      - name: Verify Admin Web interaction and build
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'admin_web=STARTED'
            npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
            npm test
            npm run build
            echo 'admin_web=PASS'
          } 2>&1 | tee -a "$RUNNER_TEMP/admin-functional-reality.log"

      - name: Persist diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='diagnostics/admin-functional-reality-latest.log'
          {
            printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"
            cat "$RUNNER_TEMP/admin-functional-reality.log" 2>/dev/null || true
          } > /tmp/admin-functional-reality-latest.log
          content="$(base64 -w0 /tmp/admin-functional-reality-latest.log)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='ci: refresh Admin Functional Reality diagnostic' -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=admin-functional-reality \
            -f description='Overview + canonical live operational projection PASS' >/dev/null

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=admin-functional-reality \
            -f description='Admin functional reality exact-SHA gate failed' >/dev/null
