name: Verify Admin L9 Phase C

on:
  push:
    paths:
      - '.github/workflows/verify-admin-l9-phase-c.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  SOURCE_SHA: 4c16bcfe9381fe1be7fee7eb4a2f00a7064cc5b7

jobs:
  verify-admin-l9-phase-c:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Run per-layer diagnostics
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_REPO: ${{ github.repository }}
          STATUS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/phase-c"
          failed=0
          run_case() {
            local context="$1"
            local file="$2"
            local log="$RUNNER_TEMP/phase-c/${context}.log"
            if node --experimental-strip-types --test "$file" >"$log" 2>&1; then
              state=success
              description="PASS: $file"
            else
              state=failure
              description="FAIL: $file"
              failed=1
            fi
            printf '%s\n' "===== $context =====" >> "$RUNNER_TEMP/admin-l9-phase-c.log"
            cat "$log" >> "$RUNNER_TEMP/admin-l9-phase-c.log"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${STATUS_REPO}/statuses/${STATUS_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}" >/dev/null
          }
          : > "$RUNNER_TEMP/admin-l9-phase-c.log"
          run_case phase-c-policy packages/admin/policy-publish.test.ts
          run_case phase-c-durable-authority packages/admin/policy-durable-authority.test.ts
          run_case phase-c-durability packages/durability/durability.test.ts
          run_case phase-c-firebase packages/durability/firebase-rtdb-durability.test.ts
          run_case phase-c-runtime packages/runtime/admin-policy-runtime.test.ts
          run_case phase-c-http packages/runtime/admin-policy-http.test.ts
          run_case phase-c-http-client packages/runtime/admin-policy-http-client.test.ts
          run_case phase-c-worker infra/cloudflare/admin-policy-worker/worker.test.ts
          exit "$failed"

      - name: Prepare evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp "$RUNNER_TEMP/admin-l9-phase-c.log" evidence/admin-l9-phase-c.log 2>/dev/null || true
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-l9-phase-c-evidence-${{ env.SOURCE_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Report Phase C success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"admin-l9-phase-c","description":"Exact-SHA durability and transport gate passed"}' >/dev/null

      - name: Report Phase C failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"admin-l9-phase-c","description":"Exact-SHA durability or transport gate failed"}' >/dev/null
