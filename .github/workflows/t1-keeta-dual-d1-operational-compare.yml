name: T1 Keeta Dual D1 Operational Compare

on:
  push:
    paths:
      - 'requests/t1-keeta-dual-d1-operational-compare.txt'

permissions:
  contents: read

jobs:
  compare:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KEETA_D1_DATABASE_ID: e7e33e6f-9bc5-4f2b-89ce-acb3bb19e492
      PROD_D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}

      - name: Compare 4028 durable row across Keeta and production D1
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/^short_code=//p' requests/t1-keeta-dual-d1-operational-compare.txt | tr -d '[:space:]')"
          [[ "$CODE" =~ ^[0-9]{4}$ ]]
          SQL="SELECT COUNT(*) AS rows, MAX(canonical_order_id) AS canonical_order_id, MAX(json_extract(record_json,'$.merchantDecision')) AS merchant_decision, MAX(json_extract(record_json,'$.providerAction')) AS provider_action, MAX(json_extract(record_json,'$.providerActionStatus')) AS provider_action_status FROM mfos_keeta_durable_delivery WHERE record_json LIKE ?"
          jq -n --arg sql "$SQL" --arg like "%$CODE%" '{sql:$sql,params:[$like]}' > /tmp/q.json
          mkdir -p evidence
          for kind in KEETA PROD; do
            if [ "$kind" = KEETA ]; then DB="$KEETA_D1_DATABASE_ID"; else DB="$PROD_D1_DATABASE_ID"; fi
            set +e
            curl --silent --show-error --max-time 20 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/q.json > "/tmp/$kind.json"
            set -e
          done
          CODE="$CODE" node <<'NODE'
          const fs=require('fs');
          const out={shortCode:process.env.CODE};
          for(const kind of ['KEETA','PROD']){
            const x=JSON.parse(fs.readFileSync('/tmp/'+kind+'.json','utf8'));
            const result=x?.result?.[0];
            out[kind.toLowerCase()]={
              apiSuccess:Boolean(x?.success),
              querySuccess:Boolean(result?.success),
              error:x?.errors?.[0]?.message||result?.error||null,
              row:result?.results?.[0]||null,
            };
          }
          console.log('KEETA_DUAL_D1_COMPARE '+JSON.stringify(out));
          fs.writeFileSync('evidence/keeta-dual-d1-compare.json',JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: t1-keeta-dual-d1-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
