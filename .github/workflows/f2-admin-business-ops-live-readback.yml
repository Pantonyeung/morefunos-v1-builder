name: F2 Admin Business Ops Live Readback

on:
  push:
    branches: [main]
    paths:
      - 'requests/f2-admin-business-ops-live-readback-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source reference
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/f2-admin-business-ops-live-readback-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          REQUEST_ID="$(sed -n 's/^request_id=//p' requests/f2-admin-business-ops-live-readback-request.txt | tr -d '\r\n')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$REQUEST_ID"
          test -n "$ADMIN_LOGIN_SECRET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Prove live Admin business-day read and checkpoint trigger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          LOGIN_HTTP="$(curl -sS -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$ADMIN_URL/api/admin/session")"
          echo "login_http=$LOGIN_HTTP" | tee evidence/http-status.txt
          test "$LOGIN_HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/login.headers | tr -d '\r' | head -n1)"
          test -n "$COOKIE"
          HTTP="$(curl -sS -o /tmp/business-day.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/business-day")"
          echo "business_day_http=$HTTP" | tee -a evidence/http-status.txt
          test "$HTTP" = 200
          node - <<'NODE' | tee evidence/admin-business-day.txt
          const x=require('/tmp/business-day.json');
          if(!x.ok||!x.value) throw new Error('ADMIN_BUSINESS_DAY_READBACK_INVALID');
          const day=x.value.businessDay;
          if(!day?.businessDayId||!day?.businessDate) throw new Error('ADMIN_BUSINESS_DAY_IDENTITY_MISSING');
          console.log('admin_business_day_http=200');
          console.log('business_day_id='+day.businessDayId);
          console.log('business_date='+day.businessDate);
          NODE

      - name: Read diagnostic checkpoint from production D1
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          DAY_ID="$(sed -n 's/^business_day_id=//p' evidence/admin-business-day.txt)"
          test -n "$DAY_ID"
          SQL="SELECT trace_id,journey_id,edge_id,stage,expected_fingerprint,observed_fingerprint,occurred_at FROM mfos_system_diagnostic_trace_event WHERE trace_id='${DAY_ID}' AND journey_id='BUSINESS_OPERATIONS_V1' AND edge_id='d1-admin-business-ops-readback' ORDER BY occurred_at DESC LIMIT 1;"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/query.json',JSON.stringify({sql:process.env.SQL}))"
          D1_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/query.json > /tmp/d1.json
          node - <<'NODE' | tee evidence/diagnostic-readback.txt
          const x=require('/tmp/d1.json');
          const r=x.result?.[0]?.results?.[0];
          if(!x.success||!r) throw new Error('ADMIN_BUSINESS_OPS_CHECKPOINT_NOT_OBSERVED');
          if(r.journey_id!=='BUSINESS_OPERATIONS_V1'||r.edge_id!=='d1-admin-business-ops-readback'||r.stage!=='APPLIED') throw new Error('ADMIN_BUSINESS_OPS_CHECKPOINT_INVALID');
          console.log('admin_business_ops_checkpoint=PASS');
          console.log('trace_id='+r.trace_id);
          console.log('stage='+r.stage);
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-admin-business-ops-live-readback-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
