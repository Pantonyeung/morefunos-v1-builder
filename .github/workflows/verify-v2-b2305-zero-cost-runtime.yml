name: Verify V2 B2305 Zero-Cost Runtime

on:
  push:
    paths:
      - 'requests/v2-b2305-zero-cost-runtime-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-b2305-zero-cost-runtime-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exact source
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck
      - name: Payment proof canonical tests
        working-directory: source
        run: node --test packages/payment/payment-proof.test.ts
      - name: Customer payment proof HTTP tests
        working-directory: source
        run: node --test packages/customer-ui-integration/payment-proof-api.test.ts
      - name: Firebase realtime signal tests
        working-directory: source
        run: node --test packages/integration/firebase-rtdb-signal.test.ts packages/integration/google-service-account-token.test.ts
      - name: Existing Order and Payment non-PostgreSQL regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ORDER_TESTS < <(find packages/order -maxdepth 1 -name '*.test.ts' ! -name '*.integration.test.ts' | sort)
          mapfile -t PAYMENT_TESTS < <(find packages/payment -maxdepth 1 -name '*.test.ts' ! -name '*.integration.test.ts' ! -name 'payment-proof.test.ts' | sort)
          ((${#ORDER_TESTS[@]} > 0))
          ((${#PAYMENT_TESTS[@]} > 0))
          node --test --test-concurrency=1 "${ORDER_TESTS[@]}"
          node --test "${PAYMENT_TESTS[@]}"
          test -f packages/order/postgres-acceptance.ts
          test -f packages/payment/postgres-payment.ts
      - name: Validate D1 migration parses in SQLite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sqlite3 :memory: < infra/cloudflare/d1/migrations/0001-zero-cost-order-payment-proof.sql
      - name: Architecture invariant grep
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "CUSTOMER_EVIDENCE_MANUALLY_VERIFIED" packages/payment/payment-proof.ts >/dev/null
          grep -F "paymentConfirmed: false" packages/customer-ui-integration/payment-proof-api.ts >/dev/null
          grep -F "Firebase is a doorbell only" packages/integration/firebase-rtdb-signal.ts >/dev/null
          ! grep -R -E "R2.*(payment.*completed|PAYMENT_COMPLETED)|Firebase.*canonical.*truth" packages/customer-ui-integration packages/integration >/dev/null
      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_sha=%s\nmutation=NONE\nworkflow=verify-v2-b2305-zero-cost-runtime.yml\nrun_id=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > evidence/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-b2305-zero-cost-runtime-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
