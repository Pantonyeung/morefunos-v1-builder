name: V2 Core Bootstrap Verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MoreFunOS V1 source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Checkout exact V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git -C source rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          printf 'source_sha=%s\n' "$ACTUAL" >> "$GITHUB_STEP_SUMMARY"

      - name: Run V2 Core contract and runtime tests
        id: v2_core_test
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run test:v2-core 2>&1 | tee "$RUNNER_TEMP/v2-core-test.log"

      - name: Run V2 Core strict typecheck
        id: v2_core_typecheck
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:v2-core 2>&1 | tee "$RUNNER_TEMP/v2-core-typecheck.log"

      - name: Run full current regression suite
        id: current_test
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run test:current 2>&1 | tee "$RUNNER_TEMP/current-test.log"

      - name: Record verification evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          TEST_V2_CORE: ${{ steps.v2_core_test.outcome }}
          TYPECHECK_V2_CORE: ${{ steps.v2_core_typecheck.outcome }}
          TEST_CURRENT: ${{ steps.current_test.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source_sha=%s\n' "$SOURCE_SHA" > evidence/v2-core-summary.txt
          printf 'builder_repository=%s\nbuilder_sha=%s\nrun_id=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" >> evidence/v2-core-summary.txt
          printf 'test_v2_core=%s\ntypecheck_v2_core=%s\ntest_current=%s\n' "$TEST_V2_CORE" "$TYPECHECK_V2_CORE" "$TEST_CURRENT" >> evidence/v2-core-summary.txt
          test -f "$RUNNER_TEMP/v2-core-test.log" && cp "$RUNNER_TEMP/v2-core-test.log" evidence/v2-core-test.log || true
          test -f "$RUNNER_TEMP/v2-core-typecheck.log" && cp "$RUNNER_TEMP/v2-core-typecheck.log" evidence/v2-core-typecheck.log || true
          test -f "$RUNNER_TEMP/current-test.log" && cp "$RUNNER_TEMP/current-test.log" evidence/current-test.log || true
          cat evidence/v2-core-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V2 Core verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-core-evidence-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          TEST_V2_CORE: ${{ steps.v2_core_test.outcome }}
          TYPECHECK_V2_CORE: ${{ steps.v2_core_typecheck.outcome }}
          TEST_CURRENT: ${{ steps.current_test.outcome }}
        run: |
          [[ "$TEST_V2_CORE" == success ]]
          [[ "$TYPECHECK_V2_CORE" == success ]]
          [[ "$TEST_CURRENT" == success ]]
