name: V2 Core Bootstrap Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v2-core-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-v2-core-bootstrap.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA
        required: true
        default: d4003299e88ec6e502576ae4d0ca50e066475e1a
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUESTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || 'd4003299e88ec6e502576ae4d0ca50e066475e1a' }}
    steps:
      - name: Validate exact source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Checkout exact V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Run V2 Core contract and runtime tests
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run test:v2-core 2>&1 | tee "$RUNNER_TEMP/v2-core-test.log"

      - name: Run V2 Core strict typecheck
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:v2-core 2>&1 | tee "$RUNNER_TEMP/v2-core-typecheck.log"

      - name: Run full current regression suite
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run test:current 2>&1 | tee "$RUNNER_TEMP/current-test.log"

      - name: Record verification identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source_sha=%s\n' "$SOURCE_SHA" > evidence/v2-core-summary.txt
          printf 'test_v2_core=PASS\ntypecheck_v2_core=PASS\ntest_current=PASS\n' >> evidence/v2-core-summary.txt
          cp "$RUNNER_TEMP/v2-core-test.log" evidence/v2-core-test.log
          cp "$RUNNER_TEMP/v2-core-typecheck.log" evidence/v2-core-typecheck.log
          cp "$RUNNER_TEMP/current-test.log" evidence/current-test.log

      - name: Upload V2 Core verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-evidence-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
