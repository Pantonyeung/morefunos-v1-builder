name: Team A Order Display Code Production Readback

on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-order-display-code-production-readback.txt'

permissions:
  contents: read
  statuses: write

jobs:
  readback:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team-a-order-display-code-production-readback.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read production D1 display-code schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/query"
          SQL="SELECT name,sql FROM sqlite_master WHERE type='table' AND name IN ('mfos_order_display_code_counter','mfos_order_display_code') ORDER BY name"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/query.json',JSON.stringify({sql:process.env.SQL}))"
          curl --fail-with-body --silent --show-error -X POST "$URL"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'content-type: application/json'             --data-binary @/tmp/query.json > /tmp/result.json
          node - <<'NODE'
          const x=require('/tmp/result.json');
          const rows=x.result?.[0]?.results||[];
          if(!x.success||!x.result?.[0]?.success) throw new Error('D1_QUERY_FAILED');
          const names=rows.map(r=>r.name).sort();
          const expected=['mfos_order_display_code','mfos_order_display_code_counter'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('DISPLAY_CODE_TABLES_MISSING:'+JSON.stringify(names));
          const by=Object.fromEntries(rows.map(r=>[r.name,String(r.sql||'')]));
          if(!/PRIMARY KEY/i.test(by.mfos_order_display_code_counter)) throw new Error('COUNTER_PK_MISSING');
          if(!/UNIQUE/i.test(by.mfos_order_display_code)) throw new Error('ASSIGNMENT_UNIQUE_MISSING');
          console.log('display_code_schema=PASS');
          console.log(JSON.stringify(rows));
          NODE

      - name: Read target order display-code values
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ORDER_A="$(sed -n 's/^order_a=//p' requests/team-a-order-display-code-production-readback.txt | tr -d '[:space:]')"
          ORDER_B="$(sed -n 's/^order_b=//p' requests/team-a-order-display-code-production-readback.txt | tr -d '[:space:]')"
          [[ "$ORDER_A" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$ORDER_B" =~ ^[0-9a-f-]{36}$ ]]
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/query"
          SQL="SELECT s.order_id,s.revision,s.lifecycle_status,s.accepted_projection_json,s.order_snapshot_json,d.display_code AS authority_display_code,d.source_order_key,d.business_date,d.sequence FROM mfos_order_state s LEFT JOIN mfos_order_display_code d ON d.order_id=s.order_id WHERE s.order_id IN ('$ORDER_A','$ORDER_B') ORDER BY s.order_id"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/target-query.json',JSON.stringify({sql:process.env.SQL}))"
          curl --fail-with-body --silent --show-error -X POST "$URL"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'content-type: application/json'             --data-binary @/tmp/target-query.json > /tmp/target-result.json
          node - <<'NODE'
          const fs=require('fs');
          const x=require('/tmp/target-result.json');
          if(!x.success||!x.result?.[0]?.success) throw new Error('TARGET_D1_QUERY_FAILED');
          const rows=x.result[0].results||[];
          if(rows.length!==2) throw new Error('TARGET_ROWS_NOT_FOUND:'+rows.length);
          const out=rows.map(r=>{
            const raw=r.order_snapshot_json||r.accepted_projection_json;
            const p=raw?JSON.parse(raw):{};
            return {
              orderId:r.order_id,
              revision:r.revision,
              lifecycleStatus:r.lifecycle_status,
              canonicalDisplayOrderCode:p?.canonicalIdentity?.displayOrderCode??null,
              localDisplayOrderCode:p?.localDisplayOrderCode??null,
              displayOrderCode:p?.displayOrderCode??null,
              authorityDisplayOrderCode:r.authority_display_code??null,
              sourceOrderKey:r.source_order_key??null,
              businessDate:r.business_date??null,
              sequence:r.sequence??null
            };
          });
          fs.writeFileSync('/tmp/target-readback.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE

      - name: Upload target readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-a-order-display-code-target-readback-${{ steps.req.outputs.source_sha }}
          path: /tmp/target-readback.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-a-order-display-code-production-readback-${{ steps.req.outputs.source_sha }}
          path: /tmp/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/Pantonyeung/morefunos-v1-builder/statuses/$SHA"             -f state=success             -f context='builder/team-a-display-code-readback'             -f description='Production display-code readback passed'             -f target_url="https://github.com/Pantonyeung/morefunos-v1-builder/actions/runs/$GITHUB_RUN_ID"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/Pantonyeung/morefunos-v1-builder/statuses/$SHA"             -f state=failure             -f context='builder/team-a-display-code-readback'             -f description='Production display-code readback failed'             -f target_url="https://github.com/Pantonyeung/morefunos-v1-builder/actions/runs/$GITHUB_RUN_ID"
