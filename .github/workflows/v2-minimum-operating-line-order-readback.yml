name: V2 Minimum Operating Line Order Readback

on:
  push:
    branches: [main]
    paths: ['requests/v2-minimum-operating-line-order-readback-request.txt']

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-minimum-operating-line-order-readback-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          BRANCH_NAME="$(sed -n 's/^branch_name=//p' requests/v2-minimum-operating-line-order-readback-request.txt | tr -d '\r\n')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$BRANCH_NAME" ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          echo "source-identity=PASS sha=$EXPECTED" | tee evidence/source-identity.log

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install TypeScript test toolchain
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22

      - name: Verify D1 order store scope migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ADD COLUMN store_id TEXT' infra/cloudflare/d1/migrations/0008-order-state-store-scope.sql
          grep -F 'accepted_projection_json, store_id' packages/order/d1-acceptance.ts
          echo 'd1-order-store-scope=PASS' | tee ../evidence/d1-store-scope.log

      - name: Run correlated D1 order readback tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --test --experimental-strip-types \
            packages/order/d1-order-query-read.test.ts \
            packages/order/d1-store-order-acceptance.test.ts \
            packages/order/d1-accepted-order-projection.test.ts \
            2>&1 | tee ../evidence/order-readback-tests.log

      - name: Run SMT Order runtime tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --test --experimental-strip-types packages/smt-ui-integration/order-runtime.test.ts 2>&1 | tee ../evidence/smt-order-runtime-tests.log

      - name: Run SMM Order runtime tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --test --experimental-strip-types packages/smm-ui-integration/order-runtime.test.ts 2>&1 | tee ../evidence/smm-order-runtime-tests.log

      - name: Run root TypeScript typecheck
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json 2>&1 | tee ../evidence/root-typecheck.log

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BRANCH_NAME: ${{ steps.request.outputs.branch_name }}
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nsource_branch=%s\nworkflow=v2-minimum-operating-line-order-readback.yml\ncorrelated_order_id=order-direct-correlated-1\n' "$SOURCE_SHA" "$BRANCH_NAME" > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-minimum-operating-line-order-readback-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
