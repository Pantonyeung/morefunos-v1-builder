name: V2 Team1 MoreFun Identity Init

on:
  push:
    paths:
      - 'requests/v2-team1-morefun-identity-init.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact V2 source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/v2-team1-morefun-identity-init.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify MoreFun identity initialization exact source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund
          node --test packages/merchant-store/morefun-production-identity-init.test.ts
          npm run typecheck
