name: Diagnose Staff Credential Real Path

on:
  push:
    paths:
      - 'requests/v2-admin-staff-credential-realpath-diagnostic-request.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_ORIGIN: https://morefun-v2-admin.pantonyeung.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Probe real staff credential path without write
        env:
          ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_LOGIN_SECRET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:\"SELECT staff_id FROM mfos_rbac_staff WHERE json_extract(record_json,'$.lifecycleStatus')='ACTIVE' ORDER BY updated_at DESC LIMIT 1\"}))"
          curl -sS -X POST "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/q.json > /tmp/staff.json
          STAFF_ID="$(node -e "const x=require('/tmp/staff.json');const id=x?.result?.[0]?.results?.[0]?.staff_id;if(!id)process.exit(2);process.stdout.write(id)")"
          STAFF_ID="$STAFF_ID" node <<'EOF'
          const origin=process.env.ADMIN_ORIGIN;
          const secret=process.env.ADMIN_LOGIN_SECRET;
          const staffId=process.env.STAFF_ID;
          const login=await fetch(origin+'/api/admin/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({loginSecret:secret})});
          const cookie=login.headers.get('set-cookie')?.split(';')[0];
          if(!login.ok||!cookie)throw new Error('LOGIN_FAILED');
          const response=await fetch(origin+'/api/admin/staff',{
            method:'POST',
            headers:{'content-type':'application/json','cookie':cookie},
            body:JSON.stringify({
              action:'SET_STAFF_PIN',
              idempotencyKey:'realpath-diag-'+Date.now(),
              staffId,
              employeeCode:'999999',
              pin:'2468',
              expectedPinRevision:1
            })
          });
          const body=await response.text();
          console.log('STATUS='+response.status);
          console.log('BODY='+body.slice(0,1200));
          if(response.status!==409)throw new Error('EXPECTED_409_GOT_'+response.status);
          if(!body.includes('STAFF_POS_CREDENTIAL_REVISION_CONFLICT'))throw new Error('REVISION_CONFLICT_NOT_REACHED');
          console.log('REAL_STAFF_CREDENTIAL_PATH_PASS');
          EOF
