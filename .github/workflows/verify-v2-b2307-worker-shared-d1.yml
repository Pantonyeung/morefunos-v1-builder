name: V2 B2307 Worker Shared D1

on:
  push:
    paths:
      - 'requests/v2-b2307-worker-shared-d1-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-b2307-worker-shared-d1-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout exact V2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify exact source identity
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck
      - name: Worker shared D1 runtime gate
        working-directory: source
        run: node --test workers/keeta/src/shared-d1-runtime.test.ts
      - name: Existing Keeta Worker regression gate
        working-directory: source
        run: node --test workers/keeta/src/index.test.ts
