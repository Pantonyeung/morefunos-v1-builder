name: F2 Business Day Stale Precheck

on:
  push:
    branches: [main]
    paths:
      - 'requests/f2-business-day-stale-precheck-request.txt'

permissions:
  contents: read

jobs:
  precheck:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/f2-business-day-stale-precheck-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read canonical Business Day facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          query(){
            NAME="$1"; SQL="$2"
            SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/q.json',JSON.stringify({sql:process.env.SQL}))"
            curl -fsS -X POST "$D1_URL" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json > "evidence/$NAME.json"
            NAME="$NAME" node -e "const x=require('./evidence/'+process.env.NAME+'.json');if(!x.success){console.error(JSON.stringify(x));process.exit(1)}"
          }
          query business_days "SELECT business_day_id,store_id,business_date,timezone,boundary_local_time,policy_revision,lifecycle_status,opened_at,closed_at,revision,note FROM mfos_business_day ORDER BY opened_at DESC LIMIT 20"
          query cash_shifts "SELECT cash_shift_id,business_day_id,store_id,lifecycle_status,revision,created_at,updated_at FROM mfos_cash_shift ORDER BY updated_at DESC LIMIT 20"
          query stores "SELECT store_id,merchant_id,revision,record_json,updated_at FROM mfos_stores ORDER BY updated_at DESC LIMIT 10"
          query order_schema "SELECT sql FROM sqlite_master WHERE type='table' AND name='mfos_order_state'"
          query order_columns "PRAGMA table_info(mfos_order_state)"
          query open_orders "SELECT order_id,store_id,revision,lifecycle_status,created_at,updated_at,accepted_projection_json,order_snapshot_json FROM mfos_order_state WHERE lifecycle_status NOT IN ('COMPLETED','CANCELLED') ORDER BY created_at ASC LIMIT 100"
          query config_pointer "SELECT store_id,active_configuration_version_id,revision,changed_at FROM mfos_store_configuration_active_pointer ORDER BY changed_at DESC LIMIT 10"
          query config_versions "SELECT configuration_version_id,store_id,version_number,payload_json,published_at FROM mfos_store_configuration_published_version ORDER BY published_at DESC LIMIT 10"

          node - <<'NODE' | tee evidence/summary.txt
          const fs=require('fs');
          const rows=n=>require('./evidence/'+n+'.json').result?.[0]?.results||[];
          const days=rows('business_days');
          const shifts=rows('cash_shifts');
          const stores=rows('stores');
          const columns=rows('order_columns');
          const orders=rows('open_orders');
          const ptr=rows('config_pointer');
          const versions=rows('config_versions');
          const openDays=days.filter(r=>r.lifecycle_status==='OPEN');
          console.log('open_day_count='+openDays.length);
          console.log('open_days='+JSON.stringify(openDays));
          const storeFacts=stores.map(r=>{
            let j={};try{j=JSON.parse(r.record_json)}catch{}
            return {store_id:r.store_id,timezone:j.timezone,currencyCode:j.currencyCode,locale:j.locale,revision:r.revision};
          });
          console.log('store_facts='+JSON.stringify(storeFacts));
          console.log('cash_shifts='+JSON.stringify(shifts));
          console.log('order_columns='+JSON.stringify(columns.map(r=>r.name)));
          console.log('has_business_day_id_column='+String(columns.some(r=>r.name==='business_day_id')));
          console.log('has_business_date_column='+String(columns.some(r=>r.name==='business_date')));
          let withBusinessDate=0,withBusinessDayId=0,parseFailed=0;
          const sample=orders.slice(-10).map(r=>{
            let j=null;try{j=JSON.parse(r.order_snapshot_json||r.accepted_projection_json||'null')}catch{parseFailed++}
            if(j?.businessDate||j?.business_date)withBusinessDate++;
            if(j?.businessDayId||j?.business_day_id)withBusinessDayId++;
            return {order_id:r.order_id,created_at:r.created_at,status:r.lifecycle_status,businessDate:j?.businessDate??j?.business_date??null,businessDayId:j?.businessDayId??j?.business_day_id??null,sourceType:j?.canonicalIdentity?.sourceType??j?.sourceAttribution?.sourceType??null};
          });
          console.log('nonterminal_order_count_sampled='+orders.length);
          console.log('orders_with_business_date_in_snapshot='+withBusinessDate);
          console.log('orders_with_business_day_id_in_snapshot='+withBusinessDayId);
          console.log('snapshot_parse_failed='+parseFailed);
          console.log('latest_open_order_sample='+JSON.stringify(sample));
          console.log('active_config_pointers='+JSON.stringify(ptr));
          const configSummary=versions.map(v=>{
            let p={};try{p=JSON.parse(v.payload_json)}catch{}
            return {id:v.configuration_version_id,store_id:v.store_id,version:v.version_number,hasBusinessDay:Object.keys(p).some(k=>/business.*day/i.test(k)),keys:Object.keys(p)};
          });
          console.log('config_summary='+JSON.stringify(configSummary));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-business-day-stale-precheck-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
