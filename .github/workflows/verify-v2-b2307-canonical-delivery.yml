name: V2 B2307 Canonical Delivery

on:
  push:
    paths:
      - 'requests/v2-b2307-canonical-delivery-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-b2307-canonical-delivery-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout exact V2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify exact source identity
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck
      - name: Shared async Store Order Intake gate
        working-directory: source
        run: npx vitest run packages/store-order-intake/store-order-intake.test.ts packages/store-order-intake/store-order-intake-async.test.ts
      - name: Keeta canonical delivery gate
        working-directory: source
        run: node --test packages/integration/keeta-durable-delivery.test.ts packages/integration/keeta-canonical-order-delivery.test.ts
      - name: Canonical D1 Order authority and replay gate
        working-directory: source
        run: node --test packages/order/d1-store-order-acceptance.test.ts packages/order/d1-acceptance-replay.test.ts
      - name: Keeta D1 durable ingress gate
        working-directory: source
        run: node --test packages/integration/d1-keeta-durable-runtime.test.ts
      - name: Keeta ingress regression gate
        working-directory: source
        run: node --test packages/integration/keeta-webhook-ingress.test.ts
      - name: Firebase post-commit retry gate
        working-directory: source
        run: node --test packages/integration/d1-firebase-order-signal.test.ts
