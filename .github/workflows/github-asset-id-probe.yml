name: GitHub Asset ID Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  probe:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      github.event.comment.body == '/probe-github-asset-id'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASSET_ID: '518085617'
      FILE_NAME: MoreFunOS-SMT-runtime-candidate-d094591d03c1.mfos
      EXPECTED_BYTES: '649319'
      EXPECTED_SHA256: f455b286f6ab85437af584edc6c2be66f36e1351c578f12c89e56801c2a9f4b1

    steps:
      - name: Download exact private Release asset by asset ID
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'TOKEN=MISSING' >&2; exit 20; }
          URL="https://api.github.com/repos/Pantonyeung/morefunos-v1/releases/assets/${ASSET_ID}"
          OUT="$RUNNER_TEMP/${FILE_NAME}"
          HDR="$RUNNER_TEMP/asset-id.headers"
          status="$(curl -sS -L -D "$HDR" -o "$OUT" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$URL")"
          bytes="$(wc -c < "$OUT" | tr -d '[:space:]')"
          sha="$(sha256sum "$OUT" | awk '{print $1}')"
          accepted="$(awk 'BEGIN{IGNORECASE=1} /^x-accepted-github-permissions:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub("\r",""); v=$0} END{print v}' "$HDR")"
          remaining="$(awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-remaining:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub("\r",""); v=$0} END{print v}' "$HDR")"
          echo "ASSET_ID_HTTP=$status"
          echo "ASSET_ID_BYTES=$bytes"
          echo "ASSET_ID_SHA256=$sha"
          echo "ASSET_ID_ACCEPTED_PERMISSIONS=${accepted:-UNSPECIFIED}"
          echo "ASSET_ID_RATELIMIT_REMAINING=${remaining:-UNSPECIFIED}"
          if [[ "$status" == '200' && "$bytes" == "$EXPECTED_BYTES" && "$sha" == "$EXPECTED_SHA256" ]]; then
            echo 'ASSET_ID_EXACT_PACKAGE=PASS'
          else
            echo 'ASSET_ID_EXACT_PACKAGE=FAIL' >&2
            exit 21
          fi
