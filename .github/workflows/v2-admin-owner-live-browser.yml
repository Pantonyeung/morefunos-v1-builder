name: V2 Admin Owner Live Browser Acceptance

on:
  push:
    paths:
      - 'requests/v2-admin-owner-live-browser-request.txt'

permissions:
  contents: read

jobs:
  browser:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ADMIN_ORIGIN: https://morefun-v2-admin.pantonyeung.workers.dev
      OWNER_ORIGIN: https://morefun-v2-owner.pantonyeung.workers.dev
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}

      - name: Resolve exact admitted source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-admin-owner-live-browser-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify deployed source remains product-current
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          AUTH=(-H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json')
          MAIN_SHA="$(curl -fsSL "${AUTH[@]}" https://api.github.com/repos/Pantonyeung/Morefun-v2/git/ref/heads/main | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [ "$MAIN_SHA" != "$SOURCE_SHA" ]; then
            curl -fsSL "${AUTH[@]}" "https://api.github.com/repos/Pantonyeung/Morefun-v2/compare/$SOURCE_SHA...$MAIN_SHA" > /tmp/compare.json
            python3 - <<'PY'
          import json,sys
          x=json.load(open('/tmp/compare.json'))
          if x.get('status') not in ('ahead','identical'):
              print('SOURCE_NOT_ANCESTOR_OF_MAIN',file=sys.stderr); sys.exit(1)
          changed=[f['filename'] for f in x.get('files',[])]
          relevant_prefixes=(
              'apps/admin-web/',
              'apps/owner-web/',
              'infra/cloudflare/admin-web-worker/',
              'infra/cloudflare/owner-web-worker/',
              'packages/admin-ui-integration/',
              'packages/owner-ui-integration/',
              'packages/catalog/',
              'packages/availability/',
              'packages/merchant-store/',
              'packages/business-day-cash/',
              'packages/reporting-projection/',
              'packages/order/',
              'packages/identity-rbac/',
              'packages/security-context-gateway/',
              'packages/session-device-trust/',
              'packages/production-persistence/',
          )
          relevant=[p for p in changed if p.startswith(relevant_prefixes)]
          if relevant:
              print('ADMIN_OWNER_RELEVANT_PATHS_MOVED_AFTER_DEPLOY=' + ','.join(relevant),file=sys.stderr); sys.exit(1)
          print('CURRENT_MAIN_UNRELATED_PATHS_ONLY_AHEAD=' + str(len(changed)))
          PY
          fi
          echo "deployed_source_sha=$SOURCE_SHA"
          echo "current_main_sha=$MAIN_SHA"

      - uses: actions/setup-node@v7
        with: {node-version: '24'}

      - name: Install Playwright core
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Run real public browser acceptance
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -n "$ADMIN_LOGIN_SECRET"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          cat > live-browser.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          const {ADMIN_ORIGIN,OWNER_ORIGIN,SOURCE_SHA,ADMIN_LOGIN_SECRET}=process.env;
          if(!ADMIN_LOGIN_SECRET) throw new Error('ADMIN_LOGIN_SECRET_MISSING');
          const browser=await chromium.launch({headless:true,executablePath:process.argv[2]});
          const result={sourceSha:SOURCE_SHA,admin:{},owner:{}};

          const anon=await browser.newContext();
          const a1=await anon.request.get(ADMIN_ORIGIN+'/api/admin/session');
          const o1=await anon.request.get(OWNER_ORIGIN+'/api/owner/session');
          if(a1.status()!==401) throw new Error('ADMIN_ANON_NOT_401:'+a1.status());
          if(o1.status()!==401) throw new Error('OWNER_ANON_NOT_401:'+o1.status());
          result.admin.anonymousSession=401; result.owner.anonymousSession=401;
          await anon.close();

          const context=await browser.newContext({viewport:{width:1440,height:1000}});

          const admin=await context.newPage();
          const adminErrors=[]; const adminFailures=[];
          admin.on('pageerror',e=>adminErrors.push(String(e)));
          admin.on('requestfailed',r=>adminFailures.push(r.url()+':'+(r.failure()?.errorText||'failed')));
          await admin.goto(ADMIN_ORIGIN+'/admin/business-day',{waitUntil:'networkidle'});
          await admin.getByLabel('登入憑證').fill(ADMIN_LOGIN_SECRET);
          await admin.getByRole('button',{name:'登入',exact:true}).click();
          try {
            await admin.getByText('磨飯系統',{exact:true}).waitFor({timeout:15000});
          } catch (error) {
            const diagnosticSession=await context.request.get(ADMIN_ORIGIN+'/api/admin/session');
            const diagnosticBody=(await admin.locator('body').innerText()).replace(/\s+/g,' ').slice(0,1600);
            console.log('ADMIN_UI_DIAG_SESSION_HTTP='+diagnosticSession.status());
            console.log('ADMIN_UI_DIAG_BODY='+JSON.stringify(diagnosticBody));
            console.log('ADMIN_UI_DIAG_PAGE_ERRORS='+JSON.stringify(adminErrors));
            console.log('ADMIN_UI_DIAG_REQUEST_FAILURES='+JSON.stringify(adminFailures));
            throw error;
          }
          const adminSession=await context.request.get(ADMIN_ORIGIN+'/api/admin/session');
          if(adminSession.status()!==200) throw new Error('ADMIN_AUTH_SESSION:'+adminSession.status());
          const adminBody=(await admin.locator('body').innerText()).replace(/\s+/g,' ');
          if(!adminBody.includes('磨飯系統')) throw new Error('ADMIN_SHELL_MISSING');
          if(adminBody.includes('需要正式 Admin session')) throw new Error('ADMIN_STILL_LOGIN_GATE');

          const productApi=await context.request.get(ADMIN_ORIGIN+'/api/admin/catalog/products');
          if(productApi.status()!==200) throw new Error('ADMIN_PRODUCT_API:'+productApi.status());
          const productJson=await productApi.json();
          if(!productJson?.ok||!Array.isArray(productJson?.value?.products)) throw new Error('ADMIN_PRODUCT_API_RESPONSE_INVALID');

          const overviewApi=await context.request.get(ADMIN_ORIGIN+'/api/admin/overview');
          if(overviewApi.status()!==200) throw new Error('ADMIN_OVERVIEW_API:'+overviewApi.status());
          const overviewJson=await overviewApi.json();
          const overviewValue=overviewJson?.value;
          if(!overviewJson?.ok||!overviewValue
            ||!Number.isInteger(overviewValue.products)
            ||!Number.isInteger(overviewValue.enabled)
            ||!Number.isInteger(overviewValue.soldOut)
            ||!Number.isInteger(overviewValue.orderable)
            ||!Number.isInteger(overviewValue.operationalRevision)
            ||typeof overviewValue.businessDate!=='string') throw new Error('ADMIN_OVERVIEW_API_RESPONSE_INVALID');

          const historyApi=await context.request.get(ADMIN_ORIGIN+'/api/admin/orders/history?businessDate='+encodeURIComponent(overviewValue.businessDate));
          if(historyApi.status()!==200) throw new Error('ADMIN_ORDERS_HISTORY_API:'+historyApi.status());
          const historyJson=await historyApi.json();
          if(!historyJson?.ok||!Array.isArray(historyJson?.value)) throw new Error('ADMIN_ORDERS_HISTORY_API_RESPONSE_INVALID');

          await admin.goto(ADMIN_ORIGIN+'/admin/overview',{waitUntil:'networkidle'});
          await admin.getByRole('heading',{name:'營運總覽',exact:true}).waitFor({timeout:15000});
          await admin.getByText('正式商品',{exact:true}).waitFor({timeout:15000});

          await admin.goto(ADMIN_ORIGIN+'/admin/catalog/products',{waitUntil:'networkidle'});
          await admin.getByRole('heading',{name:'商品管理',exact:true}).waitFor({timeout:15000});
          await admin.getByRole('heading',{name:'商品列表',exact:true}).waitFor({timeout:15000});
          if(productJson.value.products.length){
            const firstProductId=productJson.value.products[0].productId;
            await admin.goto(ADMIN_ORIGIN+'/admin/catalog/products/'+encodeURIComponent(firstProductId),{waitUntil:'networkidle'});
            await admin.getByRole('heading',{name:'商品管理',exact:true}).waitFor({timeout:15000});
            const save=admin.getByRole('button',{name:'保存 Catalog 商品資料',exact:true});
            await save.waitFor({timeout:15000});
            if(!(await save.isDisabled())) throw new Error('ADMIN_PRODUCT_MANAGE_UNEXPECTEDLY_ENABLED');
          }

          await admin.goto(ADMIN_ORIGIN+'/admin/orders/history',{waitUntil:'networkidle'});
          await admin.getByRole('heading',{name:'歷史訂單',exact:true}).waitFor({timeout:15000});
          await admin.getByLabel('營業日期').fill(overviewValue.businessDate);
          await admin.getByRole('button',{name:'查詢歷史訂單',exact:true}).click();
          await admin.getByText(/已讀取 \d+ 張 canonical 歷史訂單/).waitFor({timeout:15000});

          const manifest=await context.request.get(ADMIN_ORIGIN+'/manifest.webmanifest');
          const sw=await context.request.get(ADMIN_ORIGIN+'/sw.js');
          if(manifest.status()!==200||sw.status()!==200) throw new Error('ADMIN_PWA_ASSET_FAIL');
          await admin.reload({waitUntil:'networkidle'});
          const adminSession2=await context.request.get(ADMIN_ORIGIN+'/api/admin/session');
          if(adminSession2.status()!==200) throw new Error('ADMIN_REFRESH_SESSION_LOST');
          if(adminErrors.length||adminFailures.length) throw new Error('ADMIN_BROWSER_ERROR:'+adminErrors.join('|')+';'+adminFailures.join('|'));
          await admin.screenshot({path:'evidence/admin.png',fullPage:true});
          result.admin={...result.admin,uiLogin:'PASS',authenticatedSession:200,productApi:200,overviewApi:200,ordersHistoryApi:200,overviewUi:'PASS',productReadOnlyUi:'PASS',ordersHistoryUi:'PASS',ordersHistoryCount:historyJson.value.length,refreshSession:200,manifest:200,serviceWorker:200,pageErrors:[],requestFailures:[]};

          const owner=await context.newPage();
          const ownerErrors=[]; const ownerFailures=[];
          owner.on('pageerror',e=>ownerErrors.push(String(e)));
          owner.on('requestfailed',r=>ownerFailures.push(r.url()+':'+(r.failure()?.errorText||'failed')));
          await owner.goto(OWNER_ORIGIN+'/',{waitUntil:'networkidle'});
          await owner.getByLabel('登入憑證').fill(ADMIN_LOGIN_SECRET);
          await owner.getByRole('button',{name:'登入',exact:true}).click();
          await owner.getByText('今日實收',{exact:true}).waitFor({timeout:15000});
          const ownerSession=await context.request.get(OWNER_ORIGIN+'/api/owner/session');
          if(ownerSession.status()!==200) throw new Error('OWNER_AUTH_SESSION:'+ownerSession.status());
          const ownerBootstrap=await context.request.get(OWNER_ORIGIN+'/api/owner/bootstrap');
          if(ownerBootstrap.status()!==200) throw new Error('OWNER_BOOTSTRAP:'+ownerBootstrap.status());
          const ownerBody=(await owner.locator('body').innerText()).replace(/\s+/g,' ');
          if(ownerBody.includes('需要正式 Admin session')||ownerBody.includes('Protected Preview')) throw new Error('OWNER_STILL_LOGIN_GATE');
          const ownerManifest=await context.request.get(OWNER_ORIGIN+'/manifest.webmanifest');
          const ownerSw=await context.request.get(OWNER_ORIGIN+'/sw.js');
          if(ownerManifest.status()!==200||ownerSw.status()!==200) throw new Error('OWNER_PWA_ASSET_FAIL');
          await owner.reload({waitUntil:'networkidle'});
          await owner.getByText('今日實收',{exact:true}).waitFor({timeout:15000});
          const ownerSession2=await context.request.get(OWNER_ORIGIN+'/api/owner/session');
          if(ownerSession2.status()!==200) throw new Error('OWNER_REFRESH_SESSION_LOST');
          if(ownerErrors.length||ownerFailures.length) throw new Error('OWNER_BROWSER_ERROR:'+ownerErrors.join('|')+';'+ownerFailures.join('|'));
          await owner.screenshot({path:'evidence/owner.png',fullPage:true});
          result.owner={...result.owner,uiLogin:'PASS',authenticatedSession:200,bootstrap:200,reportingUi:'PASS',refreshSession:200,manifest:200,serviceWorker:200,pageErrors:[],requestFailures:[]};

          await browser.close();
          fs.writeFileSync('evidence/summary.json',JSON.stringify(result,null,2));
          EOF
          node live-browser.mjs "$CHROME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-owner-live-browser-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
