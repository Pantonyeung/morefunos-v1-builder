name: F2 Business Day Canonical Rollover Live

on:
  push:
    branches: [main]
    paths:
      - 'requests/f2-business-day-canonical-rollover-live-request.txt'

permissions:
  contents: read

jobs:
  rollover:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_URL: https://morefun-v2-admin.pantonyeung.workers.dev
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve and verify deployed source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/f2-business-day-canonical-rollover-live-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          DEPLOYED="$(sed -n 's/^source_sha=//p' .ci-results/v2-admin-worker-deploy.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" == "$DEPLOYED" ]] || { echo "::error::ROLLOVER_SOURCE_NOT_DEPLOYED requested=$SOURCE_SHA deployed=$DEPLOYED"; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Close stale Business Day and open server-resolved current day
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          LOGIN_BODY="$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')"
          LOGIN_HTTP="$(curl -sS -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$LOGIN_BODY" "$ADMIN_URL/api/admin/session")"
          echo "login_http=$LOGIN_HTTP" | tee evidence/summary.txt
          test "$LOGIN_HTTP" = 200
          COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/login.headers | tr -d '\r' | head -n1)"
          test -n "$COOKIE"

          DAY_HTTP="$(curl -sS -o /tmp/day-before.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/business-day")"
          echo "day_before_http=$DAY_HTTP" | tee -a evidence/summary.txt
          test "$DAY_HTTP" = 200
          cp /tmp/day-before.json evidence/day-before.json

          READINESS_HTTP="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/business-day/close")"
          echo "readiness_http=$READINESS_HTTP" | tee -a evidence/summary.txt
          test "$READINESS_HTTP" = 200
          cp /tmp/readiness.json evidence/readiness.json

          node - <<'NODE' | tee -a evidence/summary.txt
          const fs=require('fs');
          const day=require('/tmp/day-before.json');
          const ready=require('/tmp/readiness.json');
          const b=day.value?.businessDay;
          if(!day.ok||!b)throw new Error('ROLLOVER_OPEN_DAY_REQUIRED');
          if(!ready.ok||ready.value?.canClose!==true)throw new Error('ROLLOVER_CLOSE_NOT_READY');
          const parts=new Intl.DateTimeFormat('en-CA',{timeZone:b.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
          const v=t=>Number(parts.find(p=>p.type===t)?.value);
          const boundary=/^([01]\d|2[0-3]):([0-5]\d)$/.exec(b.boundaryLocalTime);
          if(!boundary)throw new Error('ROLLOVER_BOUNDARY_INVALID');
          const localDate=[v('year'),String(v('month')).padStart(2,'0'),String(v('day')).padStart(2,'0')].join('-');
          const beforeBoundary=v('hour')*60+v('minute') < Number(boundary[1])*60+Number(boundary[2]);
          const expected=beforeBoundary
            ? new Date(Date.UTC(v('year'),v('month')-1,v('day'))-86400000).toISOString().slice(0,10)
            : localDate;
          if(b.businessDate===expected)throw new Error('ROLLOVER_DAY_NOT_STALE');
          console.log('stale_business_day_id='+b.businessDayId);
          console.log('stale_business_date='+b.businessDate);
          console.log('stale_revision='+b.revision);
          console.log('expected_business_date='+expected);
          console.log('close_summary='+ready.value.summaryCode);
          console.log('close_warnings='+JSON.stringify(ready.value.warnings||[]));
          fs.writeFileSync('/tmp/rollover.json',JSON.stringify({businessDayId:b.businessDayId,revision:b.revision,expected}));
          NODE

          CLOSE_BODY="$(node -e "const x=require('/tmp/rollover.json');process.stdout.write(JSON.stringify({expectedRevision:x.revision,idempotencyKey:'round020-rollover-close:'+x.businessDayId+':'+x.revision}))")"
          CLOSE_HTTP="$(curl -sS -o /tmp/close.json -w '%{http_code}' -H "Cookie: $COOKIE" -H 'content-type: application/json' --data "$CLOSE_BODY" "$ADMIN_URL/api/admin/business-day/close")"
          echo "close_http=$CLOSE_HTTP" | tee -a evidence/summary.txt
          cat /tmp/close.json > evidence/close.json
          test "$CLOSE_HTTP" = 200
          node -e "const x=require('/tmp/close.json');if(!x.ok||x.value?.lifecycleStatus!=='CLOSED')throw new Error('ROLLOVER_CLOSE_INVALID')"

          OPEN_BODY="$(node -e "const x=require('/tmp/rollover.json');process.stdout.write(JSON.stringify({idempotencyKey:'round020-rollover-open:'+x.expected}))")"
          OPEN_HTTP="$(curl -sS -o /tmp/open.json -w '%{http_code}' -H "Cookie: $COOKIE" -H 'content-type: application/json' --data "$OPEN_BODY" "$ADMIN_URL/api/admin/business-day/open")"
          echo "open_http=$OPEN_HTTP" | tee -a evidence/summary.txt
          cat /tmp/open.json > evidence/open.json
          test "$OPEN_HTTP" = 200
          EXPECTED="$(node -e "process.stdout.write(require('/tmp/rollover.json').expected)")"
          EXPECTED="$EXPECTED" node -e "const x=require('/tmp/open.json');if(!x.ok||x.value?.lifecycleStatus!=='OPEN'||x.value?.businessDate!==process.env.EXPECTED)throw new Error('ROLLOVER_OPEN_INVALID');console.log('opened_business_day_id='+x.value.businessDayId);console.log('opened_business_date='+x.value.businessDate)" | tee -a evidence/summary.txt

          AFTER_HTTP="$(curl -sS -o /tmp/day-after.json -w '%{http_code}' -H "Cookie: $COOKIE" "$ADMIN_URL/api/admin/business-day")"
          echo "day_after_http=$AFTER_HTTP" | tee -a evidence/summary.txt
          test "$AFTER_HTTP" = 200
          cp /tmp/day-after.json evidence/day-after.json
          EXPECTED="$EXPECTED" node -e "const x=require('/tmp/day-after.json');const b=x.value?.businessDay;if(!x.ok||!b||b.lifecycleStatus!=='OPEN'||b.businessDate!==process.env.EXPECTED)throw new Error('ROLLOVER_READBACK_INVALID');console.log('rollover_readback=PASS')" | tee -a evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-business-day-canonical-rollover-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
