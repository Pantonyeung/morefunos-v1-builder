name: T1 Keeta Live Confirm 3475

on:
  push:
    branches:
      - main
    paths:
      - requests/t1-keeta-live-confirm-3475.txt

permissions:
  contents: read

concurrency:
  group: t1-keeta-live-confirm-3475
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: "4.125.0"
      DONOR_SHA: "967a8e09dfbc53655380665824d5687c0ccd177b"
      WORKER_URL: "https://morefun-v2-keeta-sit.pantonyeung.workers.dev"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-wrangler-${{ env.WRANGLER_VERSION }}

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION" --no-audit --no-fund
          wrangler --version

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-live-confirm-3475.txt | tr -d '[:space:]')"
          ORDER_VIEW_ID="$(sed -n 's/^order_view_id=//p' requests/t1-keeta-live-confirm-3475.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORDER_VIEW_ID" =~ ^[0-9]+$ ]]
          test "$ORDER_VIEW_ID" = "5123442967453475"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "order_view_id=$ORDER_VIEW_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout exact V2 and OAuth donor
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout OAuth donor
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ env.DONOR_SHA }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: donor
          persist-credentials: false
          fetch-depth: 1

      - name: Assemble capture-preserving confirm probe
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/t1-keeta-live-refund-capture.py
          cp donor/workers/keeta/src/oauth-runtime.ts source/workers/keeta/src/oauth-runtime.ts
          cp donor/packages/integration/keeta-standard-oauth.ts source/packages/integration/keeta-standard-oauth.ts
          cat > source/workers/keeta/src/live-confirm-probe.ts <<'TS'
          import base from "./index.ts";
          import { buildKeetaOrderConfirmRequest } from "../../../packages/integration/keeta-order-provider-requests.ts";
          import { sendKeetaJsonRequest, type RuntimeSecretProvider } from "../../../packages/integration/keeta-standard-api.ts";
          import { getUsableKeetaConnectionToken, type KeetaOAuthRuntimeEnv } from "./oauth-runtime.ts";

          interface Env extends KeetaOAuthRuntimeEnv {
            readonly KEETA_SIT_PROBE_KEY?: string;
            readonly KEETA_SIT_TARGET_ORDER_VIEW_ID?: string;
          }

          const APP_ID = 3419700273;
          const SHOP_ID = 721578302;
          const json = (body: unknown, status = 200) => new Response(JSON.stringify(body), {
            status,
            headers: { "content-type": "application/json; charset=utf-8", "cache-control": "no-store" },
          });

          function auth(request: Request, env: Env) {
            const expected = env.KEETA_SIT_PROBE_KEY;
            if (!expected) throw new Error("PROBE_UNAVAILABLE");
            if ((request.headers.get("authorization") ?? "") !== `Bearer ${expected}`) throw new Error("PROBE_UNAUTHORIZED");
          }

          function secrets(env: Env): RuntimeSecretProvider {
            return { async getSecret(name: string) {
              if (name !== "KEETA_APP_SECRET") return null;
              return env.KEETA_APP_SECRET?.length ? env.KEETA_APP_SECRET : null;
            }};
          }

          export default {
            async fetch(request: Request, env: Env): Promise<Response> {
              const url = new URL(request.url);
              if (request.method === "POST" && url.pathname === "/sit/live-confirm") {
                try {
                  auth(request, env);
                  const orderViewId = Number(env.KEETA_SIT_TARGET_ORDER_VIEW_ID);
                  if (!Number.isSafeInteger(orderViewId) || orderViewId !== 5123442967453475) throw new Error("TARGET_ORDER_MISMATCH");
                  const token = await getUsableKeetaConnectionToken("default", env);
                  const providerRequest = buildKeetaOrderConfirmRequest({ orderViewId, providerShopId: SHOP_ID });
                  const response = await sendKeetaJsonRequest({
                    url: providerRequest.endpoint,
                    params: {
                      ...providerRequest.params,
                      appId: APP_ID,
                      accessToken: token.accessToken,
                      timestamp: Math.floor(Date.now() / 1000),
                    },
                    secretProvider: secrets(env),
                  });
                  return json({
                    code: 0,
                    action: "CONFIRM",
                    orderViewId,
                    providerOk: response.ok,
                    providerCode: response.code,
                    providerMessage: response.message ?? null,
                  });
                } catch (error) {
                  return json({ code: error instanceof Error ? error.message : "CONFIRM_FAILED" }, 500);
                }
              }
              return base.fetch(request, env as never);
            }
          };
          TS

          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('source/workers/keeta/wrangler.jsonc','utf8'));
          src.main='src/live-confirm-probe.ts';
          src.vars={...(src.vars||{}),KEETA_SIT_TARGET_ORDER_VIEW_ID:'5123442967453475'};
          fs.writeFileSync('source/workers/keeta/live-confirm-wrangler.jsonc',JSON.stringify(src,null,2));
          NODE

      - name: Deploy protected confirm probe and call once
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf 'KEETA_SIT_PROBE_KEY=%s\n' "$PROBE_KEY" > "$RUNNER_TEMP/live-confirm.env"
          chmod 600 "$RUNNER_TEMP/live-confirm.env"
          wrangler deploy --config live-confirm-wrangler.jsonc --secrets-file "$RUNNER_TEMP/live-confirm.env"

          HTTP="$(curl --silent --show-error -o "$RUNNER_TEMP/confirm.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $PROBE_KEY" "$WORKER_URL/sit/live-confirm" || true)"
          echo "confirm_http=$HTTP"
          cat "$RUNNER_TEMP/confirm.json"
          test "$HTTP" = "200"
          node - "$RUNNER_TEMP/confirm.json" <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('confirm_provider_ok='+String(b.providerOk));
          console.log('confirm_provider_code='+String(b.providerCode));
          console.log('confirm_provider_message='+String(b.providerMessage));
          if(b.code!==0 || b.action!=='CONFIRM' || b.orderViewId!==5123442967453475 || b.providerOk!==true || b.providerCode!==0) process.exit(1);
          NODE

      - name: Upload confirm evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t1-keeta-live-confirm-3475-${{ github.run_id }}
          path: ${{ runner.temp }}/confirm.json
          if-no-files-found: warn
          retention-days: 30
