name: Deploy V2 Customer Public Worker

on:
  push:
    paths:
      - 'requests/v2-customer-public-worker-deploy.txt'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-customer-public-worker-deploy.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Require source equals current V2 main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api repos/Pantonyeung/Morefun-v2/commits/main --jq .sha)"
          test "$SOURCE_SHA" = "$MAIN_SHA" || { echo "::error::STALE_V2_SOURCE_REFUSED source=$SOURCE_SHA main=$MAIN_SHA"; exit 1; }
          echo "v2-main-pin=PASS sha=$MAIN_SHA"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build exact Customer assets
        working-directory: source/apps/customer-web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/index.html
      - name: Verify edge contract
        working-directory: source
        run: node --experimental-strip-types --test infra/cloudflare/customer-web-worker/*.test.ts
      - name: Deploy exact Customer public Worker
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          npm exec --yes --package=wrangler@4.125.0 -- wrangler deploy --config infra/cloudflare/customer-web-worker/wrangler.jsonc 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | sed 's/[),.;]*$//' || true)"
          test -n "$URL"
          echo "$URL" > "$GITHUB_WORKSPACE/evidence/url.txt"
      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat evidence/url.txt)"
          fetch_status() {
            local url="$1" out="$2" code=""
            for i in {1..30}; do
              code="$(curl -sS -o "$out" -w '%{http_code}' "$url" || true)"
              if [[ "$code" = 200 ]]; then break; fi
              sleep 2
            done
            printf '%s' "$code"
          }

          INDEX_HTTP="$(fetch_status "$URL/" /tmp/index.html)"
          MENU_HTTP="$(fetch_status "$URL/menu" /tmp/menu.html)"
          ORDERING_HTTP="$(fetch_status "$URL/api/customer/ordering" /tmp/ordering.json)"
          PRICING_REVISION_HTTP="$(fetch_status "$URL/api/pricing/revision" /tmp/customer-pricing-revision.json)"
          PRICING_ACTIVE_HTTP="$(fetch_status "$URL/api/pricing/active" /tmp/customer-pricing-active.json)"
          test "$INDEX_HTTP" = 200
          test "$MENU_HTTP" = 200
          test "$ORDERING_HTTP" = 200
          test "$PRICING_REVISION_HTTP" = 200
          test "$PRICING_ACTIVE_HTTP" = 200
          node - <<'NODE'
          const revision=require('/tmp/customer-pricing-revision.json');
          const active=require('/tmp/customer-pricing-active.json');
          if(revision?.ok!==true||!Number.isSafeInteger(revision?.value?.revision)||revision.value.revision<1)process.exit(1);
          if(active?.ok!==true||String(active?.value?.revision)!==String(revision.value.revision)||active?.value?.revisionToken!==revision.value.revisionToken)process.exit(1);
          console.log('customer_pricing_proxy=PASS revision='+revision.value.revision);
          NODE

          JS_PATH="$(grep -Eo 'src="[^"]*assets/[^"]+\.js"' /tmp/index.html | head -n1 | sed -E 's/^src="([^"]+)"$/\1/')"
          test -n "$JS_PATH"
          case "$JS_PATH" in
            http*) JS_URL="$JS_PATH" ;;
            /*) JS_URL="$URL$JS_PATH" ;;
            *) JS_URL="$URL/$JS_PATH" ;;
          esac
          JS_HTTP="$(fetch_status "$JS_URL" /tmp/customer.js)"
          test "$JS_HTTP" = 200

          FIXTURE_MARKERS=0
          for marker in 'F6 紫米餐' '(5) 招牌雞扒便當' 'TST-CU-20260824-001' 'TST-HISTORY-001' '+852 5600 4443'; do
            if grep -Fq "$marker" /tmp/customer.js; then FIXTURE_MARKERS=$((FIXTURE_MARKERS+1)); fi
          done
          test "$FIXTURE_MARKERS" = 0
          node -e "const x=require('/tmp/ordering.json');if(!Number.isSafeInteger(x.publishSequence)||!x.catalogVersion||!Array.isArray(x.products))process.exit(1)"
          printf 'index_http=%s\nspa_http=%s\nordering_http=%s\npricing_revision_http=%s\npricing_active_http=%s\nasset_http=%s\nfixture_markers=%s\n' "$INDEX_HTTP" "$MENU_HTTP" "$ORDERING_HTTP" "$PRICING_REVISION_HTTP" "$PRICING_ACTIVE_HTTP" "$JS_HTTP" "$FIXTURE_MARKERS" > evidence/smoke.txt
      - name: Publish Team2 deploy audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: gh issue comment 98 --repo Pantonyeung/morefunos-v1-builder --body "T2_CUSTOMER_DEPLOY_015 status=$JOB_STATUS run_id=$RUN_ID source_sha=$SOURCE_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-customer-public-worker-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
