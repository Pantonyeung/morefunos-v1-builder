name: Team1 Customer B2506 Browser E2E

on:
  push:
    paths:
      - requests/team1-customer-b2506-browser-e2e.txt

permissions:
  contents: read

jobs:
  browser:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}

      - name: Resolve exact admitted source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team1-customer-b2506-browser-e2e.txt | tr -d '[:space:]')"
          ORIGIN="$(sed -n 's/^origin=//p' requests/team1-customer-b2506-browser-e2e.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORIGIN" =~ ^https:// ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with: {node-version: '24'}

      - name: Install browser harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Customer UI submit refresh lifecycle E2E
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          ORIGIN: ${{ steps.req.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          cat > /tmp/customer-b2506-browser.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const [chrome, origin, sourceSha] = process.argv.slice(2);
          const browser = await chromium.launch({headless:true, executablePath:chrome});
          const ctx = await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page = await ctx.newPage();
          const pageErrors = [];
          const requestFailures = [];
          let submitPosts = 0;
          let lifecycleGets = 0;

          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('requestfailed', r => requestFailures.push(r.url()+':'+String(r.failure()?.errorText||'')));
          page.on('request', r => {
            const u = new URL(r.url());
            if (u.pathname === '/api/customer/orders' && r.method() === 'POST') submitPosts += 1;
            if (u.pathname === '/api/customer/order-status' && r.method() === 'GET') lifecycleGets += 1;
          });

          await page.goto(origin + '/menu', {waitUntil:'networkidle'});
          await page.locator('html[data-cu-runtime="connected"]').waitFor({timeout:15000});
          const productButton = page.locator('button.mf-round-action:not([disabled])').first();
          await productButton.waitFor({timeout:10000});
          await productButton.click();
          await page.locator('[data-add-product]:not([disabled])').waitFor({timeout:10000});
          await page.locator('[data-add-product]:not([disabled])').click();

          await page.locator('[data-route="/memory-jar"]').first().click();
          const submit = page.locator('[data-cu-submit]:not([disabled])');
          await submit.waitFor({timeout:10000});
          await submit.click();

          await page.waitForURL('**/orders', {timeout:20000});
          const orderStrong = page.locator('.mf-order-card .mf-order-top strong').first();
          await orderStrong.waitFor({timeout:20000});
          const firstOrderId = (await orderStrong.innerText()).trim();
          if (!firstOrderId) throw new Error('B2506_BROWSER_ORDER_ID_REQUIRED');
          if (submitPosts !== 1) throw new Error('B2506_BROWSER_SUBMIT_POST_COUNT_'+submitPosts);

          const acceptedRaw = await page.evaluate(() => localStorage.getItem('morefun.customer.accepted-order.v1'));
          if (!acceptedRaw) throw new Error('B2506_BROWSER_ACCEPTED_STORAGE_REQUIRED');
          const accepted = JSON.parse(acceptedRaw);
          if (accepted.orderId !== firstOrderId) throw new Error('B2506_BROWSER_STORAGE_ORDER_ID_MISMATCH');
          const pendingRaw = await page.evaluate(() => localStorage.getItem('morefun.customer.pending-order.v1'));
          if (pendingRaw !== null) throw new Error('B2506_BROWSER_PENDING_NOT_CLEARED');

          await page.reload({waitUntil:'networkidle'});
          await page.locator('html[data-cu-runtime="connected"]').waitFor({timeout:15000});
          const reloadedStrong = page.locator('.mf-order-card .mf-order-top strong').first();
          await reloadedStrong.waitFor({timeout:20000});
          const reloadedOrderId = (await reloadedStrong.innerText()).trim();
          if (reloadedOrderId !== firstOrderId) throw new Error('B2506_BROWSER_REFRESH_ORDER_ID_MISMATCH');
          if (submitPosts !== 1) throw new Error('B2506_BROWSER_DUPLICATE_POST_AFTER_REFRESH');

          const bodyText = (await page.locator('body').innerText()).replace(/\s+/g,' ');
          const fixtures = ['F6 紫米餐','(5) 招牌雞扒便當','TST-CU-20260824-001','TST-HISTORY-001'].filter(x=>bodyText.includes(x));
          if (fixtures.length) throw new Error('B2506_BROWSER_FIXTURE_PRESENT:'+fixtures.join(','));
          if (pageErrors.length) throw new Error('B2506_BROWSER_PAGE_ERROR:'+pageErrors.join('|'));
          if (requestFailures.length) throw new Error('B2506_BROWSER_REQUEST_FAILURE:'+requestFailures.join('|'));

          await page.screenshot({path:'evidence/customer-b2506-orders-after-refresh.png',fullPage:true});
          const result = {
            source_sha: sourceSha,
            origin,
            first_order_id: firstOrderId,
            reloaded_order_id: reloadedOrderId,
            submission_id: accepted.submissionId,
            business_date: accepted.businessDate,
            submit_post_count: submitPosts,
            lifecycle_get_count: lifecycleGets,
            pending_cleared: true,
            accepted_identity_persisted: true,
            same_order_after_refresh: true,
            fixture_markers: fixtures,
            page_errors: pageErrors,
            request_failures: requestFailures,
            classification: 'PASS'
          };
          fs.writeFileSync('evidence/browser-e2e.json', JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          await ctx.close();
          await browser.close();
          NODE
          node /tmp/customer-b2506-browser.mjs "$CHROME" "$ORIGIN" "$SOURCE_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team1-customer-b2506-browser-e2e-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
