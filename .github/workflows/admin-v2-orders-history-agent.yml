name: Admin V2 Historical Orders Verification

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/admin-v2-orders-history.sha'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: builder
          persist-credentials: true
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < builder/.ci-requests/admin-v2-orders-history.sha | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.19.0"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Run historical Orders transport test
        id: orders_test
        continue-on-error: true
        working-directory: source
        shell: bash
        run: node --experimental-strip-types --test packages/integration-v2/admin-orders-history-transport.test.ts
      - name: Install Admin Web
        id: install_admin
        continue-on-error: true
        working-directory: source/apps/admin-web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run historical Orders Web Port test
        id: orders_web_test
        if: ${{ always() && steps.install_admin.outcome == 'success' }}
        continue-on-error: true
        working-directory: source/apps/admin-web
        run: npm test -- orders-history-port.vitest.test.ts
      - name: Run historical Orders UI-A test
        id: orders_ui_test
        if: ${{ always() && steps.install_admin.outcome == 'success' }}
        continue-on-error: true
        working-directory: source/apps/admin-web
        run: npm test -- orders-history.vitest.test.tsx
      - name: Run historical Orders UI-B routing test
        id: orders_routing_test
        if: ${{ always() && steps.install_admin.outcome == 'success' }}
        continue-on-error: true
        working-directory: source/apps/admin-web
        run: npm test -- orders-history-routing.vitest.test.tsx
      - name: Typecheck
        id: typecheck
        if: ${{ always() }}
        continue-on-error: true
        working-directory: source
        run: npm run typecheck:v2-core
      - name: Persist result
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ORDERS_TEST: ${{ steps.orders_test.outcome }}
          INSTALL_ADMIN: ${{ steps.install_admin.outcome }}
          ORDERS_WEB_TEST: ${{ steps.orders_web_test.outcome }}
          ORDERS_UI_TEST: ${{ steps.orders_ui_test.outcome }}
          ORDERS_ROUTING_TEST: ${{ steps.orders_routing_test.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          set -euo pipefail
          if [[ "$ORDERS_TEST" == success && "$INSTALL_ADMIN" == success && "$ORDERS_WEB_TEST" == success && "$ORDERS_UI_TEST" == success && "$ORDERS_ROUTING_TEST" == success && "$TYPECHECK" == success ]]; then CONCLUSION=success; else CONCLUSION=failure; fi
          mkdir -p builder/.ci-results
          printf 'source_sha=%s\nbuilder_sha=%s\nrun_id=%s\norders_test=%s\ninstall_admin=%s\norders_web_test=%s\norders_ui_test=%s\norders_routing_test=%s\ntypecheck=%s\nconclusion=%s\n' "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ORDERS_TEST" "$INSTALL_ADMIN" "$ORDERS_WEB_TEST" "$ORDERS_UI_TEST" "$ORDERS_ROUTING_TEST" "$TYPECHECK" "$CONCLUSION" > builder/.ci-results/admin-v2-orders-history.txt
          git -C builder config user.name 'morefunos-builder-bot'
          git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git -C builder add .ci-results/admin-v2-orders-history.txt
          if git -C builder diff --cached --quiet; then exit 0; fi
          git -C builder commit -m "ci(result): Admin V2 historical Orders $SOURCE_SHA"
          git -C builder push origin HEAD:main
      - name: Enforce
        if: always()
        shell: bash
        env:
          ORDERS_TEST: ${{ steps.orders_test.outcome }}
          INSTALL_ADMIN: ${{ steps.install_admin.outcome }}
          ORDERS_WEB_TEST: ${{ steps.orders_web_test.outcome }}
          ORDERS_UI_TEST: ${{ steps.orders_ui_test.outcome }}
          ORDERS_ROUTING_TEST: ${{ steps.orders_routing_test.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          [[ "$ORDERS_TEST" == success ]]
          [[ "$INSTALL_ADMIN" == success ]]
          [[ "$ORDERS_WEB_TEST" == success ]]
          [[ "$ORDERS_UI_TEST" == success ]]
          [[ "$ORDERS_ROUTING_TEST" == success ]]
          [[ "$TYPECHECK" == success ]]
