name: Diagnose V2 SMM Owner Phone

on:
  push:
    paths:
      - 'requests/v2-smm-owner-phone-diagnose.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smm-owner-phone-diagnose.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Diagnose live trusted principal shape
        env:
          ADMIN_SESSION_BOOTSTRAP_JSON: ${{ secrets.ADMIN_SESSION_BOOTSTRAP_JSON }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_SESSION_BOOTSTRAP_JSON:-}"
          TOKEN="$(node -e "const x=JSON.parse(process.env.ADMIN_SESSION_BOOTSTRAP_JSON);if(!Array.isArray(x)||!x[0]?.sessionToken)process.exit(1);process.stdout.write(x[0].sessionToken)")"
          curl -fsS -H "Cookie: mf_admin_session=${TOKEN}" https://morefun-v2-admin.pantonyeung.workers.dev/api/admin/session > /tmp/admin-session.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/admin-session.json','utf8'));
          const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          console.log('ADMIN_PRINCIPAL_SHAPE actor_uuid='+uuid.test(x.actorId||'')+' staff_uuid='+uuid.test(x.staffId||'')+' scope_present='+Boolean(x.scopeRef));
          fs.writeFileSync('/tmp/admin-principal-shape.json',JSON.stringify({actorId:x.actorId,staffId:x.staffId,scopeRef:x.scopeRef}));
          NODE
          CFG='infra/cloudflare/admin-web-worker/wrangler.jsonc'
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CFG" --command "SELECT store_id FROM mfos_store_code_binding WHERE store_code='MF01' LIMIT 1;" > /tmp/store-binding.txt
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/admin-principal-shape.json','utf8'));
          const raw=fs.readFileSync('/tmp/store-binding.txt','utf8');
          const match=raw.match(/"store_id":\s*"([^"]+)"/);
          if(!match)throw new Error('CANONICAL_STORE_BINDING_MISSING');
          console.log('ADMIN_PRINCIPAL_SCOPE_MATCHES_CANONICAL='+(p.scopeRef===match[1]));
          NODE
          rm -f /tmp/admin-session.json /tmp/admin-principal-shape.json /tmp/store-binding.txt

      - name: Read live SMM pairing identity shape
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_LOGIN_SECRET"
          CODE="$(curl -sS -o /tmp/smm-pair.json -w '%{http_code}' -H 'content-type: application/json' --data "$(node -e "process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))")" https://morefun-v2-smm.pantonyeung.workers.dev/api/smm/session)"
          test "$CODE" = 200
          node - <<'NODE'
          const x=require('/tmp/smm-pair.json');
          const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          console.log(JSON.stringify({
            pair_http:200,
            actor_uuid:uuid.test(x.actorId||''),
            staff_uuid:uuid.test(x.staffId||''),
            operator_same:x.operatorId===x.staffId,
            store_uuid:uuid.test(x.storeId||''),
            scope_matches_store:x.scopeRef===x.storeId,
            mounted_count:Array.isArray(x.mountedOperationIds)?x.mountedOperationIds.length:null
          }));
          NODE
          rm -f /tmp/smm-pair.json
      - name: Read production identity and catalog shape
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          CFG='infra/cloudflare/admin-web-worker/wrangler.jsonc'
          echo '=== STAFF_AUTH_BINDINGS ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CFG" --command "SELECT actor_alias,staff_alias,scope_ref,actor_id,staff_id,status,revision,(actor_alias=actor_id) AS actor_alias_is_canonical,(staff_alias=staff_id) AS staff_alias_is_canonical FROM mfos_staff_auth_binding ORDER BY scope_ref,staff_alias;"
          echo '=== RBAC_STAFF ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CFG" --command "SELECT staff_id,revision,json_extract(record_json,'$.displayName') AS display_name,json_extract(record_json,'$.lifecycleStatus') AS lifecycle_status,json_extract(record_json,'$.roleIds') AS role_ids FROM mfos_rbac_staff ORDER BY staff_id;"
          echo '=== CANONICAL_STORE_COUNT ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CFG" --command "SELECT COUNT(*) AS store_bindings FROM mfos_store_code_binding WHERE store_code='MF01';"
          echo '=== CATALOG_OPTION_COUNTS ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CFG" --command "WITH products AS (SELECT json_extract(p.value,'$.productId') AS product_id,json_extract(p.value,'$.name') AS product_name,json_extract(p.value,'$.lifecycleStatus') AS product_status,p.value AS product_json FROM mfos_catalog_state c,json_each(c.snapshot_json,'$.products') p), groups AS (SELECT product_id,product_name,product_status,json_extract(g.value,'$.optionGroupId') AS group_id,json_extract(g.value,'$.name') AS group_name,json_extract(g.value,'$.required') AS required,json_extract(g.value,'$.minSelections') AS min_selections,json_array_length(json_extract(g.value,'$.options')) AS option_count FROM products,json_each(products.product_json,'$.optionGroups') g) SELECT COUNT(DISTINCT CASE WHEN product_status='ACTIVE' THEN product_id END) AS active_products_with_groups,SUM(CASE WHEN product_status='ACTIVE' AND (required=1 OR min_selections>0) THEN 1 ELSE 0 END) AS required_groups,SUM(CASE WHEN product_status='ACTIVE' AND COALESCE(required,0)=0 AND COALESCE(min_selections,0)=0 THEN 1 ELSE 0 END) AS optional_groups FROM groups;"
          echo '=== ACTIVE_PRODUCTS_WITH_OPTIONS ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CFG" --command "WITH products AS (SELECT json_extract(p.value,'$.productId') AS product_id,json_extract(p.value,'$.name') AS product_name,json_extract(p.value,'$.lifecycleStatus') AS product_status,p.value AS product_json FROM mfos_catalog_state c,json_each(c.snapshot_json,'$.products') p), groups AS (SELECT product_id,product_name,product_status,json_extract(g.value,'$.optionGroupId') AS group_id,json_extract(g.value,'$.name') AS group_name,json_extract(g.value,'$.required') AS required,json_extract(g.value,'$.minSelections') AS min_selections,json_array_length(json_extract(g.value,'$.options')) AS option_count FROM products,json_each(products.product_json,'$.optionGroups') g) SELECT product_id,product_name,group_id,group_name,required,min_selections,option_count FROM groups WHERE product_status='ACTIVE' ORDER BY product_name,group_name LIMIT 50;"