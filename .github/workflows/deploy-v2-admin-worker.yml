name: Deploy V2 Admin Worker

on:
  push:
    paths:
      - 'requests/v2-admin-worker-deploy-request.txt'
  pull_request:
    branches: [main]
    paths:
      - 'requests/v2-admin-worker-deploy-request.txt'

permissions:
  contents: read

jobs:
  deploy:
    if: github.actor == 'Pantonyeung' && (github.event_name == 'push' || startsWith(github.head_ref, 'verify/t2-admin-worker-deploy-proof-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-admin-worker-deploy-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install and build exact Admin source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund
          node --test packages/admin-ui-integration/*.test.ts
          npm run typecheck
          cd apps/admin-web
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html
      - name: Apply Admin session schema to production D1 using proven REST path
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          SQL_FILE='infra/cloudflare/d1/migrations/0009-admin-session-device-trust.sql'
          test -s "$SQL_FILE"
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          node -e "const fs=require('fs');fs.writeFileSync('/tmp/d1-body.json',JSON.stringify({sql:fs.readFileSync(process.argv[1],'utf8')}))" "$SQL_FILE"
          HTTP_CODE="$(curl -sS -o /tmp/d1-result.json -w '%{http_code}' -X POST "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/d1-body.json)"
          printf 'migration=0009-admin-session-device-trust.sql http=%s\n' "$HTTP_CODE" | tee "$GITHUB_WORKSPACE/evidence/d1-migrations.log"
          test "$HTTP_CODE" = 200
          node -e "const x=require('/tmp/d1-result.json');if(!x.success||!(x.result||[]).every(r=>r.success!==false)){console.error(JSON.stringify(x.errors||x.result));process.exit(1)}"
          node -e "require('fs').writeFileSync('/tmp/d1-verify.json',JSON.stringify({sql:\"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('mfos_session_policy','mfos_device_trust','mfos_session','mfos_session_device_idempotency','mfos_session_device_audit','mfos_session_device_commit_guard') ORDER BY name\"}))"
          curl -fsS -X POST "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/d1-verify.json > /tmp/d1-verify-result.json
          node - <<'NODE' | tee -a "$GITHUB_WORKSPACE/evidence/d1-migrations.log"
          const x=require('/tmp/d1-verify-result.json');
          const names=(x.result?.[0]?.results||[]).map(r=>r.name).sort();
          const expected=['mfos_device_trust','mfos_session','mfos_session_device_audit','mfos_session_device_commit_guard','mfos_session_device_idempotency','mfos_session_policy'].sort();
          if(JSON.stringify(names)!==JSON.stringify(expected)){console.error('ADMIN_SESSION_D1_TABLES_MISSING',names);process.exit(1)}
          console.log('database_name=morefun-v2-production');
          console.log('admin_session_tables=PASS');
          NODE
          rm -f /tmp/d1-body.json /tmp/d1-result.json /tmp/d1-verify.json /tmp/d1-verify-result.json
      - name: Read-only production authority preflight
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          node - <<'NODE'
          const fs=require('fs');
          const sql=`SELECT 'store' AS authority, COUNT(*) AS row_count FROM mfos_store_operational_state
          UNION ALL SELECT 'pricing', COUNT(*) FROM mfos_pricing_profile
          UNION ALL SELECT 'availability', COUNT(*) FROM mfos_availability_state
          UNION ALL SELECT 'business_day', COUNT(*) FROM mfos_business_day
          UNION ALL SELECT 'direct_bootstrap_idempotency', COUNT(*) FROM mfos_d1_idempotency WHERE scope='direct.authority.bootstrap';`;
          fs.writeFileSync('/tmp/authority-preflight.json', JSON.stringify({sql}));
          NODE
          HTTP_CODE="$(curl -sS -o /tmp/authority-preflight-result.json -w '%{http_code}' -X POST "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/authority-preflight.json)"
          echo "authority_preflight_http=$HTTP_CODE" | tee evidence/authority-preflight.txt
          test "$HTTP_CODE" = 200
          node - <<'NODE' | tee -a evidence/authority-preflight.txt
          const x=require('/tmp/authority-preflight-result.json');
          if(!x.success || !x.result?.[0]?.success) process.exit(1);
          for (const row of x.result[0].results || []) console.log(`${row.authority}=${row.row_count}`);
          NODE
          rm -f /tmp/authority-preflight.json /tmp/authority-preflight-result.json
      - name: Apply formal Admin login secret when configured
        env:
          ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ADMIN_LOGIN_SECRET:-}" ]; then
            printf '%s' "$ADMIN_LOGIN_SECRET" | npx --yes wrangler@4 secret put ADMIN_LOGIN_SECRET --config infra/cloudflare/admin-web-worker/wrangler.jsonc >/dev/null
            echo 'admin_login_secret=CONFIGURED' > "$GITHUB_WORKSPACE/evidence/session.txt"
          else
            echo 'admin_login_secret=MISSING_FAIL_CLOSED' > "$GITHUB_WORKSPACE/evidence/session.txt"
          fi
      - name: Deploy Admin Worker and assets
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          CONFIG='infra/cloudflare/admin-web-worker/wrangler.jsonc'
          npx --yes wrangler@4 deploy --config "$CONFIG" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | sed 's/[),.;]*$//' || true)"
          test -n "$URL"
          printf '%s\n' "$URL" > "$GITHUB_WORKSPACE/evidence/url.txt"
      - name: Verify live Admin session authority
        env:
          ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat evidence/url.txt)"
          curl -fsS "$URL/" >/dev/null
          CODE="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$URL/api/admin/session")"
          test "$CODE" = 401
          echo "anonymous_session_http=$CODE" > evidence/runtime.txt
          if [ -n "${ADMIN_LOGIN_SECRET:-}" ]; then
            LOGIN_CODE="$(curl -sS -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$(node -e 'process.stdout.write(JSON.stringify({loginSecret:process.env.ADMIN_LOGIN_SECRET}))')" "$URL/api/admin/session")"
            test "$LOGIN_CODE" = 200
            COOKIE="$(sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' /tmp/login.headers | tr -d '\r' | head -n1)"
            test -n "$COOKIE"
            AUTH_CODE="$(curl -sS -o /tmp/auth-session.json -w '%{http_code}' -H "Cookie: $COOKIE" "$URL/api/admin/session")"
            test "$AUTH_CODE" = 200
            echo "login_session_http=$LOGIN_CODE" >> evidence/runtime.txt
            echo "authenticated_session_http=$AUTH_CODE" >> evidence/runtime.txt
          else
            echo 'login_session_http=BLOCKED_MISSING_SECRET' >> evidence/runtime.txt
            echo 'authenticated_session_http=BLOCKED_MISSING_SECRET' >> evidence/runtime.txt
          fi
          rm -f /tmp/session.json /tmp/login.headers /tmp/login.json /tmp/auth-session.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-worker-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
