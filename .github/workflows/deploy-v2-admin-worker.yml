name: Deploy V2 Admin Worker

on:
  push:
    paths:
      - 'requests/v2-admin-worker-deploy-request.txt'
  pull_request:
    branches: [main]
    paths:
      - 'requests/v2-admin-worker-deploy-request.txt'

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    if: github.actor == 'Pantonyeung' && (github.event_name == 'push' || startsWith(github.head_ref, 'verify/t2-admin-worker-deploy-proof-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context='builder/v2-admin-worker-deploy' \
            -f description='Admin Worker deploy running' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-admin-worker-deploy-request.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Require source equals current V2 main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api repos/Pantonyeung/Morefun-v2/commits/main --jq .sha)"
          test "$SOURCE_SHA" = "$MAIN_SHA" || { echo "::error::STALE_V2_SOURCE_REFUSED source=$SOURCE_SHA main=$MAIN_SHA"; exit 1; }
          echo "v2-main-pin=PASS sha=$MAIN_SHA"

      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.req.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Diagnose reporting canonical source read-only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          CONFIG='infra/cloudflare/admin-web-worker/wrangler.jsonc'
          echo '=== PRICING_CURRENCY ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CONFIG" --command "SELECT store_id,currency,lifecycle_status,COUNT(*) AS n FROM mfos_pricing_profile WHERE lifecycle_status='ACTIVE' GROUP BY store_id,currency,lifecycle_status ORDER BY store_id,currency;"
          echo '=== REPORTING_ORDERS ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CONFIG" --command "SELECT order_id,store_id,lifecycle_status,revision,order_snapshot_json IS NULL AS snapshot_null,accepted_projection_json IS NULL AS accepted_null,json_extract(COALESCE(order_snapshot_json,accepted_projection_json),'$.currency') AS currency,json_extract(COALESCE(order_snapshot_json,accepted_projection_json),'$.totalMinor') AS total_minor,json_extract(COALESCE(order_snapshot_json,accepted_projection_json),'$.storeId') AS snapshot_store,json_extract(COALESCE(order_snapshot_json,accepted_projection_json),'$.orderId') AS snapshot_order FROM mfos_order_state WHERE lifecycle_status IN ('ACCEPTED','COMPLETED') ORDER BY order_id;"
          echo '=== REPORTING_PAYMENTS ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CONFIG" --command "SELECT payment_id,store_id,json_extract(payment_json,'$.paymentId') AS json_payment_id,json_extract(payment_json,'$.orderId') AS order_id,json_extract(payment_json,'$.currency') AS currency,json_extract(payment_json,'$.amountMinor') AS amount_minor FROM mfos_payment_state ORDER BY payment_id;"
          echo '=== REPORTING_REFUNDS ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CONFIG" --command "SELECT refund_id,store_id,json_extract(refund_json,'$.refundId') AS json_refund_id,json_extract(refund_json,'$.paymentId') AS payment_id,json_extract(refund_json,'$.orderId') AS order_id,json_extract(refund_json,'$.currency') AS currency,json_extract(refund_json,'$.amountMinor') AS amount_minor FROM mfos_refund_state ORDER BY refund_id;"
          echo '=== REPORTING_CACHE ==='
          npx --yes wrangler@4 d1 execute morefun-v2-production --remote --config "$CONFIG" --command "SELECT projection_key,store_id,currency,projection_revision,source_fingerprint,updated_at FROM mfos_reporting_projection ORDER BY projection_key;"

      - name: Install and build exact Admin source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund
          mapfile -t ADMIN_TESTS < <(find packages/admin-ui-integration -maxdepth 1 -name '*.test.ts' ! -name 'admin-session-worker.test.ts' ! -name 'admin-worker-session-runtime.test.ts' -print | sort)
          node --test "${ADMIN_TESTS[@]}"
          cd apps/admin-web
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html
      - name: Ensure Product Media R2 bucket
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          BUCKET='morefun-v2-product-media'
          if npx --yes wrangler@4 r2 bucket list | grep -Fq "$BUCKET"; then
            echo "r2-product-media=EXISTS bucket=$BUCKET"
          else
            npx --yes wrangler@4 r2 bucket create "$BUCKET"
            echo "r2-product-media=CREATED bucket=$BUCKET"
          fi
      - name: Ensure Payment Evidence R2 bucket
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          BUCKET='morefun-v2-payment-evidence'
          if npx --yes wrangler@4 r2 bucket list | grep -Fq "$BUCKET"; then
            echo "r2-payment-evidence=EXISTS bucket=$BUCKET"
          else
            npx --yes wrangler@4 r2 bucket create "$BUCKET"
            echo "r2-payment-evidence=CREATED bucket=$BUCKET"
          fi

      - name: Deploy Admin Worker and assets
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          CONFIG='infra/cloudflare/admin-web-worker/wrangler.jsonc'
          test -s "$CONFIG"
          npx --yes wrangler@4 deploy --config "$CONFIG" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/deploy.log"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$GITHUB_WORKSPACE/evidence/deploy.log" | tail -n1 | sed 's/[),.;]*$//' || true)"
          test -n "$URL"
          printf '%s\n' "$URL" > "$GITHUB_WORKSPACE/evidence/url.txt"
      - name: Apply Admin session secret when configured
        env:
          ADMIN_SESSION_BOOTSTRAP_JSON: ${{ secrets.ADMIN_SESSION_BOOTSTRAP_JSON }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ADMIN_SESSION_BOOTSTRAP_JSON:-}" ]; then
            printf '%s' "$ADMIN_SESSION_BOOTSTRAP_JSON" | npx --yes wrangler@4 secret put ADMIN_SESSION_BOOTSTRAP_JSON --config infra/cloudflare/admin-web-worker/wrangler.jsonc >/dev/null
            echo 'admin_session_secret=CONFIGURED' > "$GITHUB_WORKSPACE/evidence/session.txt"
          else
            echo 'admin_session_secret=MISSING_FAIL_CLOSED' > "$GITHUB_WORKSPACE/evidence/session.txt"
          fi
      - name: Verify live host fail-closed and bindings
        env:
          ADMIN_SESSION_BOOTSTRAP_JSON: ${{ secrets.ADMIN_SESSION_BOOTSTRAP_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat evidence/url.txt)"
          curl -fsS "$URL/" >/dev/null
          CODE="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$URL/api/admin/session")"
          test "$CODE" = 401
          echo "anonymous_session_http=$CODE" > evidence/runtime.txt
          if [ -n "${ADMIN_SESSION_BOOTSTRAP_JSON:-}" ]; then
            TOKEN="$(node -e "const x=JSON.parse(process.env.ADMIN_SESSION_BOOTSTRAP_JSON);if(!Array.isArray(x)||!x[0]?.sessionToken)process.exit(1);process.stdout.write(x[0].sessionToken)")"
            AUTH_CODE="$(curl -sS -o /tmp/auth-session.json -w '%{http_code}' -H "Cookie: mf_admin_session=${TOKEN}" "$URL/api/admin/session")"
            test "$AUTH_CODE" = 200
            echo "authenticated_session_http=$AUTH_CODE" >> evidence/runtime.txt
          else
            echo 'authenticated_session_http=BLOCKED_MISSING_SECRET' >> evidence/runtime.txt
          fi
          PRICING_REVISION_HTTP="$(curl -sS -o /tmp/pricing-revision.json -w '%{http_code}' "$URL/api/pricing/revision")"
          PRICING_ACTIVE_HTTP="$(curl -sS -o /tmp/pricing-active.json -w '%{http_code}' "$URL/api/pricing/active")"
          test "$PRICING_REVISION_HTTP" = 200
          test "$PRICING_ACTIVE_HTTP" = 200
          node - <<'NODE'
          const revision=require('/tmp/pricing-revision.json');
          const active=require('/tmp/pricing-active.json');
          if(revision?.ok!==true||!Number.isSafeInteger(revision?.value?.revision)||revision.value.revision<1||!String(revision?.value?.revisionToken||'').trim())process.exit(1);
          if(active?.ok!==true||String(active?.value?.revision)!==String(revision.value.revision)||active?.value?.revisionToken!==revision.value.revisionToken||!active?.value?.products)process.exit(1);
          console.log('pricing_live_readback=PASS revision='+revision.value.revision);
          NODE
          echo "pricing_revision_http=$PRICING_REVISION_HTTP" >> evidence/runtime.txt
          echo "pricing_active_http=$PRICING_ACTIVE_HTTP" >> evidence/runtime.txt
          PRICING_SOCKET_URL="$(printf '%s' "$URL" | sed 's#^https://#wss://#;s#^http://#ws://#')/api/pricing/socket"
          PRICING_SOCKET_URL="$PRICING_SOCKET_URL" node - <<'NODE'
          const url=process.env.PRICING_SOCKET_URL;
          const timer=setTimeout(()=>{console.error('PRICING_REALTIME_WEBSOCKET_TIMEOUT');process.exit(1)},5000);
          const ws=new WebSocket(url);
          ws.addEventListener('open',()=>{
            clearTimeout(timer);
            console.log('pricing_realtime_websocket=PASS');
            ws.close(1000,'builder-smoke');
          });
          ws.addEventListener('error',()=>{
            clearTimeout(timer);
            console.error('PRICING_REALTIME_WEBSOCKET_FAILED');
            process.exit(1);
          });
          ws.addEventListener('close',()=>process.exit(0));
          NODE
          echo "pricing_socket=PASS" >> evidence/runtime.txt
          rm -f /tmp/session.json /tmp/auth-session.json /tmp/pricing-revision.json /tmp/pricing-active.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-admin-worker-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context='builder/v2-admin-worker-deploy' \
            -f description='Admin Worker deploy passed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context='builder/v2-admin-worker-deploy' \
            -f description='Admin Worker deploy failed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
