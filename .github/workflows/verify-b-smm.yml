name: Owner V1 Verify B SMM

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character MoreFunOS V1 SMM candidate SHA'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  verify-b-smm:
    if: >-
      github.actor == 'Pantonyeung' &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.number == 2 && startsWith(github.event.comment.body, '/verify-b-smm ')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: Pantonyeung/morefunos-v1
      REQUESTED_SOURCE: ${{ github.event_name == 'issue_comment' && github.event.comment.body || inputs.source_sha }}
    steps:
      - name: Validate immutable SMM verification request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(printf '%s' "$REQUESTED_SOURCE" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$GITHUB_EVENT_NAME" == 'issue_comment' ]]; then
            case "$RAW" in
              '/verify-b-smm '*) SOURCE_SHA="${RAW#'/verify-b-smm '}" ;;
              *) echo 'Unsupported SMM verification comment.' >&2; exit 1 ;;
            esac
          else
            SOURCE_SHA="$RAW"
          fi
          SOURCE_SHA="$(printf '%s' "$SOURCE_SHA" | tr -d '[:space:]')"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must normalize to one exact 40-character Git SHA' >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo 'Validated immutable SMM source SHA.'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo 'Exact SMM source identity: PASS'

      - name: Install pinned TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"
          echo 'Pinned TypeScript 5.8.3: PASS'

      - name: Execute private SMM verification without public source logs
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/private-smm-verification.log"
          : > "$LOG"

          run_stage() {
            local stage="$1"
            shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            echo "$stage: FAIL (details withheld from public log)"
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            return 1
          }

          cd source
          if [[ ! -f apps/smm-web/package-lock.json ]]; then
            echo 'b-smm-lockfile: FAIL (committed apps/smm-web/package-lock.json required)'
            echo 'failed_stage=b-smm-lockfile' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          run_stage 'b-smm-locked-install' npm --prefix apps/smm-web ci --no-audit --no-fund || exit 1
          run_stage 'b-smm-active-work-contract' node --experimental-strip-types --test apps/smm-web/src/smm-active-work-port.test.ts || exit 1
          run_stage 'b-smm-static-boundary' node --test apps/smm-web/src/b-smm-01a-static.test.mjs apps/smm-web/src/b-smm-01b-static.test.mjs || exit 1
          run_stage 'b-smm-ui-test' npm --prefix apps/smm-web run test:ui || exit 1
          run_stage 'b-smm-typecheck' tsc --noEmit -p apps/smm-web/tsconfig.json || exit 1
          run_stage 'b-smm-build' npm --prefix apps/smm-web run build || exit 1

      - name: Publish sanitized SMM verification summary
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          FAILED_STAGE: ${{ steps.verify.outputs.failed_stage }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          echo "SMM source SHA: $SOURCE_SHA"
          if [[ "$VERIFY_OUTCOME" == 'success' ]]; then
            echo 'SMM verification: PASS'
          else
            echo "SMM verification: FAIL stage=${FAILED_STAGE:-UNAVAILABLE}"
            exit 1
          fi
