name: T1 Keeta Durable Event Journal 010

on:
  push:
    branches: [main]
    paths:
      - 'requests/t1-keeta-durable-event-journal-010.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact V2 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-durable-event-journal-010.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install source dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Event journal unit and D1 durability tests
        working-directory: source
        run: node --test packages/integration/keeta-webhook-event-journal.test.ts packages/integration/d1-keeta-durable-runtime.test.ts

      - name: Worker mount contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'createD1KeetaWebhookEventJournalRepository' workers/keeta/src/index.ts
          grep -Fq 'createKeetaWebhookEventJournalRecord' workers/keeta/src/index.ts
          grep -Fq 'mfos_keeta_webhook_event_journal' infra/cloudflare/d1/migrations/0019-keeta-webhook-event-journal.sql

      - name: Root TypeScript gate
        working-directory: source
        run: npm run typecheck
