name: Verify V2 Owner B0289 Operational Alerts

on:
  push:
    paths:
      - 'requests/v2-owner-b0289-operational-alerts-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-owner-b0289-operational-alerts-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exact source
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Operational health authority and Owner runtime tests
        working-directory: source
        run: node --test packages/offline-operations/operational-health-port-contract.test.ts packages/offline-operations/offline-operations.test.ts packages/owner-ui-integration/operational-health-runtime.test.ts packages/owner-ui-integration/runtime-provider.test.ts
      - name: Owner application tests
        working-directory: source/apps/owner-web
        run: npm test
      - name: Owner application typecheck
        working-directory: source/apps/owner-web
        run: npm run typecheck
      - name: Owner application build
        working-directory: source/apps/owner-web
        run: npm run build
      - name: Record evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_sha=%s\nworkflow=verify-v2-owner-b0289-operational-alerts.yml\nrun_id=%s\nmutation=NONE\nroot_global_ts_gate=DEFERRED_UNRELATED_UI_JSX_CONFIG\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > evidence/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-owner-b0289-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
