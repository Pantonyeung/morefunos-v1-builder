name: Canonical Order Identity Verify
on:
  push:
    branches: [main]
    paths: ['.ci-requests/canonical-order-identity.sha']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Resolve SHA
        id: src
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/canonical-order-identity.sha)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.src.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Install
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Canonical identity tests
        working-directory: source
        run: |
          node --test packages/order/canonical-order-identity.test.ts
          node --test packages/integration/keeta-canonical-order-projection.test.ts
          node --test apps/smm-web/src/smm-user-messages.test.ts
          node --test packages/integration/keeta-standard-canonical-acceptance-bridge.test.ts
          node --test packages/integration/keeta-d1-canonical-acceptance-plan.test.ts
      - name: Typecheck
        working-directory: source
        run: npm run typecheck
