name: V2 SMT Android Carrier Verification

on:
  push:
    paths:
      - 'requests/v2-smt-carrier-request.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Publish carrier pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context='builder/v2-smt-carrier' \
            -f description='SMT carrier verification running' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          else
            test -f requests/v2-smt-carrier-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-smt-carrier-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Root TypeScript typecheck
        id: root_typecheck
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/root-typecheck.log

      - name: Report Team3 TS7006 root gate
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ROOT_OUTCOME: ${{ steps.root_typecheck.outcome }}
        run: |
          set -euo pipefail
          excerpt=""
          if [ -f /tmp/root-typecheck.log ]; then
            excerpt="$(grep -E 'production-native-print-runtime.ts|error TS7006|error TS' /tmp/root-typecheck.log | tail -n 12 | tr '\n' ' ' | sed 's/"/\\\"/g' || true)"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/94/comments"             -f body="T3_HOTFIX_TS7006_003_ROOT run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} builder_sha=${GITHUB_SHA} source_sha=${SOURCE_SHA} root_typecheck=${ROOT_OUTCOME} excerpt=${excerpt}"

      - name: Require root TypeScript GREEN
        if: steps.root_typecheck.outcome != 'success'
        shell: bash
        run: exit 1

      - name: SMT Node-compatible integration tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find packages/smt-ui-integration -maxdepth 1 -name '*.test.ts' ! -name 't2-smt-worker-mount.test.ts' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

      - name: Record Worker-runtime test separation
        shell: bash
        run: |
          set -euo pipefail
          test -f source/packages/smt-ui-integration/t2-smt-worker-mount.test.ts
          grep -q "infra/cloudflare/admin-web-worker/index.ts" source/packages/smt-ui-integration/t2-smt-worker-mount.test.ts
          echo "t2-smt-worker-mount.test.ts imports Cloudflare Worker runtime code and is intentionally excluded from plain Node carrier verification; Workers-runtime verification belongs to the dedicated Cloudflare test/deploy lane." >> "$GITHUB_STEP_SUMMARY"

      - name: Install SMT app dependencies
        working-directory: source/apps/smt-clean
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: SMT app typecheck
        working-directory: source/apps/smt-clean
        run: npm run typecheck

      - name: SMT app build
        working-directory: source/apps/smt-clean
        run: npm run build

      - name: Verify installed asset base
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test -s apps/smt-clean/dist/index.html
          grep -Eq '(src|href)="\./assets/' apps/smt-clean/dist/index.html
          ! grep -Eq '(src|href)="/assets/' apps/smt-clean/dist/index.html

      - name: Android runtime persistence regression tests
        working-directory: source
        run: gradle -p apps/smt-android :app:testDebugUnitTest --no-daemon

      - name: Android Java compile
        working-directory: source
        run: gradle -p apps/smt-android :app:compileDebugJavaWithJavac --no-daemon

      - name: Android lint
        working-directory: source
        run: gradle -p apps/smt-android :app:lintDebug --no-daemon

      - name: Android assemble
        working-directory: source
        run: gradle -p apps/smt-android :app:assembleDebug --no-daemon

      - name: Require APK artifact
        shell: bash
        working-directory: source
        run: test -f apps/smt-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload TEST APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v2-smt-test-apk-${{ steps.request.outputs.source_sha }}
          path: source/apps/smt-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          mkdir -p evidence
          printf 'source_repo=Pantonyeung/Morefun-v2\nsource_sha=%s\nworkflow=verify-v2-smt-carrier.yml\nruntime_persistence_tests=:app:testDebugUnitTest\napk_kind=DEBUG_TEST_ONLY\n' "$SOURCE_SHA" > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-smt-carrier-${{ steps.request.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Report Team3 TS7006 gate result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ROOT_OUTCOME: ${{ steps.root_typecheck.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          excerpt=""
          if [ -f /tmp/root-typecheck.log ]; then
            excerpt="$(grep -E 'production-native-print-runtime.ts|error TS7006|error TS' /tmp/root-typecheck.log | tail -n 12 | tr '\n' ' ' | sed 's/"/\\\"/g' || true)"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/94/comments"             -f body="T3_HOTFIX_TS7006_003_GATE run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} builder_sha=${GITHUB_SHA} source_sha=${SOURCE_SHA} root_typecheck=${ROOT_OUTCOME} job_status=${JOB_STATUS} excerpt=${excerpt}"


      - name: Publish carrier success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context='builder/v2-smt-carrier' \
            -f description='SMT carrier verification passed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Publish carrier failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context='builder/v2-smt-carrier' \
            -f description='SMT carrier verification failed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
