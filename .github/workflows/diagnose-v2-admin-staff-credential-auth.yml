name: Diagnose Admin Staff Credential Authorization

on:
  push:
    paths:
      - 'requests/v2-admin-staff-credential-auth-diagnostic-request.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_ORIGIN: https://morefun-v2-admin.pantonyeung.workers.dev
    steps:
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Probe staff credential authorization without write
        env:
          ADMIN_LOGIN_SECRET: ${{ secrets.ADMIN_LOGIN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const origin=process.env.ADMIN_ORIGIN;
          const secret=process.env.ADMIN_LOGIN_SECRET;
          if(!secret)throw new Error('ADMIN_LOGIN_SECRET_REQUIRED');
          const login=await fetch(origin+'/api/admin/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({loginSecret:secret})});
          const setCookie=login.headers.get('set-cookie');
          const loginBody=await login.text();
          console.log('LOGIN_STATUS='+login.status);
          console.log('LOGIN_BODY='+loginBody.slice(0,1000));
          if(!login.ok||!setCookie)throw new Error('LOGIN_FAILED');
          const cookie=setCookie.split(';')[0];
          const body={
            action:'SET_STAFF_PIN',
            idempotencyKey:'diag-nonwrite-'+Date.now(),
            staffId:'diag-nonexistent-staff',
            employeeCode:'999999',
            pin:'2468',
            expectedPinRevision:0
          };
          const res=await fetch(origin+'/api/admin/staff',{method:'POST',headers:{'content-type':'application/json','cookie':cookie},body:JSON.stringify(body)});
          const text=await res.text();
          console.log('PROBE_STATUS='+res.status);
          console.log('PROBE_BODY='+text.slice(0,1200));
          if(res.status===403)throw new Error('STAFF_AUTH_FORBIDDEN');
          if(res.status>=500)throw new Error('STAFF_AUTH_OR_SESSION_FAILURE');
          if(res.status!==400)throw new Error('UNEXPECTED_PROBE_STATUS_'+res.status);
          if(!text.includes('RBAC_STAFF_NOT_FOUND'))throw new Error('EXPECTED_NOT_FOUND_NOT_REACHED');
          console.log('AUTHORIZATION_CHAIN_PASS');
          EOF
