name: Team2 Customer Canonical Presentation 015 Verification

on:
  push:
    paths:
      - 'requests/team2-customer-presentation-015.txt'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team2-customer-presentation-015.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install source dependencies
        working-directory: source
        run: npm install --no-save --ignore-scripts --no-audit --no-fund

      - name: Canonical server regressions
        working-directory: source
        run: |
          node --test packages/customer-ui-integration/*.test.ts
          node --test packages/customer-loyalty/customer-authentication-d1.test.ts
          node --test packages/order/d1-store-order-acceptance.test.ts
          node --test packages/admin-ui-integration/admin-worker-session-runtime.test.ts

      - name: Customer presentation and browser regressions
        working-directory: source
        run: node --test apps/customer-web/*.test.mjs

      - name: Customer public Worker regression
        working-directory: source
        run: node --experimental-strip-types --test infra/cloudflare/customer-web-worker/*.test.ts

      - name: Production build and fixture scan
        working-directory: source/apps/customer-web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/index.html
          JS="$(find dist/assets -maxdepth 1 -type f -name '*.js' | head -1)"
          test -s "$JS"
          for marker in 'F6 紫米餐' '(5) 招牌雞扒便當' 'TST-CU-20260824-001' 'TST-HISTORY-001' '+852 5600 4443'; do
            ! grep -F "$marker" "$JS"
          done
          grep -F 'canonical-runtime' "$JS"

      - name: Wrangler dry-run
        working-directory: source
        run: npm exec --yes --package=wrangler@4.125.0 -- wrangler deploy --dry-run --config infra/cloudflare/customer-web-worker/wrangler.jsonc

      - name: Strict TypeScript
        working-directory: source
        run: npm exec --yes --package=typescript@5.9.3 -- tsc -p packages/customer-ui-integration/tsconfig.json

      - name: Publish durable GREEN evidence
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
        run: |
          set -euo pipefail
          CONTENT="$(printf 'status=GREEN\nsource_sha=%s\nrun_id=%s\njob=%s\nfixture_markers=0\npresentation_boundary=canonical-runtime\n' "$SOURCE_SHA" "$RUN_ID" "$JOB_ID" | base64 -w0)"
          PATH_ENC="evidence/team2/customer-presentation-015-green.txt"
          SHA="$(gh api "repos/Pantonyeung/morefunos-v1-builder/contents/$PATH_ENC" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/Pantonyeung/morefunos-v1-builder/contents/$PATH_ENC" -f message="evidence(team2): Customer presentation 015 GREEN $SOURCE_SHA" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/Pantonyeung/morefunos-v1-builder/contents/$PATH_ENC" -f message="evidence(team2): Customer presentation 015 GREEN $SOURCE_SHA" -f content="$CONTENT" >/dev/null
          fi
