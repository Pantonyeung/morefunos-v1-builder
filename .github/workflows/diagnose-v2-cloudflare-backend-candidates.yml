name: Diagnose V2 Cloudflare Backend Candidates

on:
  push:
    paths:
      - 'requests/v2-cloudflare-backend-candidates.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect candidate Workers read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p evidence
          api(){ curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$1"; }
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          NAMES='morefun-order-api morefun-smt morefunos-platform-b morefunos-platform-b-api-staging morefunos-acceptance-layout-api'
          : > evidence/summary.txt
          for NAME in $NAMES; do
            api "$BASE/workers/scripts/$NAME/settings" > "evidence/$NAME-settings.json" 2>"evidence/$NAME-settings.err" || true
            api "$BASE/workers/scripts/$NAME/content/v2" > "evidence/$NAME-content.raw" 2>"evidence/$NAME-content.err" || true
            printf '[%s]\n' "$NAME" >> evidence/summary.txt
            if jq -e '.result.bindings' "evidence/$NAME-settings.json" >/dev/null 2>&1; then
              jq -r '[.result.bindings[]? | "\(.name):\(.type)"] | "bindings=" + (if length==0 then "NONE" else join(",") end)' "evidence/$NAME-settings.json" >> evidence/summary.txt
            else
              printf 'bindings=UNREADABLE\n' >> evidence/summary.txt
            fi
            if grep -Eiq 'postgres|database_url|pghost|hyperdrive' "evidence/$NAME-settings.json" "evidence/$NAME-content.raw" 2>/dev/null; then printf 'has_postgres=YES\n' >> evidence/summary.txt; else printf 'has_postgres=NO\n' >> evidence/summary.txt; fi
            if grep -Eiq 'firebase' "evidence/$NAME-settings.json" "evidence/$NAME-content.raw" 2>/dev/null; then printf 'has_firebase=YES\n' >> evidence/summary.txt; else printf 'has_firebase=NO\n' >> evidence/summary.txt; fi
            if grep -Fq '/api/smt/session/login' "evidence/$NAME-content.raw" 2>/dev/null; then printf 'has_smt_login=YES\n' >> evidence/summary.txt; else printf 'has_smt_login=NO\n' >> evidence/summary.txt; fi
            if grep -Fq '/api/smt/orders' "evidence/$NAME-content.raw" 2>/dev/null; then printf 'has_smt_orders=YES\n' >> evidence/summary.txt; else printf 'has_smt_orders=NO\n' >> evidence/summary.txt; fi
          done
          cat evidence/summary.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-cloudflare-backend-candidates-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
