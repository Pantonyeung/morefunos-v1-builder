name: Deploy Morefun V2 Keeta SIT

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/morefun-v2-keeta-sit.sha'
      - '.github/workflows/deploy-morefun-v2-keeta-sit.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: morefun-v2-keeta-sit
  cancel-in-progress: false

jobs:
  deploy-keeta-sit:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_VERSION: '4.125.0'
    steps:
      - name: Publish Keeta deploy pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context='builder/deploy-morefun-v2-keeta-sit' \
            -f description='Keeta SIT deployment running' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          else
            SHA="$(tr -d '[:space:]' < .ci-requests/morefun-v2-keeta-sit.sha | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Require Builder credentials
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f source/workers/keeta/wrangler.jsonc
          test -f source/infra/cloudflare/d1/migrations/0002-keeta-durable-ingress.sql
          printf 'verified_exact_sha=%s\n' "$EXPECTED_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache Wrangler npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-wrangler-${{ env.WRANGLER_VERSION }}

      - name: Install pinned Wrangler once
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION" --no-audit --no-fund
          wrangler --version

      - name: Install source dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck Keeta before deployment
        working-directory: source
        run: npm run typecheck

      - name: Run Keeta regression before deployment
        working-directory: source
        run: node --test packages/integration/keeta-webhook-ingress.test.ts packages/integration/keeta-durable-delivery.test.ts packages/integration/keeta-order-get-reconciliation.test.ts packages/integration/fulfillment-ready-keeta-prepare.test.ts packages/integration/d1-keeta-ready-runtime.test.ts packages/smm-ui-integration/fulfillment-runtime.test.ts apps/smt-clean/src/runtime/fulfillment-runtime.test.ts workers/keeta/src/d1-durable-delivery.test.ts workers/keeta/src/index.test.ts

      - name: Require existing Keeta runtime secrets
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler secret list --config wrangler.jsonc --format json > "$RUNNER_TEMP/keeta-secrets.json"
          node - "$RUNNER_TEMP/keeta-secrets.json" <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const names = new Set(rows.map((row) => row.name));
          for (const required of ['KEETA_APP_SECRET', 'KEETA_TOKEN_ENCRYPTION_KEY']) {
            if (!names.has(required)) throw new Error(`${required}_MISSING`);
          }
          NODE

      - name: Verify Keeta D1 database identity
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          node - "$RUNNER_TEMP/d1-list.json" wrangler.jsonc <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const config = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const expected = config.d1_databases.find((row) => row.binding === 'KEETA_INGRESS_DB');
          if (!expected) throw new Error('KEETA_D1_BINDING_CONFIG_MISSING');
          const live = rows.find((row) => row.name === expected.database_name);
          if (!live) throw new Error(`KEETA_D1_DATABASE_NOT_VISIBLE name=${expected.database_name}`);
          console.log(`keeta_d1_name=${live.name}`);
          console.log(`keeta_d1_live_id=${live.uuid}`);
          console.log(`keeta_d1_config_id=${expected.database_id}`);
          if (live.uuid !== expected.database_id) throw new Error('KEETA_D1_DATABASE_ID_MISMATCH');
          NODE

      - name: Verify required Keeta SIT D1 schema without applying unrelated migrations
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('keeta_webhook_dedup','mfos_keeta_durable_delivery') ORDER BY name;" \
            > "$RUNNER_TEMP/keeta-schema.json"
          node - "$RUNNER_TEMP/keeta-schema.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(payload) ? payload.flatMap((entry) => entry?.results ?? []) : [];
          const names = new Set(rows.map((row) => row.name));
          for (const required of ['keeta_webhook_dedup', 'mfos_keeta_durable_delivery']) {
            if (!names.has(required)) throw new Error(`KEETA_REQUIRED_D1_TABLE_MISSING ${required}`);
          }
          console.log('keeta_required_d1_schema=present');
          NODE

      - name: Deploy exact Keeta SIT Worker
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.jsonc

      - name: Smoke deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            https://morefun-v2-keeta-sit.pantonyeung.workers.dev/health \
            | tee "$RUNNER_TEMP/keeta-health.json"
          node - "$RUNNER_TEMP/keeta-health.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.service !== 'morefun-v2-keeta-sit' || body.status !== 'ok') process.exit(1);
          NODE

      - name: Record deployment evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          printf 'builder_run_id=%s\nsource_sha=%s\nworker=morefun-v2-keeta-sit\n' "$GITHUB_RUN_ID" "$SOURCE_SHA"

      - name: Publish Keeta deploy success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context='builder/deploy-morefun-v2-keeta-sit' \
            -f description='Keeta SIT deployment passed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Publish Keeta deploy failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context='builder/deploy-morefun-v2-keeta-sit' \
            -f description='Keeta SIT deployment failed' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
