name: Owner Manual V1 Android Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA from Pantonyeung/morefunos-v1'
        required: true
        type: string
      runtime_update_manifest_url:
        description: 'Owner-approved HTTPS URL for device-readable runtime-update.json'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: owner-manual-v1-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REPO: Pantonyeung/morefunos-v1
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      RUNTIME_UPDATE_MANIFEST_URL: ${{ inputs.runtime_update_manifest_url }}
      EXPECTED_APP_SIGNING_CERT_SHA256: 8f66270541c419a90ae0e8b94a2c7796e13d5c06805b0919ce3f7f5b3602857a

    steps:
      - name: Validate immutable release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED_SOURCE_SHA="$(printf '%s' "$REQUESTED_SOURCE_SHA" | tr -d '[:space:]')"
          if [[ ! "$NORMALIZED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must normalize to an exact 40-character Git commit SHA" >&2
            exit 1
          fi
          if [[ -z "${RUNTIME_UPDATE_MANIFEST_URL:-}" || "$RUNTIME_UPDATE_MANIFEST_URL" =~ [[:space:]] || ! "$RUNTIME_UPDATE_MANIFEST_URL" =~ ^https:// ]]; then
            echo "RUNTIME_UPDATE_ENDPOINT_INVALID" >&2
            exit 1
          fi
          export RUNTIME_UPDATE_MANIFEST_URL
          node <<'NODE'
          const raw = process.env.RUNTIME_UPDATE_MANIFEST_URL;
          try {
            const url = new URL(raw);
            if (url.protocol !== 'https:' || !url.hostname || url.username || url.password || url.hash) {
              throw new Error('invalid');
            }
          } catch {
            console.error('RUNTIME_UPDATE_ENDPOINT_INVALID');
            process.exit(1);
          }
          NODE
          echo "source_sha=${NORMALIZED_SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "Validated immutable private release source SHA and HTTPS OTA endpoint."

      - name: Checkout builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Verify builder remains policy-constrained
        run: node scripts/verify-builder-policy.mjs

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo "Verified immutable private source SHA: $ACTUAL_SOURCE_SHA"

      - name: Install pinned TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"
          echo "Pinned TypeScript 5.8.3: PASS"

      - name: Execute private Android release build without public source logs
        id: build_core
        continue-on-error: true
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/private-android-release-build.log"
          : > "$LOG"

          run_stage() {
            local stage="$1"
            shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            echo "$stage: FAIL (details withheld from public log)"
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            return 1
          }

          verify_android_sdk() {
            local sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            test -n "$sdk_root" || return 1
            command -v sdkmanager >/dev/null 2>&1 || return 1
            test -f "$sdk_root/platforms/android-36/android.jar" || return 1
            test -x "$sdk_root/build-tools/36.0.0/apksigner" || return 1
          }

          cd source
          run_stage "android-release-g6-static" npm run test:g6 || exit 1
          run_stage "android-release-g6-typecheck" npm run typecheck:g6 || exit 1
          run_stage "android-release-smt-web-locked-install" npm --prefix apps/smt-web ci --no-audit --no-fund || exit 1
          run_stage "android-release-smt-web-build" npm --prefix apps/smt-web run build || exit 1
          run_stage "android-release-sdk-components" verify_android_sdk || exit 1
          run_stage "android-release-lint-debug" gradle -p apps/smt-android :app:lintDebug --no-daemon -PmorefunRuntimeUpdateManifestUrl="$RUNTIME_UPDATE_MANIFEST_URL" || exit 1
          run_stage "android-release-assemble-debug" gradle -p apps/smt-android :app:assembleDebug --no-daemon -PmorefunRuntimeUpdateManifestUrl="$RUNTIME_UPDATE_MANIFEST_URL" || exit 1

          APK_PATH="apps/smt-android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "android-release-apk-artifact: FAIL"
            echo "failed_stage=android-release-apk-artifact" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Private Android release build core: PASS"

      - name: Stable-sign generated APK
        if: steps.build_core.outcome == 'success'
        id: stable_signing
        shell: bash
        env:
          V1_ANDROID_KEYSTORE_B64: ${{ secrets.V1_ANDROID_KEYSTORE_B64 }}
          V1_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V1_ANDROID_KEYSTORE_PASSWORD }}
          V1_ANDROID_KEY_ALIAS: ${{ secrets.V1_ANDROID_KEY_ALIAS }}
          V1_ANDROID_KEY_PASSWORD: ${{ secrets.V1_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required_name in \
            V1_ANDROID_KEYSTORE_B64 \
            V1_ANDROID_KEYSTORE_PASSWORD \
            V1_ANDROID_KEY_ALIAS \
            V1_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Stable app-signing configuration is incomplete: missing $required_name" >&2
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/morefunos-v1-app-signing.p12"
          APK="$GITHUB_WORKSPACE/source/apps/smt-android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$APK"
          test -x "$APKSIGNER"

          printf '%s' "$V1_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$V1_ANDROID_KEY_ALIAS" \
            --ks-pass env:V1_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:V1_ANDROID_KEY_PASSWORD \
            "$APK"

          VERIFY_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr 'A-F' 'a-f')"
          SIGNER_COUNT="$(printf '%s\n' "$VERIFY_OUTPUT" \
            | grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' || true)"

          test "$SIGNER_COUNT" = "1"
          if [[ ! "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Stable APK signing certificate digest could not be verified" >&2
            exit 1
          fi
          if [[ "$CERT_SHA256" != "$EXPECTED_APP_SIGNING_CERT_SHA256" ]]; then
            echo "Stable APK signing certificate identity mismatch" >&2
            exit 1
          fi

          echo "certificate_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Stable APK signing identity verified: PASS"

      - name: Generate immutable release metadata
        if: steps.build_core.outcome == 'success' && steps.stable_signing.outcome == 'success'
        id: metadata
        working-directory: source
        shell: bash
        env:
          NORMALIZED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BUILDER_SHA: ${{ github.sha }}
          BUILDER_RUN_ID: ${{ github.run_id }}
          BUILDER_REPO: ${{ github.repository }}
          APP_SIGNING_CERT_SHA256: ${{ steps.stable_signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          APK="apps/smt-android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_FILE="apps/smt-android/app/build.gradle.kts"
          test -f "$APK"

          VERSION_NAME="$(awk -F'"' '/versionName = / {print $2; exit}' "$BUILD_FILE")"
          VERSION_CODE="$(awk '/versionCode = / {print $3; exit}' "$BUILD_FILE")"
          MIN_SDK="$(awk '/minSdk = / {print $3; exit}' "$BUILD_FILE")"
          TARGET_SDK="$(awk '/targetSdk = / {print $3; exit}' "$BUILD_FILE")"
          PACKAGE_ID="$(awk -F'"' '/applicationId = / {print $2; exit}' "$BUILD_FILE")"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "$APK")"
          APK_FILENAME="MoreFunOS-SMT-${VERSION_NAME}-${NORMALIZED_SOURCE_SHA:0:12}.apk"

          cp "$APK" "$APK_FILENAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_FILENAME" > SHA256SUMS

          export VERSION_NAME VERSION_CODE MIN_SDK TARGET_SDK PACKAGE_ID APK_SHA256 APK_BYTES APK_FILENAME APP_SIGNING_CERT_SHA256 NORMALIZED_SOURCE_SHA
          node <<'NODE'
          const fs = require('node:fs');
          const metadata = {
            sourceRepository: process.env.SOURCE_REPO,
            sourceSha: process.env.NORMALIZED_SOURCE_SHA,
            packageId: process.env.PACKAGE_ID,
            versionName: process.env.VERSION_NAME,
            versionCode: Number(process.env.VERSION_CODE),
            minSdk: Number(process.env.MIN_SDK),
            targetSdk: Number(process.env.TARGET_SDK),
            runtimeUpdateManifestUrl: process.env.RUNTIME_UPDATE_MANIFEST_URL,
            apkFilename: process.env.APK_FILENAME,
            apkSha256: process.env.APK_SHA256,
            apkBytes: Number(process.env.APK_BYTES),
            appSigningCertificateSha256: process.env.APP_SIGNING_CERT_SHA256,
            builderRepository: process.env.BUILDER_REPO,
            builderSha: process.env.BUILDER_SHA,
            builderRunId: process.env.BUILDER_RUN_ID,
            builtAtUtc: new Date().toISOString()
          };
          fs.writeFileSync('build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE

          test "$PACKAGE_ID" = "com.morefunos.smt"
          test "$VERSION_CODE" -ge 12
          test "$APK_SHA256" != ""

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"

      - name: Deliver APK privately to V1 source repository Release
        if: steps.build_core.outcome == 'success' && steps.stable_signing.outcome == 'success'
        id: delivery
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.V1_ARTIFACT_DELIVERY_TOKEN }}
          NORMALIZED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          APK_FILENAME: ${{ steps.metadata.outputs.apk_filename }}
          APK_SHA256: ${{ steps.metadata.outputs.apk_sha256 }}
          APP_SIGNING_CERT_SHA256: ${{ steps.stable_signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Private artifact delivery configuration is incomplete: missing V1_ARTIFACT_DELIVERY_TOKEN" >&2
            exit 1
          fi

          TAG="builder-v1-${VERSION_NAME}-${NORMALIZED_SOURCE_SHA:0:12}-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            "$APK_FILENAME" \
            build-metadata.json \
            SHA256SUMS \
            --repo "$SOURCE_REPO" \
            --target "$NORMALIZED_SOURCE_SHA" \
            --title "SMT ${VERSION_NAME} (${VERSION_CODE}) | ${NORMALIZED_SOURCE_SHA:0:12}" \
            --notes "Owner-manual immutable V1 Android build from ${NORMALIZED_SOURCE_SHA}. Stable app-signing certificate SHA-256: ${APP_SIGNING_CERT_SHA256}. APK SHA-256: ${APK_SHA256}. Builder ${GITHUB_REPOSITORY}@${GITHUB_SHA}, run ${GITHUB_RUN_ID}. Build + private delivery evidence only; not Install/Device/Hardware/Operational PASS." \
            --prerelease

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Private V1 Release delivery: PASS"

      - name: Generate sanitized release evidence
        if: steps.delivery.outcome == 'success'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.delivery.outputs.release_tag }}
          APK_SHA256: ${{ steps.metadata.outputs.apk_sha256 }}
          APK_BYTES: ${{ steps.metadata.outputs.apk_bytes }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          CERT_SHA256: ${{ steps.stable_signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          echo "android-release-tag=$RELEASE_TAG"
          echo "android-release-version=$VERSION_NAME"
          echo "android-release-version-code=$VERSION_CODE"
          echo "android-release-apk-sha256=$APK_SHA256"
          echo "android-release-apk-bytes=$APK_BYTES"
          echo "android-release-signing-cert-sha256=$CERT_SHA256"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/morefunos-v1-app-signing.p12"

      - name: Fail job after sanitized evidence if private build failed
        if: steps.build_core.outcome == 'failure'
        shell: bash
        env:
          FAILED_STAGE: ${{ steps.build_core.outputs.failed_stage }}
        run: |
          echo "Private Android release build failed at ${FAILED_STAGE:-unknown}. Raw private-source details were withheld from the public Builder log."
          exit 1
