name: V2 Core Verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Morefun-v2 source SHA
        required: true
        type: string
      base_sha:
        description: Optional exact comparison base SHA
        required: false
        type: string
      branch_name:
        description: V2 branch name represented by source SHA
        required: true
        type: string
  push:
    paths:
      - 'requests/v2-core-request.txt'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve exact request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$(printf '%s' "$INPUT_SOURCE_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            BASE_SHA="$(printf '%s' "${INPUT_BASE_SHA:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            BRANCH_NAME="$(printf '%s' "$INPUT_BRANCH_NAME" | tr -d '\r\n')"
          else
            test -f requests/v2-core-request.txt
            SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/v2-core-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            BASE_SHA="$(sed -n 's/^base_sha=//p' requests/v2-core-request.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            BRANCH_NAME="$(sed -n 's/^branch_name=//p' requests/v2-core-request.txt | tr -d '\r\n')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$BASE_SHA" ]]; then [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
          [[ -n "$BRANCH_NAME" ]]
          {
            echo "source_sha=$SOURCE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "branch_name=$BRANCH_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Require V2 source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          echo "source-identity=PASS sha=$EXPECTED"

      - name: Record Node runtime
        shell: bash
        run: node --version

      - name: Core Catalog tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node --test packages/catalog/*.test.ts | tee "$RUNNER_TEMP/v2-core-tests.log"

      - name: TypeScript static check
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npx --yes --package typescript@7.0.2 tsc --noEmit -p tsconfig.json | tee "$RUNNER_TEMP/v2-core-typecheck.log"

      - name: Governance guard
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
          BRANCH_NAME: ${{ steps.request.outputs.branch_name }}
        run: |
          set -euo pipefail
          ARGS=(--head "$SOURCE_SHA" --branch "$BRANCH_NAME")
          if [[ -n "$BASE_SHA" ]]; then ARGS+=(--base "$BASE_SHA"); fi
          (
            cd source
            python3 scripts/governance_guard.py "${ARGS[@]}"
          ) | tee "$RUNNER_TEMP/v2-core-governance.log"

      - name: Write evidence manifest
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
          BRANCH_NAME: ${{ steps.request.outputs.branch_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v2-core-evidence.txt" <<EOF
          builder_repo=Pantonyeung/morefunos-v1-builder
          builder_run_id=${GITHUB_RUN_ID}
          source_repo=Pantonyeung/Morefun-v2
          source_sha=${SOURCE_SHA}
          base_sha=${BASE_SHA:-none}
          branch_name=${BRANCH_NAME}
          node_version=$(node --version)
          typescript_version=7.0.2
          EOF

      - name: Upload Core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-evidence-${{ steps.request.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/v2-core-evidence.txt
            ${{ runner.temp }}/v2-core-tests.log
            ${{ runner.temp }}/v2-core-typecheck.log
            ${{ runner.temp }}/v2-core-governance.log
          if-no-files-found: warn
          retention-days: 30
