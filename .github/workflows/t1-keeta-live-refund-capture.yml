name: T1 Keeta Live Event Capture

on:
  push:
    branches:
      - main
    paths:
      - requests/t1-keeta-live-refund-capture.txt
  pull_request:
    branches:
      - main
    paths:
      - requests/t1-keeta-live-refund-capture.txt
  issues:
    types:
      - opened

permissions:
  contents: read

concurrency:
  group: morefun-v2-keeta-live-capture-v2
  cancel-in-progress: false

jobs:
  capture:
    if: github.actor == 'Pantonyeung' && (github.event_name != 'issues' || startsWith(github.event.issue.title, '[TEAM1-CAPTURE]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_VERSION: "4.125.0"
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-wrangler-${{ env.WRANGLER_VERSION }}

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "wrangler@$WRANGLER_VERSION" --no-audit --no-fund
          wrangler --version

      - name: Resolve source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/t1-keeta-live-refund-capture.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Morefun-v2
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Apply sanitized capture patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/t1-keeta-live-refund-capture.py
          grep -Fq "KEETA_LIVE_EVENT_CAPTURE" source/workers/keeta/src/index.ts
          grep -Fq "1006" source/workers/keeta/src/index.ts

      - name: Deploy capture Worker
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.jsonc

      - name: Arm capture window
        shell: bash
        run: |
          echo "KEETA_LIVE_EVENT_CAPTURE=ARMED"
          echo "capture_window_minutes=8"
          echo "target_events=1002,1003,1004,1005,1006,1007"

      - name: Tail sanitized live events
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          timeout 480s wrangler tail --config wrangler.jsonc --format json --search KEETA_LIVE_EVENT_CAPTURE > "$RUNNER_TEMP/keeta-live-tail.jsonl" 2> "$RUNNER_TEMP/keeta-live-tail.err" || true
          grep -F "KEETA_LIVE_EVENT_CAPTURE" "$RUNNER_TEMP/keeta-live-tail.jsonl" > "$RUNNER_TEMP/keeta-live-events.txt" || true
          echo "capture_complete=true"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t1-keeta-live-event-capture-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keeta-live-events.txt
            ${{ runner.temp }}/keeta-live-tail.err
          if-no-files-found: warn
          retention-days: 30

      - name: Restore exact admitted Worker
        if: always()
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          git checkout -- src/index.ts
          wrangler deploy --config wrangler.jsonc
          echo "exact_worker_restored=true"
