name: Keeta Live 1102 Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keeta-live-1102-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morefun-v2-keeta-live-1102
  cancel-in-progress: false

jobs:
  live-1102:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_VERSION: '4.125.0'
      SHOP_ID: '721517434'
      WORKER_URL: 'https://morefun-v2-keeta-sit.pantonyeung.workers.dev'
    steps:
      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact Morefun-v2 source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .ci-requests/morefun-v2-keeta-sit.sha | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SHA"

      - name: Require Builder credentials
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact Morefun-v2 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity and live routes
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -q '/sit/configure-webhook-1102' source/workers/keeta/src/index.ts
          grep -q '/sit/store-rest' source/workers/keeta/src/index.ts
          grep -q '/sit/store-open' source/workers/keeta/src/index.ts
          grep -q 'WEBHOOK_1102' source/packages/integration/keeta-store-status.ts

      - name: Prepare protected probe secret
        shell: bash
        run: |
          set -euo pipefail
          PROBE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_KEY"
          printf 'KEETA_SIT_PROBE_KEY=%s\n' "$PROBE_KEY" > "$RUNNER_TEMP/keeta-live-secrets.env"
          chmod 600 "$RUNNER_TEMP/keeta-live-secrets.env"
          echo "PROBE_KEY=$PROBE_KEY" >> "$GITHUB_ENV"

      - name: Deploy exact Worker and probe secret as one version
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc --secrets-file "$RUNNER_TEMP/keeta-live-secrets.env"

      - name: Read and lock baseline store state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/store-details?shopId=$SHOP_ID" \
            > "$RUNNER_TEMP/baseline.json"
          node - "$RUNNER_TEMP/baseline.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId) !== 721517434) throw new Error(`BASELINE_READ_FAILED ${JSON.stringify(body)}`);
          if (body.data.status !== 4) throw new Error(`BASELINE_NOT_OPEN status=${body.data.status}`);
          console.log(`baseline_status=${body.data.status}`);
          console.log(`baseline_delivery_rest_status=${body.data.deliveryRestStatus}`);
          console.log(`baseline_pickup_rest_status=${body.data.pickupRestStatus}`);
          console.log(`baseline_available_for_order=${body.data.availableForOrder}`);
          NODE

      - name: Capture D1 baseline watermark
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
            --command "SELECT shop_id,status,delivery_rest_status,pickup_rest_status,source,provider_timestamp,updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID" \
            > "$RUNNER_TEMP/d1-baseline.json"
          UPDATED_AT="$(node - "$RUNNER_TEMP/d1-baseline.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const chunks = Array.isArray(payload) ? payload : [payload];
          const row = chunks.flatMap((x) => Array.isArray(x.results) ? x.results : [])[0];
          if (!row) throw new Error('D1_BASELINE_ROW_MISSING');
          process.stdout.write(String(row.updated_at));
          NODE
          )"
          echo "BASELINE_UPDATED_AT=$UPDATED_AT" >> "$GITHUB_ENV"
          echo "baseline_d1_updated_at=$UPDATED_AT"

      - name: Configure Keeta 1102 SIT webhook
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/configure-webhook-1102" \
            > "$RUNNER_TEMP/configure-1102.json"
          node - "$RUNNER_TEMP/configure-1102.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || body.data?.eventId !== 1102 || body.data?.isTest !== 1) throw new Error(`KEETA_1102_CONFIG_FAILED ${JSON.stringify(body)}`);
          console.log(`webhook_1102_configured=${body.data.url}`);
          NODE

      - name: Trigger test store OPEN to REST
        id: rest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/store-rest?shopId=$SHOP_ID" \
            > "$RUNNER_TEMP/store-rest.json"
          node - "$RUNNER_TEMP/store-rest.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0) throw new Error(`KEETA_STORE_REST_FAILED ${JSON.stringify(body)}`);
          console.log('store_rest_request=accepted');
          NODE

      - name: Prove live REST 1102 reached D1
        id: rest_webhook
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
              --command "SELECT shop_id,status,delivery_rest_status,pickup_rest_status,source,provider_timestamp,updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID" \
              > "$RUNNER_TEMP/d1-rest.json"
            if node - "$RUNNER_TEMP/d1-rest.json" "$BASELINE_UPDATED_AT" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const baseline = Number(process.argv[3]);
          const chunks = Array.isArray(payload) ? payload : [payload];
          const row = chunks.flatMap((x) => Array.isArray(x.results) ? x.results : [])[0];
          if (!row || row.source !== 'WEBHOOK_1102' || row.status !== 3 || Number(row.updated_at) <= baseline) process.exit(1);
          console.log(`rest_1102_status=${row.status}`);
          console.log(`rest_1102_delivery=${row.delivery_rest_status}`);
          console.log(`rest_1102_pickup=${row.pickup_rest_status}`);
          console.log(`rest_1102_provider_timestamp=${row.provider_timestamp}`);
          console.log(`rest_1102_updated_at=${row.updated_at}`);
          NODE
            then
              exit 0
            fi
            echo "waiting_for_rest_1102_attempt=$attempt"
            sleep 5
          done
          echo 'REST_1102_NOT_OBSERVED' >&2
          exit 1

      - name: Restore test store to OPEN
        id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/store-open?shopId=$SHOP_ID" \
            > "$RUNNER_TEMP/store-open.json"
          node - "$RUNNER_TEMP/store-open.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0) throw new Error(`KEETA_STORE_RESTORE_FAILED ${JSON.stringify(body)}`);
          console.log('store_restore_request=accepted');
          NODE

      - name: Prove live OPEN 1102 reached D1
        id: open_webhook
        if: always() && steps.restore.outcome == 'success'
        working-directory: source/workers/keeta
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --json \
              --command "SELECT shop_id,status,delivery_rest_status,pickup_rest_status,source,provider_timestamp,updated_at FROM keeta_store_status WHERE shop_id=$SHOP_ID" \
              > "$RUNNER_TEMP/d1-open.json"
            if node - "$RUNNER_TEMP/d1-open.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const chunks = Array.isArray(payload) ? payload : [payload];
          const row = chunks.flatMap((x) => Array.isArray(x.results) ? x.results : [])[0];
          if (!row || row.source !== 'WEBHOOK_1102' || row.status !== 4) process.exit(1);
          console.log(`open_1102_status=${row.status}`);
          console.log(`open_1102_delivery=${row.delivery_rest_status}`);
          console.log(`open_1102_pickup=${row.pickup_rest_status}`);
          console.log(`open_1102_provider_timestamp=${row.provider_timestamp}`);
          console.log(`open_1102_updated_at=${row.updated_at}`);
          NODE
            then
              exit 0
            fi
            echo "waiting_for_open_1102_attempt=$attempt"
            sleep 5
          done
          echo 'OPEN_1102_NOT_OBSERVED' >&2
          exit 1

      - name: Final provider reconciliation must be OPEN
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $PROBE_KEY" \
            "$WORKER_URL/sit/store-details?shopId=$SHOP_ID" \
            > "$RUNNER_TEMP/final-store.json"
          node - "$RUNNER_TEMP/final-store.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.code !== 0 || Number(body.data?.shopId) !== 721517434 || body.data.status !== 4) throw new Error(`FINAL_STORE_NOT_RESTORED ${JSON.stringify(body)}`);
          console.log(`final_status=${body.data.status}`);
          console.log(`final_delivery_rest_status=${body.data.deliveryRestStatus}`);
          console.log(`final_pickup_rest_status=${body.data.pickupRestStatus}`);
          console.log(`final_available_for_order=${body.data.availableForOrder}`);
          NODE

      - name: Record B0169 live 1102 evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          printf 'builder_run_id=%s\nsource_sha=%s\nshop_id=%s\nrest_request=%s\nrest_webhook=%s\nrestore_request=%s\nopen_webhook=%s\n' \
            "$GITHUB_RUN_ID" "$SOURCE_SHA" "$SHOP_ID" \
            '${{ steps.rest.outcome }}' '${{ steps.rest_webhook.outcome }}' '${{ steps.restore.outcome }}' '${{ steps.open_webhook.outcome }}'
