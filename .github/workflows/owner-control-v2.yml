name: Owner Control V2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: owner-control-v2-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor == 'Pantonyeung' && github.event.issue.number == 2
    runs-on: ubuntu-24.04
    outputs:
      command: ${{ steps.parse.outputs.command }}
      source_sha: ${{ steps.parse.outputs.source_sha }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - name: Parse one exact owner command
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r VERB ARG1 ARG2 EXTRA <<< "$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | xargs)"
          [[ -z "${EXTRA:-}" ]]
          case "$VERB" in
            /verify-v1) COMMAND=verify-v1 ;;
            /verify-smt-p01-d103) COMMAND=verify-smt-p01-d103 ;;
            /verify-carrier) COMMAND=verify-carrier ;;
            /repair-smt-p01-lockfile) COMMAND=repair-smt-p01-lockfile ;;
            /release-android) COMMAND=release-android ;;
            /runtime-status) COMMAND=runtime-status ;;
            /release-runtime) echo 'Comment-triggered Runtime release is retired. Use Runtime Release Request or workflow_dispatch.' >&2; exit 2 ;;
            *) echo 'Unsupported Owner Control V2 command.' >&2; exit 1 ;;
          esac
          [[ "$ARG1" =~ ^[0-9a-fA-F]{40}$ ]]
          SOURCE_SHA="${ARG1,,}"
          if [[ "$COMMAND" == runtime-status ]]; then
            case "${ARG2:-}" in candidate|stable|dev) CHANNEL="$ARG2" ;; *) echo 'channel must be candidate, stable, or dev' >&2; exit 1 ;; esac
          else
            [[ -z "${ARG2:-}" ]]
            CHANNEL='none'
          fi
          {
            echo "command=$COMMAND"
            echo "source_sha=$SOURCE_SHA"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

  verify-v1:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-v1'
    uses: ./.github/workflows/verify-v1.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets:
      V1_SOURCE_READ_TOKEN: ${{ secrets.V1_SOURCE_READ_TOKEN }}

  verify-smt-p01-d103:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-smt-p01-d103'
    uses: ./.github/workflows/verify-smt-p01-d103.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets:
      V1_SOURCE_READ_TOKEN: ${{ secrets.V1_SOURCE_READ_TOKEN }}

  verify-carrier:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-carrier'
    uses: ./.github/workflows/verify-carrier.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets:
      V1_SOURCE_READ_TOKEN: ${{ secrets.V1_SOURCE_READ_TOKEN }}

  repair-smt-p01-lockfile:
    needs: prepare
    if: needs.prepare.outputs.command == 'repair-smt-p01-lockfile'
    uses: ./.github/workflows/repair-smt-p01-lockfile.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  release-android:
    needs: prepare
    if: needs.prepare.outputs.command == 'release-android'
    uses: ./.github/workflows/android-release-v2.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  runtime-status:
    needs: prepare
    if: needs.prepare.outputs.command == 'runtime-status'
    runs-on: ubuntu-24.04
    steps:
      - name: Check public OTA identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          OTA_PUBLIC_ORIGIN: https://morefunos-v1-ota.pantonyeung.workers.dev
        run: |
          set -euo pipefail
          EXPECTED="runtime-${CHANNEL}-${SOURCE_SHA:0:12}"
          curl --fail --silent --show-error --location --max-time 20 "$OTA_PUBLIC_ORIGIN/runtime-update.json" > "$RUNNER_TEMP/runtime-update.json"
          node - "$RUNNER_TEMP/runtime-update.json" "$EXPECTED" "$CHANNEL" <<'NODE'
          const fs=require('node:fs');
          const [file,expected,channel]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync(file,'utf8'));
          if(m.releaseId!==expected || m.runtimeVersion!==expected || m.channel!==channel) process.exit(2);
          NODE

  report:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, verify-v1, verify-smt-p01-d103, verify-carrier, repair-smt-p01-lockfile, release-android, runtime-status]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish one sanitized Owner result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ needs.prepare.outputs.command }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          V1: ${{ needs.verify-v1.result }}
          V1_STAGE: ${{ needs.verify-v1.outputs.failure_stage }}
          D103: ${{ needs.verify-smt-p01-d103.result }}
          D103_STAGE: ${{ needs.verify-smt-p01-d103.outputs.failure_stage }}
          CARRIER: ${{ needs.verify-carrier.result }}
          CARRIER_STAGE: ${{ needs.verify-carrier.outputs.failure_stage }}
          REPAIR: ${{ needs.repair-smt-p01-lockfile.result }}
          ANDROID_RELEASE: ${{ needs.release-android.result }}
          STATUS: ${{ needs.runtime-status.result }}
        run: |
          set -euo pipefail
          STAGE=''
          case "$COMMAND" in
            verify-v1) RESULT="$V1"; STAGE="$V1_STAGE" ;;
            verify-smt-p01-d103) RESULT="$D103"; STAGE="$D103_STAGE" ;;
            verify-carrier) RESULT="$CARRIER"; STAGE="$CARRIER_STAGE" ;;
            repair-smt-p01-lockfile) RESULT="$REPAIR" ;;
            release-android) RESULT="$ANDROID_RELEASE" ;;
            runtime-status) RESULT="$STATUS" ;;
            *) RESULT=unknown ;;
          esac
          if [[ "$RESULT" == cancelled && ( -z "$STAGE" || "$STAGE" == none ) ]]; then
            STAGE=job-level-cancel
          fi
          BODY="owner-control-v2 command=$COMMAND source_sha=$SOURCE_SHA result=$RESULT"
          if [[ -n "$STAGE" ]]; then BODY="$BODY stage=$STAGE"; fi
          if [[ "$CHANNEL" != none ]]; then BODY="$BODY channel=$CHANNEL"; fi
          echo "$BODY"
          gh issue comment 2 --repo Pantonyeung/morefunos-v1-builder --body "$BODY" >/dev/null
