name: Owner Control V2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: owner-control-v2-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor == 'Pantonyeung' && github.event.issue.number == 2
    runs-on: ubuntu-24.04
    outputs:
      command: ${{ steps.parse.outputs.command }}
      source_sha: ${{ steps.parse.outputs.source_sha }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - name: Parse one exact owner command
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r VERB ARG1 ARG2 EXTRA <<< "$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | xargs)"
          [[ -z "${EXTRA:-}" ]]
          case "$VERB" in
            /verify-a) COMMAND=verify-a ;;
            /verify-b) COMMAND=verify-b ;;
            /verify-c) COMMAND=verify-c ;;
            /verify-abc) COMMAND=verify-abc ;;
            /verify-ui-mother) COMMAND=verify-ui-mother ;;
            /repair-smt-p01-lockfile) COMMAND=repair-smt-p01-lockfile ;;
            /release-runtime) COMMAND=release-runtime ;;
            /runtime-status) COMMAND=runtime-status ;;
            *) echo 'Unsupported Owner Control V2 command.' >&2; exit 1 ;;
          esac
          [[ "$ARG1" =~ ^[0-9a-fA-F]{40}$ ]]
          SOURCE_SHA="${ARG1,,}"
          if [[ "$COMMAND" == release-runtime || "$COMMAND" == runtime-status ]]; then
            case "${ARG2:-}" in candidate|stable|dev) CHANNEL="$ARG2" ;; *) echo 'channel must be candidate, stable, or dev' >&2; exit 1 ;; esac
          else
            [[ -z "${ARG2:-}" ]]
            CHANNEL='none'
          fi
          {
            echo "command=$COMMAND"
            echo "source_sha=$SOURCE_SHA"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

  verify-a:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-a'
    uses: ./.github/workflows/verify-a.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-b:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-b'
    uses: ./.github/workflows/verify-b.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-c:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-c'
    uses: ./.github/workflows/verify-c.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-abc:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-abc'
    uses: ./.github/workflows/verify-abc-integration.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  repair-smt-p01-lockfile:
    needs: prepare
    if: needs.prepare.outputs.command == 'repair-smt-p01-lockfile'
    uses: ./.github/workflows/repair-smt-p01-lockfile.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  verify-ui-mother:
    needs: prepare
    if: needs.prepare.outputs.command == 'verify-ui-mother'
    uses: ./.github/workflows/verify-ui-mother.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets:
      V1_SOURCE_READ_TOKEN: ${{ secrets.V1_SOURCE_READ_TOKEN }}

  release-runtime:
    needs: prepare
    if: needs.prepare.outputs.command == 'release-runtime'
    uses: ./.github/workflows/runtime-release-v2.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      release_channel: ${{ needs.prepare.outputs.channel }}
    secrets: inherit

  runtime-status:
    needs: prepare
    if: needs.prepare.outputs.command == 'runtime-status'
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.status.outputs.result }}
    steps:
      - name: Check public OTA identity
        id: status
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          OTA_PUBLIC_ORIGIN: https://morefunos-v1-ota.pantonyeung.workers.dev
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:12}"
          EXPECTED="runtime-${CHANNEL}-${SHORT_SHA}"
          curl --fail --silent --show-error --location --max-time 20 "$OTA_PUBLIC_ORIGIN/runtime-update.json" > "$RUNNER_TEMP/runtime-update.json"
          node - "$RUNNER_TEMP/runtime-update.json" "$EXPECTED" "$CHANNEL" <<'NODE'
          const fs=require('node:fs');
          const [file,expected,channel]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync(file,'utf8'));
          if(m.releaseId!==expected || m.runtimeVersion!==expected || m.channel!==channel) process.exit(2);
          NODE
          echo 'result=success' >> "$GITHUB_OUTPUT"

  report:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, verify-a, verify-b, verify-c, verify-abc, repair-smt-p01-lockfile, verify-ui-mother, release-runtime, runtime-status]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish one sanitized Owner result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ needs.prepare.outputs.command }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          A: ${{ needs.verify-a.result }}
          B: ${{ needs.verify-b.result }}
          C: ${{ needs.verify-c.result }}
          ABC: ${{ needs.verify-abc.result }}
          REPAIR: ${{ needs.repair-smt-p01-lockfile.result }}
          UI: ${{ needs.verify-ui-mother.result }}
          RELEASE: ${{ needs.release-runtime.result }}
          STATUS: ${{ needs.runtime-status.result }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            verify-a) RESULT="$A" ;;
            verify-b) RESULT="$B" ;;
            verify-c) RESULT="$C" ;;
            verify-abc) RESULT="$ABC" ;;
            repair-smt-p01-lockfile) RESULT="$REPAIR" ;;
            verify-ui-mother) RESULT="$UI" ;;
            release-runtime) RESULT="$RELEASE" ;;
            runtime-status) RESULT="$STATUS" ;;
            *) RESULT=unknown ;;
          esac
          BODY="owner-control-v2 command=$COMMAND source_sha=$SOURCE_SHA result=$RESULT"
          if [[ "$CHANNEL" != none ]]; then BODY="$BODY channel=$CHANNEL"; fi
          echo "$BODY"
          gh issue comment 2 --repo Pantonyeung/morefunos-v1-builder --body "$BODY" >/dev/null
