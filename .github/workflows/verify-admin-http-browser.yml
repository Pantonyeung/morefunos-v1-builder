name: Verify Admin HTTP Browser Acceptance

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA to verify
        required: true
        type: string
    secrets:
      V1_SOURCE_READ_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MoreFunOS V1 source SHA to verify
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  verify-admin-http-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate exact source request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact MoreFunOS V1 source
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Admin dependencies
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '===== toolchain ====='
            node --version
            npm --version
            echo '===== npm install app (legacy peer deps: verifier-only Arborist workaround) ====='
            npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
            echo '===== npm install playwright ====='
            npm install --legacy-peer-deps --no-save --ignore-scripts --no-audit --no-fund playwright@1.61.0
            echo '===== playwright install chromium ====='
            npx playwright install --with-deps chromium
          } 2>&1 | tee "$RUNNER_TEMP/admin-http-browser-install.log"

      - name: Test and build Admin Web
        working-directory: source/apps/admin-web
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/admin-http-browser-test-build.log"
          npm run build 2>&1 | tee -a "$RUNNER_TEMP/admin-http-browser-test-build.log"

      - name: Run real HTTP browser acceptance
        working-directory: source/apps/admin-web
        env:
          ADMIN_HTTP_EVIDENCE_DIR: ${{ runner.temp }}/admin-http-evidence
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/http-browser-acceptance.mjs 2>&1 | tee "$RUNNER_TEMP/admin-http-browser.log"

      - name: Prepare evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
          cp "$RUNNER_TEMP/admin-http-browser-install.log" evidence/admin-http-browser-install.log 2>/dev/null || true
          cp "$RUNNER_TEMP/admin-http-browser-test-build.log" evidence/admin-http-browser-test-build.log 2>/dev/null || true
          cp "$RUNNER_TEMP/admin-http-browser.log" evidence/admin-http-browser.log 2>/dev/null || true
          cp -R "$RUNNER_TEMP/admin-http-evidence/." evidence/ 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-http-browser-evidence-${{ env.SOURCE_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
