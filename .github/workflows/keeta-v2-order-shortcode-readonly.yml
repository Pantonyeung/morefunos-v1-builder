name: Keeta V2 Order Shortcode Readonly

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/keeta-v2-order-shortcode-readonly.sha'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: '4.125.0'
      D1_DATABASE: 'morefun-v2-keeta-sit-ingress'
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: 7c2a3dc3acf059667baf09983a6e37f769112b43
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Read latest 1001 identities
        working-directory: source/workers/keeta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$D1_DATABASE" --remote --config wrangler.jsonc --command "SELECT message_id,message,received_at FROM keeta_webhook_evidence WHERE event_id=1001 ORDER BY received_at DESC LIMIT 12" --json > "$RUNNER_TEMP/evidence.json"
          node - "$RUNNER_TEMP/evidence.json" <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=(Array.isArray(raw)?raw.flatMap(x=>x.results??[]):raw.results??[]);
          const pick=(o,paths)=>{for(const p of paths){let v=o;for(const k of p.split('.'))v=v?.[k];if(v!==undefined&&v!==null)return v}return null};
          for(const row of rows){
            let m; try{m=JSON.parse(row.message)}catch{continue}
            const body=m?.data??m;
            const out={
              messageId:row.message_id,
              receivedAt:row.received_at,
              seqNo:String(pick(body,['orderInfo.merchantOrder.seqNoStr','orderInfo.merchantOrder.seqNo','merchantOrder.seqNoStr','merchantOrder.seqNo','orderInfo.baseOrder.seqNoStr','baseOrder.seqNoStr'])??''),
              orderViewId:String(pick(body,['orderInfo.merchantOrder.orderViewIdStr','orderInfo.baseOrder.orderViewIdStr','orderInfo.baseOrder.orderViewId','merchantOrder.orderViewIdStr','baseOrder.orderViewIdStr','orderViewIdStr','orderViewId'])??'')
            };
            console.log('LATEST_1001='+JSON.stringify(out));
          }
          console.log('LATEST_1001_COUNT='+rows.length);
          NODE
