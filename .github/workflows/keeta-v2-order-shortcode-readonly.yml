name: Keeta V2 Order Shortcode Readonly

on:
  push:
    branches: [main]
    paths:
      - '.ci-requests/keeta-v2-order-shortcode-readonly.sha'

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: '4.125.0'
      TARGET_CODE: '7205'
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/Morefun-v2
          ref: 7d3c39c05693ca2150476348fd635d5637ae3f6c
          token: ${{ secrets.V2_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Read authoritative durable order
        working-directory: source/workers/keeta-channel-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute KEETA_INGRESS_DB --remote --config wrangler.jsonc --command "SELECT canonical_order_id,canonical_revision,updated_at,record_json FROM mfos_keeta_durable_delivery ORDER BY updated_at DESC LIMIT 80" --json > "$RUNNER_TEMP/durable.json"
          node - "$RUNNER_TEMP/durable.json" <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=(Array.isArray(raw)?raw.flatMap(x=>x.results??[]):raw.results??[]);
          const target=process.env.TARGET_CODE;
          const pick=(o,paths)=>{for(const p of paths){let v=o;for(const k of p.split('.'))v=v?.[k];if(v!==undefined&&v!==null)return v}return null};
          let found=0;
          for(const row of rows){
            let d; try{d=JSON.parse(row.record_json)}catch{continue}
            let m; try{m=JSON.parse(d?.evidence?.message??'')}catch{continue}
            const info=(m?.orderInfo&&typeof m.orderInfo==='object')?m.orderInfo:m;
            const code=String(pick(info,['merchantOrder.seqNoStr','merchantOrder.seqNo'])??'');
            const providerOrderId=String(pick(info,['merchantOrder.orderViewIdStr','baseOrder.orderViewIdStr','baseOrder.orderViewId'])??'');
            if(code===target){
              found++;
              console.log('DURABLE_7205='+JSON.stringify({
                providerOrderCode:code,
                providerOrderId,
                dedupKey:d.dedupKey??null,
                status:d.status??null,
                merchantDecision:d.merchantDecision??null,
                providerAction:d.providerAction??null,
                providerActionStatus:d.providerActionStatus??null,
                canonicalOrderId:row.canonical_order_id??d.canonicalOrderId??null,
                canonicalRevision:row.canonical_revision??d.canonicalRevision??null,
                attempts:d.attempts??null,
                lastError:d.lastError??null,
                firstSeenAt:d.firstSeenAt??null,
                updatedAt:d.updatedAt??row.updated_at??null
              }));
            }
          }
          console.log('DURABLE_MATCH_COUNT='+found);
          if(found===0){
            console.log('LATEST_DURABLE_CODES='+JSON.stringify(rows.slice(0,12).map(row=>{try{const d=JSON.parse(row.record_json);const m=JSON.parse(d?.evidence?.message??'{}');const info=(m?.orderInfo&&typeof m.orderInfo==='object')?m.orderInfo:m;return {code:String(info?.merchantOrder?.seqNoStr??''),providerOrderId:String(info?.merchantOrder?.orderViewIdStr??info?.baseOrder?.orderViewIdStr??info?.baseOrder?.orderViewId??''),updatedAt:d?.updatedAt??row.updated_at??null}}catch{return null}}).filter(Boolean)));
            process.exit(2);
          }
          NODE
