name: Diagnose V2 SMT Server Secret Presence

on:
  push:
    paths:
      - 'requests/v2-smt-server-secret-presence.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SMT_DATABASE_URL: ${{ secrets.SMT_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      PGHOST: ${{ secrets.PGHOST }}
      SMT_ALLOWED_ORIGIN: ${{ secrets.SMT_ALLOWED_ORIGIN }}
      SMT_TRUSTED_DEVICE_ID: ${{ secrets.SMT_TRUSTED_DEVICE_ID }}
      SMT_TRUSTED_SCOPE_REF: ${{ secrets.SMT_TRUSTED_SCOPE_REF }}
      SMT_STAFF_POS_PEPPER: ${{ secrets.SMT_STAFF_POS_PEPPER }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record SET or UNSET only
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          : > evidence/summary.txt
          for NAME in SMT_DATABASE_URL DATABASE_URL POSTGRES_URL PGHOST SMT_ALLOWED_ORIGIN SMT_TRUSTED_DEVICE_ID SMT_TRUSTED_SCOPE_REF SMT_STAFF_POS_PEPPER; do
            if [ -n "${!NAME:-}" ]; then
              printf '%s=SET\n' "$NAME" >> evidence/summary.txt
            else
              printf '%s=UNSET\n' "$NAME" >> evidence/summary.txt
            fi
          done
          printf 'values_exposed=NO\n' >> evidence/summary.txt
          cat evidence/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v2-smt-server-secret-presence-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
