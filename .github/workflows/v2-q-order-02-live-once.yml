name: V2 Q-ORDER-02 Live One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.ci-trigger/q-order-02.txt'

permissions:
  contents: write

jobs:
  live-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CORE_SHA: 88b8f493d3b5f383280610af194257fdb0a1de56
      CUSTOMER_SHA: d44b03de913c667b6c43837e8f98a9d07542d1de
      SMT_SHA: beead70bd6e9b11bbc2770b9e7da0c5efb753438
      PREVIEW_BRANCH: q-order-02-v2-staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Builder evidence plane
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact Integration/Core source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Checkout exact Customer source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.CUSTOMER_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: customer
          persist-credentials: false

      - name: Checkout exact SMT source
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ env.SMT_SHA }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: smt
          persist-credentials: false

      - name: Verify exact identities and isolation
        id: identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C customer rev-parse HEAD)" = "$CUSTOMER_SHA"
          test "$(git -C smt rev-parse HEAD)" = "$SMT_SHA"
          grep -q '"FIREBASE_NAMESPACE": "morefunos-v2-staging"' core/wrangler.jsonc
          ! grep -R --line-number --exclude-dir=.git --exclude='*.md' --exclude='*.test.*' -E 'FIREBASE_NAMESPACE.*(p-line-staging|b-line-staging)' core/functions core/packages/integration-v2 core/wrangler.jsonc
          grep -q 'pendingChannelSubmissions' smt/apps/smt-web/src/smt-runtime-adapter.ts
          grep -q 'readOrders' smt/apps/smt-web/src/contracts.ts

      - name: Install dependencies
        id: install
        continue-on-error: true
        working-directory: core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Focused pre-live tests
        id: focused
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test \
            packages/integration-v2/durable-channel-transport.test.ts \
            packages/integration-v2/customer-order-submit-adapter.test.ts \
            packages/integration-v2/smt-durable-channel-hydrator.test.ts \
            2>&1 | tee "$RUNNER_TEMP/q-order-02-focused.log"

      - name: Compose Customer assets
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/customer
          for file in index.html customer-shell.css customer-shell.js customer-closure.css customer-closure.js customer-closure-v2.js customer-closure-v3.css customer-closure-v3.js customer-runtime-bridge.js; do
            test -f "customer/apps/customer-web/$file"
            cp "customer/apps/customer-web/$file" "deploy/customer/$file"
          done
          cat > deploy/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoreFunOS Q-ORDER-02</title></head><body><main><h1>MoreFunOS Q-ORDER-02</h1><a href="/customer/">Customer</a></main></body></html>
          HTML

      - name: Add ephemeral canonical operator harness
        id: harness
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/q-order-02-token"
          mkdir -p core/functions/api/operator
          cat > core/functions/api/operator/q-order-02.ts <<EOF
          import { FirebaseRtdbDurabilityPort } from '../../../packages/durability/firebase-rtdb-durability.ts';
          import { createOperationalStateCheckpointReaderV1 } from '../../../packages/runtime-v2/operational-state-reader.ts';
          import { createOperationalStateDurableAuthorityV1 } from '../../../packages/runtime-v2/operational-state-durable-authority.ts';
          import { createGoogleFirebaseBearerTokenProviderV1 } from '../../../packages/integration-v2/admin-production-edge.ts';
          import { createWebCryptoGoogleJwtClientFactoryV1 } from '../../../packages/integration-v2/google-service-account-webcrypto.ts';
          import { createDurableChannelTransportV1 } from '../../../packages/integration-v2/durable-channel-transport.ts';

          const OPERATOR_TOKEN = '$TOKEN';
          const EXPECTED_BRANCH = '$PREVIEW_BRANCH';
          const EXPECTED_NAMESPACE = 'morefunos-v2-staging';
          const googleJwt = createWebCryptoGoogleJwtClientFactoryV1();
          interface Env { FIREBASE_DATABASE_URL: string; FIREBASE_NAMESPACE: string; GOOGLE_SERVICE_ACCOUNT_EMAIL: string; GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: string; CF_PAGES_BRANCH?: string; }
          interface Ctx { request: Request; env: Env & Record<string, unknown>; }
          const json = (body: unknown, status = 200) => Response.json(body, { status, headers: { 'cache-control': 'no-store' } });

          export async function onRequest(context: Ctx): Promise<Response> {
            if (context.request.method !== 'POST') return json({ ok: false, error: 'METHOD_NOT_ALLOWED' }, 405);
            if (context.env.CF_PAGES_BRANCH !== EXPECTED_BRANCH) return json({ ok: false, error: 'NOT_FOUND' }, 404);
            if (context.env.FIREBASE_NAMESPACE !== EXPECTED_NAMESPACE) return json({ ok: false, error: 'NAMESPACE_MISMATCH' }, 409);
            if (context.request.headers.get('authorization') !== 'Bearer ' + OPERATOR_TOKEN) return json({ ok: false, error: 'UNAUTHORIZED' }, 401);
            const tokens = createGoogleFirebaseBearerTokenProviderV1({ email: context.env.GOOGLE_SERVICE_ACCOUNT_EMAIL, privateKey: context.env.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }, googleJwt);
            const port = new FirebaseRtdbDurabilityPort({ databaseUrl: context.env.FIREBASE_DATABASE_URL, namespace: context.env.FIREBASE_NAMESPACE, tokens });
            const body = await context.request.json() as Record<string, unknown>;
            if (body.action === 'set-status') {
              const status = body.status === 'open' ? 'open' : body.status === 'closed' ? 'closed' : null;
              if (!status) return json({ ok: false, error: 'STATUS_INVALID' }, 400);
              const reader = createOperationalStateCheckpointReaderV1(port);
              const current = await reader.readCurrent();
              if (current.storeStatus === status) return json({ ok: true, state: current });
              const authority = createOperationalStateDurableAuthorityV1({ port, initialState: current });
              const next = await authority.execute({ expectedRevision: current.revision, command: { kind: 'set-store-status', status }, committedAt: new Date().toISOString() });
              return json({ ok: true, state: next });
            }
            if (body.action === 'inspect-channel') {
              const businessDate = String(body.businessDate ?? '');
              const submissionId = String(body.submissionId ?? '');
              const transport = createDurableChannelTransportV1(port);
              const matches = (await transport.list(businessDate)).filter((entry) => entry.submissionId === submissionId);
              return json({ ok: true, count: matches.length, envelope: matches[0] ?? null });
            }
            return json({ ok: false, error: 'ACTION_INVALID' }, 400);
          }
          EOF
          test -s core/functions/api/operator/q-order-02.ts

      - name: Build harness deployment
        id: build
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages functions build --outdir=../deploy 2>&1 | tee "$RUNNER_TEMP/q-order-02-build.log"

      - name: Deploy harness preview
        id: deploy
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy ../deploy --project-name=morefunos-v1 --branch="$PREVIEW_BRANCH" --commit-hash="$CORE_SHA" 2>&1 | tee "$RUNNER_TEMP/q-order-02-deploy.log"
          URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/q-order-02-deploy.log" | tail -n 1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Open canonical staging state
        id: open_store
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/q-order-02-token")"
          curl --fail --silent --show-error --location -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data '{"action":"set-status","status":"open"}' "$URL/api/operator/q-order-02" > "$RUNNER_TEMP/open.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/open.json'); if(!x.ok||x.state.storeStatus!=='open') process.exit(1)"

      - name: Read live business date
        id: live_read
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$URL/api/customer/ordering" > "$RUNNER_TEMP/ordering.json"
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ordering.json','utf8'));
          if(x.storeStatus!=='open'||!/^\d{4}-\d{2}-\d{2}$/.test(x.businessDate)) process.exit(1);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/business-date',x.businessDate);
          NODE

      - name: POST live Customer order twice
        id: live_submit
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          BUSINESS_DATE="$(cat "$RUNNER_TEMP/business-date")"
          SUBMISSION_ID="q-order-02-${GITHUB_RUN_ID}"
          IDEMPOTENCY_KEY="q-order-02-idem-${GITHUB_RUN_ID}"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          export BUSINESS_DATE SUBMISSION_ID IDEMPOTENCY_KEY CREATED_AT
          node - <<'NODE'
          const fs=require('fs');
          const body={submissionId:process.env.SUBMISSION_ID,idempotencyKey:process.env.IDEMPOTENCY_KEY,createdAt:process.env.CREATED_AT,businessDate:process.env.BUSINESS_DATE,payload:{lines:[{lineId:'line-1',productId:'F4',quantity:1,selections:[{optionGroupId:'drink',optionIds:['milk-tea']}]}],pickup:{mode:'takeaway',requestedTime:'asap'},customerDisplayedTotalMinor:4500,currency:'HKD',externalReference:process.env.SUBMISSION_ID}};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/submit.json',JSON.stringify(body));
          NODE
          CODE1="$(curl --silent --show-error --location -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/submit.json" -o "$RUNNER_TEMP/first.json" -w '%{http_code}' "$URL/api/customer/orders")"
          CODE2="$(curl --silent --show-error --location -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/submit.json" -o "$RUNNER_TEMP/replay.json" -w '%{http_code}' "$URL/api/customer/orders")"
          test "$CODE1" = 202
          test "$CODE2" = 202
          node - <<'NODE'
          const fs=require('fs'); const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/first.json','utf8')); const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/replay.json','utf8'));
          if(!a.ok||!b.ok||a.submissionId!==process.env.SUBMISSION_ID||b.submissionId!==process.env.SUBMISSION_ID||a.status!=='submitted'||b.status!=='submitted'||a.authoritativeAcceptance!==false||b.authoritativeAcceptance!==false) process.exit(1);
          NODE
          printf '%s' "$SUBMISSION_ID" > "$RUNNER_TEMP/submission-id"

      - name: Read live durable envelope
        id: live_durable
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/q-order-02-token")"
          BUSINESS_DATE="$(cat "$RUNNER_TEMP/business-date")"
          SUBMISSION_ID="$(cat "$RUNNER_TEMP/submission-id")"
          export SUBMISSION_ID
          printf '{"action":"inspect-channel","businessDate":"%s","submissionId":"%s"}' "$BUSINESS_DATE" "$SUBMISSION_ID" > "$RUNNER_TEMP/inspect.json"
          curl --fail --silent --show-error --location -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/inspect.json" "$URL/api/operator/q-order-02" > "$RUNNER_TEMP/live-envelope.json"
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/live-envelope.json','utf8'));
          if(!x.ok||x.count!==1||!x.envelope||x.envelope.submissionId!==process.env.SUBMISSION_ID||x.envelope.source!=='customer'||x.envelope.channel!=='customer-web'||x.envelope.status!=='submitted'||x.envelope.authoritativeAcceptance!==false) process.exit(1);
          NODE

      - name: Hydrate live envelope into canonical SMT pending seam
        id: smt_hydrate
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          export LIVE_ENVELOPE_FILE="$RUNNER_TEMP/live-envelope.json"
          export BUSINESS_DATE="$(cat "$RUNNER_TEMP/business-date")"
          node --experimental-strip-types --input-type=module - <<'NODE' | tee "$RUNNER_TEMP/smt-hydrate.log"
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          import { createChannelIntake } from './packages/channels/channel-intake.ts';
          import { createSmtDurableChannelHydratorV1 } from './packages/integration-v2/smt-durable-channel-hydrator.ts';
          const live=JSON.parse(fs.readFileSync(process.env.LIVE_ENVELOPE_FILE,'utf8')).envelope;
          const intake=createChannelIntake();
          const runtime={submitChannel:intake.submit,pendingChannelSubmissions:()=>intake.list().filter((x)=>x.status==='submitted')};
          const result=await createSmtDurableChannelHydratorV1({queue:{async list(){return [live];}},runtime}).hydrate(process.env.BUSINESS_DATE);
          assert.equal(result.submitted,1); assert.equal(result.pending.length,1); assert.equal(result.pending[0].submissionId,live.submissionId); assert.equal(result.pending[0].channel,'customer-web');
          console.log(JSON.stringify({ok:true,submissionId:live.submissionId,pending:1,channel:'customer-web'}));
          NODE
          grep -q 'pendingChannelSubmissions' ../smt/apps/smt-web/src/smt-runtime-adapter.ts
          grep -q 'readOrders' ../smt/apps/smt-web/src/contracts.ts

      - name: Restore staging closed
        id: close_store
        if: always()
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$URL"
          TOKEN="$(cat "$RUNNER_TEMP/q-order-02-token")"
          curl --fail --silent --show-error --location -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data '{"action":"set-status","status":"closed"}' "$URL/api/operator/q-order-02" > "$RUNNER_TEMP/close.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/close.json'); if(!x.ok||x.state.storeStatus!=='closed') process.exit(1)"

      - name: Build clean exact-source artifact
        id: clean_build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f core/functions/api/operator/q-order-02.ts
          rm -rf deploy-clean
          mkdir -p deploy-clean/customer
          for file in index.html customer-shell.css customer-shell.js customer-closure.css customer-closure.js customer-closure-v2.js customer-closure-v3.css customer-closure-v3.js customer-runtime-bridge.js; do cp "customer/apps/customer-web/$file" "deploy-clean/customer/$file"; done
          cp deploy/index.html deploy-clean/index.html
          (cd core && npx wrangler pages functions build --outdir=../deploy-clean)

      - name: Redeploy clean exact-source artifact
        id: clean_deploy
        if: always()
        continue-on-error: true
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy ../deploy-clean --project-name=morefunos-v1 --branch="$PREVIEW_BRANCH" --commit-hash="$CORE_SHA" 2>&1 | tee "$RUNNER_TEMP/clean-deploy.log"
          URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/clean-deploy.log" | tail -n 1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify cleanup
        id: cleanup_verify
        if: always()
        continue-on-error: true
        shell: bash
        env:
          URL: ${{ steps.clean_deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$URL"
          CODE="$(curl --silent --show-error --location -o "$RUNNER_TEMP/operator-after.txt" -w '%{http_code}' "$URL/api/operator/q-order-02")"
          test "$CODE" = 404
          curl --fail --silent --show-error --location "$URL/api/customer/ordering" > "$RUNNER_TEMP/final-ordering.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/final-ordering.json'); if(x.storeStatus!=='closed') process.exit(1)"

      - name: Persist evidence marker
        if: always()
        shell: bash
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          HARNESS: ${{ steps.harness.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          OPEN_STORE: ${{ steps.open_store.outcome }}
          LIVE_READ: ${{ steps.live_read.outcome }}
          LIVE_SUBMIT: ${{ steps.live_submit.outcome }}
          LIVE_DURABLE: ${{ steps.live_durable.outcome }}
          SMT_HYDRATE: ${{ steps.smt_hydrate.outcome }}
          CLOSE_STORE: ${{ steps.close_store.outcome }}
          CLEAN_BUILD: ${{ steps.clean_build.outcome }}
          CLEAN_DEPLOY: ${{ steps.clean_deploy.outcome }}
          CLEANUP_VERIFY: ${{ steps.cleanup_verify.outcome }}
          LIVE_URL: ${{ steps.deploy.outputs.url }}
          CLEAN_URL: ${{ steps.clean_deploy.outputs.url }}
        run: |
          set -euo pipefail
          if [[ "$IDENTITY" == success && "$INSTALL" == success && "$FOCUSED" == success && "$COMPOSE" == success && "$HARNESS" == success && "$BUILD" == success && "$DEPLOY" == success && "$OPEN_STORE" == success && "$LIVE_READ" == success && "$LIVE_SUBMIT" == success && "$LIVE_DURABLE" == success && "$SMT_HYDRATE" == success && "$CLOSE_STORE" == success && "$CLEAN_BUILD" == success && "$CLEAN_DEPLOY" == success && "$CLEANUP_VERIFY" == success ]]; then CONCLUSION=success; else CONCLUSION=failure; fi
          mkdir -p evidence builder/.ci-results
          {
            printf 'core_sha=%s\ncustomer_sha=%s\nsmt_sha=%s\n' "$CORE_SHA" "$CUSTOMER_SHA" "$SMT_SHA"
            printf 'builder_sha=%s\nrun_id=%s\npreview_branch=%s\nlive_url=%s\nclean_url=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PREVIEW_BRANCH" "$LIVE_URL" "$CLEAN_URL"
            printf 'identity=%s\ninstall=%s\nfocused=%s\ncompose=%s\nharness=%s\nbuild=%s\ndeploy=%s\nopen_store=%s\nlive_read=%s\nlive_submit=%s\nlive_durable=%s\nsmt_hydrate=%s\nclose_store=%s\nclean_build=%s\nclean_deploy=%s\ncleanup_verify=%s\nconclusion=%s\n' "$IDENTITY" "$INSTALL" "$FOCUSED" "$COMPOSE" "$HARNESS" "$BUILD" "$DEPLOY" "$OPEN_STORE" "$LIVE_READ" "$LIVE_SUBMIT" "$LIVE_DURABLE" "$SMT_HYDRATE" "$CLOSE_STORE" "$CLEAN_BUILD" "$CLEAN_DEPLOY" "$CLEANUP_VERIFY" "$CONCLUSION"
          } > builder/.ci-results/v2-q-order-02-live.txt
          cp builder/.ci-results/v2-q-order-02-live.txt evidence/result-marker.txt
          for f in q-order-02-focused.log q-order-02-build.log q-order-02-deploy.log open.json ordering.json first.json replay.json live-envelope.json smt-hydrate.log close.json clean-deploy.log final-ordering.json; do test -f "$RUNNER_TEMP/$f" && cp "$RUNNER_TEMP/$f" evidence/ || true; done
          git -C builder config user.name 'morefunos-builder-bot'
          git -C builder config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git -C builder add .ci-results/v2-q-order-02-live.txt
          if ! git -C builder diff --cached --quiet; then git -C builder commit -m "ci(result): V2 Q-ORDER-02 live $CORE_SHA"; git -C builder push origin HEAD:main; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-q-order-02-live-${{ env.CORE_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce result
        if: always()
        shell: bash
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          HARNESS: ${{ steps.harness.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          OPEN_STORE: ${{ steps.open_store.outcome }}
          LIVE_READ: ${{ steps.live_read.outcome }}
          LIVE_SUBMIT: ${{ steps.live_submit.outcome }}
          LIVE_DURABLE: ${{ steps.live_durable.outcome }}
          SMT_HYDRATE: ${{ steps.smt_hydrate.outcome }}
          CLOSE_STORE: ${{ steps.close_store.outcome }}
          CLEAN_BUILD: ${{ steps.clean_build.outcome }}
          CLEAN_DEPLOY: ${{ steps.clean_deploy.outcome }}
          CLEANUP_VERIFY: ${{ steps.cleanup_verify.outcome }}
        run: |
          [[ "$IDENTITY" == success ]]
          [[ "$INSTALL" == success ]]
          [[ "$FOCUSED" == success ]]
          [[ "$COMPOSE" == success ]]
          [[ "$HARNESS" == success ]]
          [[ "$BUILD" == success ]]
          [[ "$DEPLOY" == success ]]
          [[ "$OPEN_STORE" == success ]]
          [[ "$LIVE_READ" == success ]]
          [[ "$LIVE_SUBMIT" == success ]]
          [[ "$LIVE_DURABLE" == success ]]
          [[ "$SMT_HYDRATE" == success ]]
          [[ "$CLOSE_STORE" == success ]]
          [[ "$CLEAN_BUILD" == success ]]
          [[ "$CLEAN_DEPLOY" == success ]]
          [[ "$CLEANUP_VERIFY" == success ]]
