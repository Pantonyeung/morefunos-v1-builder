name: Team A SMM Display Code Mismatch Readback

on:
  push:
    branches: [main]
    paths:
      - 'requests/team-a-smm-display-code-mismatch-readback.txt'

permissions:
  contents: read

jobs:
  readback:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_ID: 1ed17fcb-7e7a-4e13-a922-ae141aff4142
      ORDER_A: b1b7eeef-2c83-5a1e-a1fd-9d78f0f5653e
      ORDER_B: 141b5bc3-d80b-5248-881d-d7d9a7830656
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/^source_sha=//p' requests/team-a-smm-display-code-mismatch-readback.txt | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read mismatched production rows
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/query"
          SQL="SELECT s.order_id,s.revision,s.lifecycle_status,s.accepted_projection_json,s.order_snapshot_json,d.display_code AS authority_display_code,d.source_order_key,d.business_date,d.sequence FROM mfos_order_state s LEFT JOIN mfos_order_display_code d ON d.order_id=s.order_id WHERE s.order_id IN ('$ORDER_A','$ORDER_B') ORDER BY s.order_id"
          SQL="$SQL" node -e "require('fs').writeFileSync('/tmp/query.json',JSON.stringify({sql:process.env.SQL}))"
          curl --fail-with-body --silent --show-error -X POST "$URL"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'content-type: application/json'             --data-binary @/tmp/query.json > evidence/raw.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('evidence/raw.json','utf8'));
          if(!x.success||!x.result?.[0]?.success) throw new Error('D1_QUERY_FAILED');
          const rows=x.result[0].results||[];
          if(rows.length!==2) throw new Error('TARGET_ROWS_NOT_FOUND:'+rows.length);
          const out=rows.map(r=>{
            const raw=r.order_snapshot_json||r.accepted_projection_json;
            const p=raw?JSON.parse(raw):{};
            return {
              orderId:r.order_id,
              revision:r.revision,
              lifecycleStatus:r.lifecycle_status,
              canonicalDisplayOrderCode:p?.canonicalIdentity?.displayOrderCode??null,
              localDisplayOrderCode:p?.localDisplayOrderCode??null,
              displayOrderCode:p?.displayOrderCode??null,
              authorityDisplayOrderCode:r.authority_display_code??null,
              sourceOrderKey:r.source_order_key??null,
              businessDate:r.business_date??null,
              sequence:r.sequence??null
            };
          });
          fs.writeFileSync('evidence/readback.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-a-smm-display-code-mismatch-readback-${{ steps.req.outputs.source_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
