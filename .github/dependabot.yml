version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    groups:
      github-actions-maintenance:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(actions)"
