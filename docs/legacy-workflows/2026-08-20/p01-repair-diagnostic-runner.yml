name: P01 Observable Repair Runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    if: github.actor == 'Pantonyeung' && github.event.issue.number == 50 && startsWith(github.event.comment.body, '/p01-repair ')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.parse.outputs.source_sha }}
    steps:
      - id: parse
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SOURCE_SHA="${COMMAND#'/p01-repair '}"
          SOURCE_SHA="$(printf '%s' "$SOURCE_SHA" | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$COMMAND" = "/p01-repair ${SOURCE_SHA}"
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

  repair:
    needs: prepare
    uses: ./.github/workflows/repair-smt-p01-lockfile.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  report:
    if: ${{ always() }}
    needs: [prepare, repair]
    runs-on: ubuntu-latest
    steps:
      - name: Publish observable repair result
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          REPAIR_RESULT: ${{ needs.repair.result }}
          NEW_SHA: ${{ needs.repair.outputs.new_sha }}
          LOCK_SHA256: ${{ needs.repair.outputs.lock_sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment 50 --repo Pantonyeung/morefunos-v1-builder --body "P01_REPAIR_OBSERVABLE run_id=${RUN_ID} prepare=${PREPARE_RESULT:-UNKNOWN} source_sha=${SOURCE_SHA:-UNKNOWN} repair=${REPAIR_RESULT:-UNKNOWN} new_sha=${NEW_SHA:-NONE} lock_sha256=${LOCK_SHA256:-NONE}" >/dev/null
