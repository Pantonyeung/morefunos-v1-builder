name: Owner V1 Verify Cross-Surface Preview

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  operational-lockfiles:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/generate-operational-lockfiles ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Validate immutable lockfile request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "$COMMAND" in
            '/generate-operational-lockfiles '*) SOURCE_SHA="${COMMAND#'/generate-operational-lockfiles '}" ;;
            *) echo 'Unsupported operational lockfile command.' >&2; exit 1 ;;
          esac
          SOURCE_SHA="$(printf '%s' "$SOURCE_SHA" | tr -d '[:space:]')"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source SHA must be exactly 40 hexadecimal characters.' >&2
            exit 1
          fi
          EXPECTED="/generate-operational-lockfiles ${SOURCE_SHA}"
          if [[ "$COMMAND" != "$EXPECTED" ]]; then
            echo 'Command must contain exactly one command and one SHA.' >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo 'Immutable operational lockfile request: PASS'

      - name: Checkout Builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"
          echo 'operational-lockfile-source-identity: PASS'

      - name: Canonicalize and npm-ci operational lockfiles
        id: lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cd source
          APPS=(apps/smm-web apps/admin-web apps/customer-web apps/owner-web)
          for APP in "${APPS[@]}"; do
            test -f "$APP/package.json"
            rm -rf "$APP/node_modules"
            rm -f "$APP/package-lock.json"
            npm --prefix "$APP" install --package-lock-only --ignore-scripts --no-audit --no-fund >/dev/null
            test -f "$APP/package-lock.json"
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'))" "$APP/package-lock.json"
            npm --prefix "$APP" ci --ignore-scripts --no-audit --no-fund >/dev/null
            echo "$APP lockfile + npm ci: PASS"
          done

          for LOCK in apps/smm-web/package-lock.json apps/admin-web/package-lock.json apps/customer-web/package-lock.json apps/owner-web/package-lock.json; do
            APP_JSON="${LOCK%/package-lock.json}/package.json"
            node - "$APP_JSON" "$LOCK" <<'NODE'
          const fs = require('node:fs');
          const [pkgPath, lockPath] = process.argv.slice(2);
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const root = lock.packages?.[''];
          if (!root || root.name !== pkg.name || root.version !== pkg.version) {
            throw new Error(`LOCK_IDENTITY_MISMATCH:${lockPath}`);
          }
          NODE
          done
          echo 'operational-lockfile-identity: PASS'

          {
            echo "smm_sha256=$(sha256sum apps/smm-web/package-lock.json | awk '{print $1}')"
            echo "admin_sha256=$(sha256sum apps/admin-web/package-lock.json | awk '{print $1}')"
            echo "customer_sha256=$(sha256sum apps/customer-web/package-lock.json | awk '{print $1}')"
            echo "owner_sha256=$(sha256sum apps/owner-web/package-lock.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish dependency-only Builder evidence branch
        id: publish
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:12}"
          EVIDENCE_BRANCH="generated/operational-lockfiles-${SHORT_SHA}"
          EVIDENCE_ROOT="generated/${SOURCE_SHA}"

          git config user.name 'MoreFunOS V1 Builder'
          git config user.email '107616897+Pantonyeung@users.noreply.github.com'
          git switch -C "$EVIDENCE_BRANCH"
          mkdir -p "$EVIDENCE_ROOT/apps/smm-web" "$EVIDENCE_ROOT/apps/admin-web" "$EVIDENCE_ROOT/apps/customer-web" "$EVIDENCE_ROOT/apps/owner-web"
          cp source/apps/smm-web/package-lock.json "$EVIDENCE_ROOT/apps/smm-web/package-lock.json"
          cp source/apps/admin-web/package-lock.json "$EVIDENCE_ROOT/apps/admin-web/package-lock.json"
          cp source/apps/customer-web/package-lock.json "$EVIDENCE_ROOT/apps/customer-web/package-lock.json"
          cp source/apps/owner-web/package-lock.json "$EVIDENCE_ROOT/apps/owner-web/package-lock.json"
          cat > "$EVIDENCE_ROOT/METADATA.json" <<EOF
          {
            "sourceRepository": "Pantonyeung/morefunos-v1",
            "sourceSha": "${SOURCE_SHA}",
            "purpose": "dependency-lockfile-evidence-only",
            "surfaces": ["smm-web", "admin-web", "customer-web", "owner-web"]
          }
          EOF

          git add -- "$EVIDENCE_ROOT"
          git commit -m "build(operational): record canonical surface lockfiles for ${SHORT_SHA}"
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          git push --force-with-lease origin "HEAD:refs/heads/${EVIDENCE_BRANCH}"
          echo "evidence_branch=$EVIDENCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "evidence_commit=$EVIDENCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'dependency-only-builder-evidence: PASS'

      - name: Report sanitized lockfile result
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_BRANCH: ${{ steps.publish.outputs.evidence_branch }}
          EVIDENCE_COMMIT: ${{ steps.publish.outputs.evidence_commit }}
          SMM_SHA256: ${{ steps.lockfiles.outputs.smm_sha256 }}
          ADMIN_SHA256: ${{ steps.lockfiles.outputs.admin_sha256 }}
          CUSTOMER_SHA256: ${{ steps.lockfiles.outputs.customer_sha256 }}
          OWNER_SHA256: ${{ steps.lockfiles.outputs.owner_sha256 }}
        run: |
          set -euo pipefail
          BODY="operational-lockfiles ${SOURCE_SHA} PASS builder_branch=${EVIDENCE_BRANCH} builder_commit=${EVIDENCE_COMMIT} smm=${SMM_SHA256} admin=${ADMIN_SHA256} customer=${CUSTOMER_SHA256} owner=${OWNER_SHA256}"
          echo "$BODY"
          gh issue comment 2 --body "$BODY" >/dev/null

  validate:
    if: >-
      github.actor == 'Pantonyeung' &&
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, '/verify-cross-surface ')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - name: Validate immutable cross-surface verification request
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "$COMMAND" in
            '/verify-cross-surface '*) SOURCE_SHA="${COMMAND#'/verify-cross-surface '}" ;;
            *) echo 'Unsupported cross-surface verification command.' >&2; exit 1 ;;
          esac
          SOURCE_SHA="$(printf '%s' "$SOURCE_SHA" | tr -d '[:space:]')"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source SHA must be exactly 40 hexadecimal characters.' >&2
            exit 1
          fi
          EXPECTED="/verify-cross-surface ${SOURCE_SHA}"
          if [[ "$COMMAND" != "$EXPECTED" ]]; then
            echo 'Command must contain exactly one command and one SHA.' >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo 'Immutable cross-surface source request: PASS'

  surface:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: smt
            label: SMT
            directory: apps/smt-web
          - id: smm
            label: SMM
            directory: apps/smm-web
          - id: admin
            label: Admin
            directory: apps/admin-web
          - id: customer
            label: Customer
            directory: apps/customer-web
          - id: owner
            label: Owner
            directory: apps/owner-web
    name: ${{ matrix.label }} Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      APP_DIR: ${{ matrix.directory }}
      SURFACE_ID: ${{ matrix.id }}
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact private source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$SOURCE_SHA"
          echo "${SURFACE_ID}-source-identity: PASS"

      - name: Verify surface without exposing private build logs
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/private-${SURFACE_ID}-verification.log"
          STAGE_LOG="$GITHUB_WORKSPACE/private-${SURFACE_ID}-stage.log"
          PLAIN_LOG="$GITHUB_WORKSPACE/private-${SURFACE_ID}-stage-plain.log"
          : > "$LOG"
          cd source

          sanitize_identifier() {
            printf '%s' "$1" | tr '[:space:]' '_' | tr -cd 'A-Za-z0-9_./,:-' | cut -c1-180
          }

          set_failure() {
            local stage="$1"
            local diagnostic="${2:-UNAVAILABLE}"
            if [[ ! "$diagnostic" =~ ^[A-Za-z0-9_./,:-]+$ ]]; then diagnostic='UNAVAILABLE'; fi
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
            echo "$stage: FAIL diagnostic=$diagnostic"
          }

          run_stage() {
            local stage="$1"
            shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            set_failure "$stage"
            return 1
          }

          run_test_stage() {
            local stage="$1"
            shift
            : > "$STAGE_LOG"
            if "$@" > "$STAGE_LOG" 2>&1; then
              cat "$STAGE_LOG" >> "$LOG"
              echo "$stage: PASS"
              return 0
            fi
            cat "$STAGE_LOG" >> "$LOG"
            sed -r 's/\x1B\[[0-9;]*[mK]//g' "$STAGE_LOG" > "$PLAIN_LOG"
            local diagnostic test_identifier error_code error_kind source_location
            diagnostic="$(grep -Eo '([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+\.(test|spec)\.[cm]?[jt]sx?:[0-9]+:[0-9]+' "$PLAIN_LOG" | sed -E 's#^.*/(src/[^ ]+)$#\1#' | sort -u | head -5 | paste -sd, - || true)"
            if [[ -z "$diagnostic" ]]; then
              diagnostic="$(grep -Eo '([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+\.(test|spec)\.[cm]?[jt]sx?' "$PLAIN_LOG" | sed -E 's#^.*/(src/[^ ]+)$#\1#' | sort -u | head -5 | paste -sd, - || true)"
            fi
            test_identifier="$(grep -E '^[[:space:]]*(not ok [0-9]+ - |× |FAIL )' "$PLAIN_LOG" | head -1 | sed -E 's/^[[:space:]]*not ok [0-9]+ - //; s/^[[:space:]]*×[[:space:]]*//; s/^[[:space:]]*FAIL[[:space:]]+//' || true)"
            if [[ -n "$test_identifier" ]]; then
              test_identifier="$(sanitize_identifier "$test_identifier")"
              if [[ -n "$test_identifier" ]]; then diagnostic="${diagnostic:+${diagnostic},}test:${test_identifier}"; fi
            fi
            error_code="$(grep -Eo 'ERR_[A-Z0-9_]+' "$PLAIN_LOG" | head -1 || true)"
            if [[ -n "$error_code" ]]; then diagnostic="${diagnostic:+${diagnostic},}code:${error_code}"; fi
            error_kind="$(grep -Eo '(TestingLibraryElementError|AssertionError|SyntaxError|TypeError|ReferenceError|RangeError)' "$PLAIN_LOG" | head -1 || true)"
            if [[ -n "$error_kind" ]]; then diagnostic="${diagnostic:+${diagnostic},}kind:${error_kind}"; fi
            source_location="$(grep -Eo '(packages|apps)/[A-Za-z0-9_./-]+\.[cm]?[jt]sx?:[0-9]+(:[0-9]+)?' "$PLAIN_LOG" | grep -Ev '\.(test|spec)\.' | head -1 || true)"
            if [[ -n "$source_location" ]]; then
              source_location="$(sanitize_identifier "$source_location")"
              diagnostic="${diagnostic:+${diagnostic},}source:${source_location}"
            fi
            set_failure "$stage" "${diagnostic:-UNAVAILABLE}"
            return 1
          }

          run_typecheck_stage() {
            local stage="$1"
            shift
            : > "$STAGE_LOG"
            if "$@" > "$STAGE_LOG" 2>&1; then
              cat "$STAGE_LOG" >> "$LOG"
              echo "$stage: PASS"
              return 0
            fi
            cat "$STAGE_LOG" >> "$LOG"
            local diagnostic
            diagnostic="$(sed -nE 's#^([^(:[:space:]]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+):.*#\1:\2:\3-\4#p' "$STAGE_LOG" | head -5 | paste -sd, - || true)"
            set_failure "$stage" "${diagnostic:-UNAVAILABLE}"
            return 1
          }

          if [[ -f "$APP_DIR/package-lock.json" ]]; then
            run_stage "${SURFACE_ID}-locked-install" npm --prefix "$APP_DIR" ci --no-audit --no-fund || exit 1
          else
            run_stage "${SURFACE_ID}-install" npm --prefix "$APP_DIR" install --no-audit --no-fund --package-lock=false || exit 1
          fi
          run_test_stage "${SURFACE_ID}-test" npm --prefix "$APP_DIR" test || exit 1
          run_typecheck_stage "${SURFACE_ID}-typecheck" "$APP_DIR/node_modules/.bin/tsc" --noEmit -p "$APP_DIR/tsconfig.json" || exit 1
          run_stage "${SURFACE_ID}-build" npm --prefix "$APP_DIR" run build || exit 1

      - name: Report sanitized surface result
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          FAILED_STAGE: ${{ steps.verify.outputs.failed_stage }}
          DIAGNOSTIC: ${{ steps.verify.outputs.diagnostic }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" == 'success' ]]; then RESULT='PASS'; else RESULT="FAIL stage=${FAILED_STAGE:-UNAVAILABLE} diagnostic=${DIAGNOSTIC:-UNAVAILABLE}"; fi
          BODY="cross-surface-${SURFACE_ID} ${SOURCE_SHA} ${RESULT}"
          echo "$BODY"
          gh issue comment 2 --body "$BODY" >/dev/null

      - name: Fail surface after sanitized result
        if: steps.verify.outcome == 'failure'
        run: exit 1

  preview-contract:
    needs: validate
    name: Preview Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Checkout exact private MoreFunOS V1 source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$SOURCE_SHA"
          echo 'preview-source-identity: PASS'
      - name: Run public-safe preview contract test
        id: preview
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npm run test:preview >/dev/null 2>&1
          echo 'preview-contract: PASS'
      - name: Report sanitized preview result
        if: always()
        shell: bash
        env:
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_OUTCOME" == 'success' ]]; then RESULT='PASS'; else RESULT='FAIL'; fi
          BODY="cross-surface-preview-contract ${SOURCE_SHA} ${RESULT}"
          echo "$BODY"
          gh issue comment 2 --body "$BODY" >/dev/null
      - name: Fail preview contract after sanitized result
        if: steps.preview.outcome == 'failure'
        run: exit 1
