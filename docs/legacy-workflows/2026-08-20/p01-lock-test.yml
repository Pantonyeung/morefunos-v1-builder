name: P01 Lock Compatibility Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  lock-test:
    if: github.actor == 'Pantonyeung' && github.event.issue.number == 50 && startsWith(github.event.comment.body, '/p01-lock-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: parse
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          COMMAND="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SOURCE_SHA="${COMMAND#'/p01-lock-test '}"
          SOURCE_SHA="$(printf '%s' "$SOURCE_SHA" | tr -d '[:space:]')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$COMMAND" = "/p01-lock-test ${SOURCE_SHA}"
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-v1
          ref: ${{ steps.parse.outputs.source_sha }}
          token: ${{ secrets.V1_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - id: test
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rm -rf apps/smt-web/node_modules
          rm -f apps/smt-web/package-lock.json
          npm --prefix apps/smt-web install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm --prefix apps/smt-web ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          LOCK_SHA256="$(sha256sum apps/smt-web/package-lock.json | awk '{print $1}')"
          echo "lock_sha256=$LOCK_SHA256" >> "$GITHUB_OUTPUT"
      - name: report
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SOURCE_SHA: ${{ steps.parse.outputs.source_sha }}
          LOCK_SHA256: ${{ steps.test.outputs.lock_sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment 50 --repo Pantonyeung/morefunos-v1-builder --body "P01_LOCK_TEST run_id=${RUN_ID} source_sha=${SOURCE_SHA:-UNKNOWN} result=${TEST_OUTCOME:-UNKNOWN} lock_sha256=${LOCK_SHA256:-NONE}" >/dev/null
